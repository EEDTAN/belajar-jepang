 q:["m|___ 傘[かさ]は だれの 傘[かさ]ですか。|Payung ini punya siapa?|この|これ|その|あの", "m|___ 人[ひと]は 日本語[にほんご]の 先生[せんせい]です。|Orang yang di sana itu guru bahasa Jepang.|あの|あれ|この|それ", "o|この/人[ひと]は/私[わたし]の/先生[せんせい]/です|Orang ini guru saya.", "m|___は 私[わたし]の かばんです。|Itu (yang di dekatmu) tas saya.|それ|その|あの|この", "o|その/辞書[じしょ]は/英語[えいご]の/辞書[じしょ]/です|Kamus itu (yang di dekatmu) kamus bahasa Inggris.", "o|この/コンピューター/は/ハサンさんの/です|Komputer ini punya Pak Hasan.", "m|A：___ 時計[とけい]は ハサンさんのですか。 B：はい、この 時計[とけい]は ハサンさんのです。|A: Jam (yang kamu pegang) itu punya Pak Hasan? B: Ya, jam ini punya Pak Hasan.|その|この|あの|それ", "m|この ___は ブディさんのです。|Kartu nama ini punya Pak Budi.|名刺[めいし]|これ|それ|あれ"]},
{b:2,t:"そうです / そうですか / ちがいます",d:"Pertanyaan ya/tidak tentang kata benda (…は N ですか) dijawab <b>はい、そうです</b> (ya, betul) atau <b>いいえ、違います</b> (ちがいます, bukan). Sesudah いいえ, biasanya disebutkan yang benar; bisa juga menjawab いいえ、そうじゃ ありません. <b>そうですか</b> dengan nada turun berarti \"oh, begitu\" dan diucapkan saat menerima informasi baru.",
 r:["はい、 + そうです", "いいえ、 + 違[ちが]います/そうじゃ ありません", "そう + ですか (nada turun)"],
 s:"いいえ、違[ちが]います。 + P + です → いいえ、違[ちが]います。手帳[てちょう]です。",
 k:[["そう", "Artinya \"begitu\". Kata ini merujuk ke isi pertanyaan, sehingga kata benda dalam pertanyaan tidak perlu diulang."], ["そうです", "Jawaban \"ya, betul\" untuk pertanyaan ya/tidak tentang kata benda (S は KB ですか)."], ["違[ちが]います", "Artinya \"salah\" atau \"bukan begitu\". Jawaban \"tidak\" yang biasanya langsung disusul jawaban yang benar."], ["そうじゃ ありません", "Bentuk negatif dari そうです (\"tidak begitu\"). Dipakai sesudah いいえ dengan arti yang sama seperti 違[ちが]います."], ["そうですか", "Walaupun ada か, ungkapan ini bukan pertanyaan kalau diucapkan dengan nada turun. Artinya \"oh, begitu\", tanda bahwa kamu baru menerima informasi dan memahaminya."]],
 x:["Pola ini berisi tiga tanggapan: <b>はい、そうです</b> (ya, betul), <b>いいえ、違[ちが]います</b> (bukan), dan <b>そうですか</b> (oh, begitu).", "そうです dan 違[ちが]います menjawab pertanyaan ya/tidak berbentuk S は KB ですか. Pertanyaan dengan kata tanya (何[なん]ですか, だれですか) tidak bisa dijawab dengan そうです; jawablah langsung dengan informasinya, misalnya かばんです.", "Sesudah いいえ、違[ちが]います, sebutkan yang benar supaya jelas: A：それは 雑誌[ざっし]ですか。 B：いいえ、違[ちが]います。新聞[しんぶん]です。", "違[ちが]います tidak ditempel langsung pada kata benda. Kalau ingin menyebut kata bendanya, pakai じゃ ありません: いいえ、雑誌[ざっし]じゃ ありません ✓, 雑誌[ざっし]違[ちが]います ✗.", "そうですか diucapkan dengan nada turun. Dengan nada naik, ungkapan ini terdengar ragu atau heran, seperti \"Oh ya? Masa?\".", "Kesalahan umum: menjawab そうです saat menerima informasi baru. Kalau temanmu berkata 私[わたし]は 医者[いしゃ]です, tanggapan yang tepat adalah そうですか. そうです dipakai untuk mengiyakan pertanyaan ya/tidak."],
 ex:[["A：それは 日本語[にほんご]の 本[ほん]ですか。 B：はい、そうです。", "A: Itu buku bahasa Jepang? B: Ya, betul."], ["A：これは ボールペンですか。 B：いいえ、違[ちが]います。シャープペンシルです。", "A: Ini bolpoin? B: Bukan. Itu pensil mekanik."], ["A：私[わたし]は インドネシア人[じん]です。 B：そうですか。", "A: Saya orang Indonesia. B: Oh, begitu."]],
 q:["m|A：それは あなたの 傘[かさ]ですか。 B：はい、___。|A: Itu payungmu? B: Ya, betul.|そうです|違[ちが]います|そうですか|そうじゃ ありません", "m|A：これは 鍵[かぎ]ですか。 B：いいえ、___。カードです。|A: Ini kunci? B: Bukan. Itu kartu.|違[ちが]います|そうです|そうですか|はい", "m|A：私[わたし]は 医者[いしゃ]です。 B：___。|A: Saya dokter. B: Oh, begitu.|そうですか|そうです|違[ちが]います|はい、そうです", "o|いいえ、/違[ちが]います。/これは/ラジオ/です。|(Ditanya: Itu kamera?) Bukan. Ini radio.", "o|はい、/そうです。/私[わたし]の/です|(Ditanya: Ini punya Anda?) Ya, betul. Punya saya.", "o|いいえ、/そうじゃ/ありません。/英語[えいご]の/雑誌[ざっし]です|(Ditanya: Itu majalah berbahasa Jepang?) Bukan. Ini majalah berbahasa Inggris.", "m|A：これは 何[なん]ですか。 B：___。|A: Ini apa? B: Itu kamus.|辞書[じしょ]です|はい、そうです|そうですか|違[ちが]います", "m|A：それは 時計[とけい]ですか。 B：いいえ、時計[とけい]___。|A: Itu jam? B: Bukan, ini bukan jam.|じゃ ありません|違[ちが]います|そうです|ですか"]},
{b:2,t:"～ですか、～ですか (pertanyaan pilihan)",d:"Untuk pertanyaan pilihan \"A atau B?\", ucapkan dua pertanyaan berurutan: <b>A ですか、B ですか</b>. Jawablah dengan menyebut pilihannya, misalnya B です, tanpa はい atau いいえ.",
 r:["S + は + KB1 + ですか、 + KB2 + ですか", "Jawaban: KB1/KB2 + です"],
 s:"S + は + P1 + ですか、 + P2 + ですか → あの人[ひと]は 医者[いしゃ]ですか、研究者[けんきゅうしゃ]ですか。",
 k:[["ですか、 (pilihan pertama)", "Pilihan pertama dijadikan pertanyaan lengkap. Tanda koma 、 menunjukkan bahwa pertanyaannya belum selesai karena masih ada pilihan kedua."], ["ですか (pilihan kedua)", "Pilihan kedua juga diberi ですか. Dua pertanyaan yang berurutan inilah yang membawa arti \"atau\", jadi tidak perlu kata khusus untuk \"atau\"."], ["tanpa はい / いいえ", "Penanya ingin tahu pilihan yang mana, bukan ya atau tidak. Karena itu jawabannya langsung pilihan yang benar + です."]],
 x:["Pola ini menanyakan pilihan \"A atau B?\". Caranya, ajukan dua pertanyaan berturut-turut: <b>A ですか、B ですか</b>.", "Cara menyusun: buat pertanyaan pertama (あの人[ひと]は 医者[いしゃ]ですか), ganti 。 dengan 、, lalu tambahkan pilihan kedua + ですか: あの人[ひと]は 医者[いしゃ]ですか、研究者[けんきゅうしゃ]ですか。", "S cukup disebut sekali di awal. Bagian sesudah koma hanya berisi pilihan kedua + ですか.", "Jawab dengan menyebut pilihannya: 研究者[けんきゅうしゃ]です. Jangan memulai jawaban dengan はい atau いいえ, karena pertanyaan ini tidak meminta jawaban ya/tidak.", "Kesalahan umum: menghapus ですか yang pertama (医者[いしゃ]、研究者[けんきゅうしゃ]ですか ✗) atau mencari padanan kata \"atau\". Kedua pilihan sama-sama perlu ですか.", "Pola ini bisa digabung dengan pola lain yang sudah kamu kenal, misalnya milik: それは あなたのですか、リナさんのですか。"],
 ex:[["A：あの 人[ひと]は 先生[せんせい]ですか、学生[がくせい]ですか。 B：学生[がくせい]です。", "A: Orang itu guru atau mahasiswa? B: Mahasiswa."], ["A：それは ノートですか、手帳[てちょう]ですか。 B：手帳[てちょう]です。", "A: Itu buku tulis atau buku agenda? B: Buku agenda."], ["ワンさんは 中国人[ちゅうごくじん]ですか、韓国人[かんこくじん]ですか。", "Pak Wang orang Cina atau orang Korea?"]],
 q:["o|それは/英語[えいご]/ですか、/日本語[にほんご]/ですか|Itu bahasa Inggris atau bahasa Jepang?|それは/日本語[にほんご]/ですか、/英語[えいご]/ですか", "m|A：ジョンさんは アメリカ人[じん]ですか、イギリス人[じん]ですか。 B：___。|A: Pak John orang Amerika atau orang Inggris? B: Orang Inggris.|イギリス人[じん]です|アメリカ人[じん]です|はい、そうです|いいえ、違[ちが]います", "m|これは 日本語[にほんご]の 新聞[しんぶん]___、英語[えいご]の 新聞[しんぶん]ですか。|Ini koran berbahasa Jepang atau koran berbahasa Inggris?|ですか|です|じゃ ありません|も", "o|あの人[ひと]は/銀行員[ぎんこういん]/ですか、/会社員[かいしゃいん]/ですか|Orang itu pegawai bank atau karyawan perusahaan?|あの人[ひと]は/会社員[かいしゃいん]/ですか、/銀行員[ぎんこういん]/ですか", "o|この/かばんは/ハサンさんの/ですか、/ブディさんの/ですか|Tas ini punya Pak Hasan atau punya Pak Budi?|この/かばんは/ブディさんの/ですか、/ハサンさんの/ですか", "m|A：あなたは 学生[がくせい]ですか、___ですか。 B：研究者[けんきゅうしゃ]です。|A: Anda mahasiswa atau peneliti? B: Peneliti.|研究者[けんきゅうしゃ]|学生[がくせい]|だれ|何[なん]", "m|A：これは 鉛筆[えんぴつ]ですか、___。 B：ボールペンです。|A: Ini pensil atau bolpoin? B: Bolpoin.|ボールペンですか|ボールペンです|ボールペンも|そうですか"]},
{b:2,t:"の pengganti kata benda (私のです)",d:"Kalau bendanya sudah jelas, kata benda sesudah <b>の</b> boleh dihilangkan: この 傘は 私の 傘です cukup menjadi この 傘は <b>私のです</b>. Untuk menanyakan pemiliknya, pakai <b>だれのですか</b>. Cara ini tidak berlaku untuk orang: 田中さんは 大学の 先生です tidak bisa disingkat menjadi 大学のです.",
 r:["KB1 + の + (KB2)", "S + は + pemilik + の + です", "S + は + だれ + の + ですか"],
 s:"S + は + pemilik + の + です → この かばんは 私[わたし]のです。",
 k:[["の (tanpa KB2)", "Artinya \"punya ...\". Kata benda sesudah の dihilangkan karena sudah jelas dari S atau dari pertanyaan, jadi tidak perlu diulang."], ["だれの", "だれ + の = \"punya siapa\". Dipakai untuk menanyakan pemilik benda: この 傘[かさ]は だれのですか."], ["です / じゃ ありません", "Ditempel langsung sesudah の: 私[わたし]のです (punya saya), 私[わたし]のじゃ ありません (bukan punya saya)."]],
 x:["Kalau bendanya sudah jelas, kata benda sesudah の boleh dihilangkan. この かばんは 私[わたし]の かばんです terdengar berulang, jadi biasanya cukup この かばんは <b>私[わたし]のです</b>.", "Cara menyusun: mulai dari KB1 の KB2 (私[わたし]の かばん), hapus KB2 (かばん), lalu tutup dengan です: 私[わたし]のです.", "Bentuk tanya dan negatifnya: だれのですか (punya siapa?), ハサンさんのですか (punya Pak Hasan?), 私[わたし]のじゃ ありません (bukan punya saya).", "Kesalahan umum: ikut menghapus の. この かばんは 私[わたし]です berarti \"tas ini adalah saya\". の harus tetap ada: 私[わたし]のです.", "Cara singkat ini hanya untuk benda, tidak untuk orang. ブディさんは みどり病院[びょういん]の 医者[いしゃ]です tidak bisa disingkat menjadi みどり病院[びょういん]のです.", "私[わたし]のです berarti \"punya saya\". Kata bendanya tidak perlu diulang karena sudah disebut di S: この かばんは 私[わたし]のです."],
 ex:[["この 鉛筆[えんぴつ]は 私[わたし]のです。", "Pensil ini punya saya."], ["A：その 傘[かさ]は だれのですか。 B：サントスさんのです。", "A: Payung itu punya siapa? B: Punya Pak Santos."], ["あの 車[くるま]は 先生[せんせい]のじゃ ありません。", "Mobil itu bukan punya guru."]],
 q:["m|この 辞書[じしょ]は 私[わたし]___です。|Kamus ini punya saya.|の|は|も|か", "m|A：これは あなたの 時計[とけい]ですか。 B：いいえ、私[わたし]___。|A: Ini jam tanganmu? B: Bukan, bukan punya saya.|のじゃ ありません|のです|じゃ ありません|の 時計[とけい]です", "o|この/ノート/は/ワンさん/の/です|Buku tulis ini punya Pak Wang.", "m|A：ジョンさんは 英語[えいご]の 先生[せんせい]ですか。 B：はい、英語[えいご]の ___。|A: Apakah Pak John guru bahasa Inggris? B: Ya, guru bahasa Inggris.|先生[せんせい]です|です|先生[せんせい]ですか|じゃ ありません", "o|その/CD/は/だれ/の/ですか|CD itu (yang di dekatmu) punya siapa?", "o|その/手帳[てちょう]は/私[わたし]の/じゃ/ありません|Buku agenda itu bukan punya saya.", "m|A：これは だれの 鍵[かぎ]ですか。 B：ハサンさん___。|A: Ini kunci siapa? B: Punya Pak Hasan.|のです|です|の 鍵[かぎ]ですか|じゃ ありません", "m|ハサンさんは ___です。|Pak Hasan karyawan ABC.|ABCの 社員[しゃいん]|ABCの|社員[しゃいん]の ABC|ABCは 社員[しゃいん]"]},
{b:3,t:"ここ・そこ・あそこ・どこ",d:"<b>ここ</b> (sini) menunjuk tempat dekat pembicara, <b>そこ</b> (situ) dekat lawan bicara, <b>あそこ</b> (sana) jauh dari keduanya, dan <b>どこ</b> berarti mana. Kalau pembicara dan lawan bicara ada di tempat yang sama, tempat itu disebut ここ. Bentuk sopannya <b>こちら, そちら, あちら, どちら</b>, yang aslinya menunjuk arah dan sering dipakai pegawai toko atau saat bicara dengan orang yang dihormati.",
 r:["ここ/そこ/あそこ + は + KB (tempat) + です", "こちら/そちら/あちら + は + KB (tempat) + です", "ここ + は + どこ/どちら + ですか"],
 s:"ここ + は + P + です → ここは 食堂[しょくどう]です。",
 k:[["ここ / そこ / あそこ", "Penunjuk tempat: ここ = sini (dekat pembicara), そこ = situ (dekat lawan bicara), あそこ = sana (jauh dari keduanya). Di pola ini kata tersebut menjadi S, jadi langsung diikuti は."], ["どこ", "Kata tanya \"mana\" untuk tempat. Diletakkan di posisi P, tempat jawabannya nanti muncul: ここは どこですか."], ["こちら / そちら / あちら / どちら", "Versi sopan dari ここ/そこ/あそこ/どこ. Arti dasarnya arah (sebelah sini, situ, sana), dan sering dipakai pegawai toko, resepsionis, atau saat bicara dengan orang yang dihormati."], ["は", "Menandai tempat yang sedang dibicarakan sebagai S. Sesudahnya disebutkan tempat itu apa: ここは 教室[きょうしつ]です."]],
 x:["Pola ini memakai penunjuk tempat sebagai S: <b>ここは 食堂[しょくどう]です</b> = \"Di sini kantin\" atau \"Tempat ini kantin\".", "Pembagian jaraknya sama dengan これ/それ/あれ. Kalau pembicara dan lawan bicara berada di tempat yang sama, misalnya di ruangan yang sama, keduanya menyebut tempat itu ここ.", "Bedakan tempat dan benda: ここ/そこ/あそこ untuk tempat, これ/それ/あれ untuk benda. ここは 教室[きょうしつ]です (di sini ruang kelas), これは 辞書[じしょ]です (ini kamus).", "Bentuk sopan こちら/そちら/あちら/どちら sering terdengar di toko, kantor, dan hotel, misalnya dari pegawai yang mengantar tamu: こちらは ロビーです (sebelah sini lobi).", "Kesalahan umum: memakai そこ untuk tempat yang jauh dari kalian berdua. そこ hanya untuk tempat di dekat lawan bicara; tempat yang jauh disebut あそこ."],
 ex:[["ここは 教室[きょうしつ]です。", "Di sini ruang kelas."], ["あそこは 事務所[じむしょ]です。", "Di sana kantor."], ["こちらは 会議室[かいぎしつ]です。", "Sebelah sini ruang rapat (sopan)."]],
 q:["m|___は 私[わたし]の 部屋[へや]です。|Di sini kamar saya.|ここ|そこ|あそこ|どこ", "m|A：すみません、受付[うけつけ]は どちらですか。 B：___です。どうぞ。|A: Permisi, meja informasi di sebelah mana? B: Di sebelah sini. Silakan.|こちら|そちら|どちら|この", "o|すみません、/ここ/は/どこ/ですか|Permisi, ini di mana?", "o|そこは/ハサンさんの/事務所[じむしょ]/です|Di situ (dekat Anda) kantor Pak Hasan.", "o|すみません、/あそこは/トイレ/ですか|Permisi, apakah di sana toilet?", "m|A：そこは 何[なん]の 部屋[へや]ですか。 B：___は 会議室[かいぎしつ]です。|A: Ruangan tempatmu itu ruang apa? B: Di sini ruang rapat.|ここ|そこ|あそこ|どこ", "m|___は エレベーターです。|(Pegawai kepada tamu) Di sebelah sini lift.|こちら|そちら|この|どちら", "o|こちらは/ハサンさんの/部屋[へや]/です|(Pemandu kepada tamu) Ini kamar Pak Hasan."]},
{b:3,t:"N は Tempat です / どこですか",d:"Untuk menyebut letak benda, tempat, atau orang, pakai <b>N は (tempat) です</b>: 食堂は あそこです (kantinnya di sana). Untuk bertanya, ganti tempatnya dengan <b>どこ</b>, atau どちら supaya lebih sopan. Pertanyaan ini juga dipakai untuk menanyakan negara, kampus, atau perusahaan seseorang: お国は どちらですか. Untuk itu jangan pakai 何.",
 r:["S + は + K-tempat + です", "S + は + どこ/どちら + ですか", "お国[くに]/会社[かいしゃ]/大学[だいがく] + は + どちら + ですか"],
 s:"S + は + K-tempat + です → 電話[でんわ]は あそこです。",
 k:[["は", "Menandai benda, tempat, atau orang yang dicari sebagai S. Hal yang mau diberi tahu letaknya selalu disebut dulu."], ["K-tempat + です", "Kata tempat (あそこ, 食堂[しょくどう], 2階[かい]) ditaruh tepat sebelum です. Dalam pola ini です berarti \"ada (di)\", jadi tidak perlu kata kerja lain."], ["どこ / どちら", "Kata tanya tempat di posisi P. どちら lebih sopan, cocok untuk bertanya kepada pegawai atau orang yang baru dikenal."], ["お国[くに]", "お adalah awalan sopan untuk hal milik orang lain: お国[くに]は どちらですか (Anda dari negara mana?). Untuk negaramu sendiri, cukup 国[くに] tanpa お."]],
 x:["Pola ini memberi tahu letak sesuatu: <b>S は (tempat) です</b>. S bisa benda (電話[でんわ]), tempat (トイレ), atau orang (ハサンさん): ハサンさんは 事務所[じむしょ]です = Pak Hasan ada di kantor.", "Cara bertanya: ganti tempatnya dengan どこ lalu tutup dengan ですか: 電話[でんわ]は どこですか. Jawabannya cukup tempat + です: あそこです, ロビーです, 2階[かい]です.", "Untuk menyebut letak dengan です, tempatnya langsung diikuti です tanpa partikel: 電話[でんわ]は あそこです (teleponnya ada di sana).", "どちら juga dipakai untuk menanyakan asal negara, perusahaan, atau kampus seseorang dengan sopan: お国[くに]は どちらですか, 会社[かいしゃ]は どちらですか. Jawabannya nama negara atau perusahaan + です.", "Kesalahan umum: memakai 何[なん] untuk menanyakan tempat atau negara (お国[くに]は 何[なん]ですか ✗). Untuk tempat, negara, dan perusahaan, pakai どこ atau どちら.", "Untuk lantai, pakai 何階[なんがい]: A：ワイン売[う]り場[ば]は 何階[なんがい]ですか。 B：地下[ちか]です。"],
 ex:[["自動販売機[じどうはんばいき]は あそこです。", "Mesin penjual otomatis ada di sana."], ["A：先生[せんせい]は どこですか。 B：教室[きょうしつ]です。", "A: Guru ada di mana? B: Di ruang kelas."], ["A：大学[だいがく]は どちらですか。 B：インドネシア大学[だいがく]です。", "A: Anda kuliah di universitas mana? B: Universitas Indonesia."]],
 q:["o|すみません、/エスカレーター/は/どこ/ですか|Permisi, eskalator di mana?", "m|A：ワンさんは ___ですか。 B：食堂[しょくどう]です。|A: Pak Wang ada di mana? B: Di kantin.|どこ|だれ|何[なん]|いくら", "m|階段[かいだん]は ___です。|Tangganya di sana (jauh dari kita berdua).|あそこ|そこ|ここ|どこ", "m|A：お国[くに]は ___ですか。 B：ブラジルです。|A: Anda berasal dari negara mana? B: Brasil.|どちら|何[なん]|だれ|いくら", "o|ハサンさん/は/会議室[かいぎしつ]/です|Pak Hasan ada di ruang rapat.", "o|会社[かいしゃ]/は/どちら/ですか|(Bertanya sopan) Anda bekerja di perusahaan mana?", "m|自動販売機[じどうはんばいき]___ ロビーです。|Mesin penjual otomatis ada di lobi.|は|の|も|か", "m|A：すみません、靴[くつ]売[う]り場[ば]は ___ですか。 B：5階[かい]です。|A: Permisi, bagian sepatu ada di lantai berapa? B: Di lantai 5.|何階[なんがい]|いくら|だれ|何歳[なんさい]"]},
{b:3,t:"いくらですか / どこの N ですか",d:"<b>いくらですか</b> menanyakan harga, dan jawabannya angka + 円 (えん): 3,000円です. <b>どこの N ですか</b> menanyakan asal negara atau perusahaan pembuat suatu barang; jawabannya (negara/perusahaan) の N です. Kata bendanya boleh dihilangkan: 日本のです = buatan Jepang.",
 r:["S + は + いくら + ですか", "Angka + 円[えん] + です", "S + は + どこ + の + KB + ですか"],
 s:"S + は + いくら + ですか → この 時計[とけい]は いくらですか。",
 k:[["いくら", "Kata tanya \"berapa\" untuk harga. Diletakkan di posisi P, tempat harga muncul di jawaban: この 時計[とけい]は いくらですか → 5,000円[えん]です."], ["円[えん]", "Satuan mata uang yen, ditaruh di belakang angka seperti kata \"rupiah\": 500円[えん] = 500 yen."], ["どこの", "どこ + の = \"buatan mana\" atau \"dari mana\". Karena ada の, biasanya diikuti kata benda: どこの 靴[くつ]. Dipakai untuk menanyakan negara atau perusahaan pembuat barang."], ["の (dalam jawaban)", "Jawaban memakai pola KB1 の KB2: イタリアの 靴[くつ]です. Kalau sudah jelas, KB2 boleh dihilangkan: イタリアのです."]],
 x:["<b>S は いくらですか</b> menanyakan harga. Jawabannya angka + 円[えん] + です: 1,500円[えん]です.", "Satuan besar angka: 百[ひゃく] = ratus, 千[せん] = ribu, 万[まん] = sepuluh ribu. Ada perubahan bunyi yang perlu dihafal: 300 = さんびゃく, 600 = ろっぴゃく, 800 = はっぴゃく, 3.000 = さんぜん, 8.000 = はっせん.", "Kesalahan umum: membaca 10.000 sebagai じゅうせん karena mengikuti \"sepuluh ribu\". Bahasa Jepang menghitung per 万[まん] (10.000), jadi 10.000 = いちまん dan 50.000 = ごまん.", "<b>どこの KB ですか</b> menanyakan negara atau perusahaan pembuat barang. Jawabannya nama negara atau perusahaan + の + KB: フランスの ワインです, atau lebih singkat フランスのです.", "Bedakan どこ dan どこの: どこ menanyakan letak (トイレは どこですか), sedangkan どこの menanyakan asal barang dan biasanya diikuti kata benda (どこの ワインですか)."],
 ex:[["A：この 傘[かさ]は いくらですか。 B：1,200円[えん]です。", "A: Payung ini harganya berapa? B: 1.200 yen."], ["A：その 時計[とけい]は どこの 時計[とけい]ですか。 B：スイスの 時計[とけい]です。", "A: Jam itu jam buatan mana? B: Jam buatan Swiss."], ["この カメラは 日本[にほん]のです。", "Kamera ini buatan Jepang."]],
 q:["m|A：この 靴[くつ]は ___ですか。 B：5,000円[えん]です。|A: Sepatu ini harganya berapa? B: 5.000 yen.|いくら|どこ|何[なん]|だれ", "m|A：これは ___ コーヒーですか。 B：ブラジルの コーヒーです。|A: Ini kopi dari negara mana? B: Kopi Brasil.|どこの|どこ|だれの|いくら", "o|あの/ネクタイ/は/いくら/ですか|Dasi itu harganya berapa?", "o|それ/は/どこ/の/コンピューター/ですか|Itu komputer buatan mana?", "o|この/ワインは/イタリア/の/です|Wine ini buatan Italia.", "o|すみません、/この/カメラは/いくら/ですか|Permisi, kamera ini harganya berapa?", "m|A：この 辞書[じしょ]は いくらですか。 B：___です。|A: Kamus ini harganya berapa? B: 3.000 yen.|さんぜんえん|さんせんえん|さんびゃくえん|さんまんえん", "m|A：その 車[くるま]は どこの 車[くるま]ですか。 B：___。|A: Mobil itu buatan mana? B: Buatan Jerman.|ドイツのです|ドイツ人[じん]のです|ドイツ語[ご]のです|ドイツの 車[くるま]ですか"]},
{b:4,t:"今 ～時～分です",d:"Jam dibaca dengan <b>～時</b> (じ) dan menit dengan <b>～分</b>, yang bacaannya ふん atau ぷん tergantung angkanya: 5分 (ごふん), 10分 (じゅっぷん). Hafalkan juga 4時 (よじ), 7時 (しちじ), dan 9時 (くじ). Untuk bertanya, pakai 今 何時ですか. Setengah jam disebut 半 (はん), sedangkan 午前 (a.m.) dan 午後 (p.m.) diletakkan sebelum jam.",
 r:["今[いま] + (午前[ごぜん]/午後[ごご]) + ～時[じ] + (～分[ふん]/半[はん]) + です", "(S + は) + 今[いま] + 何時[なんじ] + です + か"],
 s:"今[いま] + angka + 時[じ] + angka + 分[ふん] + です → 今[いま] 七時[しちじ]十五分[じゅうごふん]です。",
 k:[["今[いま]", "Artinya 'sekarang'. Diletakkan di awal sebagai keterangan waktu dan dipakai tanpa partikel."], ["～時[じ]", "Penghitung jam, diletakkan <b>setelah</b> angka: 七時[しちじ] = jam tujuh. Ada bacaan khusus: 四時[よじ], 七時[しちじ], 九時[くじ]."], ["～分[ふん] / ～分[ぷん]", "Penghitung menit, juga diletakkan setelah angka. Dibaca ふん setelah 2, 5, 7, 9 (にふん, ごふん, ななふん, きゅうふん) dan ぷん setelah 1, 3, 4, 6, 8, 10 (いっぷん, さんぷん, よんぷん, ろっぷん, はっぷん, じゅっぷん)."], ["半[はん]", "Artinya 'setengah', yaitu 30 menit, dan diletakkan setelah jam: 七時[しちじ]半[はん] = jam 7.30."], ["です / か", "です menutup kalimat dengan sopan. Untuk bertanya, ganti angkanya dengan 何[なん] lalu tambahkan か: 何時[なんじ]ですか (jam berapa?), 何時[なんじ]何分[なんぷん]ですか (jam berapa lewat berapa menit?)."]],
 x:["<b>Urutan:</b> 今[いま] → (午前[ごぜん]/午後[ごご]) → jam → menit → です. 午前[ごぜん] (a.m.) dan 午後[ごご] (p.m.) diletakkan <b>sebelum</b> jam: 午後[ごご]三時[さんじ] = jam 3 sore.", "<b>Bacaan jam 1–12:</b> いちじ, にじ, さんじ, <b>よじ</b>, ごじ, ろくじ, <b>しちじ</b>, はちじ, <b>くじ</b>, じゅうじ, じゅういちじ, じゅうにじ. Yang dicetak tebal paling sering salah.", "<b>Bacaan menit:</b> 1 いっぷん, 2 にふん, 3 さんぷん, 4 よんぷん, 5 ごふん, 6 ろっぷん, 7 ななふん, 8 はっぷん, 9 きゅうふん, 10 じゅっぷん. Puluhan mengikuti pola yang sama: 15 じゅうごふん, 20 にじゅっぷん, 45 よんじゅうごふん.", "<b>Kesalahan umum:</b> jam 7.30 ('setengah delapan') adalah 七時[しちじ]半[はん], bukan 八時[はちじ]半[はん] (itu jam 8.30). Kesalahan lain: membaca 4時[じ] sebagai よんじ dan 9時[じ] sebagai きゅうじ.", "<b>Bertanya jam di tempat lain:</b> ロンドンは 今[いま] 何時[なんじ]ですか。 → 午後[ごご]八時[はちじ]です。 Nama tempat diberi は sebagai topik."],
 ex:[["今[いま] 四時[よじ]半[はん]です。", "Sekarang jam 4.30."], ["A：今[いま] 何時[なんじ]ですか。 B：九時[くじ]十分[じゅっぷん]です。", "A: Sekarang jam berapa? B: Jam 9 lewat 10 menit."], ["今[いま] 午後[ごご]七時[しちじ]五分[ごふん]です。", "Sekarang jam 7.05 malam."]],
 q:["m|今[いま] ___です。|Sekarang jam 4.|よじ|よんじ|しじ|よっじ", "m|A：今[いま] ___ですか。 B：十時[じゅうじ]です。|A: Sekarang jam berapa? B: Jam 10.|何時[なんじ]|何分[なんぷん]|いくら|どこ", "o|今[いま]/午前[ごぜん]/十一時[じゅういちじ]/二十分[にじゅっぷん]/です|Sekarang jam 11.20 pagi.", "m|今[いま] 七時[しちじ]___です。|Sekarang jam 7.30.|半[はん]|分[ふん]|時[じ]|半分[はんぶん]", "o|今[いま]/午後[ごご]/三時[さんじ]/半[はん]/です|Sekarang jam setengah empat sore (3.30).", "o|ジャカルタ/は/今[いま]/何時[なんじ]/ですか|Di Jakarta sekarang jam berapa?|今[いま]/ジャカルタ/は/何時[なんじ]/ですか", "m|今[いま] 八時[はちじ]___です。|Sekarang jam 8.10.|じゅっぷん|じゅうふん|じゅっふん|とおふん", "m|今[いま] ___です。|Sekarang jam setengah sepuluh (9.30).|くじはん|じゅうじはん|きゅうじはん|くじさんぷん"]},
{b:4,t:"Kata kerja ～ます / ～ません",d:"Bentuk <b>～ます</b> adalah bentuk sopan kata kerja untuk kebiasaan atau hal yang akan dilakukan: 毎朝 起きます (bangun setiap pagi), 明日 働きます (besok bekerja). Untuk bentuk negatif, ganti ます dengan <b>ません</b>: 働きません. Untuk bertanya, tambahkan か: 働きますか.",
 r:["S + は + (K-waktu) + KK-ます", "S + は + (K-waktu) + KK-ません", "S + は + (K-waktu) + KK-ます + か"],
 s:"S + は + K-waktu + P → 私[わたし]は 毎晩[まいばん] 勉強[べんきょう]します。",
 k:[["ます", "Akhiran sopan kata kerja. Dipakai untuk kebiasaan (setiap hari …) dan untuk hal yang akan dilakukan (besok …). Bedanya terlihat dari kata waktunya, bukan dari kata kerjanya."], ["ません", "Bentuk negatif sopan: ganti ます dengan ません. Artinya 'tidak …' untuk kebiasaan atau rencana: 土曜日[どようび]は 働[はたら]きません."], ["か", "Partikel tanya di akhir kalimat. Urutan kata tidak berubah, cukup tambahkan か: 働[はたら]きますか (apakah bekerja?)."], ["は", "Menandai S (topik). Kata waktu juga bisa diberi は untuk membandingkan: 日曜日[にちようび]は 休[やす]みます (kalau hari Minggu, saya libur)."]],
 x:["<b>Fungsi:</b> bentuk ます adalah bentuk sopan untuk berbicara dengan orang yang belum akrab. Artinya bisa 'biasanya melakukan' atau 'akan melakukan', tergantung kata waktunya: 毎日[まいにち] 勉強[べんきょう]します (setiap hari belajar), 明日[あした] 勉強[べんきょう]します (besok akan belajar).", "<b>Perubahan:</b> 起[お]きます → 起[お]きません, 寝[ね]ます → 寝[ね]ません, 休[やす]みます → 休[やす]みません, 勉強[べんきょう]します → 勉強[べんきょう]しません. Cukup ganti ます dengan ません; bagian depan kata kerja tidak berubah.", "<b>Pertanyaan dan jawaban:</b> 毎朝[まいあさ] 勉強[べんきょう]しますか。 → はい、勉強[べんきょう]します。 / いいえ、勉強[べんきょう]しません。 Kata kerja diulang dalam jawaban.", "<b>Kesalahan umum:</b> menaruh kata kerja di tengah (私[わたし]は 働[はたら]きます 毎日[まいにち] ✗). Kata kerja selalu di akhir: 私[わたし]は 毎日[まいにち] 働[はたら]きます. Kesalahan lain: memakai ません untuk kejadian kemarin; untuk masa lampau pakai ませんでした.", "<b>Tips:</b> kata kerja berakhiran します (勉強[べんきょう]します) berubah dengan cara yang sama: しません, しますか."],
 ex:[["私[わたし]は 毎晩[まいばん] 十一時[じゅういちじ]に 寝[ね]ます。", "Setiap malam saya tidur jam 11."], ["日曜日[にちようび]は 働[はたら]きません。", "Hari Minggu saya tidak bekerja."], ["A：明日[あした]も 働[はたら]きますか。 B：いいえ、明日[あした]は 休[やす]みます。", "A: Besok kamu bekerja juga? B: Tidak, besok saya libur."]],
 q:["m|明日[あした] 勉強[べんきょう]___。|Besok saya tidak belajar.|しません|します|しました|しませんでした", "m|私[わたし]は 毎日[まいにち] 働[はたら]き___。|Saya bekerja setiap hari.|ます|ません|ますか|ませんか", "o|土曜日[どようび]/と/日曜日[にちようび]/は/休[やす]みます|Hari Sabtu dan Minggu saya libur.|日曜日[にちようび]/と/土曜日[どようび]/は/休[やす]みます", "o|明日[あした]/何時[なんじ]に/起[お]きますか|Besok kamu bangun jam berapa?", "o|ミラーさんは/今晩[こんばん]/勉強[べんきょう]/しますか|Pak Miller, malam ini Anda belajar?|今晩[こんばん]/ミラーさんは/勉強[べんきょう]/しますか", "o|私[わたし]は/あさって/休[やす]みません|Lusa saya tidak libur.|あさって/私[わたし]は/休[やす]みません", "m|A：明日[あした] 働[はたら]きますか。 B：いいえ、___。|A: Besok kamu bekerja? B: Tidak, saya tidak bekerja.|働[はたら]きません|働[はたら]きます|働[はたら]きました|働[はたら]きませんでした", "m|A：土曜日[どようび]も 勉強[べんきょう]します___。 B：はい、します。|A: Hari Sabtu juga kamu belajar? B: Ya, saya belajar.|か|を|に|は"]},
{b:4,t:"～から ～まで",d:"<b>から</b> menandai titik mulai (dari) dan <b>まで</b> titik akhir (sampai): 9時から 5時まで, 月曜日から 金曜日まで. Keduanya boleh dipakai sendiri-sendiri dan boleh langsung diikuti です: 試験は 10時からです (ujian mulai jam 10).",
 r:["S + は + K-waktu + から + K-waktu + まで + KK-ます", "S + は + K-waktu + から + K-waktu + まで + です", "S + は + K-waktu + から/まで + です"],
 s:"S + は + K-waktu + から + K-waktu + まで + P → 私[わたし]は 七時[しちじ]から 九時[くじ]まで 勉強[べんきょう]します。",
 k:[["から", "Menandai titik mulai, artinya 'dari'. から diletakkan <b>setelah</b> kata waktu: 九時[くじ]から (dari jam 9)."], ["まで", "Menandai titik akhir, seperti 'sampai'. Juga diletakkan setelah kata waktu: 五時[ごじ]まで (sampai jam 5)."], ["KK-ます", "Kalau ada kegiatan, kata kerjanya diletakkan di akhir, setelah まで: 八時[はちじ]から 四時[よじ]まで 働[はたら]きます."], ["です", "Kalau kalimat hanya menyebut jadwal tanpa kata kerja, langsung tutup dengan です setelah から atau まで: 銀行[ぎんこう]は 九時[くじ]から 三時[さんじ]までです."], ["は", "Menandai S (topik): tempat atau acara yang jadwalnya dibicarakan (銀行[ぎんこう]は, 試験[しけん]は), atau orang yang melakukan kegiatan."]],
 x:["<b>Fungsi:</b> から dan まで menyatakan rentang waktu, 'dari … sampai …'. Keduanya juga bisa dipakai untuk tempat: ジャカルタから バンコクまで (dari Jakarta sampai Bangkok).", "<b>Cara menyusun:</b> S + は → waktu mulai + から → waktu akhir + まで → です atau kata kerja. Contoh: 図書館[としょかん]は 九時[くじ]から 六時[ろくじ]までです (perpustakaan buka dari jam 9 sampai jam 6).", "<b>Variasi:</b> から dan まで boleh dipakai sendiri-sendiri: 会議[かいぎ]は 二時[にじ]からです (rapat mulai jam 2); 昨日[きのう] 十時[じゅうじ]まで 働[はたら]きました (kemarin saya bekerja sampai jam 10). Pertanyaan: 何時[なんじ]から 何時[なんじ]までですか.", "<b>Kesalahan umum:</b> menaruh から/まで di depan: から 九時[くじ] (salah). Partikel Jepang selalu di belakang kata bendanya. Jangan juga menambahkan に setelah から: 九時[くじ]からに (salah).", "<b>から/まで atau に?</b> に menunjuk satu titik waktu (六時[ろくじ]に 起[お]きます), sedangkan から dan まで menunjuk awal dan akhir sebuah rentang. Kegiatan yang berlangsung lama seperti 働[はたら]きます dan 勉強[べんきょう]します cocok dengan から～まで."],
 ex:[["デパートは 十時[じゅうじ]から 八時[はちじ]までです。", "Toserba buka dari jam 10 sampai jam 8."], ["私[わたし]は 月曜日[げつようび]から 金曜日[きんようび]まで 働[はたら]きます。", "Saya bekerja dari hari Senin sampai Jumat."], ["昼休[ひるやす]みは 十二時[じゅうにじ]からです。", "Istirahat siang mulai jam 12."]],
 q:["m|試験[しけん]は 十時[じゅうじ]___ 十二時[じゅうにじ]までです。|Ujiannya dari jam 10 sampai jam 12.|から|まで|に|と", "m|美術館[びじゅつかん]は 午後[ごご]五時[ごじ]___です。|Museum seni buka sampai jam 5 sore.|まで|から|に|と", "o|会議[かいぎ]/は/一時[いちじ]から/三時[さんじ]まで/です|Rapatnya dari jam 1 sampai jam 3.", "o|毎日[まいにち]/何時[なんじ]/まで/働[はたら]きますか|Setiap hari kamu bekerja sampai jam berapa?", "o|毎日[まいにち]/九時[くじ]から/五時[ごじ]まで/働[はたら]きます|Setiap hari saya bekerja dari jam 9 sampai jam 5.|九時[くじ]から/五時[ごじ]まで/毎日[まいにち]/働[はたら]きます", "o|郵便局[ゆうびんきょく]/は/何時[なんじ]/から/ですか|Kantor pos buka mulai jam berapa?", "m|毎晩[まいばん] 十一時[じゅういちじ]___ 勉強[べんきょう]します。|Setiap malam saya belajar sampai jam sebelas.|まで|から|に|と", "m|A：休[やす]みは 何曜日[なんようび]___ 何曜日[なんようび]までですか。 B：金曜日[きんようび]から 日曜日[にちようび]までです。|A: Liburnya dari hari apa sampai hari apa? B: Dari hari Jumat sampai hari Minggu.|から|まで|に|と"]},
{b:5,t:"どこ（へ）も 行きません",d:"Kata tanya + <b>も</b> dengan kata kerja negatif berarti \"tidak … sama sekali\": <b>どこ（へ）も 行きません</b> = tidak pergi ke mana-mana. Partikel へ boleh dipakai atau tidak, tetapi kata kerjanya harus negatif (～ません atau ～ませんでした). Polanya sama untuk orang: だれも 来ませんでした = tidak ada seorang pun yang datang.",
 r:["S + は + どこ + (へ) + も + 行[い]きません/行[い]きませんでした", "(K-waktu + は) + だれ + も + 来[き]ません/来[き]ませんでした"],
 s:"S + は + どこ + へ + も + P (KK-ません) → 私[わたし]は どこへも 行[い]きません。",
 k:[["どこ", "Kata tanya 'mana'. Di pola ini どこ tidak dipakai untuk bertanya; digabung dengan も, artinya menjadi 'mana pun'."], ["へ", "Partikel arah tujuan, sama seperti dalam 学校[がっこう]へ 行[い]きます. Di pola ini boleh dipakai atau dihilangkan (どこへも = どこも), dan boleh juga diganti に (どこにも)."], ["も", "Setelah kata tanya, も berarti 'mana pun' atau 'siapa pun'. Kalau kata kerjanya negatif, hasilnya penyangkalan total: どこも 行[い]きません = tidak pergi ke mana pun."], ["ません / ませんでした", "Kata kerjanya wajib negatif. ません untuk kebiasaan atau rencana, ませんでした untuk kejadian yang sudah lewat."], ["だれも", "Pola yang sama untuk orang: だれ + も + kata kerja negatif = tidak ada seorang pun: だれも 来[き]ませんでした."]],
 x:["<b>Fungsi:</b> kata tanya + も + kata kerja negatif menyangkal semuanya. どこ(へ)も 行[い]きません = tidak pergi ke mana-mana; だれも 来[き]ません = tidak ada yang datang.", "<b>Cara menyusun:</b> (1) どこ; (2) tambahkan へ, boleh dilewati; (3) tambahkan も; (4) akhiri dengan 行[い]きません atau 行[い]きませんでした. Kata waktu biasanya di depan dan diberi は: 今月[こんげつ]は どこへも 行[い]きません.", "<b>Sebagai jawaban:</b> A: 今週[こんしゅう] どこへ 行[い]きますか。 B: どこへも 行[い]きません。 Jawaban ini menggantikan nama tempat.", "<b>Kesalahan umum:</b> (1) memakai kata kerja positif; untuk arti 'tidak ke mana-mana' kata kerjanya harus ～ません atau ～ませんでした. (2) Menukar urutan partikel menjadi どこもへ; urutan yang benar どこ → へ → も. (3) Menerjemahkan kata per kata menjadi どこへ 行[い]きません tanpa も; kalimat itu tidak bermakna 'tidak ke mana-mana'.", "<b>Tips:</b> jawaban singkat yang alami cukup どこも 行[い]きません. Tidak perlu menyebut tempat apa pun."],
 ex:[["明日[あした]は どこも 行[い]きません。", "Besok saya tidak pergi ke mana-mana."], ["A：休[やす]みは どこへ 行[い]きましたか。 B：どこへも 行[い]きませんでした。", "A: Waktu libur kamu pergi ke mana? B: Tidak ke mana-mana."], ["今日[きょう]は だれも 来[き]ませんでした。", "Hari ini tidak ada seorang pun yang datang."]],
 q:["m|A：来週[らいしゅう] どこへ 行[い]きますか。 B：どこ___ 行[い]きません。|A: Minggu depan kamu pergi ke mana? B: Tidak ke mana-mana.|へも|へ|と|の", "m|昨日[きのう]は どこも 行[い]き___。|Kemarin saya tidak pergi ke mana-mana.|ませんでした|ました|ません|ます", "o|土曜日[どようび]は/どこへ/も/行[い]きません|Hari Sabtu saya tidak pergi ke mana-mana.", "m|けさは ___ 来[き]ませんでした。|Tadi pagi tidak ada seorang pun yang datang.|だれも|だれ|だれと|だれの", "o|先週[せんしゅう]/は/どこ/も/行[い]きませんでした|Minggu lalu saya tidak pergi ke mana-mana.", "o|日曜日[にちようび]は/だれ/も/来[き]ません|Hari Minggu tidak ada seorang pun yang datang.", "m|A：おととい どこへ 行[い]きましたか。 B：___ 行[い]きませんでした。|A: Kemarin lusa kamu pergi ke mana? B: Saya tidak pergi ke mana-mana.|どこも|どこへ|どこに|どこで", "m|来週[らいしゅう]は どこへも ___。|Minggu depan saya tidak pergi ke mana-mana.|行[い]きません|行[い]きます|行[い]きました|行[い]きませんでした"]},
{b:5,t:"いつ (kapan)",d:"<b>いつ</b> berarti \"kapan\" dan dipakai tanpa partikel に: いつ 帰りますか. Kata waktu seperti 今日, 明日, 昨日, 毎日, 来週, dan 去年 juga tidak memakai に. Partikel に dipakai untuk waktu yang memakai angka, seperti 3時に atau 9月に; nama hari boleh dengan atau tanpa に.",
 r:["S + は + いつ + K-tempat + へ + 行[い]きます/来[き]ます/帰[かえ]ります + か", "S + は + いつ + です + か"],
 s:"S + は + いつ + K-tempat + へ + P + か → ワンさんは いつ 中国[ちゅうごく]へ 帰[かえ]りますか。",
 k:[["いつ", "Kata tanya 'kapan'. Diletakkan di posisi keterangan waktu, biasanya setelah S + は. Seperti 明日[あした] atau 来週[らいしゅう], いつ langsung dipakai tanpa に."], ["か", "Partikel tanya di akhir kalimat. Urutan kata sama seperti kalimat biasa; hanya keterangan waktunya yang diganti いつ."], ["へ", "Tujuan tetap diberi へ seperti biasa. いつ tidak mengubah partikel lain dalam kalimat."], ["です", "Untuk menanyakan waktu sebuah acara, cukup S + は + いつ + ですか: 休[やす]みは いつですか."]],
 x:["<b>Fungsi:</b> いつ menanyakan waktu secara umum: hari, tanggal, bulan, atau tahun. Untuk menanyakan jam yang tepat, lebih cocok 何時[なんじ]に: 何時[なんじ]に 来[き]ますか.", "<b>Cara menyusun:</b> tulis kalimat biasa, ganti keterangan waktunya dengan いつ, lalu tambahkan か: 来月[らいげつ] 日本[にほん]へ 行[い]きます → いつ 日本[にほん]へ 行[い]きますか.", "<b>Menjawab:</b> pakai kata waktu. Kata waktu dengan angka memakai に (三月[さんがつ]に, 十五日[じゅうごにち]に), kata relatif tanpa に (来週[らいしゅう], 明日[あした]). Untuk pertanyaan ～ですか, jawab dengan waktu + です: 七月[しちがつ]十日[とおか]です.", "<b>Kesalahan umum:</b> menambahkan に setelah いつ (いつに 行[い]きますか, salah) karena terbiasa memakai に untuk waktu. Kesalahan lain: lupa か di akhir kalimat. いつ boleh juga diletakkan di awal kalimat, tetapi か tetap wajib.", "<b>Tips:</b> dalam pertanyaan, いつ biasanya diletakkan setelah topik: マリアさんは いつ 来[き]ますか. Kalau tidak ada topik, いつ boleh di awal kalimat: いつ 帰[かえ]りますか."],
 ex:[["A：いつ 国[くに]へ 帰[かえ]りますか。 B：来月[らいげつ] 帰[かえ]ります。", "A: Kapan kamu pulang ke negaramu? B: Bulan depan."], ["A：試験[しけん]は いつですか。 B：来週[らいしゅう]の 月曜日[げつようび]です。", "A: Ujiannya kapan? B: Senin minggu depan."], ["私[わたし]は 去年[きょねん]の 九月[くがつ]に インドネシアへ 帰[かえ]りました。", "Saya pulang ke Indonesia bulan September tahun lalu."]],
 q:["m|___ 大学[だいがく]へ 来[き]ましたか。|Kapan kamu datang ke universitas?|いつ|いつに|どこ|だれ", "m|___ 銀行[ぎんこう]へ 行[い]きます。|Besok saya pergi ke bank.|明日[あした]|明日[あした]に|明日[あした]で|明日[あした]を", "o|会議[かいぎ]/は/いつ/ですか|Rapatnya kapan?", "o|いつ/デパートへ/行[い]きますか|Kapan kamu pergi ke toserba?|デパートへ/いつ/行[い]きますか", "o|試験[しけん]/は/いつ/から/ですか|Ujiannya mulai kapan?", "o|ミラーさんは/いつ/会社[かいしゃ]へ/来[き]ますか|Kapan Pak Miller datang ke kantor?|いつ/ミラーさんは/会社[かいしゃ]へ/来[き]ますか|ミラーさんは/会社[かいしゃ]へ/いつ/来[き]ますか", "m|A：いつ ジャカルタへ 帰[かえ]りますか。 B：八月[はちがつ]___ 帰[かえ]ります。|A: Kapan kamu pulang ke Jakarta? B: Saya pulang bulan Agustus.|に|と|を|へ", "m|A：誕生日[たんじょうび]は ___ですか。 B：六月[ろくがつ]十日[とおか]です。|A: Ulang tahunmu kapan? B: Tanggal 10 Juni.|いつ|どこ|だれ|いくら"]},
{b:5,t:"～よ dan ～ね",d:"<b>よ</b> di akhir kalimat dipakai untuk memberi tahu hal yang belum diketahui lawan bicara atau menegaskan pendapat, mirip \"lho\" atau \"kok\". <b>ね</b> dipakai saat kamu mengharapkan persetujuan, memastikan sesuatu, atau menunjukkan simpati, mirip \"ya\" atau \"kan\". Jangan terlalu sering memakai よ kepada atasan karena bisa terdengar menggurui.",
 r:["Kalimat + よ", "Kalimat + ね"],
 s:"Kalimat + よ → 試験[しけん]は 明日[あした]ですよ。",
 k:[["よ", "Diletakkan di akhir kalimat untuk memberi tahu hal yang menurut pembicara belum diketahui lawan bicara, atau untuk menegaskan pendapat. Mirip 'lho' atau 'kok'."], ["ね", "Diletakkan di akhir kalimat bila pembicara mengharapkan persetujuan, ingin memastikan sesuatu, atau menunjukkan simpati. Mirip 'ya' atau 'kan'."], ["です / KK-ます", "よ dan ね ditempelkan setelah bentuk sopan tanpa mengubah kalimat di depannya: 休[やす]みです → 休[やす]みですよ / 休[やす]みですね."]],
 x:["<b>Perbedaan inti:</b> よ berarti 'saya beri tahu kamu', karena informasinya ada di pihak pembicara. ね berarti 'kita sama-sama tahu, kan?', karena informasinya dianggap sudah dimiliki kedua pihak.", "<b>Cara menyusun:</b> buat kalimat sopan biasa yang berakhir ～です atau ～ます, lalu tambahkan よ atau ね di paling akhir: 銀行[ぎんこう]は 三時[さんじ]までですよ。 / 大変[たいへん]ですね。", "<b>Kapan memakai よ:</b> saat menjawab dengan informasi baru atau membetulkan anggapan lawan bicara. A: 明日[あした]も 会議[かいぎ]ですか。 B: いいえ、明日[あした]は 休[やす]みですよ。", "<b>Kapan memakai ね:</b> saat meminta persetujuan atau memastikan (電車[でんしゃ]は 九時[くじ]ですね = keretanya jam sembilan, kan?), dan saat menunjukkan simpati (大変[たいへん]ですね = wah, berat ya).", "<b>Kesalahan umum:</b> memakai よ terlalu sering, terutama kepada atasan atau orang yang lebih tua, sehingga terdengar menggurui. Sebaliknya, memakai ね untuk informasi yang belum diketahui lawan bicara terdengar janggal, karena ね menganggap ia sudah tahu.", "<b>Tips:</b> よ dan ね tidak mengubah arti dasar kalimat. Tanpa keduanya kalimat tetap benar, hanya terdengar lebih datar."],
 ex:[["A：図書館[としょかん]は 何時[なんじ]までですか。 B：七時[しちじ]までですよ。", "A: Perpustakaan buka sampai jam berapa? B: Sampai jam 7, lho."], ["A：毎晩[まいばん] 十二時[じゅうにじ]まで 働[はたら]きます。 B：大変[たいへん]ですね。", "A: Setiap malam saya bekerja sampai jam 12. B: Wah, berat, ya."], ["明日[あした]は 日曜日[にちようび]ですね。", "Besok hari Minggu, ya."]],
 q:["m|A：あの 人[ひと]は 学生[がくせい]ですか。 B：いいえ、先生[せんせい]です___。|A: Orang itu mahasiswa? B: Bukan, dia guru, lho.|よ|ね|か|も", "m|A：ワンさんは 中国人[ちゅうごくじん]です___。 B：はい、そうです。|A: Pak Wang orang Cina, kan? B: Ya, betul.|ね|よ|も|に", "o|あの/バス/は/駅[えき]へ/行[い]きます/よ|Bus itu pergi ke stasiun, lho.", "o|今日[きょう]は/休[やす]み/です/ね|Hari ini libur, ya.", "o|ワンさんは/来週[らいしゅう]/国[くに]へ/帰[かえ]ります/よ|Pak Wang pulang ke negaranya minggu depan, lho.|来週[らいしゅう]/ワンさんは/国[くに]へ/帰[かえ]ります/よ|ワンさんは/国[くに]へ/来週[らいしゅう]/帰[かえ]ります/よ", "o|誕生日[たんじょうび]/は/明日[あした]/です/ね|Ulang tahunmu besok, kan?|明日[あした]/は/誕生日[たんじょうび]/です/ね", "m|A：すみません、この 電車[でんしゃ]は 急行[きゅうこう]ですか。 B：いいえ、普通[ふつう]です___。|A: Permisi, kereta ini kereta ekspres? B: Bukan, ini kereta biasa, lho.|よ|ね|か|も", "m|A：会議[かいぎ]は 二時[にじ]からです。 B：二時[にじ]からです___。|A: Rapatnya mulai jam dua. B: Jam dua, ya.|ね|よ|を|に"]},
{b:6,t:"N を します / 何を しますか",d:"<b>します</b> artinya \"melakukan\". Banyak kegiatan cukup dibentuk dengan <b>kata benda + を します</b>: サッカーを します (main sepak bola), 宿題を します (mengerjakan PR). Untuk menanyakan kegiatan seseorang, pakai <b>何を しますか</b>; di sini 何 dibaca なに.",
 r:["S + は + KB + を + します", "S + は + K-waktu + 何[なに] + を + します + か"],
 s:"S + は + K-waktu + O + を + します → 私[わたし]は 明日[あした] サッカーを します。",
 k:[["を", "Menandai kegiatan sebagai O (objek) dari します. Satu kata します bisa berarti bermain, mengerjakan, atau mengadakan, tergantung KB di depannya: サッカーを します, 宿題[しゅくだい]を します."], ["します", "Kata kerja serbaguna yang berarti 'melakukan'. Artinya menyesuaikan dengan kata bendanya: テニスを します = bermain tenis, 宿題[しゅくだい]を します = mengerjakan PR, 会議[かいぎ]を します = mengadakan rapat."], ["何[なに]を", "Untuk menanyakan kegiatan, kata bendanya diganti 何[なに]. Di sini dibaca なに karena diikuti を: 何[なに]を しますか (melakukan apa?)."], ["か", "Partikel tanya di akhir kalimat. Jawabannya cukup mengganti 何[なに] dengan nama kegiatannya: サッカーを します."]],
 x:["<b>Fungsi:</b> します berarti 'melakukan'. Dengan pola KB + を + します, satu kata kerja bisa dipakai untuk banyak kegiatan: olahraga (テニス, サッカー), tugas (宿題[しゅくだい]), dan acara (会議[かいぎ], お花見[はなみ]).", "<b>Cara menyusun:</b> S + は → waktu → (tempat + で) → kegiatan + を → します. Contoh: 私[わたし]は 毎朝[まいあさ] 学校[がっこう]で テニスを します.", "<b>Bertanya:</b> 何[なに]を しますか (akan atau biasanya melakukan apa?), 何[なに]を しましたか (tadi atau kemarin melakukan apa?). Jawabannya tidak harus memakai します: 図書館[としょかん]で 本[ほん]を 読[よ]みました.", "<b>Variasi bentuk:</b> します → しません → しました → しませんでした. Ajakan: しませんか / しましょう.", "<b>Kesalahan umum:</b> lupa を (テニス します). Dalam percakapan santai を kadang dilewati, tetapi dalam bahasa sopan dan tulisan pakailah を. Kesalahan lain: membaca 何[なに]を sebagai なんを.", "<b>Tips:</b> 勉強[べんきょう]します sebenarnya juga kata benda + します. Jadi 勉強[べんきょう]を します dan 勉強[べんきょう]します sama artinya."],
 ex:[["日曜日[にちようび]に 友達[ともだち]と テニスを します。", "Hari Minggu saya bermain tenis dengan teman."], ["今晩[こんばん] 宿題[しゅくだい]を します。", "Malam ini saya mengerjakan PR."], ["明日[あした] 何[なに]を しますか。", "Besok kamu melakukan apa?"]],
 q:["m|毎晩[まいばん] 宿題[しゅくだい]___ します。|Setiap malam saya mengerjakan PR.|を|が|へ|の", "m|A: 土曜日[どようび]に 何[なに]を しますか。 B: サッカーを ___。|A: Hari Sabtu kamu melakukan apa? B: Saya bermain sepak bola.|します|あります|です|行[い]きます", "o|昼休[ひるやす]み/に/何[なに]/を/しますか|Waktu istirahat siang kamu melakukan apa?", "o|いっしょに/テニス/を/しませんか|Maukah bermain tenis bersama?|テニス/を/いっしょに/しませんか", "o|あさって/会議[かいぎ]/を/します|Lusa kami mengadakan rapat.|会議[かいぎ]/を/あさって/します", "o|先週[せんしゅう]の/土曜日[どようび]/何[なに]/を/しましたか|Sabtu minggu lalu kamu melakukan apa?", "m|A：昨日[きのう] 何[なに]を しましたか。 B：友達[ともだち]と テニス___ しました。|A: Kemarin kamu melakukan apa? B: Saya bermain tenis dengan teman.|を|で|が|へ", "m|A：今晩[こんばん] ___を しますか。 B：レポートを 書[か]きます。|A: Malam ini kamu melakukan apa? B: Saya menulis laporan.|何[なに]|どこ|だれ|いつ"]},
{b:6,t:"何: なに atau なん",d:"Kanji 何 (apa) punya dua bacaan. Dibaca <b>なん</b> sebelum です dan の (何ですか, 何の 本) serta bila disambung dengan satuan seperti 何時, 何歳, 何曜日. Sebelum partikel を dan が, 何 dibaca <b>なに</b>: 何を 食べますか.",
 r:["S + は + 何[なん] + (の + KB) + です + か", "(S + は) + 何[なん] + 時[じ]/曜日[ようび]/歳[さい] + です + か", "S + は + 何[なに] + を + KK-ます + か"],
 s:"S + は + 何[なに] + を + P + か → ミラーさんは 何[なに]を 飲[の]みますか。",
 k:[["何[なん]", "Dibaca なん bila diikuti です atau の (何[なん]ですか, 何[なん]の 本[ほん]), dan bila disambung dengan satuan seperti 時[じ], 曜日[ようび], 歳[さい] (何時[なんじ], 何曜日[なんようび], 何歳[なんさい]). Dengan begitu bunyinya lebih lancar diucapkan."], ["何[なに]", "Dibaca なに bila diikuti partikel を: 何[なに]を 買[か]いますか. Ini bacaan dasar kata 'apa'."], ["を", "Menandai objek yang ditanyakan. 何[なに] + を menanyakan benda atau kegiatan: 何[なに]を 食[た]べますか (makan apa?)."], ["の + KB", "何[なん]の + KB menanyakan jenis atau isi sesuatu: 何[なん]の 本[ほん]ですか (buku tentang apa?)."]],
 x:["<b>Fungsi:</b> 何[なに] berarti 'apa'. Tulisannya satu, tetapi bacaannya dua: なに dan なん. Pilihannya ditentukan oleh kata yang datang <b>sesudahnya</b>.", "<b>Dibaca なん:</b> (1) sebelum です: これは 何[なん]ですか; (2) sebelum の: 何[なん]の 本[ほん]ですか; (3) bersama satuan: 何時[なんじ], 何分[なんぷん], 何曜日[なんようび], 何歳[なんさい], 何階[なんがい], 何番[なんばん], 何月[なんがつ], 何日[なんにち].", "<b>Dibaca なに:</b> sebelum を: 何[なに]を 飲[の]みますか, 何[なに]を しましたか.", "<b>Kesalahan umum:</b> membaca 何[なに]を sebagai なんを, atau 何[なん]ですか sebagai なにですか. Ingat pasangannya: なに + を, なん + です/の/satuan.", "<b>Tips:</b> 何[なん]の + KB menanyakan jenis atau isi sesuatu: 何[なん]の 本[ほん]ですか (buku tentang apa?). Sedangkan 何[なん]ですか menanyakan bendanya sendiri: これは 何[なん]ですか (ini apa?)."],
 ex:[["それは 何[なん]の 雑誌[ざっし]ですか。", "Itu majalah tentang apa?"], ["今晩[こんばん] 何[なに]を 食[た]べますか。", "Malam ini kamu makan apa?"], ["今日[きょう]は 何曜日[なんようび]ですか。", "Hari ini hari apa?"]],
 q:["m|あれは ___の 店[みせ]ですか。|Itu toko apa?|なん|なに|だれ|いつ", "m|昨日[きのう] ___を 買[か]いましたか。|Kemarin kamu membeli apa?|なに|なん|いつ|どこ", "m|すみません、今[いま] ___ですか。|Permisi, sekarang jam berapa?|なんじ|なにじ|なに|なんようび", "o|これ/は/何[なん]/の/CD/ですか|Ini CD apa?", "o|けさ/何[なに]/を/食[た]べましたか|Tadi pagi kamu makan apa?", "o|これ/は/何[なん]/の/鍵[かぎ]/ですか|Ini kunci apa?", "m|A：それは ___ですか。 B：日本[にほん]の お茶[ちゃ]です。|A: Itu apa? B: Teh Jepang.|なん|なに|どこ|いつ", "m|A：試験[しけん]は ___曜日[ようび]ですか。 B：水曜日[すいようび]です。|A: Ujiannya hari apa? B: Hari Rabu.|なん|なに|いつ|どこ"]},
{b:7,t:"～語で 何ですか",d:"Untuk menanyakan sebuah kata dalam bahasa lain, pakai <b>「kata」は ～語で 何ですか</b> (何 dibaca なん). Partikel で di sini berarti \"dalam (bahasa)\", dan jawabannya cukup 「…」です. で yang sama dipakai bersama kata kerja: 日本語で 書きます (menulis dalam bahasa Jepang).",
 r:["「KB」 + は + ～語[ご] + で + 何[なん]ですか", "「KB」 + です", "S + は + ～語[ご] + で + O + を + KK-ます"],
 s:"「kata」 + は + ～語[ご] + で + 何[なん]ですか → 「kunci」は 日本語[にほんご]で 何[なん]ですか。",
 k:[["は", "Kata yang ditanyakan dijadikan topik dengan は, artinya kira-kira \"kalau kata ini, ...\". Karena itu kata tersebut diletakkan paling depan."], ["で", "で menunjukkan sarana. Bahasa dianggap alat untuk mengungkapkan sesuatu, jadi 英語[えいご]で berarti \"dalam bahasa Inggris\". Ini で yang sama dengan はしで 食[た]べます (makan dengan sumpit)."], ["何[なん]ですか", "Di sini 何[なん] dibaca なん, bukan なに, karena langsung diikuti です. Jawabannya cukup kata padanannya + です."], ["「 」", "Tanda kutip Jepang 「 」 mengapit kata yang sedang ditanyakan: 「kunci」は 日本語[にほんご]で 何[なん]ですか."]],
 x:["Pola ini dipakai untuk menanyakan padanan kata dalam bahasa lain. Saat belajar dengan orang Jepang, sebutkan kata dalam bahasa Indonesia atau Inggris, lalu tanyakan bahasa Jepangnya.", "Menyusun langkah demi langkah: (1) tulis katanya di dalam 「 」: 「pulpen」; (2) tambahkan は: 「pulpen」は; (3) sebut bahasanya + で: 日本語[にほんご]で; (4) tutup dengan 何[なん]ですか. Hasilnya: 「pulpen」は 日本語[にほんご]で 何[なん]ですか。", "Menjawab cukup dengan kata padanannya + です: 「ボールペン」です. Jawaban lengkapnya: 「pulpen」は 日本語[にほんご]で 「ボールペン」です.", "で yang sama dipakai bersama kata kerja untuk menyebut bahasa yang digunakan: 英語[えいご]で メールを 書[か]きます (menulis e-mail dalam bahasa Inggris), 日本語[にほんご]で 年賀状[ねんがじょう]を 書[か]きます (menulis kartu tahun baru dalam bahasa Jepang).", "Kesalahan yang sering muncul: memakai に (英語[えいご]に 何[なん]ですか), membaca 何[なん] sebagai なに, atau lupa 語[ご]. 日本[にほん] adalah nama negara, bahasanya 日本語[にほんご]."],
 ex:[["「さようなら」は 英語[えいご]で 何[なん]ですか。", "Apa bahasa Inggrisnya \"sayounara\"?"], ["「Goodbye」です。", "Bahasa Inggrisnya \"goodbye\"."], ["日本語[にほんご]で レポートを 書[か]きます。", "Saya menulis laporan dalam bahasa Jepang."]],
 q:["m|「おはよう」は 英語[えいご]___ 何[なん]ですか。|Apa bahasa Inggrisnya \"ohayou\"?|で|に|を|が", "m|「Hello」は ___で 何[なん]ですか。|Apa bahasa Jepangnya \"hello\"?|日本語[にほんご]|日本[にほん]|日本人[にほんじん]|英語[えいご]", "o|「ありがとう」/は/インドネシア語[ご]/で/何[なん]/ですか|Apa bahasa Indonesianya \"arigatou\"?|インドネシア語[ご]/で/「ありがとう」/は/何[なん]/ですか", "o|日本語[にほんご]/で/手紙[てがみ]/を/書[か]きます|Saya menulis surat dalam bahasa Jepang.|手紙[てがみ]/を/日本語[にほんご]/で/書[か]きます", "m|「Thank you」は 日本語[にほんご]で ___ですか。|Apa bahasa Jepangnya \"thank you\"?|何[なん]|誰[だれ]|どこ|いつ", "m|A: 「本[ほん]」は 英語[えいご]で 何[なん]ですか。 B: 「Book」___。|A: Apa bahasa Inggrisnya \"hon\"? B: \"Book\".|です|で|は|を", "o|「Selamat pagi」/は/日本語[にほんご]/で/「おはようございます」/です|Bahasa Jepangnya \"selamat pagi\" adalah \"ohayou gozaimasu\".|日本語[にほんご]/で/「Selamat pagi」/は/「おはようございます」/です", "o|「すみません」/は/英語[えいご]/で/何[なん]/ですか|Apa bahasa Inggrisnya \"sumimasen\"?|英語[えいご]/で/「すみません」/は/何[なん]/ですか"]},
{b:7,t:"Orang に N を あげます / もらいます",d:"<b>あげます</b> = memberi: Pemberi は Penerima に Barang を あげます. <b>もらいます</b> = menerima: Penerima は Pemberi に (atau から) Barang を もらいます. Kalau Anda yang menerima, ceritakan dengan もらいます: 私は 友達に もらいました. Pola yang sama dipakai untuk 貸します/借ります dan 教えます/習います.",
 r:["S + は + KB-orang + に + O + を + あげます / 貸[か]します / 教[おし]えます", "S + は + KB-orang + に / から + O + を + もらいます / 借[か]ります / 習[なら]います"],
 s:"S + は + KB-orang + に + O + を + あげます → 私[わたし]は 山田[やまだ]さんに チョコレートを あげます。",
 k:[["は", "は menandai tokoh yang diceritakan: pemberi kalau kata kerjanya あげます, penerima kalau kata kerjanya もらいます."], ["に", "に menandai orang di pihak lain. Dengan あげます, 貸[か]します, dan 教[おし]えます artinya \"kepada\"; dengan もらいます, 借[か]ります, dan 習[なら]います artinya \"dari\". Arah barangnya ditentukan oleh kata kerja."], ["を", "を menandai barang atau ilmu yang berpindah: 花[はな]を, 本[ほん]を, 日本語[にほんご]を."], ["から", "Dengan もらいます, 借[か]ります, dan 習[なら]います, に boleh diganti から karena orang itu adalah asal barang. Kalau asalnya lembaga seperti 会社[かいしゃ] atau 学校[がっこう], gunakan から."], ["あげます / もらいます", "Pilih menurut subjeknya: subjek yang memberi memakai あげます, subjek yang menerima memakai もらいます. Kejadiannya bisa sama; yang berbeda hanya sudut pandang."]],
 x:["あげます = memberi, もらいます = menerima. Satu kejadian bisa diceritakan dari dua sisi: カリナさんは ワンさんに 本[ほん]を あげました (Karina-san memberi Wang-san buku) dan ワンさんは カリナさんに 本[ほん]を もらいました (Wang-san menerima buku dari Karina-san).", "Langkah dengan あげます: (1) pemberi + は: 私[わたし]は; (2) penerima + に: 友達[ともだち]に; (3) barang + を: 写真[しゃしん]を; (4) あげました. Langkah dengan もらいます: (1) penerima + は; (2) pemberi + に atau から; (3) barang + を; (4) もらいました.", "Pasangan lain dengan susunan yang sama: 貸[か]します (meminjamkan) dan 借[か]ります (meminjam), 教[おし]えます (mengajar) dan 習[なら]います (belajar dari seseorang). Contoh: 私[わたし]は カリナさんに インドネシア語[ご]を 教[おし]えます; カリナさんは 私[わたし]に インドネシア語[ご]を 習[なら]います.", "Kesalahan yang sering muncul: 貸[か]します dan 借[か]ります tertukar. Kalau barang keluar dari subjek, pakai 貸[か]します; kalau barang masuk ke subjek, pakai 借[か]ります.", "Kalau orang lain memberi sesuatu kepada Anda, jangan memakai あげます (友達[ともだち]は 私[わたし]に 花[はな]を あげました salah). Ceritakan dari sisi Anda: 私[わたし]は 友達[ともだち]に 花[はな]を もらいました. Kata kerja khusus untuk \"memberi kepada saya\" baru dipelajari nanti."],
 ex:[["私[わたし]は 母[はは]に 花[はな]を あげました。", "Saya memberikan bunga kepada ibu."], ["私[わたし]は 友達[ともだち]に 本[ほん]を もらいました。", "Saya mendapat buku dari teman."], ["山田[やまだ]さんに 英語[えいご]を 教[おし]えます。", "Saya mengajari Yamada-san bahasa Inggris."]],
 q:["m|私[わたし]は 父[ちち]___ ネクタイを あげました。|Saya memberikan dasi kepada ayah.|に|を|が|で", "m|私[わたし]は 山田[やまだ]さんに お土産[みやげ]を ___。|Saya mendapat oleh-oleh dari Yamada-san.|もらいました|あげました|貸[か]しました|教[おし]えました", "o|その/時計[とけい]/は/誰[だれ]/に/もらいましたか|Jam itu kamu dapat dari siapa?", "o|友達[ともだち]/に/プレゼント/を/あげました|Saya memberikan hadiah kepada teman.|プレゼント/を/友達[ともだち]/に/あげました", "m|私[わたし]は 友達[ともだち]に 辞書[じしょ]を ___。|Saya meminjam kamus dari teman.|借[か]りました|貸[か]しました|あげました|教[おし]えました", "m|私[わたし]は 学校[がっこう]___ 本[ほん]を もらいました。|Saya mendapat buku dari sekolah.|から|を|が|へ", "o|ワンさん/に/傘[かさ]/を/貸[か]しました|Saya meminjamkan payung kepada Wang-san.|傘[かさ]/を/ワンさん/に/貸[か]しました", "o|誰[だれ]/に/日本語[にほんご]/を/習[なら]いましたか|Kamu belajar bahasa Jepang dari siapa?|日本語[にほんご]/を/誰[だれ]/に/習[なら]いましたか"]},
{b:7,t:"もう ～ました / まだです",d:"<b>もう</b> + ～ました berarti \"sudah ...\". Untuk bertanya: もう ～ましたか. Jawabannya はい、もう ～ました, atau <b>いいえ、まだです</b> (belum). Jawaban ～ませんでした berarti \"tidak melakukan\", jadi tidak cocok untuk \"belum\".",
 r:["もう + O + を + KK-ましたか", "はい、 + もう + KK-ました", "いいえ、 + まだです"],
 s:"もう + O + を + KK-ました → もう 荷物[にもつ]を 送[おく]りました。",
 k:[["もう", "もう berarti \"sudah\". Letaknya sebelum kata kerja: boleh di awal (もう 荷物[にもつ]を 送[おく]りました) atau tepat sebelum kata kerja (荷物[にもつ]を もう 送[おく]りました)."], ["～ました", "Pekerjaan yang sudah selesai memakai bentuk lampau ～ました. もう dan ～ました dipakai sekaligus: もう 食[た]べました (sudah makan)."], ["いいえ、まだです", "Ini jawaban \"belum\" yang paling umum. Kata kerjanya tidak perlu diulang."], ["～ませんでした", "Bentuk ini berarti \"tidak melakukan\" pada waktu yang sudah lewat, seakan kesempatannya sudah selesai. Karena itu bentuk ini tidak dipakai untuk menjawab \"belum\"."], ["これから", "Sering menyusul まだです untuk menyebut rencana: いいえ、まだです。これから 書[か]きます (belum, baru akan saya tulis)."]],
 x:["もう ～ました menyatakan bahwa suatu pekerjaan sudah selesai. Bentuk tanyanya, もう ～ましたか, dipakai untuk mengecek apakah sesuatu sudah dikerjakan.", "Menyusun langkah demi langkah: (1) kata kerja bentuk ます: 買[か]います; (2) ubah ke bentuk lampau: 買[か]いました; (3) tambahkan もう dan objeknya: もう お土産[みやげ]を 買[か]いました; (4) untuk bertanya, tambahkan か: もう お土産[みやげ]を 買[か]いましたか.", "Menjawab: kalau sudah, はい、もう 買[か]いました; kalau belum, いいえ、まだです. Jawaban \"belum\" bisa disusul rencana dengan これから: これから 買[か]います.", "Kesalahan yang sering muncul: menjawab \"belum\" dengan いいえ、買[か]いませんでした. Kalimat itu berarti \"tidak membeli\", seakan-akan kesempatannya sudah lewat. Untuk menjawab \"sudah\", ulangi kata kerjanya (はい、もう 買[か]いました); jawaban もうです salah.", "Subjek biasanya tidak disebut karena sudah jelas dari percakapan. Kalau perlu, letakkan di depan: ミラーさんは もう 帰[かえ]りましたか (Miller-san sudah pulang?)."],
 ex:[["もう 手紙[てがみ]を 送[おく]りましたか。", "Kamu sudah mengirim suratnya?"], ["はい、もう 送[おく]りました。", "Ya, sudah saya kirim."], ["いいえ、まだです。これから 送[おく]ります。", "Belum. Sebentar lagi saya kirim."]],
 q:["m|A: もう 昼[ひる]ご飯[はん]を 食[た]べましたか。 B: いいえ、___。|A: Sudah makan siang? B: Belum.|まだです|もうです|食[た]べませんでした|食[た]べました", "m|___ 切符[きっぷ]を 買[か]いましたか。|Kamu sudah membeli tiketnya?|もう|まだ|これから|明日[あした]", "o|もう/新聞[しんぶん]/を/読[よ]みましたか|Kamu sudah membaca koran?|新聞[しんぶん]/を/もう/読[よ]みましたか", "m|A: もう 宿題[しゅくだい]を しましたか。 B: ___、まだです。|A: Sudah mengerjakan PR? B: Belum.|いいえ|はい|もう|どうも", "m|A: もう 年賀状[ねんがじょう]を 書[か]きましたか。 B: はい、___。|A: Sudah menulis kartu tahun baru? B: Ya, sudah.|もう 書[か]きました|まだです|書[か]きません|まだ 書[か]きました", "o|もう/メール/を/送[おく]りました|Saya sudah mengirim e-mail.|メール/を/もう/送[おく]りました", "o|はい、/もう/写真[しゃしん]を/撮[と]りました|Ya, saya sudah mengambil fotonya.|はい、/写真[しゃしん]を/もう/撮[と]りました", "o|いいえ、/まだです。/これから/かけます|Belum. Sebentar lagi saya telepon."]},
{b:8,t:"～が、～ (tetapi)",d:"<b>が</b> di akhir kalimat pertama berarti \"tetapi\" dan menyambung dua hal yang berlawanan: Kalimat 1 + が、Kalimat 2. Sebelum が tetap pakai bentuk sopan です atau ます: 高いですが、おいしいです.",
 r:["Kalimat 1 + が、 + Kalimat 2", "S + は + KS + ですが、 + KS + です", "KK-ます / KK-ません + が、 + Kalimat 2"],
 s:"Kalimat 1 + が、 + Kalimat 2 → あの レストランは 安[やす]いですが、おいしくないです。",
 k:[["が", "が di sini berarti \"tetapi\". Partikel ini menempel di akhir kalimat pertama, lalu diikuti koma dan kalimat kedua."], ["です / ます sebelum が", "Kalimat pertama tetap utuh dan sopan, lalu が ditambahkan di belakangnya: 高[たか]いですが, 行[い]きますが. が tidak menggantikan です atau ます."], ["Isi yang berlawanan", "Kalimat kedua harus bertentangan dengan kalimat pertama atau di luar dugaan. Kalau isinya searah, sambung dengan そして: おいしいです。そして、安[やす]いです."]],
 x:["が (tetapi) menggabungkan dua kalimat yang isinya berlawanan menjadi satu kalimat.", "Menyusun langkah demi langkah: (1) kalimat pertama: この 本[ほん]は 古[ふる]いです; (2) tambahkan が dan koma: この 本[ほん]は 古[ふる]いですが、; (3) kalimat kedua yang berlawanan: おもしろいです. Hasilnya: この 本[ほん]は 古[ふる]いですが、おもしろいです.", "Kalimat pertama bisa berupa kata benda atau kata kerja, dan kalimat kedua boleh negatif: 土曜日[どようび]は 休[やす]みですが、忙[いそが]しいです; 朝[あさ]ご飯[はん]を 食[た]べませんが、元気[げんき]です; この 店[みせ]は 有名[ゆうめい]ですが、高[たか]くないです.", "Kesalahan yang sering muncul: meniru urutan \"tetapi\" dan menaruh が di awal kalimat kedua. Dalam percakapan, が selalu menempel di belakang kalimat pertama: おいしいですが、高[たか]いです.", "が juga muncul di 失礼[しつれい]ですが (Bab 1). Di sana が hanya memperhalus kalimat sebelum bertanya, jadi tidak diterjemahkan \"tetapi\"."],
 ex:[["日本[にほん]の 食[た]べ物[もの]は おいしいですが、高[たか]いです。", "Makanan Jepang enak, tetapi mahal."], ["この 部屋[へや]は 小[ちい]さいですが、きれいです。", "Kamar ini kecil, tetapi bersih."], ["仕事[しごと]は 忙[いそが]しいですが、楽[たの]しいです。", "Pekerjaannya sibuk, tetapi menyenangkan."]],
 q:["m|この 車[くるま]は 古[ふる]いです___、とても 便利[べんり]です。|Mobil ini tua, tetapi sangat praktis.|が|を|に|の", "m|日本語[にほんご]は 難[むずか]しいですが、___。|Bahasa Jepang sulit, tetapi menarik.|おもしろいです|難[むずか]しいです|おもしろくないです|易[やさ]しくないです", "o|この/かばん/は/高[たか]いですが、/とても/いいです|Tas ini mahal, tetapi sangat bagus.", "m|この カメラは ___、とても 高[たか]いです。|Kamera ini bagus, tetapi sangat mahal.|いいですが|いいです|がいいです|よくないですが", "m|日曜日[にちようび]は 休[やす]みです___、会社[かいしゃ]へ 行[い]きます。|Hari Minggu libur, tetapi saya pergi ke kantor.|が|を|も|へ", "o|私[わたし]の/町[まち]は/小[ちい]さいですが、/にぎやかです|Kota saya kecil, tetapi ramai.", "o|この/寮[りょう]は/古[ふる]いですが、/とても/きれいです|Asrama ini tua, tetapi sangat bersih.", "o|この/パソコンは/便利[べんり]ですが、/高[たか]いです|Komputer ini praktis, tetapi mahal."]},
{b:8,t:"とても / あまり",d:"<b>とても</b> (sangat) dipakai dalam kalimat positif: とても おいしいです. <b>あまり</b> (tidak begitu) selalu diikuti bentuk negatif: あまり 高くないです, あまり 静かじゃ ありません. Keduanya diletakkan tepat sebelum kata sifat.",
 r:["S + は + とても + KS + です", "S + は + あまり + KS-i (～い → ～くない) + です", "S + は + あまり + KS-na + じゃ ありません"],
 s:"S + は + あまり + KS-i (～くない) + です → この 辞書[じしょ]は あまり 高[たか]くないです。",
 k:[["とても", "とても berarti \"sangat\" dan dipakai dalam kalimat positif. Letaknya tepat di depan kata sifat: とても 寒[さむ]いです."], ["あまり", "あまり baru berarti \"tidak begitu\" kalau kata sifat sesudahnya berbentuk negatif. Kata ini sendiri tidak mengandung arti \"tidak\"."], ["～くないです", "Kata sifat -い sesudah あまり diubah ke negatif: い diganti くない, lalu ditambah です. 難[むずか]しい → あまり 難[むずか]しくないです."], ["じゃ ありません", "Kata sifat -な sesudah あまり tidak berubah; yang berubah bagian belakangnya: 便利[べんり]です → あまり 便利[べんり]じゃ ありません."]],
 x:["とても dan あまり menunjukkan seberapa kuat sifatnya: とても = sangat, あまり + negatif = tidak begitu. Keduanya diletakkan tepat sebelum kata sifat.", "Menyusun kalimat あまり langkah demi langkah: (1) pilih kata sifat: 易[やさ]しい; (2) ubah ke negatif: 易[やさ]しくない; (3) taruh あまり di depannya dan tutup dengan です: あまり 易[やさ]しくないです. Untuk KS-na: 暇[ひま] → 暇[ひま]じゃ ありません → あまり 暇[ひま]じゃ ありません.", "Dalam tanya jawab: この 映画[えいが]は おもしろいですか。 Jawabannya はい、とても おもしろいです atau いいえ、あまり おもしろくないです. Jawaban dengan あまり terdengar lebih halus daripada おもしろくないです saja.", "とても juga bisa dipakai di depan kata sifat yang menerangkan benda: とても きれいな 町[まち]です, とても 古[ふる]い 車[くるま]です.", "Kesalahan yang sering muncul: あまり dengan bentuk positif (あまり 高[たか]いです) atau とても dengan bentuk negatif (とても 高[たか]くないです). Pasangan yang benar: とても + positif, あまり + negatif."],
 ex:[["この 町[まち]は とても にぎやかです。", "Kota ini sangat ramai."], ["今日[きょう]は あまり 寒[さむ]くないです。", "Hari ini tidak begitu dingin."], ["あの 店[みせ]は あまり 有名[ゆうめい]じゃ ありません。", "Toko itu tidak begitu terkenal."]],
 q:["m|この カメラは ___ 高[たか]くないです。|Kamera ini tidak begitu mahal.|あまり|とても|そして|それから", "m|私[わたし]の 町[まち]は あまり ___。|Kota saya tidak begitu ramai.|にぎやかじゃ ありません|にぎやかです|にぎやかくないです|にぎやかな です", "o|この/パン/は/とても/おいしい/です|Roti ini sangat enak.", "o|この/本[ほん]/は/あまり/おもしろくない/です|Buku ini tidak begitu menarik.", "m|この 部屋[へや]は あまり ___。|Kamar ini tidak begitu besar.|大[おお]きくないです|大[おお]きいです|大[おお]きいじゃ ありません|大[おお]きじゃ ありません", "m|あの 山[やま]は ___ 高[たか]いです。|Gunung itu sangat tinggi.|とても|あまり|そして|どう", "o|この/町[まち]/は/あまり/静[しず]か/じゃ ありません|Kota ini tidak begitu tenang.", "o|日本[にほん]/の/生活[せいかつ]/は/とても/楽[たの]しいです|Kehidupan di Jepang sangat menyenangkan."]},
{b:8,t:"N は どうですか / どんな N ですか",d:"<b>N は どうですか</b> menanyakan kesan atau pendapat tentang sesuatu (Bagaimana ...?). <b>どんな + kata benda</b> menanyakan sifat atau jenisnya (... seperti apa?). Jawaban untuk どんな biasanya berupa kata sifat + kata benda: 静かな 町です.",
 r:["S + は + どうですか", "S + は + どんな + KB + ですか", "S + は + KS-i / KS-na な + KB + です"],
 s:"S + は + どんな + KB + ですか → 日本語[にほんご]の 先生[せんせい]は どんな 人[ひと]ですか。",
 k:[["どう", "どう menanyakan kesan atau keadaan (\"bagaimana\"). Kata ini berdiri sendiri dan langsung diikuti ですか: 仕事[しごと]は どうですか."], ["どんな", "どんな harus menempel pada kata benda: どんな 人[ひと], どんな 所[ところ]. Yang ditanyakan adalah sifat atau jenis benda itu."], ["な (dalam jawaban)", "Jawaban どんな biasanya kata sifat + kata benda. KS-na memakai な (静[しず]かな 所[ところ]です), sedangkan KS-i langsung menempel (古[ふる]い 町[まち]です)."], ["Letak kata tanya", "どう dan どんな berada di tempat yang nanti diisi jawabannya: 町[まち]は どうですか → 町[まち]は 静[しず]かです; どんな 町[まち]ですか → 静[しず]かな 町[まち]です. Kata tanyanya tidak dipindah ke depan."]],
 x:["どう berarti \"bagaimana\" dan menanyakan kesan atau pendapat; jawabannya cukup kata sifat: おもしろいです, あまり よくないです. どんな + KB berarti \"KB yang seperti apa\" dan menanyakan sifat atau jenis; jawabannya kata sifat + kata benda: おもしろい 人[ひと]です.", "Menyusun pertanyaan どんな langkah demi langkah: (1) topik + は: カリナさんの 寮[りょう]は; (2) どんな + kata benda: どんな 所[ところ]; (3) ですか. Hasilnya: カリナさんの 寮[りょう]は どんな 所[ところ]ですか. Jawabannya misalnya にぎやかな 所[ところ]です.", "どんな juga dipakai bersama kata kerja: どんな 映画[えいが]を 見[み]ますか (film seperti apa yang kamu tonton?). Jawabannya: おもしろい 映画[えいが]を 見[み]ます atau アメリカの 映画[えいが]を 見[み]ます.", "どうですか juga dipakai untuk menawarkan sesuatu: お茶[ちゃ]は どうですか (mau teh?). Bentuk yang lebih sopan adalah いかがですか.", "Kesalahan yang sering muncul: どう + kata benda (どう 人[ひと]ですか) atau どんな tanpa kata benda (どんなですか). どう berdiri sendiri, sedangkan どんな selalu diikuti kata benda."],
 ex:[["日本[にほん]の 生活[せいかつ]は どうですか。", "Bagaimana kehidupan di Jepang?"], ["田中[たなか]さんは どんな 人[ひと]ですか。", "Tanaka-san orangnya seperti apa?"], ["親切[しんせつ]な 人[ひと]です。", "Dia orang yang baik hati."]],
 q:["m|新[あたら]しい 仕事[しごと]は ___ですか。|Bagaimana pekerjaan barunya?|どう|どんな|誰[だれ]|どこ", "m|ミラーさんは ___ 人[ひと]ですか。|Miller-san orang yang seperti apa?|どんな|どう|どこ|いつ", "o|日本語[にほんご]/の/勉強[べんきょう]/は/どう/ですか|Bagaimana belajar bahasa Jepangmu?", "o|どんな/本[ほん]/を/読[よ]みますか|Buku seperti apa yang kamu baca?", "m|A: その カメラは どうですか。 B: とても ___ カメラです。|A: Bagaimana kamera itu? B: Kamera yang sangat bagus.|いい|いいな|よく|いいの", "m|A: ミラーさんの 町[まち]は どんな 町[まち]ですか。 B: ___ 町[まち]です。|A: Kota Miller-san itu kota yang seperti apa? B: Kota yang indah.|きれいな|きれい|きれいの|きれいい", "o|インドネシア/は/どんな/国[くに]/ですか|Indonesia negara yang seperti apa?", "o|とても/親切[しんせつ]な/人[ひと]/です|Dia orang yang sangat baik hati."]},
{b:9,t:"N が わかります / あります (punya)",d:"<b>わかります</b> (mengerti) dan <b>あります</b> (punya) menandai bendanya dengan <b>が</b>, bukan を: 日本語が わかります, 車が あります. Di sini あります berarti memiliki, termasuk hal tak berwujud seperti waktu atau janji: 時間が ありません (tidak punya waktu).",
 r:["S + は + O + が + わかります", "S + は + O + が + あります", "S + は + O + が + わかりません / ありません"],
 s:"S + は + O + が + わかります → ワンさんは 日本語[にほんご]が わかります。",
 k:[["が", "わかります dan あります menyatakan keadaan (paham, punya). Kata kerja keadaan seperti ini menandai hal yang dipahami atau dimiliki dengan が; を dipakai untuk objek tindakan seperti 食[た]べます atau 読[よ]みます."], ["は", "は menandai orang yang paham atau yang punya. Kalau sudah jelas dari percakapan, bagian ini sering dihilangkan: 時間[じかん]が ありません."], ["あります (punya)", "Setelah orang + は, あります berarti \"punya\". Bisa untuk benda (車[くるま]が あります) maupun hal tak berwujud seperti 時間[じかん], 用事[ようじ], dan 約束[やくそく]."], ["～ません", "Negatifnya cukup mengganti ます dengan ません: わかりません (tidak mengerti), ありません (tidak punya)."]],
 x:["わかります berarti \"mengerti, paham\". あります yang didahului orang + は berarti \"punya\". Keduanya memakai が untuk hal yang dipahami atau dimiliki.", "Menyusun langkah demi langkah: (1) orangnya + は: カリナさんは; (2) hal + が: かたかなが; (3) kata kerja: わかります. Hasilnya: カリナさんは かたかなが わかります. Pertanyaan: かたかなが わかりますか. Jawaban: はい、わかります atau いいえ、わかりません.", "あります sering dipakai untuk hal tak berwujud: 時間[じかん]が ありません (tidak ada waktu), 用事[ようじ]が あります (ada urusan), 約束[やくそく]が あります (ada janji). Ungkapan ini biasa dipakai untuk menolak ajakan dengan halus.", "Kesalahan yang sering muncul: memakai を karena \"mengerti bahasa Jepang\" terasa seperti kalimat berobjek (日本語[にほんご]を わかります). Yang benar 日本語[にほんご]が わかります.", "あります hanya dipakai untuk benda dan hal. Untuk orang dan hewan (punya anak, punya kucing) dipakai kata kerja lain yang dipelajari nanti.", "わかりました (Bab 6), yang diucapkan saat menerima instruksi, berasal dari kata kerja yang sama dan berarti \"baik, saya mengerti\"."],
 ex:[["ミラーさんは ひらがなが わかります。", "Miller-san mengerti hiragana."], ["私[わたし]は パソコンが あります。", "Saya punya komputer."], ["細[こま]かい お金[かね]が ありますか。", "Kamu punya uang receh?"]],
 q:["m|私[わたし]は 英語[えいご]___ わかります。|Saya mengerti bahasa Inggris.|が|を|へ|の", "m|すみません、今日[きょう]は 時間[じかん]が ___。|Maaf, hari ini saya tidak punya waktu.|ありません|いません|わかりません|しません", "o|明日[あした]/は/約束[やくそく]/が/あります|Besok saya ada janji.", "m|私[わたし]は 自転車[じてんしゃ]___ あります。|Saya punya sepeda.|が|を|へ|の", "m|すみません、ちょっと 用事[ようじ]が ___から、帰[かえ]ります。|Maaf, karena ada sedikit urusan, saya pulang.|あります|わかります|します|です", "o|私[わたし]/は/車[くるま]/が/ありません|Saya tidak punya mobil.", "o|サントスさん/は/漢字[かんじ]/が/わかりますか|Apakah Santos-san mengerti kanji?", "o|明日[あした]/時間[じかん]/が/ありますか|Besok kamu ada waktu?"]},
{b:9,t:"よく・だいたい・たくさん・少し・あまり・全然",d:"Kata keterangan ini biasanya diletakkan tepat sebelum kata kerja: よく (dengan baik, sering), だいたい (sebagian besar), たくさん (banyak), 少し (sedikit). <b>あまり</b> (tidak begitu) dan <b>全然</b> (sama sekali tidak) wajib diikuti bentuk negatif: 全然 わかりません.",
 r:["S + は + O + が + よく / だいたい / 少[すこ]し + わかります", "S + は + O + が + たくさん / 少[すこ]し + あります", "S + は + O + が / を + あまり / 全然[ぜんぜん] + KK-ません"],
 s:"S + は + O + が + 全然[ぜんぜん] + KK-ません → 私[わたし]は 漢字[かんじ]が 全然[ぜんぜん] わかりません。",
 k:[["よく", "Dengan わかります, よく berarti \"dengan baik\" (よく わかります = paham betul). Dengan kata kerja tindakan, よく berarti \"sering\": よく 映画[えいが]を 見[み]ます."], ["だいたい / 少[すこ]し", "Menunjukkan sebagian: だいたい = sebagian besar, kurang lebih; 少[すこ]し = sedikit. Kalimatnya tetap positif."], ["たくさん", "Menyatakan jumlah yang banyak, cocok dengan あります atau kata kerja seperti 食[た]べます. Untuk \"paham betul\", pakai よく."], ["あまり / 全然[ぜんぜん]", "Keduanya wajib diikuti bentuk negatif ～ません. あまり = tidak begitu, 全然[ぜんぜん] = sama sekali tidak. Tanpa ～ません kalimatnya salah."], ["Letak", "Kata keterangan ini biasanya diletakkan sesudah ～が atau ～を, tepat sebelum kata kerja: 英語[えいご]が 少[すこ]し わかります."]],
 x:["Kata keterangan ini menjawab pertanyaan \"seberapa\". Untuk pemahaman, urutannya dari tinggi ke rendah: よく わかります → だいたい わかります → 少[すこ]し わかります → あまり わかりません → 全然[ぜんぜん] わかりません.", "Untuk jumlah: 仕事[しごと]が たくさん あります → 少[すこ]し あります → あまり ありません → 全然[ぜんぜん] ありません.", "Menyusun langkah demi langkah: (1) S は O が: 私[わたし]は 韓国語[かんこくご]が; (2) kata keterangan: 少[すこ]し; (3) kata kerja: わかります. Kalau memakai あまり atau 全然[ぜんぜん], ubah kata kerjanya ke ～ません: 私[わたし]は 韓国語[かんこくご]が あまり わかりません.", "Kesalahan yang sering muncul: 全然[ぜんぜん] わかります atau あまり あります ✗. 全然[ぜんぜん] dan あまり selalu dipasangkan dengan kata kerja bentuk negatif (～ません): 全然[ぜんぜん] わかりません.", "Dengan kata kerja tindakan, よく berarti \"sering\" dan あまり ～ません berarti \"jarang\": よく 写真[しゃしん]を 撮[と]ります (sering memotret), あまり テレビを 見[み]ません (jarang menonton TV)."],
 ex:[["山田[やまだ]さんは 英語[えいご]が よく わかります。", "Yamada-san mengerti bahasa Inggris dengan baik."], ["私[わたし]は 漢字[かんじ]が 少[すこ]し わかります。", "Saya sedikit mengerti kanji."], ["今[いま] お金[かね]が 全然[ぜんぜん] ありません。", "Sekarang saya sama sekali tidak punya uang."]],
 q:["m|私[わたし]は タイ語[ご]が ___ わかりません。|Saya sama sekali tidak mengerti bahasa Thai.|全然[ぜんぜん]|少[すこ]し|だいたい|たくさん", "m|宿題[しゅくだい]が ___ あります。|Saya punya banyak PR.|たくさん|全然[ぜんぜん]|あまり|とても", "o|日本語[にほんご]/が/だいたい/わかります|Saya kurang lebih mengerti bahasa Jepang.|だいたい/日本語[にほんご]/が/わかります", "o|私[わたし]/は/お酒[さけ]/を/あまり/飲[の]みません|Saya jarang minum alkohol.|私[わたし]/は/あまり/お酒[さけ]/を/飲[の]みません", "m|私[わたし]は 英語[えいご]が ___ わかります。|Saya mengerti bahasa Inggris dengan baik.|よく|全然[ぜんぜん]|あまり|たくさん", "m|今日[きょう]は 時間[じかん]が あまり ___。|Hari ini saya tidak punya banyak waktu.|ありません|あります|わかります|わかりません", "o|日曜日[にちようび]/は/よく/映画[えいが]/を/見[み]ます|Pada hari Minggu saya sering menonton film.|日曜日[にちようび]/は/映画[えいが]/を/よく/見[み]ます", "o|父[ちち]/は/お金[かね]/が/たくさん/あります|Ayah saya punya banyak uang.|父[ちち]/は/たくさん/お金[かね]/が/あります"]},
{b:9,t:"どうして ～か / ～から",d:"<b>どうして</b> artinya \"mengapa\" dan biasanya diletakkan di awal pertanyaan. Jawabannya berupa alasan yang ditutup dengan <b>から</b>: 忙しいですから (karena sibuk). Untuk menanyakan alasan dari ucapan lawan bicara, cukup katakan どうしてですか.",
 r:["どうして + Kalimat + か", "Kalimat (alasan) + から", "どうして + ですか"],
 s:"どうして + Kalimat + か / Alasan + から → どうして 図書館[としょかん]で 勉強[べんきょう]しますか。 / 静[しず]かですから。",
 k:[["どうして", "Kata tanya untuk alasan (\"mengapa, kenapa\"). Biasanya diletakkan di awal pertanyaan, dan kalimatnya tetap ditutup か."], ["か", "Pertanyaan dengan どうして tetap ditutup か, seperti pertanyaan sopan lainnya."], ["～から", "Jawaban alasan diakhiri から (\"karena\"). Bagian hasilnya tidak perlu diulang karena sudah disebut dalam pertanyaan."], ["どうしてですか", "Dipakai untuk menanyakan alasan dari ucapan lawan bicara tanpa mengulang kalimatnya, seperti \"Kenapa?\"."]],
 x:["どうして berarti \"mengapa\". Pertanyaan dengan どうして hampir selalu dijawab dengan ～から.", "Menyusun pertanyaan langkah demi langkah: (1) kalimat biasa: 歩[ある]いて 帰[かえ]ります; (2) tambahkan どうして di depan; (3) tambahkan か di akhir. Hasilnya: どうして 歩[ある]いて 帰[かえ]りますか.", "Menyusun jawaban: (1) alasan dalam bentuk sopan: バスは 高[たか]いです; (2) tambahkan から: バスは 高[たか]いですから. Bagian akibatnya (\"saya pulang jalan kaki\") tidak perlu diulang.", "Pertanyaan negatif dengan どうして berarti \"mengapa tidak\": どうして 食[た]べませんか (mengapa tidak makan?). Tanpa どうして, ～ませんか adalah ajakan: 食[た]べませんか (mau makan?).", "Kesalahan yang sering muncul: から diletakkan di depan alasan seperti \"karena\" (から バスは 高[たか]いです), atau どうして tertukar dengan どう. どうですか menanyakan kesan, どうしてですか menanyakan alasan."],
 ex:[["どうして 昨日[きのう] 会社[かいしゃ]を 休[やす]みましたか。", "Mengapa kemarin kamu tidak masuk kerja?"], ["用事[ようじ]が ありましたから。", "Karena ada urusan."], ["明日[あした]は 学校[がっこう]を 休[やす]みます。…どうしてですか。", "Besok saya tidak masuk sekolah. ...Mengapa?"]],
 q:["m|A: ___ 昨日[きのう] 来[き]ませんでしたか。 B: 病院[びょういん]へ 行[い]きましたから。|A: Mengapa kemarin tidak datang? B: Karena saya pergi ke rumah sakit.|どうして|どう|どんな|いつ", "m|A: どうして タクシーで 行[い]きますか。 B: 時間[じかん]が ありません___。|A: Mengapa naik taksi? B: Karena tidak ada waktu.|から|が|まで|を", "o|どうして/日本語[にほんご]/を/勉強[べんきょう]しますか|Mengapa kamu belajar bahasa Jepang?|日本語[にほんご]/を/どうして/勉強[べんきょう]しますか", "o|日本[にほん]/の/歌[うた]/が/好[す]きです/から|Karena saya suka lagu Jepang.", "m|A: 明日[あした] いっしょに 映画[えいが]を 見[み]ませんか。 B: すみません、明日[あした]は ちょっと…。 A: ___。|A: Besok mau menonton film bersama? B: Maaf, besok agak… A: Kenapa?|どうしてですか|どうですか|どんなですか|どうしてから", "m|A: どうして 銀行[ぎんこう]へ 行[い]きますか。 B: ___。|A: Mengapa kamu pergi ke bank? B: Karena saya tidak punya uang.|お金[かね]が ありませんから|から お金[かね]が ありません|お金[かね]を ありませんから|お金[かね]が ありませんまで", "o|どうして/バス/で/来[き]ましたか|Mengapa kamu datang naik bus?|バス/で/どうして/来[き]ましたか", "o|今日[きょう]/は/休[やす]み/です/から|Karena hari ini libur."]},
{b:10,t:"N は Tempat に あります / います",d:"Untuk menyebut letak sesuatu yang sudah dibicarakan, pakai <b>N は Tempat に あります/います</b> (N ada di ...). Benda mati memakai あります, orang dan hewan memakai います. Letaknya ditanyakan dengan N は どこに ありますか. Kalau ingin memperkenalkan sesuatu yang baru, pakai Tempat に N が あります.",
 r:["KB + は + K-tempat + に + あります/います", "KB + は + どこ + に + ありますか/いますか", "KB + は + K-tempat + です (bentuk singkat)"],
 s:"KB + は + K-tempat + に + あります → 鍵[かぎ]は 机[つくえ]の 上[うえ]に あります。",
 k:[["は", "Menandai benda atau orang yang sudah diketahui kedua pihak. Yang ingin diberitahukan adalah <b>letaknya</b>, jadi bendanya ditaruh di depan sebagai topik dengan は."], ["に", "Menandai tempat keberadaan (\"di\"). Sama seperti pola Tempat に N が あります, tempat beradanya benda atau orang ditandai に."], ["あります / います", "Dipilih menurut bendanya: benda mati dan tumbuhan memakai あります, manusia dan hewan memakai います. Pilihan ini tidak berubah walaupun urutan kalimatnya berubah."], ["どこに", "Untuk menanyakan letak, tempatnya diganti どこ dan に tetap dipakai: 鍵[かぎ]は どこに ありますか."], ["です (bentuk singkat)", "Kalau maksudnya sudah jelas, に あります/います boleh diganti です: トイレは あそこです. Bentuk singkat ini sering dipakai dalam percakapan."]],
 x:["Pola ini memberi tahu letak sesuatu yang sudah dibicarakan: \"N ada di ...\". Biasanya pola ini menjadi jawaban pertanyaan ～は どこに ありますか / いますか.", "Bandingkan dua pola. 机[つくえ]の 上[うえ]に 本[ほん]が あります memperkenalkan buku sebagai hal baru (\"di atas meja ada buku\"). 本[ほん]は 机[つくえ]の 上[うえ]に あります membicarakan buku yang sudah diketahui, dan hal barunya adalah letaknya (\"bukunya ada di atas meja\").", "Cara menyusun: (1) benda atau orang + は; (2) tempat + に, boleh memakai kata posisi (駅[えき]の 前[まえ]に); (3) あります atau います. Untuk bertanya, tempatnya diganti どこ: 先生[せんせい]は どこに いますか.", "Negatifnya ありません / いません: 田中[たなか]さんは 事務所[じむしょ]に いません (Tanaka-san tidak ada di kantor). Dalam percakapan, tempat + です juga lazim: 田中[たなか]さんは 会議室[かいぎしつ]です.", "Kesalahan yang sering terjadi: memakai で untuk tempat keberadaan (事務所[じむしょ]で います salah), atau memakai が untuk benda yang sudah dibicarakan. 鍵[かぎ]が どこに ありますか kurang tepat; pakai 鍵[かぎ]は."],
 ex:[["ミラーさんは 事務所[じむしょ]に います。", "Miller-san ada di kantor."], ["私[わたし]の 傘[かさ]は どこに ありますか。", "Payung saya ada di mana?"], ["郵便局[ゆうびんきょく]は 駅[えき]の 前[まえ]に あります。", "Kantor pos ada di depan stasiun."]],
 q:["m|ミラーさん___ 会議室[かいぎしつ]に います。|Miller-san ada di ruang rapat.|は|を|で|へ", "m|A: 田中[たなか]さんは どこに いますか。 B: ロビー___ います。|A: Tanaka-san ada di mana? B: Di lobi.|に|で|を|へ", "o|電話[でんわ]/は/どこ/に/ありますか|Telepon ada di mana?", "o|猫[ねこ]/は/私[わたし]の/部屋[へや]/に/います|Kucingnya ada di kamar saya.", "m|A: 田中[たなか]さんの 犬[いぬ]は ___に いますか。 B: 庭[にわ]に います。|A: Anjing Tanaka-san ada di mana? B: Ada di halaman.|どこ|だれ|何[なに]|いつ", "m|A: サントスさんは どこに いますか。 B: 今[いま]、食堂[しょくどう]___。|A: Santos-san ada di mana? B: Sekarang dia ada di kantin.|です|で います|が います|に あります", "o|ATM/は/コンビニの/中[なか]に/あります|ATM-nya ada di dalam minimarket.", "o|父[ちち]/は/今[いま]/うちに/いません|Ayah saya sekarang tidak ada di rumah.|今[いま]/父[ちち]/は/うちに/いません"]},
{b:10,t:"Kata posisi: N の 上・下・前・後ろ・中・外・隣・近く・間",d:"Kata posisi ditaruh setelah benda patokan dengan <b>の</b>: 机の 上 (di atas meja). Artinya: 上 atas, 下 bawah, 前 depan, 後ろ belakang, 中 dalam, 外 luar, 隣 sebelah, 近く dekat, 間 antara (A と B の 間). Setelah itu pakai に あります/います, atau で untuk tempat kegiatan: 公園の 中で 写真を 撮ります.",
 r:["KB (patokan) + の + kata posisi + に + KB + が + あります/います", "KB + は + KB1 + と + KB2 + の + 間[あいだ] + に + あります/います", "KB (patokan) + の + kata posisi + で + O + を + KK"],
 s:"patokan + の + posisi + に + KB + が + います → 椅子[いす]の 下[した]に 猫[ねこ]が います。",
 k:[["の", "Menyambung benda patokan dengan kata posisi: 机[つくえ]の 上[うえ] = \"bagian atas meja\". Kata posisi dalam bahasa Jepang termasuk kata benda, jadi disambung dengan の seperti 私[わたし]の 本[ほん]."], ["上[うえ]・中[なか]・前[まえ] (kata posisi)", "Kata posisi selalu diletakkan sesudah benda patokan: 机[つくえ]の 上[うえ]に = di atas meja."], ["に", "Ditaruh sesudah kata posisi kalau kalimatnya tentang keberadaan (あります/います): かばんの 中[なか]に あります."], ["で", "Ditaruh sesudah kata posisi kalau di tempat itu dilakukan sebuah kegiatan: 駅[えき]の 中[なか]で パンを 買[か]います."], ["A と B の 間[あいだ]", "Untuk \"di antara A dan B\", kedua patokan disambung と, lalu diikuti の 間[あいだ]: 学校[がっこう]と 公園[こうえん]の 間[あいだ]に."]],
 x:["Kata posisi Bab 10: 上[うえ] atas, 下[した] bawah, 前[まえ] depan, 後[うし]ろ belakang, 右[みぎ] kanan, 左[ひだり] kiri, 中[なか] dalam, 外[そと] luar, 隣[となり] sebelah, 近[ちか]く dekat, 間[あいだ] antara.", "Cara menyusun: (1) sebut benda patokan (机[つくえ]); (2) tambah の; (3) tambah kata posisi (上[うえ]); (4) tambah に untuk keberadaan atau で untuk kegiatan. Hasilnya 机[つくえ]の 上[うえ]に, artinya \"di atas meja\".", "Frasa posisi bisa dipakai dalam dua pola Bab 10: かばんの 中[なか]に 傘[かさ]が あります (memperkenalkan benda) dan 傘[かさ]は かばんの 中[なか]に あります (memberi tahu letak benda yang sudah diketahui).", "隣[となり] berarti tepat di sebelah, biasanya untuk dua hal sejenis yang berderet, misalnya rumah dengan rumah atau orang dengan orang. 近[ちか]く berarti di sekitar, tidak harus menempel.", "Kesalahan yang sering terjadi: membalik urutannya. 上[うえ]の 机[つくえ] berarti \"meja yang di atas\", bukan \"di atas meja\". Patokan selalu di depan dan kata posisi di belakang: 机[つくえ]の 上[うえ]."],
 ex:[["机[つくえ]の 下[した]に 猫[ねこ]が います。", "Ada kucing di bawah meja."], ["銀行[ぎんこう]は 郵便局[ゆうびんきょく]と 病院[びょういん]の 間[あいだ]に あります。", "Bank ada di antara kantor pos dan rumah sakit."], ["コンビニの 前[まえ]で 友達[ともだち]に 会[あ]いました。", "Saya bertemu teman di depan minimarket."]],
 q:["m|箱[はこ]の ___に 電池[でんち]が あります。|Ada baterai di dalam kotak.|中[なか]|外[そと]|上[うえ]|下[した]", "m|ドアの ___に 男[おとこ]の子[こ]が います。|Ada anak laki-laki di belakang pintu.|後[うし]ろ|前[まえ]|隣[となり]|近[ちか]く", "m|本屋[ほんや]は 花屋[はなや]___ 銀行[ぎんこう]の 間[あいだ]に あります。|Toko buku ada di antara toko bunga dan bank.|と|の|に|を", "o|学校[がっこう]/は/駅[えき]の/近[ちか]く/に/あります|Sekolah ada di dekat stasiun.", "m|銀行[ぎんこう]の ___に コンビニが あります。|Ada minimarket di sebelah kanan bank.|右[みぎ]|左[ひだり]|上[うえ]|外[そと]", "m|木[き]の 下[した]___ 本[ほん]を 読[よ]みました。|Saya membaca buku di bawah pohon.|で|に|を|が", "o|冷蔵庫[れいぞうこ]の/中[なか]に/牛乳[ぎゅうにゅう]が/あります|Ada susu di dalam kulkas.|牛乳[ぎゅうにゅう]が/冷蔵庫[れいぞうこ]の/中[なか]に/あります", "o|窓[まど]の/外[そと]に/白[しろ]い/猫[ねこ]が/います|Ada kucing putih di luar jendela.|白[しろ]い/猫[ねこ]が/窓[まど]の/外[そと]に/います"]},
{b:10,t:"N や N (など)",d:"<b>や</b> artinya \"dan\", tetapi hanya menyebut beberapa contoh; masih ada benda lain yang tidak disebut. Kalau semua benda disebut, pakai と. <b>など</b> (dan lain-lain) boleh ditambahkan setelah benda terakhir: 本や ノートなど.",
 r:["K-tempat + に + KB1 + や + KB2 + (など) + が + あります/います", "KB1 + や + KB2 + (など) + を + KK"],
 s:"K-tempat + に + KB1 + や + KB2 + など + が + あります → かばんの 中[なか]に 本[ほん]や 辞書[じしょ]などが あります。",
 k:[["や", "Berarti \"dan\" untuk menyebut beberapa contoh saja. Pendengar paham bahwa masih ada benda lain yang tidak disebut. や ditaruh di antara benda-benda itu, tidak sesudah benda terakhir."], ["など", "Berarti \"dan lain-lain\". Boleh ditambahkan sesudah benda terakhir untuk menegaskan bahwa daftarnya belum lengkap. Partikel が atau を datang sesudah など: 本[ほん]や ノートなどが."], ["と", "Juga berarti \"dan\", tetapi dipakai kalau <b>semua</b> benda disebut. 本[ほん]と ノートが あります artinya yang ada hanya buku dan buku catatan."], ["が / を di akhir daftar", "Partikel hanya ditulis sekali, di akhir daftar, dan fungsinya sama seperti biasa: が untuk benda yang ada, を untuk objek kata kerja."]],
 x:["や dipakai untuk menyebut beberapa contoh dari sebuah kelompok, artinya \"..., ..., dan lain-lain\". Yang disambung dengan や hanya kata benda.", "Cara menyusun: (1) benda pertama + や; (2) benda kedua, bisa ditambah や + benda ketiga; (3) boleh tambah など; (4) partikel sesuai fungsinya. Contoh: テーブルの 上[うえ]に 新聞[しんぶん]や 雑誌[ざっし]などが あります.", "Perbedaan や dan と: 冷蔵庫[れいぞうこ]に 卵[たまご]と 牛乳[ぎゅうにゅう]が あります berarti isinya hanya telur dan susu. 冷蔵庫[れいぞうこ]に 卵[たまご]や 牛乳[ぎゅうにゅう]が あります berarti ada telur, susu, dan masih ada yang lain.", "Kesalahan yang sering terjadi: menaruh や sesudah benda terakhir (本[ほん]や ノートやが salah), atau memakai や untuk menyambung kata sifat dan kata kerja.", "Kalau ditanya 何[なに]が ありますか dan isinya banyak, jawab dengan や ... など. Kamu tidak perlu menyebut semuanya."],
 ex:[["箱[はこ]の 中[なか]に 手紙[てがみ]や 写真[しゃしん]が あります。", "Di dalam kotak ada surat, foto, dan lain-lain."], ["冷蔵庫[れいぞうこ]に 卵[たまご]や 牛乳[ぎゅうにゅう]などが あります。", "Di kulkas ada telur, susu, dan sebagainya."], ["スーパーで 肉[にく]や 野菜[やさい]を 買[か]いました。", "Di supermarket saya membeli daging, sayur, dan lain-lain."]],
 q:["m|部屋[へや]に ベッド___ 机[つくえ]が あります。|Di kamar ada tempat tidur, meja, dan lain-lain.|や|を|で|へ", "m|机[つくえ]の 上[うえ]に ボールペンや ノート___が あります。|Di atas meja ada bolpoin, buku catatan, dan lain-lain.|など|や|と|も", "o|果物[くだもの]/や/野菜[やさい]/を/買[か]いました|Saya membeli buah, sayur, dan lain-lain.|野菜[やさい]/や/果物[くだもの]/を/買[か]いました", "m|箱[はこ]の 中[なか]に 鉛筆[えんぴつ]___ 消[け]しゴムが あります。|Di dalam kotak ada pensil dan penghapus, tidak ada benda lain.|と|や|を|で", "m|デパートで シャツや 靴[くつ]___ 買[か]いました。|Di toserba saya membeli kemeja, sepatu, dan lain-lain.|を|が|や|に", "o|公園[こうえん]に/犬[いぬ]/や/猫[ねこ]/が/います|Di taman ada anjing, kucing, dan lain-lain.|公園[こうえん]に/猫[ねこ]/や/犬[いぬ]/が/います|犬[いぬ]/や/猫[ねこ]/が/公園[こうえん]に/います|猫[ねこ]/や/犬[いぬ]/が/公園[こうえん]に/います", "o|日曜日[にちようび]は/テニスや/サッカーを/します|Hari Minggu saya bermain tenis, sepak bola, dan lain-lain."]},
{b:11,t:"Kata bilangan & penghitung (～つ・～人・～枚・～台)",d:"Benda dihitung dengan penghitung: <b>～つ</b> untuk benda umum (一つ … 九つ, 十 dibaca とお), <b>～人</b> untuk orang (一人 ひとり, 二人 ふたり, 三人 さんにん), <b>～枚</b> untuk benda tipis seperti kertas dan kemeja, <b>～台</b> untuk mesin dan kendaraan. Kata bilangan dipakai tanpa partikel, sesudah が/を dan tepat sebelum kata kerja: みかんを 四つ 買いました. Kata tanyanya いくつ, 何人, 何枚, 何台.",
 r:["S + は + KB + を + jumlah (bilangan + penghitung) + KK", "K-tempat + に + KB + が + jumlah + あります/います", "KB + を/が + いくつ/何人[なんにん]/何枚[なんまい]/何台[なんだい] + KK-ますか"],
 s:"S + は + KB + を + jumlah + KK → 私[わたし]は りんごを 三[みっ]つ 買[か]いました。",
 k:[["～つ・～人[にん]・～枚[まい]・～台[だい]", "Bahasa Jepang memakai penghitung sesuai jenis benda: ～つ untuk benda umum, ～人[にん] untuk orang, ～枚[まい] untuk benda tipis, ～台[だい] untuk mesin dan kendaraan."], ["三[みっ]つ (posisi jumlah)", "Jumlah diletakkan sesudah が/を dan tepat sebelum kata kerja: りんごを 三[みっ]つ 買[か]いました (membeli tiga buah apel)."], ["Jumlah tanpa partikel", "Jumlah tidak diberi partikel karena ia menerangkan kata kerjanya (\"membeli sebanyak tiga\"). Jadi りんごを 三[みっ]つを 買[か]いました salah."], ["が / を", "Partikel tetap menempel pada bendanya: が untuk benda yang ada (あります/います), を untuk objek kata kerja."], ["いくつ・何人[なんにん]・何枚[なんまい]", "Kata tanya jumlah. いくつ untuk benda yang dihitung dengan ～つ; untuk penghitung lain pakai 何[なん] + penghitung (何人[なんにん], 何枚[なんまい], 何台[なんだい]). Posisinya sama dengan jumlah, sebelum kata kerja."]],
 x:["Hitungan ～つ dari satu sampai sepuluh: 一[ひと]つ, 二[ふた]つ, 三[みっ]つ, 四[よっ]つ, 五[いつ]つ, 六[むっ]つ, 七[なな]つ, 八[やっ]つ, 九[ここの]つ, 十[とお]. Mulai sebelas, pakai angka biasa tanpa つ: 十一[じゅういち].", "Hitungan orang: 一人[ひとり] dan 二人[ふたり] punya bacaan khusus. Mulai tiga orang memakai にん: 三人[さんにん], 四人[よにん] (bukan よんにん), 五人[ごにん].", "～枚[まい] dipakai untuk benda tipis dan rata seperti kertas, perangko, kemeja, dan foto. ～台[だい] dipakai untuk mesin dan kendaraan seperti mobil, sepeda, televisi, dan komputer. Bacaannya teratur: 一枚[いちまい], 三枚[さんまい], 二台[にだい], 八台[はちだい].", "Kesalahan yang sering terjadi: menaruh jumlah di depan benda. 三[みっ]つの りんごを 買[か]いました terdengar kaku; yang alami りんごを 三[みっ]つ 買[か]いました. Kesalahan lain adalah memilih penghitung yang salah, misalnya 二[ふた]つ untuk orang.", "Pola ini langsung berguna saat berbelanja: これを 二[ふた]つ ください. Untuk bertanya: 学生[がくせい]が 何人[なんにん] いますか, りんごを いくつ 買[か]いましたか."],
 ex:[["みかんを 六[むっ]つ 買[か]いました。", "Saya membeli enam buah jeruk."], ["教室[きょうしつ]に 学生[がくせい]が 五人[ごにん] います。", "Di kelas ada lima orang pelajar."], ["封筒[ふうとう]を 三枚[さんまい] ください。", "Minta tiga lembar amplop."]],
 q:["m|シャツを ___ 買[か]いました。|Saya membeli dua helai kemeja.|二枚[にまい]|二台[にだい]|二人[ふたり]|二階[にかい]", "m|うちに テレビが ___ あります。|Di rumah ada tiga televisi.|三台[さんだい]|三枚[さんまい]|三人[さんにん]|三階[さんがい]", "o|私[わたし]/は/兄[あに]/が/二人[ふたり]/います|Saya punya dua kakak laki-laki.", "o|りんご/を/五[いつ]つ/ください|Minta lima buah apel.", "m|クラスに インドネシア人[じん]の 学生[がくせい]が ___ います。|Di kelas ada satu orang pelajar Indonesia.|一人[ひとり]|一[ひと]つ|一台[いちだい]|一枚[いちまい]", "m|A: 切手[きって]を ___ 買[か]いましたか。 B: 五枚[ごまい] 買[か]いました。|A: Kamu membeli berapa lembar perangko? B: Saya membeli lima lembar.|何枚[なんまい]|何人[なんにん]|何台[なんだい]|何回[なんかい]", "o|私[わたし]は/毎日[まいにち]/卵[たまご]を/二[ふた]つ/食[た]べます|Setiap hari saya makan dua butir telur.|毎日[まいにち]/私[わたし]は/卵[たまご]を/二[ふた]つ/食[た]べます|私[わたし]は/卵[たまご]を/毎日[まいにち]/二[ふた]つ/食[た]べます", "o|この クラスに/留学生[りゅうがくせい]が/何人[なんにん]/いますか|Di kelas ini ada berapa orang pelajar asing?|留学生[りゅうがくせい]が/この クラスに/何人[なんにん]/いますか"]},
{b:11,t:"Lama waktu & frekuensi (～時間・～週間・～に ～回)",d:"Lama waktu dinyatakan dengan ～分 (menit), <b>～時間</b> (jam), ～日 (hari), <b>～週間</b> (minggu), ～か月 (bulan), dan ～年 (tahun). Sama seperti kata bilangan, kata ini dipakai tanpa partikel: 二時間 勉強しました. Frekuensi dibentuk dengan rentang waktu + <b>に</b> + jumlah <b>～回</b>: 一週間に 三回 berarti tiga kali seminggu. Untuk bertanya, pakai どのくらい (berapa lama) atau 何回 (berapa kali).",
 r:["S + は + lama waktu + KK (tanpa partikel)", "S + は + rentang waktu + に + jumlah + 回[かい] + KK", "K-tempat + まで + lama waktu + かかります"],
 s:"S + は + rentang waktu + に + jumlah 回[かい] + O + を + KK → 私[わたし]は 一週間[いっしゅうかん]に 二回[にかい] サッカーを します。",
 k:[["二時間[にじかん] (tanpa partikel)", "Kata lama waktu (二時間[にじかん], 三日[みっか], 一週間[いっしゅうかん]) dipakai seperti kata bilangan: tanpa partikel, biasanya sebelum kata kerja. Ia menjawab pertanyaan どのくらい (berapa lama)."], ["に (frekuensi)", "に di sini berarti \"dalam\" atau \"per\": 一週間[いっしゅうかん]に 三回[さんかい] = tiga kali dalam satu minggu. に menempel pada rentang waktunya, bukan pada jumlah kalinya."], ["～回[かい]", "Penghitung untuk \"kali\". Perhatikan bunyinya: 一回[いっかい], 六回[ろっかい], 八回[はっかい], 十回[じゅっかい]. Kata tanyanya 何回[なんかい]."], ["かかります", "Kata kerja \"memakan (waktu)\". Lama waktunya ditaruh tepat sebelum かかります, juga tanpa partikel: 駅[えき]まで 十分[じゅっぷん] かかります."], ["～ぐらい", "Ditempel sesudah lama waktu atau jumlah untuk arti \"kira-kira\": 二時間[にじかん]ぐらい, 三回[さんかい]ぐらい."]],
