{b:14,t:'Bentuk -て + ください',d:'Aturan bentuk-て: う・つ・る → <b>って</b> | む・ぶ・ぬ → <b>んで</b> | く → <b>いて</b> | ぐ → <b>いで</b> | す → <b>して</b> | ru-verb: る → <b>て</b>. Pengecualian: 行く→行って, する→して, 来る→来て. ～てください = "tolong ...".',
 ex:[['ちょっと 待[ま]って ください。','Tolong tunggu sebentar.'],['名前[なまえ]を 書[か]いて ください。','Tolong tulis nama Anda.']],
 q:['m|飲[の]む → ___|Bentuk-て dari 飲む|飲[の]んで|飲[の]みて|飲[の]って|飲[の]いて','m|書[か]く → ___|Bentuk-て dari 書く|書[か]いて|書[か]って|書[か]んで|書[か]きて','m|行[い]く → ___|Bentuk-て dari 行く (pengecualian)|行[い]って|行[い]いて|行[い]んで|行[い]きて','o|ゆっくり/話[はな]して/ください|Tolong bicara pelan-pelan.']},
{b:14,t:'～て います',d:'Bentuk-て + <b>います</b> = sedang berlangsung, atau keadaan yang berlanjut (tinggal, menikah, bekerja).',
 ex:[['今[いま] 雨[あめ]が 降[ふ]って います。','Sekarang sedang hujan.'],['東京[とうきょう]に 住[す]んで います。','Saya tinggal di Tokyo.']],
 q:['m|弟[おとうと]は 今[いま] 寝[ね]て ___。|Adik sedang tidur.|います|あります|です|ください','o|母[はは]/は/料理[りょうり]/を/作[つく]って/います|Ibu sedang memasak.']},
{b:9,t:'～から (karena)',d:'Alasan + <b>から</b>、hasil. Alasan selalu di depan.',
 ex:[['雨[あめ]ですから、家[いえ]に います。','Karena hujan, saya di rumah.'],['忙[いそが]しいですから、行[い]きません。','Karena sibuk, saya tidak pergi.']],
 q:['m|時間[じかん]が ありません___、タクシーで 行[い]きます。|Karena tidak ada waktu, saya naik taksi.|から|まで|より|でも','o|暑[あつ]い/です/から/窓[まど]/を/開[あ]けます|Karena panas, saya buka jendela.']},
{b:1,t:'～も (juga)',d:'<b>も</b> = "juga". Menggantikan は, が, atau を.',
 ex:[['私[わたし]も 学生[がくせい]です。','Saya juga pelajar.'],['肉[にく]も 魚[さかな]も 好[す]きです。','Saya suka daging maupun ikan.']],
 q:['m|A: 私[わたし]は 学生[がくせい]です。 B: 私[わたし]___ 学生[がくせい]です。|Saya juga pelajar.|も|は|が|の','o|妹[いもうと]/も/犬[いぬ]/が/好[す]き/です|Adik perempuan juga suka anjing.']},
{b:4,t:'～と (dan / bersama)',d:'<b>と</b> = "dan" (menggabungkan kata benda) atau "bersama" (dengan orang).',
 ex:[['パンと 牛乳[ぎゅうにゅう]を 買[か]いました。','Saya membeli roti dan susu.'],['友達[ともだち]と 公園[こうえん]へ 行[い]きました。','Saya pergi ke taman bersama teman.']],
 q:['m|家族[かぞく]___ 旅行[りょこう]します。|Saya bepergian bersama keluarga.|と|を|で|が','o|りんご/と/バナナ/を/ください|Minta apel dan pisang.|バナナ/と/りんご/を/ください']},
{b:12,t:'A は B より ～',d:'Perbandingan. <b>A は B より</b> Adj = A lebih ... daripada B. <b>B より A の ほうが</b> Adj = A-lah yang lebih ....',
 ex:[['東京[とうきょう]は 大阪[おおさか]より 大[おお]きいです。','Tokyo lebih besar daripada Osaka.'],['夏[なつ]より 冬[ふゆ]の ほうが 好[す]きです。','Saya lebih suka musim dingin daripada musim panas.']],
 q:['m|電車[でんしゃ]は バス___ 速[はや]いです。|Kereta lebih cepat daripada bus.|より|から|ほう|まで','o|犬[いぬ]/より/猫[ねこ]/の/ほう/が/好[す]き/です|Saya lebih suka kucing daripada anjing.|猫[ねこ]/の/ほう/が/犬[いぬ]/より/好[す]き/です']},
// --- Pola tambahan per bab Minna no Nihongo I (ditambahkan di akhir agar indeks progres lama tetap) ---
{b:1,t:"～さん (panggilan sopan)",d:"Tempelkan <b>さん</b> di belakang nama orang lain supaya sopan, seperti Pak, Bu, atau Mas/Mbak: 田中さん, ミラーさん. Jangan pakai さん untuk namamu sendiri. Kalau sudah tahu nama lawan bicara, panggil dia dengan nama + さん, karena あなた bisa terdengar kurang sopan. Untuk guru, pakai 先生 sebagai ganti さん: 田中先生.",
 ex:[["カリナさんは 学生[がくせい]です。","Mbak Karina seorang mahasiswa."],["はじめまして。私[わたし]は 山田[やまだ]です。","Perkenalkan, saya Yamada."],["A：あの 人[ひと]は だれですか。 B：田中[たなか]先生[せんせい]です。","A: Orang itu siapa? B: Itu Pak Guru Tanaka."]],
 q:["m|はじめまして。私[わたし]は 木村[きむら]___。|Perkenalkan, saya Kimura.|です|さんです|じゃ ありません|ですか","m|A：あの 人[ひと]は だれですか。 B：佐藤[さとう]___です。|A: Orang itu siapa? B: Itu Bu Sato.|さん|の|も|は","o|あの/人[ひと]は/ミラー/さん/ですか|Apakah orang itu Pak Miller?","m|あの 人[ひと]は 山田[やまだ]___です。|Orang itu Bu Guru Yamada.|先生[せんせい]|先生[せんせい]さん|さん先生[せんせい]|の 先生[せんせい]"]},
{b:2,t:"この・その・あの + kata benda",d:"<b>この</b>, <b>その</b>, dan <b>あの</b> selalu diikuti kata benda: この 本 (buku ini, dekat saya), その 本 (buku itu, dekat lawan bicara), あの 本 (buku itu, jauh dari kita berdua). これ, それ, あれ dipakai tanpa kata benda, jadi kita bilang これは 鍵です (ini kunci), tetapi この 鍵は 車の 鍵です (kunci ini kunci mobil).",
 ex:[["この 鍵[かぎ]は 車[くるま]の 鍵[かぎ]です。","Kunci ini kunci mobil."],["その 雑誌[ざっし]は 何[なん]の 雑誌[ざっし]ですか。","Majalah itu majalah tentang apa?"],["あの 車[くるま]は だれの 車[くるま]ですか。","Mobil yang di sana itu punya siapa?"]],
 q:["m|___ 傘[かさ]は だれの 傘[かさ]ですか。|Payung ini punya siapa?|この|これ|その|あの","m|___ 人[ひと]は 日本語[にほんご]の 先生[せんせい]です。|Orang yang di sana itu guru bahasa Jepang.|あの|あれ|この|それ","o|この/人[ひと]は/私[わたし]の/先生[せんせい]/です|Orang ini guru saya.","m|___は 私[わたし]の かばんです。|Itu (yang di dekatmu) tas saya.|それ|その|あの|この"]},
{b:2,t:"そうです / そうですか / ちがいます",d:"Pertanyaan ya/tidak tentang kata benda (…は N ですか) dijawab <b>はい、そうです</b> (ya, betul) atau <b>いいえ、違います</b> (ちがいます, bukan). Sesudah いいえ, biasanya disebutkan yang benar; bisa juga menjawab いいえ、そうじゃ ありません. <b>そうですか</b> dengan nada turun berarti \"oh, begitu\" dan diucapkan saat menerima informasi baru.",
 ex:[["A：それは 日本語[にほんご]の 本[ほん]ですか。 B：はい、そうです。","A: Itu buku bahasa Jepang? B: Ya, betul."],["A：これは ボールペンですか。 B：いいえ、違[ちが]います。シャープペンシルです。","A: Ini bolpoin? B: Bukan. Itu pensil mekanik."],["A：私[わたし]は インドネシア人[じん]です。 B：そうですか。","A: Saya orang Indonesia. B: Oh, begitu."]],
 q:["m|A：それは あなたの 傘[かさ]ですか。 B：はい、___。|A: Itu payungmu? B: Ya, betul.|そうです|違[ちが]います|そうですか|そうじゃ ありません","m|A：これは 鍵[かぎ]ですか。 B：いいえ、___。カードです。|A: Ini kunci? B: Bukan. Itu kartu.|違[ちが]います|そうです|そうですか|はい","m|A：私[わたし]は 医者[いしゃ]です。 B：___。|A: Saya dokter. B: Oh, begitu.|そうですか|そうです|違[ちが]います|はい、そうです","o|いいえ、/違[ちが]います。/これは/ラジオ/です。|(Ditanya: Itu kamera?) Bukan. Ini radio."]},
{b:2,t:"～ですか、～ですか (pertanyaan pilihan)",d:"Untuk pertanyaan pilihan \"A atau B?\", ucapkan dua pertanyaan berurutan: <b>A ですか、B ですか</b>. Jawablah dengan menyebut pilihannya, misalnya B です, tanpa はい atau いいえ.",
 ex:[["A：あの 人[ひと]は 先生[せんせい]ですか、学生[がくせい]ですか。 B：学生[がくせい]です。","A: Orang itu guru atau mahasiswa? B: Mahasiswa."],["A：それは ノートですか、手帳[てちょう]ですか。 B：手帳[てちょう]です。","A: Itu buku tulis atau buku agenda? B: Buku agenda."],["ワンさんは 中国人[ちゅうごくじん]ですか、韓国人[かんこくじん]ですか。","Pak Wang orang Cina atau orang Korea?"]],
 q:["o|それは/英語[えいご]/ですか、/日本語[にほんご]/ですか|Itu bahasa Inggris atau bahasa Jepang?|それは/日本語[にほんご]/ですか、/英語[えいご]/ですか","m|A：ジョンさんは アメリカ人[じん]ですか、イギリス人[じん]ですか。 B：___。|A: Pak John orang Amerika atau orang Inggris? B: Orang Inggris.|イギリス人[じん]です|アメリカ人[じん]です|はい、そうです|いいえ、違[ちが]います","m|これは 日本語[にほんご]の 新聞[しんぶん]___、英語[えいご]の 新聞[しんぶん]ですか。|Ini koran berbahasa Jepang atau koran berbahasa Inggris?|ですか|です|じゃ ありません|も"]},
{b:2,t:"の pengganti kata benda (私のです)",d:"Kalau bendanya sudah jelas, kata benda sesudah <b>の</b> boleh dihilangkan: この 傘は 私の 傘です cukup menjadi この 傘は <b>私のです</b>. Untuk menanyakan pemiliknya, pakai <b>だれのですか</b>. Cara ini tidak berlaku untuk orang: 田中さんは 大学の 先生です tidak bisa disingkat menjadi 大学のです.",
 ex:[["この 鉛筆[えんぴつ]は 私[わたし]のです。","Pensil ini punya saya."],["A：その 傘[かさ]は だれのですか。 B：サントスさんのです。","A: Payung itu punya siapa? B: Punya Pak Santos."],["あの 車[くるま]は 先生[せんせい]のじゃ ありません。","Mobil itu bukan punya guru."]],
 q:["m|この 辞書[じしょ]は 私[わたし]___です。|Kamus ini punya saya.|の|は|も|か","m|A：これは あなたの 時計[とけい]ですか。 B：いいえ、私[わたし]___。|A: Ini jam tanganmu? B: Bukan, bukan punya saya.|のじゃ ありません|のです|じゃ ありません|の 時計[とけい]です","o|この/ノート/は/ワンさん/の/です|Buku tulis ini punya Pak Wang.","m|A：ジョンさんは 英語[えいご]の 先生[せんせい]ですか。 B：はい、英語[えいご]の ___。|A: Apakah Pak John guru bahasa Inggris? B: Ya, guru bahasa Inggris.|先生[せんせい]です|です|先生[せんせい]ですか|じゃ ありません"]},
{b:3,t:"ここ・そこ・あそこ・どこ",d:"<b>ここ</b> (sini) menunjuk tempat dekat pembicara, <b>そこ</b> (situ) dekat lawan bicara, <b>あそこ</b> (sana) jauh dari keduanya, dan <b>どこ</b> berarti mana. Kalau pembicara dan lawan bicara ada di tempat yang sama, tempat itu disebut ここ. Bentuk sopannya <b>こちら, そちら, あちら, どちら</b>, yang aslinya menunjuk arah dan sering dipakai pegawai toko atau saat bicara dengan orang yang dihormati.",
 ex:[["ここは 教室[きょうしつ]です。","Di sini ruang kelas."],["あそこは 事務所[じむしょ]です。","Di sana kantor."],["こちらは 会議室[かいぎしつ]です。","Sebelah sini ruang rapat (sopan)."]],
 q:["m|___は 私[わたし]の 部屋[へや]です。|Di sini kamar saya.|ここ|そこ|あそこ|どこ","m|A：すみません、受付[うけつけ]は どちらですか。 B：___です。どうぞ。|A: Permisi, meja informasi di sebelah mana? B: Di sebelah sini. Silakan.|こちら|そちら|どちら|この","o|すみません、/ここ/は/どこ/ですか|Permisi, ini di mana?"]},
{b:3,t:"N は Tempat です / どこですか",d:"Untuk menyebut letak benda, tempat, atau orang, pakai <b>N は (tempat) です</b>: 食堂は あそこです (kantinnya di sana). Untuk bertanya, ganti tempatnya dengan <b>どこ</b>, atau どちら supaya lebih sopan. Pertanyaan ini juga dipakai untuk menanyakan negara, kampus, atau perusahaan seseorang: お国は どちらですか. Untuk itu jangan pakai 何.",
 ex:[["自動販売機[じどうはんばいき]は あそこです。","Mesin penjual otomatis ada di sana."],["A：先生[せんせい]は どこですか。 B：教室[きょうしつ]です。","A: Guru ada di mana? B: Di ruang kelas."],["A：大学[だいがく]は どちらですか。 B：インドネシア大学[だいがく]です。","A: Anda kuliah di universitas mana? B: Universitas Indonesia."]],
 q:["o|すみません、/エスカレーター/は/どこ/ですか|Permisi, eskalator di mana?","m|A：ワンさんは ___ですか。 B：食堂[しょくどう]です。|A: Pak Wang ada di mana? B: Di kantin.|どこ|だれ|何[なん]|いくら","m|階段[かいだん]は ___です。|Tangganya di sana (jauh dari kita berdua).|あそこ|そこ|ここ|どこ","m|A：お国[くに]は ___ですか。 B：ブラジルです。|A: Anda berasal dari negara mana? B: Brasil.|どちら|何[なん]|だれ|いくら"]},
{b:3,t:"いくらですか / どこの N ですか",d:"<b>いくらですか</b> menanyakan harga, dan jawabannya angka + 円 (えん): 3,000円です. <b>どこの N ですか</b> menanyakan asal negara atau perusahaan pembuat suatu barang; jawabannya (negara/perusahaan) の N です. Kata bendanya boleh dihilangkan: 日本のです = buatan Jepang.",
 ex:[["A：この 傘[かさ]は いくらですか。 B：1,200円[えん]です。","A: Payung ini harganya berapa? B: 1.200 yen."],["A：その 時計[とけい]は どこの 時計[とけい]ですか。 B：スイスの 時計[とけい]です。","A: Jam itu jam buatan mana? B: Jam buatan Swiss."],["この カメラは 日本[にほん]のです。","Kamera ini buatan Jepang."]],
 q:["m|A：この 靴[くつ]は ___ですか。 B：5,000円[えん]です。|A: Sepatu ini harganya berapa? B: 5.000 yen.|いくら|どこ|何[なん]|だれ","m|A：これは ___ コーヒーですか。 B：ブラジルの コーヒーです。|A: Ini kopi dari negara mana? B: Kopi Brasil.|どこの|どこ|だれの|いくら","o|あの/ネクタイ/は/いくら/ですか|Dasi itu harganya berapa?","o|それ/は/どこ/の/コンピューター/ですか|Itu komputer buatan mana?"]},
{b:4,t:"今 ～時～分です",d:"Jam dibaca dengan <b>～時</b> (じ) dan menit dengan <b>～分</b>, yang bacaannya ふん atau ぷん tergantung angkanya: 5分 (ごふん), 10分 (じゅっぷん). Hafalkan juga 4時 (よじ), 7時 (しちじ), dan 9時 (くじ). Untuk bertanya, pakai 今 何時ですか. Setengah jam disebut 半 (はん), sedangkan 午前 (a.m.) dan 午後 (p.m.) diletakkan sebelum jam.",
 ex:[["今[いま] 四時[よじ]半[はん]です。","Sekarang jam 4.30."],["A：今[いま] 何時[なんじ]ですか。 B：九時[くじ]十分[じゅっぷん]です。","A: Sekarang jam berapa? B: Jam 9 lewat 10 menit."],["今[いま] 午後[ごご]七時[しちじ]五分[ごふん]です。","Sekarang jam 7.05 malam."]],
 q:["m|今[いま] ___です。|Sekarang jam 4.|よじ|よんじ|しじ|よっじ","m|A：今[いま] ___ですか。 B：十時[じゅうじ]です。|A: Sekarang jam berapa? B: Jam 10.|何時[なんじ]|何分[なんぷん]|いくら|どこ","o|今[いま]/午前[ごぜん]/十一時[じゅういちじ]/二十分[にじゅっぷん]/です|Sekarang jam 11.20 pagi.","m|今[いま] 七時[しちじ]___です。|Sekarang jam 7.30.|半[はん]|分[ふん]|時[じ]|半分[はんぶん]"]},
{b:4,t:"Kata kerja ～ます / ～ません",d:"Bentuk <b>～ます</b> adalah bentuk sopan kata kerja untuk kebiasaan atau hal yang akan dilakukan: 毎朝 起きます (bangun setiap pagi), 明日 働きます (besok bekerja). Untuk bentuk negatif, ganti ます dengan <b>ません</b>: 働きません. Untuk bertanya, tambahkan か: 働きますか.",
 ex:[["私[わたし]は 毎晩[まいばん] 十一時[じゅういちじ]に 寝[ね]ます。","Setiap malam saya tidur jam 11."],["日曜日[にちようび]は 働[はたら]きません。","Hari Minggu saya tidak bekerja."],["A：明日[あした]も 働[はたら]きますか。 B：いいえ、明日[あした]は 休[やす]みます。","A: Besok kamu bekerja juga? B: Tidak, besok saya libur."]],
 q:["m|明日[あした] 勉強[べんきょう]___。|Besok saya tidak belajar.|しません|します|しました|しませんでした","m|私[わたし]は 毎日[まいにち] 働[はたら]き___。|Saya bekerja setiap hari.|ます|ません|ますか|ませんか","o|土曜日[どようび]/と/日曜日[にちようび]/は/休[やす]みます|Hari Sabtu dan Minggu saya libur.|日曜日[にちようび]/と/土曜日[どようび]/は/休[やす]みます","o|明日[あした]/何時[なんじ]に/起[お]きますか|Besok kamu bangun jam berapa?"]},
{b:4,t:"～から ～まで",d:"<b>から</b> menandai titik mulai (dari) dan <b>まで</b> titik akhir (sampai): 9時から 5時まで, 月曜日から 金曜日まで. Keduanya boleh dipakai sendiri-sendiri dan boleh langsung diikuti です: 試験は 10時からです (ujian mulai jam 10).",
 ex:[["デパートは 十時[じゅうじ]から 八時[はちじ]までです。","Toserba buka dari jam 10 sampai jam 8."],["私[わたし]は 月曜日[げつようび]から 金曜日[きんようび]まで 働[はたら]きます。","Saya bekerja dari hari Senin sampai Jumat."],["昼休[ひるやす]みは 十二時[じゅうにじ]からです。","Istirahat siang mulai jam 12."]],
 q:["m|試験[しけん]は 十時[じゅうじ]___ 十二時[じゅうにじ]までです。|Ujiannya dari jam 10 sampai jam 12.|から|まで|に|と","m|美術館[びじゅつかん]は 午後[ごご]五時[ごじ]___です。|Museum seni buka sampai jam 5 sore.|まで|から|に|と","o|会議[かいぎ]/は/一時[いちじ]から/三時[さんじ]まで/です|Rapatnya dari jam 1 sampai jam 3.","o|毎日[まいにち]/何時[なんじ]/まで/働[はたら]きますか|Setiap hari kamu bekerja sampai jam berapa?"]},
{b:5,t:"どこ（へ）も 行きません",d:"Kata tanya + <b>も</b> dengan kata kerja negatif berarti \"tidak … sama sekali\": <b>どこ（へ）も 行きません</b> = tidak pergi ke mana-mana. Partikel へ boleh dipakai atau tidak, tetapi kata kerjanya harus negatif (～ません atau ～ませんでした). Polanya sama untuk orang: だれも 来ませんでした = tidak ada seorang pun yang datang.",
 ex:[["明日[あした]は どこも 行[い]きません。","Besok saya tidak pergi ke mana-mana."],["A：休[やす]みは どこへ 行[い]きましたか。 B：どこへも 行[い]きませんでした。","A: Waktu libur kamu pergi ke mana? B: Tidak ke mana-mana."],["今日[きょう]は だれも 来[き]ませんでした。","Hari ini tidak ada seorang pun yang datang."]],
 q:["m|A：来週[らいしゅう] どこへ 行[い]きますか。 B：どこ___ 行[い]きません。|A: Minggu depan kamu pergi ke mana? B: Tidak ke mana-mana.|へも|へ|と|の","m|昨日[きのう]は どこも 行[い]き___。|Kemarin saya tidak pergi ke mana-mana.|ませんでした|ました|ません|ます","o|土曜日[どようび]は/どこへ/も/行[い]きません|Hari Sabtu saya tidak pergi ke mana-mana.","m|けさは ___ 来[き]ませんでした。|Tadi pagi tidak ada seorang pun yang datang.|だれも|だれ|だれと|だれの"]},
{b:5,t:"いつ (kapan)",d:"<b>いつ</b> berarti \"kapan\" dan dipakai tanpa partikel に: いつ 帰りますか. Kata waktu seperti 今日, 明日, 昨日, 毎日, 来週, dan 去年 juga tidak memakai に. Partikel に dipakai untuk waktu yang memakai angka, seperti 3時に atau 9月に; nama hari boleh dengan atau tanpa に.",
 ex:[["A：いつ 国[くに]へ 帰[かえ]りますか。 B：来月[らいげつ] 帰[かえ]ります。","A: Kapan kamu pulang ke negaramu? B: Bulan depan."],["A：試験[しけん]は いつですか。 B：来週[らいしゅう]の 月曜日[げつようび]です。","A: Ujiannya kapan? B: Senin minggu depan."],["私[わたし]は 去年[きょねん]の 九月[くがつ]に インドネシアへ 帰[かえ]りました。","Saya pulang ke Indonesia bulan September tahun lalu."]],
 q:["m|___ 大学[だいがく]へ 来[き]ましたか。|Kapan kamu datang ke universitas?|いつ|いつに|どこ|だれ","m|___ 銀行[ぎんこう]へ 行[い]きます。|Besok saya pergi ke bank.|明日[あした]|明日[あした]に|明日[あした]で|明日[あした]を","o|会議[かいぎ]/は/いつ/ですか|Rapatnya kapan?","o|いつ/デパートへ/行[い]きますか|Kapan kamu pergi ke toserba?|デパートへ/いつ/行[い]きますか"]},
{b:5,t:"～よ dan ～ね",d:"<b>よ</b> di akhir kalimat dipakai untuk memberi tahu hal yang belum diketahui lawan bicara atau menegaskan pendapat, mirip \"lho\" atau \"kok\". <b>ね</b> dipakai saat kamu mengharapkan persetujuan, memastikan sesuatu, atau menunjukkan simpati, mirip \"ya\" atau \"kan\". Jangan terlalu sering memakai よ kepada atasan karena bisa terdengar menggurui.",
 ex:[["A：図書館[としょかん]は 何時[なんじ]までですか。 B：七時[しちじ]までですよ。","A: Perpustakaan buka sampai jam berapa? B: Sampai jam 7, lho."],["A：毎晩[まいばん] 十二時[じゅうにじ]まで 働[はたら]きます。 B：大変[たいへん]ですね。","A: Setiap malam saya bekerja sampai jam 12. B: Wah, berat, ya."],["明日[あした]は 日曜日[にちようび]ですね。","Besok hari Minggu, ya."]],
 q:["m|A：あの 人[ひと]は 学生[がくせい]ですか。 B：いいえ、先生[せんせい]です___。|A: Orang itu mahasiswa? B: Bukan, dia guru, lho.|よ|ね|か|も","m|A：ワンさんは 中国人[ちゅうごくじん]です___。 B：はい、そうです。|A: Pak Wang orang Cina, kan? B: Ya, betul.|ね|よ|も|に","o|あの/バス/は/駅[えき]へ/行[い]きます/よ|Bus itu pergi ke stasiun, lho.","o|今日[きょう]は/休[やす]み/です/ね|Hari ini libur, ya."]},
{b:6,t:"N を します / 何を しますか",d:"<b>します</b> artinya \"melakukan\". Banyak kegiatan cukup dibentuk dengan <b>kata benda + を します</b>: サッカーを します (main sepak bola), 宿題を します (mengerjakan PR). Untuk menanyakan kegiatan seseorang, pakai <b>何を しますか</b>; di sini 何 dibaca なに.",
 ex:[["日曜日[にちようび]に 友達[ともだち]と テニスを します。","Hari Minggu saya bermain tenis dengan teman."],["今晩[こんばん] 宿題[しゅくだい]を します。","Malam ini saya mengerjakan PR."],["明日[あした] 何[なに]を しますか。","Besok kamu melakukan apa?"]],
 q:["m|毎晩[まいばん] 宿題[しゅくだい]___ します。|Setiap malam saya mengerjakan PR.|を|が|へ|の","m|A: 土曜日[どようび]に 何[なに]を しますか。 B: サッカーを ___。|A: Hari Sabtu kamu melakukan apa? B: Saya bermain sepak bola.|します|あります|です|行[い]きます","o|昼休[ひるやす]み/に/何[なに]/を/しますか|Waktu istirahat siang kamu melakukan apa?","o|いっしょに/テニス/を/しませんか|Maukah bermain tenis bersama?|テニス/を/いっしょに/しませんか"]},
{b:6,t:"何: なに atau なん",d:"Kanji 何 (apa) punya dua bacaan. Dibaca <b>なん</b> sebelum です dan の (何ですか, 何の 本) serta bila disambung dengan satuan seperti 何時, 何歳, 何曜日. Sebelum partikel を dan が, 何 dibaca <b>なに</b>: 何を 食べますか.",
 ex:[["それは 何[なん]の 雑誌[ざっし]ですか。","Itu majalah tentang apa?"],["今晩[こんばん] 何[なに]を 食[た]べますか。","Malam ini kamu makan apa?"],["今日[きょう]は 何曜日[なんようび]ですか。","Hari ini hari apa?"]],
 q:["m|あれは ___の 店[みせ]ですか。|Itu toko apa?|なん|なに|だれ|いつ","m|昨日[きのう] ___を 買[か]いましたか。|Kemarin kamu membeli apa?|なに|なん|いつ|どこ","m|すみません、今[いま] ___ですか。|Permisi, sekarang jam berapa?|なんじ|なにじ|なに|なんようび","o|これ/は/何[なん]/の/CD/ですか|Ini CD apa?"]},
{b:7,t:"～語で 何ですか",d:"Untuk menanyakan sebuah kata dalam bahasa lain, pakai <b>「kata」は ～語で 何ですか</b> (何 dibaca なん). Partikel で di sini berarti \"dalam (bahasa)\", dan jawabannya cukup 「…」です. で yang sama dipakai bersama kata kerja: 日本語で 書きます (menulis dalam bahasa Jepang).",
 ex:[["「さようなら」は 英語[えいご]で 何[なん]ですか。","Apa bahasa Inggrisnya \"sayounara\"?"],["「Goodbye」です。","Bahasa Inggrisnya \"goodbye\"."],["日本語[にほんご]で レポートを 書[か]きます。","Saya menulis laporan dalam bahasa Jepang."]],
 q:["m|「おはよう」は 英語[えいご]___ 何[なん]ですか。|Apa bahasa Inggrisnya \"ohayou\"?|で|に|を|が","m|「Hello」は ___で 何[なん]ですか。|Apa bahasa Jepangnya \"hello\"?|日本語[にほんご]|日本[にほん]|日本人[にほんじん]|英語[えいご]","o|「ありがとう」/は/インドネシア語[ご]/で/何[なん]/ですか|Apa bahasa Indonesianya \"arigatou\"?|インドネシア語[ご]/で/「ありがとう」/は/何[なん]/ですか","o|日本語[にほんご]/で/手紙[てがみ]/を/書[か]きます|Saya menulis surat dalam bahasa Jepang.|手紙[てがみ]/を/日本語[にほんご]/で/書[か]きます"]},
{b:7,t:"Orang に N を あげます / もらいます",d:"<b>あげます</b> = memberi: Pemberi は Penerima に Barang を あげます. <b>もらいます</b> = menerima: Penerima は Pemberi に (atau から) Barang を もらいます. Kalau Anda yang menerima, ceritakan dengan もらいます: 私は 友達に もらいました. Pola yang sama dipakai untuk 貸します/借ります dan 教えます/習います.",
 ex:[["私[わたし]は 母[はは]に 花[はな]を あげました。","Saya memberikan bunga kepada ibu."],["私[わたし]は 友達[ともだち]に 本[ほん]を もらいました。","Saya mendapat buku dari teman."],["山田[やまだ]さんに 英語[えいご]を 教[おし]えます。","Saya mengajari Yamada-san bahasa Inggris."]],
 q:["m|私[わたし]は 父[ちち]___ ネクタイを あげました。|Saya memberikan dasi kepada ayah.|に|を|が|で","m|私[わたし]は 山田[やまだ]さんに お土産[みやげ]を ___。|Saya mendapat oleh-oleh dari Yamada-san.|もらいました|あげました|貸[か]しました|教[おし]えました","o|その/時計[とけい]/は/誰[だれ]/に/もらいましたか|Jam itu kamu dapat dari siapa?","o|友達[ともだち]/に/プレゼント/を/あげました|Saya memberikan hadiah kepada teman.|プレゼント/を/友達[ともだち]/に/あげました"]},
{b:7,t:"もう ～ました / まだです",d:"<b>もう</b> + ～ました berarti \"sudah ...\". Untuk bertanya: もう ～ましたか. Jawabannya はい、もう ～ました, atau <b>いいえ、まだです</b> (belum). Jawaban ～ませんでした berarti \"tidak melakukan\", jadi tidak cocok untuk \"belum\".",
 ex:[["もう 手紙[てがみ]を 送[おく]りましたか。","Kamu sudah mengirim suratnya?"],["はい、もう 送[おく]りました。","Ya, sudah saya kirim."],["いいえ、まだです。これから 送[おく]ります。","Belum. Sebentar lagi saya kirim."]],
 q:["m|A: もう 昼[ひる]ご飯[はん]を 食[た]べましたか。 B: いいえ、___。|A: Sudah makan siang? B: Belum.|まだです|もうです|食[た]べませんでした|食[た]べました","m|___ 切符[きっぷ]を 買[か]いましたか。|Kamu sudah membeli tiketnya?|もう|まだ|これから|明日[あした]","o|もう/新聞[しんぶん]/を/読[よ]みましたか|Kamu sudah membaca koran?|新聞[しんぶん]/を/もう/読[よ]みましたか"]},
{b:8,t:"～が、～ (tetapi)",d:"<b>が</b> di akhir kalimat pertama berarti \"tetapi\" dan menyambung dua hal yang berlawanan: Kalimat 1 + が、Kalimat 2. Sebelum が tetap pakai bentuk sopan です atau ます: 高いですが、おいしいです.",
 ex:[["日本[にほん]の 食[た]べ物[もの]は おいしいですが、高[たか]いです。","Makanan Jepang enak, tetapi mahal."],["この 部屋[へや]は 小[ちい]さいですが、きれいです。","Kamar ini kecil, tetapi bersih."],["仕事[しごと]は 忙[いそが]しいですが、楽[たの]しいです。","Pekerjaannya sibuk, tetapi menyenangkan."]],
 q:["m|この 車[くるま]は 古[ふる]いです___、とても 便利[べんり]です。|Mobil ini tua, tetapi sangat praktis.|が|を|に|の","m|日本語[にほんご]は 難[むずか]しいですが、___。|Bahasa Jepang sulit, tetapi menarik.|おもしろいです|難[むずか]しいです|おもしろくないです|易[やさ]しくないです","o|この/かばん/は/高[たか]いですが、/とても/いいです|Tas ini mahal, tetapi sangat bagus."]},
{b:8,t:"とても / あまり",d:"<b>とても</b> (sangat) dipakai dalam kalimat positif: とても おいしいです. <b>あまり</b> (tidak begitu) selalu diikuti bentuk negatif: あまり 高くないです, あまり 静かじゃ ありません. Keduanya diletakkan tepat sebelum kata sifat.",
 ex:[["この 町[まち]は とても にぎやかです。","Kota ini sangat ramai."],["今日[きょう]は あまり 寒[さむ]くないです。","Hari ini tidak begitu dingin."],["あの 店[みせ]は あまり 有名[ゆうめい]じゃ ありません。","Toko itu tidak begitu terkenal."]],
 q:["m|この カメラは ___ 高[たか]くないです。|Kamera ini tidak begitu mahal.|あまり|とても|そして|それから","m|私[わたし]の 町[まち]は あまり ___。|Kota saya tidak begitu ramai.|にぎやかじゃ ありません|にぎやかです|にぎやかくないです|にぎやかな です","o|この/パン/は/とても/おいしい/です|Roti ini sangat enak.","o|この/本[ほん]/は/あまり/おもしろくない/です|Buku ini tidak begitu menarik."]},
{b:8,t:"N は どうですか / どんな N ですか",d:"<b>N は どうですか</b> menanyakan kesan atau pendapat tentang sesuatu (Bagaimana ...?). <b>どんな + kata benda</b> menanyakan sifat atau jenisnya (... seperti apa?). Jawaban untuk どんな biasanya berupa kata sifat + kata benda: 静かな 町です.",
 ex:[["日本[にほん]の 生活[せいかつ]は どうですか。","Bagaimana kehidupan di Jepang?"],["田中[たなか]さんは どんな 人[ひと]ですか。","Tanaka-san orangnya seperti apa?"],["親切[しんせつ]な 人[ひと]です。","Dia orang yang baik hati."]],
 q:["m|新[あたら]しい 仕事[しごと]は ___ですか。|Bagaimana pekerjaan barunya?|どう|どんな|誰[だれ]|どこ","m|ミラーさんは ___ 人[ひと]ですか。|Miller-san orang yang seperti apa?|どんな|どう|どこ|いつ","o|日本語[にほんご]/の/勉強[べんきょう]/は/どう/ですか|Bagaimana belajar bahasa Jepangmu?","o|どんな/本[ほん]/を/読[よ]みますか|Buku seperti apa yang kamu baca?"]},
{b:9,t:"N が わかります / あります (punya)",d:"<b>わかります</b> (mengerti) dan <b>あります</b> (punya) menandai bendanya dengan <b>が</b>, bukan を: 日本語が わかります, 車が あります. Di sini あります berarti memiliki, termasuk hal tak berwujud seperti waktu atau janji: 時間が ありません (tidak punya waktu).",
 ex:[["ミラーさんは ひらがなが わかります。","Miller-san mengerti hiragana."],["私[わたし]は パソコンが あります。","Saya punya komputer."],["細[こま]かい お金[かね]が ありますか。","Kamu punya uang receh?"]],
 q:["m|私[わたし]は 英語[えいご]___ わかります。|Saya mengerti bahasa Inggris.|が|を|へ|の","m|すみません、今日[きょう]は 時間[じかん]が ___。|Maaf, hari ini saya tidak punya waktu.|ありません|いません|わかりません|しません","o|明日[あした]/は/約束[やくそく]/が/あります|Besok saya ada janji."]},
{b:9,t:"よく・だいたい・たくさん・少し・あまり・全然",d:"Kata keterangan ini biasanya diletakkan tepat sebelum kata kerja: よく (dengan baik, sering), だいたい (sebagian besar), たくさん (banyak), 少し (sedikit). <b>あまり</b> (tidak begitu) dan <b>全然</b> (sama sekali tidak) wajib diikuti bentuk negatif: 全然 わかりません.",
 ex:[["山田[やまだ]さんは 英語[えいご]が よく わかります。","Yamada-san mengerti bahasa Inggris dengan baik."],["私[わたし]は 漢字[かんじ]が 少[すこ]し わかります。","Saya sedikit mengerti kanji."],["今[いま] お金[かね]が 全然[ぜんぜん] ありません。","Sekarang saya sama sekali tidak punya uang."]],
 q:["m|私[わたし]は タイ語[ご]が ___ わかりません。|Saya sama sekali tidak mengerti bahasa Thai.|全然[ぜんぜん]|少[すこ]し|だいたい|たくさん","m|宿題[しゅくだい]が ___ あります。|Saya punya banyak PR.|たくさん|全然[ぜんぜん]|あまり|とても","o|日本語[にほんご]/が/だいたい/わかります|Saya kurang lebih mengerti bahasa Jepang.|だいたい/日本語[にほんご]/が/わかります","o|私[わたし]/は/お酒[さけ]/を/あまり/飲[の]みません|Saya jarang minum alkohol.|私[わたし]/は/あまり/お酒[さけ]/を/飲[の]みません"]},
{b:9,t:"どうして ～か / ～から",d:"<b>どうして</b> artinya \"mengapa\" dan biasanya diletakkan di awal pertanyaan. Jawabannya berupa alasan yang ditutup dengan <b>から</b>: 忙しいですから (karena sibuk). Untuk menanyakan alasan dari ucapan lawan bicara, cukup katakan どうしてですか.",
 ex:[["どうして 昨日[きのう] 会社[かいしゃ]を 休[やす]みましたか。","Mengapa kemarin kamu tidak masuk kerja?"],["用事[ようじ]が ありましたから。","Karena ada urusan."],["明日[あした]は 学校[がっこう]を 休[やす]みます。…どうしてですか。","Besok saya tidak masuk sekolah. ...Mengapa?"]],
 q:["m|A: ___ 昨日[きのう] 来[き]ませんでしたか。 B: 病院[びょういん]へ 行[い]きましたから。|A: Mengapa kemarin tidak datang? B: Karena saya pergi ke rumah sakit.|どうして|どう|どんな|いつ","m|A: どうして タクシーで 行[い]きますか。 B: 時間[じかん]が ありません___。|A: Mengapa naik taksi? B: Karena tidak ada waktu.|から|が|まで|を","o|どうして/日本語[にほんご]/を/勉強[べんきょう]しますか|Mengapa kamu belajar bahasa Jepang?|日本語[にほんご]/を/どうして/勉強[べんきょう]しますか","o|日本[にほん]/の/歌[うた]/が/好[す]きです/から|Karena saya suka lagu Jepang."]},
{b:10,t:"N は Tempat に あります / います",d:"Untuk menyebut letak sesuatu yang sudah dibicarakan, pakai <b>N は Tempat に あります/います</b> (N ada di ...). Benda mati memakai あります, orang dan hewan memakai います. Letaknya ditanyakan dengan N は どこに ありますか. Kalau ingin memperkenalkan sesuatu yang baru, pakai Tempat に N が あります.",
 ex:[["ミラーさんは 事務所[じむしょ]に います。","Miller-san ada di kantor."],["私[わたし]の 傘[かさ]は どこに ありますか。","Payung saya ada di mana?"],["郵便局[ゆうびんきょく]は 駅[えき]の 前[まえ]に あります。","Kantor pos ada di depan stasiun."]],
 q:["m|ミラーさん___ 会議室[かいぎしつ]に います。|Miller-san ada di ruang rapat.|は|を|で|へ","m|A: 田中[たなか]さんは どこに いますか。 B: ロビー___ います。|A: Tanaka-san ada di mana? B: Di lobi.|に|で|を|へ","o|電話[でんわ]/は/どこ/に/ありますか|Telepon ada di mana?","o|猫[ねこ]/は/私[わたし]の/部屋[へや]/に/います|Kucingnya ada di kamar saya."]},
{b:10,t:"Kata posisi: N の 上・下・前・後ろ・中・外・隣・近く・間",d:"Kata posisi ditaruh setelah benda patokan dengan <b>の</b>: 机の 上 (di atas meja). Artinya: 上 atas, 下 bawah, 前 depan, 後ろ belakang, 中 dalam, 外 luar, 隣 sebelah, 近く dekat, 間 antara (A と B の 間). Setelah itu pakai に あります/います, atau で untuk tempat kegiatan: 公園の 中で 写真を 撮ります.",
 ex:[["机[つくえ]の 下[した]に 猫[ねこ]が います。","Ada kucing di bawah meja."],["銀行[ぎんこう]は 郵便局[ゆうびんきょく]と 病院[びょういん]の 間[あいだ]に あります。","Bank ada di antara kantor pos dan rumah sakit."],["コンビニの 前[まえ]で 友達[ともだち]に 会[あ]いました。","Saya bertemu teman di depan minimarket."]],
 q:["m|箱[はこ]の ___に 電池[でんち]が あります。|Ada baterai di dalam kotak.|中[なか]|外[そと]|上[うえ]|下[した]","m|ドアの ___に 男[おとこ]の子[こ]が います。|Ada anak laki-laki di belakang pintu.|後[うし]ろ|前[まえ]|隣[となり]|近[ちか]く","m|本屋[ほんや]は 花屋[はなや]___ 銀行[ぎんこう]の 間[あいだ]に あります。|Toko buku ada di antara toko bunga dan bank.|と|の|に|を","o|学校[がっこう]/は/駅[えき]の/近[ちか]く/に/あります|Sekolah ada di dekat stasiun."]},
{b:10,t:"N や N (など)",d:"<b>や</b> artinya \"dan\", tetapi hanya menyebut beberapa contoh; masih ada benda lain yang tidak disebut. Kalau semua benda disebut, pakai と. <b>など</b> (dan lain-lain) boleh ditambahkan setelah benda terakhir: 本や ノートなど.",
 ex:[["箱[はこ]の 中[なか]に 手紙[てがみ]や 写真[しゃしん]が あります。","Di dalam kotak ada surat, foto, dan lain-lain."],["冷蔵庫[れいぞうこ]に 卵[たまご]や 牛乳[ぎゅうにゅう]などが あります。","Di kulkas ada telur, susu, dan sebagainya."],["スーパーで 肉[にく]や 野菜[やさい]を 買[か]いました。","Di supermarket saya membeli daging, sayur, dan lain-lain."]],
 q:["m|部屋[へや]に ベッド___ 机[つくえ]が あります。|Di kamar ada tempat tidur, meja, dan lain-lain.|や|を|で|へ","m|机[つくえ]の 上[うえ]に ボールペンや ノート___が あります。|Di atas meja ada bolpoin, buku catatan, dan lain-lain.|など|や|と|も","o|果物[くだもの]/や/野菜[やさい]/を/買[か]いました|Saya membeli buah, sayur, dan lain-lain.|野菜[やさい]/や/果物[くだもの]/を/買[か]いました"]},
{b:11,t:"Kata bilangan & penghitung (～つ・～人・～枚・～台)",d:"Benda dihitung dengan penghitung: <b>～つ</b> untuk benda umum (一つ … 九つ, 十 dibaca とお), <b>～人</b> untuk orang (一人 ひとり, 二人 ふたり, 三人 さんにん), <b>～枚</b> untuk benda tipis seperti kertas dan kemeja, <b>～台</b> untuk mesin dan kendaraan. Kata bilangan dipakai tanpa partikel, sesudah が/を dan tepat sebelum kata kerja: みかんを 四つ 買いました. Kata tanyanya いくつ, 何人, 何枚, 何台.",
 ex:[["みかんを 六[むっ]つ 買[か]いました。","Saya membeli enam buah jeruk."],["教室[きょうしつ]に 学生[がくせい]が 五人[ごにん] います。","Di kelas ada lima orang pelajar."],["封筒[ふうとう]を 三枚[さんまい] ください。","Minta tiga lembar amplop."]],
 q:["m|シャツを ___ 買[か]いました。|Saya membeli dua helai kemeja.|二枚[にまい]|二台[にだい]|二人[ふたり]|二階[にかい]","m|うちに テレビが ___ あります。|Di rumah ada tiga televisi.|三台[さんだい]|三枚[さんまい]|三人[さんにん]|三階[さんがい]","o|私[わたし]/は/兄[あに]/が/二人[ふたり]/います|Saya punya dua kakak laki-laki.","o|りんご/を/五[いつ]つ/ください|Minta lima buah apel."]},
{b:11,t:"Lama waktu & frekuensi (～時間・～週間・～に ～回)",d:"Lama waktu dinyatakan dengan ～分 (menit), <b>～時間</b> (jam), ～日 (hari), <b>～週間</b> (minggu), ～か月 (bulan), dan ～年 (tahun). Sama seperti kata bilangan, kata ini dipakai tanpa partikel: 二時間 勉強しました. Frekuensi dibentuk dengan rentang waktu + <b>に</b> + jumlah <b>～回</b>: 一週間に 三回 berarti tiga kali seminggu. Untuk bertanya, pakai どのくらい (berapa lama) atau 何回 (berapa kali).",
 ex:[["毎日[まいにち] 二時間[にじかん] 勉強[べんきょう]します。","Setiap hari saya belajar dua jam."],["一週間[いっしゅうかん]に 三回[さんかい] テニスを します。","Saya bermain tenis tiga kali seminggu."],["駅[えき]まで 歩[ある]いて 十五分[じゅうごふん]ぐらい かかります。","Jalan kaki ke stasiun makan waktu sekitar 15 menit."]],
 q:["m|一週間[いっしゅうかん]___ 二回[にかい] 図書館[としょかん]へ 行[い]きます。|Saya pergi ke perpustakaan dua kali seminggu.|に|を|が|の","m|兄[あに]は アメリカに ___ いました。|Kakak laki-laki saya tinggal di Amerika selama tiga bulan.|三[さん]か月[げつ]|三月[さんがつ]|三日[みっか]|三回[さんかい]","o|一年[いちねん]/に/二回[にかい]/旅行[りょこう]します|Saya berwisata dua kali setahun.","o|毎日[まいにち]/八時間[はちじかん]/働[はたら]きます|Setiap hari saya bekerja delapan jam."]},
{b:11,t:"～だけ (hanya)",d:"<b>だけ</b> berarti \"hanya\" atau \"saja\". Letakkan langsung sesudah kata benda atau kata jumlah: 水だけ, 一人だけ, 少しだけ. Partikel を dan が sesudah だけ boleh dihilangkan, jadi cukup 水だけ 飲みました.",
 ex:[["朝[あさ]は コーヒーだけ 飲[の]みます。","Pagi hari saya hanya minum kopi."],["休[やす]みは 一日[いちにち]だけです。","Liburnya hanya satu hari."],["日本語[にほんご]は 少[すこ]しだけ 分[わ]かります。","Saya hanya mengerti sedikit bahasa Jepang."]],
 q:["m|昼[ひる]ご飯[はん]は パン___ 食[た]べました。|Untuk makan siang, saya hanya makan roti.|だけ|も|や|と","m|この クラスの 留学生[りゅうがくせい]は 二人[ふたり]___です。|Pelajar asing di kelas ini hanya dua orang.|だけ|ぐらい|から|まで","o|会議[かいぎ]/は/三十分[さんじゅっぷん]/だけ/です|Rapatnya hanya tiga puluh menit.","o|妹[いもうと]/は/野菜[やさい]/だけ/食[た]べます|Adik perempuan saya hanya makan sayur."]},
{b:12,t:"Bentuk lampau: でした / ～かったです",d:"Kata benda dan kata sifat-な: です menjadi <b>でした</b>, negatifnya <b>じゃ ありませんでした</b>. Kata sifat-い: い diganti <b>かったです</b> (寒い → 寒かったです), negatifnya <b>くなかったです</b>. Kata sifat-い tidak memakai でした, jadi 寒いでした salah. Pengecualian: いい menjadi <b>よかったです</b> dan よくなかったです.",
 ex:[["おとといは 雨[あめ]でした。","Kemarin lusa hujan."],["旅行[りょこう]は とても 楽[たの]しかったです。","Perjalanannya sangat menyenangkan."],["先週[せんしゅう]は 暇[ひま]じゃ ありませんでした。","Minggu lalu saya tidak senggang."]],
 q:["m|けさは とても 寒[さむ]___。|Tadi pagi sangat dingin.|かったです|いでした|でした|くなかったです","m|いい → ___|Bentuk lampau positif dari いいです|よかったです|いかったです|いいでした|よくなかったです","m|昨日[きのう]は 休[やす]み___。|Kemarin bukan hari libur.|じゃ ありませんでした|じゃ ありません|くなかったです|でした","o|先週[せんしゅう]/の/試験[しけん]/は/簡単[かんたん]/でした|Ujian minggu lalu mudah."]},
{b:12,t:"A と B と どちらが ～ / ～の ほうが ～",d:"Untuk membandingkan dua hal, tanyakan <b>A と B と どちらが</b> + kata sifat + ですか. Jawab dengan <b>B の ほうが</b> + kata sifat + です (B yang lebih ...). Kalau keduanya sama, jawab <b>どちらも</b> + kata sifat + です. どちら dipakai untuk dua pilihan apa saja, termasuk orang dan tempat.",
 ex:[["山[やま]と 海[うみ]と どちらが 好[す]きですか。","Kamu lebih suka gunung atau laut?"],["海[うみ]の ほうが 好[す]きです。","Saya lebih suka laut."],["どちらも 好[す]きです。","Saya suka dua-duanya."]],
 q:["m|バス___ ほうが 安[やす]いです。|Bus yang lebih murah.|の|が|と|は","m|インドネシアと 日本[にほん]と どちら___ 暑[あつ]いですか。|Mana yang lebih panas, Indonesia atau Jepang?|が|は|を|の","o|インドネシア/の/ほう/が/暑[あつ]い/です|Indonesia yang lebih panas.","o|犬[いぬ]/と/猫[ねこ]/と/どちらが/好[す]きですか|Kamu lebih suka anjing atau kucing?|猫[ねこ]/と/犬[いぬ]/と/どちらが/好[す]きですか"]},
{b:12,t:"～で 何が いちばん ～ですか",d:"Untuk menanyakan yang paling ... di antara tiga hal atau lebih, pakai lingkup + <b>で</b> + kata tanya + <b>が いちばん</b> + kata sifat + ですか, misalnya 果物で (di antara buah-buahan). Pilih kata tanya sesuai jawabannya: 何 untuk benda, どこ untuk tempat, だれ untuk orang, いつ untuk waktu. Jawabannya <b>N が いちばん</b> + kata sifat + です.",
 ex:[["果物[くだもの]で 何[なに]が いちばん 好[す]きですか。","Di antara buah-buahan, kamu paling suka apa?"],["みかんが いちばん 好[す]きです。","Saya paling suka jeruk."],["クラスで だれが いちばん 日本語[にほんご]が 上手[じょうず]ですか。","Di kelas, siapa yang paling pandai bahasa Jepang?"]],
 q:["m|インドネシアは 一年[いちねん]で ___が いちばん 暑[あつ]いですか。|Di Indonesia, kapan paling panas dalam setahun?|いつ|どこ|だれ|何[なに]","m|家族[かぞく]で ___が いちばん 忙[いそが]しいですか。|Di keluargamu, siapa yang paling sibuk?|だれ|いつ|どこ|何[なに]","o|この/町[まち]で/どこが/いちばん/にぎやかですか|Di kota ini, tempat mana yang paling ramai?|どこが/この/町[まち]で/いちばん/にぎやかですか","o|父[ちち]/が/いちばん/忙[いそが]しい/です|Ayah yang paling sibuk."]},
{b:13,t:"N が ほしいです",d:"<b>N が ほしいです</b> berarti ingin memiliki suatu benda; bendanya ditandai が. ほしい adalah kata sifat-い, jadi negatifnya ほしくないです. Kalau ingin melakukan sesuatu, pakai ～たいです. Pola ini hanya untuk keinginan sendiri atau untuk bertanya kepada lawan bicara, tidak untuk orang ketiga.",
 ex:[["私[わたし]は 新[あたら]しい パソコンが ほしいです。","Saya ingin punya komputer baru."],["誕生日[たんじょうび]に 何[なに]が ほしいですか。","Untuk ulang tahun, kamu ingin apa?"],["今[いま]は 何[なに]も ほしくないです。","Sekarang saya tidak ingin apa-apa."]],
 q:["m|私[わたし]は カメラ___ ほしいです。|Saya ingin punya kamera.|が|を|に|で","m|新[あたら]しい 靴[くつ]が ___。|Saya ingin sepatu baru.|ほしいです|ほしいます|ほしいでした|ほしくないです","o|私[わたし]/は/広[ひろ]い/部屋[へや]/が/ほしいです|Saya ingin kamar yang luas.","m|のどが かわきました。水[みず]が 飲[の]み___。|Saya haus. Saya ingin minum air.|たいです|ほしいです|たくないです|ました"]},
{b:13,t:"Tempat へ ～に 行きます (tujuan)",d:"Tujuan kepergian ditulis sebelum <b>に</b>: Tempat へ + tujuan + に + 行きます / 来ます / 帰ります. Tujuannya bisa kata kerja bentuk ます tanpa ます (買います → <b>買いに</b>) atau kata benda kegiatan seperti 買い物, 食事, 散歩 (<b>散歩に</b> 行きます). Objeknya tetap memakai を: パンを 買いに 行きます.",
 ex:[["図書館[としょかん]へ 本[ほん]を 借[か]りに 行[い]きます。","Saya pergi ke perpustakaan untuk meminjam buku."],["友達[ともだち]が うちへ 遊[あそ]びに 来[き]ました。","Teman datang ke rumah untuk bermain."],["週末[しゅうまつ] 川[かわ]へ 釣[つ]りに 行[い]きました。","Akhir pekan lalu saya pergi memancing ke sungai."]],
 q:["m|デパートへ 靴[くつ]を ___に 行[い]きます。|Saya pergi ke toserba untuk membeli sepatu.|買[か]い|買[か]います|買[か]いたい|買[か]いました","m|駅[えき]へ 友達[ともだち]を 迎[むか]え___ 行[い]きます。|Saya pergi ke stasiun untuk menjemput teman.|に|へ|で|を","o|海[うみ]へ/泳[およ]ぎ/に/行[い]きました|Saya pergi berenang ke laut.|泳[およ]ぎ/に/海[うみ]へ/行[い]きました","m|日曜日[にちようび] 公園[こうえん]へ 散歩[さんぽ]___ 行[い]きます。|Hari Minggu saya pergi jalan-jalan ke taman.|に|を|で|が"]},
{b:13,t:"どこか / 何か",d:"<b>どこか</b> berarti suatu tempat dan <b>何か</b> berarti sesuatu; partikel へ dan を sesudahnya boleh dihilangkan. どこか 行きますか artinya \"pergi ke suatu tempat?\" dan dijawab はい atau いいえ, sedangkan どこへ 行きますか menanyakan \"ke mana?\". Jawaban negatifnya memakai どこも / 何も + bentuk negatif: いいえ、何も 食べませんでした.",
 ex:[["週末[しゅうまつ] どこか 行[い]きましたか。","Akhir pekan kemarin kamu pergi ke suatu tempat?"],["いいえ、どこも 行[い]きませんでした。","Tidak, saya tidak pergi ke mana-mana."],["のどが かわきましたから、何[なに]か 飲[の]みたいです。","Saya haus, jadi ingin minum sesuatu."]],
 q:["m|おなかが すきましたから、___ 食[た]べませんか。|Saya lapar. Bagaimana kalau kita makan sesuatu?|何[なに]か|何[なに]も|何[なに]を|どこか","m|日曜日[にちようび] ___ 行[い]きますか。|Hari Minggu kamu pergi ke suatu tempat?|どこか|どこ|どこも|何[なに]か","o|かばんの/中[なか]に/何[なに]か/ありますか|Apakah ada sesuatu di dalam tas?|何[なに]か/かばんの/中[なか]に/ありますか","m|A: 何[なに]か 食[た]べましたか。 B: いいえ、___ 食[た]べませんでした。|A: Kamu sudah makan sesuatu? B: Tidak, saya tidak makan apa-apa.|何[なに]も|何[なに]か|何[なに]を|何[なに]が"]},
{b:14,t:"Kelompok kata kerja (I・II・III)",d:"Lihat bunyi tepat sebelum ます: bunyi <b>-i</b> (書きます, 飲みます, 帰ります) umumnya <b>Kelompok I</b>. Bunyi <b>-e</b> (食べます, 寝ます) selalu <b>Kelompok II</b>, begitu juga beberapa kata berbunyi -i yang perlu dihafal: 見ます, 起きます, 借ります, います. <b>Kelompok III</b> hanya します (termasuk 勉強します, 散歩します) dan 来ます. Kelompok ini menentukan cara membuat bentuk-て.",
 ex:[["毎朝[まいあさ] 新聞[しんぶん]を 読[よ]みます。","Setiap pagi saya membaca koran. (yo-mi-masu: bunyi -i, Kelompok I)"],["毎晩[まいばん] テレビを 見[み]ます。","Setiap malam saya menonton TV. (mi-masu: bunyi -i, tetapi Kelompok II)"],["明日[あした] 友達[ともだち]が うちへ 来[き]ます。","Besok teman datang ke rumah. (ki-masu: Kelompok III)"]],
 q:["m|Kelompok I → ___|Kata kerja mana yang termasuk Kelompok I?|帰[かえ]ります|食[た]べます|見[み]ます|来[き]ます","m|Kelompok II → ___|Kata kerja mana yang termasuk Kelompok II?|借[か]ります|話[はな]します|待[ま]ちます|勉強[べんきょう]します","m|起[お]きます → ___|Bentuk-て dari 起きます (Kelompok II)|起[お]きて|起[お]いて|起[お]って|起[お]きって","o|電気[でんき]/を/つけて/ください|Tolong nyalakan lampunya."]},
{b:14,t:"～ましょうか (menawarkan bantuan)",d:"Bentuk ます tanpa ます + <b>ましょうか</b> dipakai untuk menawarkan bantuan, artinya \"Perlu saya ...?\". Yang melakukannya adalah pembicara sendiri. Jawab <b>ええ、お願いします</b> kalau mau dibantu, atau <b>いいえ、けっこうです</b> kalau tidak perlu.",
 ex:[["荷物[にもつ]が 多[おお]いですね。一[ひと]つ 持[も]ちましょうか。","Barangnya banyak, ya. Perlu saya bawakan satu?"],["地図[ちず]を 書[か]きましょうか。","Perlu saya gambarkan petanya?"],["いいえ、けっこうです。","Tidak usah, terima kasih."]],
 q:["m|暑[あつ]いですね。エアコンを つけ___。|Panas, ya. Perlu saya nyalakan AC-nya?|ましょうか|ませんか|てください|ました","m|A: 傘[かさ]を 貸[か]しましょうか。 B: ええ、___。|A: Perlu saya pinjamkan payung? B: Ya, tolong.|お願[ねが]いします|けっこうです|貸[か]しましょう|どういたしまして","o|寒[さむ]いですね。/窓[まど]/を/閉[し]めましょうか|Dingin, ya. Perlu saya tutup jendelanya?"]},
{b:15,t:"～ても いいですか (minta izin)",d:"Bentuk-て + <b>も いいですか</b> dipakai untuk meminta izin: \"Bolehkah saya ...?\". Kalau boleh, jawab ええ、いいですよ atau どうぞ; kalau tidak, jawab dengan halus すみません、ちょっと…. Tanpa か, <b>～ても いいです</b> berarti \"boleh ...\".",
 ex:[["すみません、ここに 座[すわ]っても いいですか。","Permisi, bolehkah saya duduk di sini?"],["ええ、どうぞ。","Ya, silakan."],["試験[しけん]で 辞書[じしょ]を 使[つか]っても いいです。","Waktu ujian boleh memakai kamus."]],
 q:["m|この 電話[でんわ]を 使[つか]って___ いいですか。|Bolehkah saya memakai telepon ini?|も|は|を|が","m|ここに 荷物[にもつ]を ___も いいですか。|Bolehkah saya menaruh barang di sini?|置[お]いて|置[お]きて|置[お]って|置[お]んで","o|すみません、/ちょっと/休[やす]んでも/いいですか|Maaf, bolehkah saya istirahat sebentar?","m|A: この 本[ほん]を 借[か]りても いいですか。 B: ええ、___。|A: Bolehkah saya meminjam buku ini? B: Ya, silakan.|どうぞ|どういたしまして|お願[ねが]いします|いただきます"]},
{b:15,t:"～ては いけません (larangan)",d:"Bentuk-て + <b>は いけません</b> berarti \"tidak boleh ...\" (は di sini dibaca wa). Larangan ini tegas, biasanya untuk aturan atau dari atasan kepada bawahan, jadi jangan dipakai kepada orang yang lebih tinggi. Pola ini juga menjadi jawaban \"tidak\" yang tegas untuk ～ても いいですか: いいえ、いけません.",
 ex:[["美術館[びじゅつかん]で 写真[しゃしん]を 撮[と]っては いけません。","Di museum seni tidak boleh memotret."],["教室[きょうしつ]で ジュースを 飲[の]んでは いけません。","Di kelas tidak boleh minum jus."],["ここに 車[くるま]を 止[と]めても いいですか。…いいえ、いけません。","Bolehkah saya parkir mobil di sini? …Tidak, tidak boleh."]],
 q:["m|病院[びょういん]で たばこを ___は いけません。|Di rumah sakit tidak boleh merokok.|吸[す]って|吸[す]いて|吸[す]んで|吸[す]きて","m|A: 鉛筆[えんぴつ]で 書[か]いても いいですか。 B: いいえ、鉛筆[えんぴつ]で 書[か]いては ___。|A: Bolehkah saya menulis dengan pensil? B: Tidak, tidak boleh menulis dengan pensil.|いけません|いいです|ください|いいですか","o|この/川[かわ]/で/泳[およ]いでは/いけません|Tidak boleh berenang di sungai ini.","o|会議室[かいぎしつ]/で/食[た]べては/いけません|Tidak boleh makan di ruang rapat."]},
{b:16,t:"～て、～て (urutan kegiatan)",d:"Untuk menyebut dua kegiatan atau lebih secara berurutan, ubah kata kerja ke bentuk-て lalu sambung dengan koma: 起きて、食べて、行きます. Urutannya mengikuti urutan kejadian. Hanya kata kerja terakhir yang memakai ます/ました, dan kata kerja itulah yang menentukan waktunya (sekarang/nanti atau lampau).",
 ex:[["毎朝[まいあさ] 6時[じ]に 起[お]きて、朝[あさ]ご飯[はん]を 食[た]べて、学校[がっこう]へ 行[い]きます。","Setiap pagi saya bangun jam 6, sarapan, lalu berangkat ke sekolah."],["昨日[きのう]は 図書館[としょかん]で 本[ほん]を 借[か]りて、うちで 読[よ]みました。","Kemarin saya meminjam buku di perpustakaan, lalu membacanya di rumah."]],
 q:["m|毎晩[まいばん] 日本語[にほんご]を 勉強[べんきょう]___、11時[じ]に 寝[ね]ます。|Setiap malam saya belajar bahasa Jepang, lalu tidur jam 11.|して|します|しました|しませんか","m|駅[えき]で 友達[ともだち]に ___、いっしょに 昼[ひる]ご飯[はん]を 食[た]べました。|Saya bertemu teman di stasiun, lalu makan siang bersama.|会[あ]って|会[あ]いて|会[あ]んで|会[あ]いで","o|電車[でんしゃ]を/降[お]りて/バスに/乗[の]ります|Saya turun dari kereta, lalu naik bus.","o|うちへ 帰[かえ]って/シャワーを/浴[あ]びて/寝[ね]ました|Saya pulang ke rumah, mandi, lalu tidur."]},
{b:16,t:"～くて / ～で (menyambung kata sifat & kata benda)",d:"Untuk menyambung dua sifat atau keterangan. Kata sifat-い: buang い, tambah <b>くて</b> (安い → 安くて; いい → よくて). Kata sifat-な dan kata benda: tambah <b>で</b> (静か → 静かで, 医者 → 医者で). Untuk kata sifat, pakai pola ini kalau kedua sifat searah (sama-sama baik atau sama-sama buruk); kalau berlawanan, pakai が (tetapi).",
 ex:[["あの レストランは 安[やす]くて、おいしいです。","Restoran itu murah dan enak."],["この 公園[こうえん]は 静[しず]かで、きれいです。","Taman ini tenang dan indah."],["父[ちち]は 医者[いしゃ]で、45歳[さい]です。","Ayah saya dokter, umurnya 45 tahun."]],
 q:["m|安[やす]い → ___|Bentuk sambung dari 安い|安[やす]くて|安[やす]いで|安[やす]いくて|安[やす]で","m|この ホテルは サービスが ___、安[やす]いです。|Hotel ini pelayanannya bagus dan murah.|よくて|いくて|いいで|よいで","m|田中[たなか]さんは 親切[しんせつ]___、おもしろいです。|Tanaka-san baik hati dan lucu.|で|な|くて|に","o|この/かばんは/軽[かる]くて/便利[べんり]です|Tas ini ringan dan praktis."]},
{b:16,t:"～てから",d:"Bentuk-て + <b>から</b> = 'setelah ..., (baru) ...': kegiatan pertama selesai dulu, lalu kegiatan kedua dilakukan (宿題をしてから、遊びます). Waktu kalimat ditentukan oleh kata kerja di akhir. Jangan tertukar dengan ～から 'karena' (Bab 9), yang menempel pada bentuk ます/です: 行きますから.",
 ex:[["宿題[しゅくだい]を してから、テレビを 見[み]ます。","Setelah mengerjakan PR, (baru) saya menonton TV."],["日本[にほん]へ 来[き]てから、漢字[かんじ]の 勉強[べんきょう]を 始[はじ]めました。","Setelah datang ke Jepang, saya mulai belajar kanji."],["仕事[しごと]が 終[お]わってから、ジョギングを します。","Setelah pekerjaan selesai, saya joging."]],
 q:["m|うちへ ___から、電話[でんわ]します。|Setelah pulang ke rumah, saya akan menelepon.|帰[かえ]って|帰[かえ]りて|帰[かえ]んで|帰[かえ]いて","m|お金[かね]を 下[お]ろして___、買[か]い物[もの]を します。|Setelah mengambil uang, saya berbelanja.|から|が|を|に","o|晩[ばん]ご飯[はん]を/食[た]べてから/公園[こうえん]を/散歩[さんぽ]します|Setelah makan malam, saya berjalan-jalan di taman."]},
{b:16,t:"N1 は N2 が kata sifat",d:"Pola untuk menerangkan ciri sesuatu: N1 は (yang dibicarakan) + N2 が (bagian atau aspeknya) + kata sifat. 象は鼻が長いです = 'Gajah belalainya panjang', mirip susunan bahasa Indonesia. Ungkapan yang sering dipakai: 背が高い (tinggi badannya), 頭がいい (pintar).",
 ex:[["姉[あね]は 背[せ]が 高[たか]いです。","Kakak perempuan saya tinggi badannya."],["インドネシアは 果物[くだもの]が おいしいです。","Indonesia itu buah-buahannya enak."],["田中[たなか]さんは 頭[あたま]が いいです。","Tanaka-san pintar."]],
 q:["m|象[ぞう]は 鼻[はな]___ 長[なが]いです。|Gajah belalainya panjang.|が|を|で|に","m|この 部屋[へや]___ 窓[まど]が 大[おお]きいです。|Kamar ini jendelanya besar.|は|を|へ|に","o|この/町[まち]は/緑[みどり]が/多[おお]いです|Kota ini banyak tanaman hijaunya.","o|田中[たなか]さんの/弟[おとうと]さんは/目[め]が/大[おお]きいです|Adik laki-laki Tanaka-san matanya besar."]},
{b:16,t:"どうやって (bagaimana caranya)",d:"どうやって = 'dengan cara bagaimana', untuk menanyakan cara melakukan sesuatu atau jalan menuju suatu tempat. Letakkan sebelum kata kerja: 駅までどうやって行きますか. Jawabannya sering memakai ～て、～て untuk menjelaskan langkah-langkahnya.",
 ex:[["空港[くうこう]まで どうやって 行[い]きますか。","Bagaimana cara pergi ke bandara?"],["うちから 駅[えき]まで 歩[ある]いて、電車[でんしゃ]で 空港[くうこう]へ 行[い]きます。","Dari rumah saya jalan kaki ke stasiun, lalu naik kereta ke bandara."],["この カメラは どうやって 使[つか]いますか。","Bagaimana cara memakai kamera ini?"]],
 q:["m|図書館[としょかん]まで ___ 行[い]きますか。|Bagaimana cara pergi ke perpustakaan?|どうやって|どんな|どの|どれ","m|A: 駅[えき]まで どうやって 行[い]きますか。 B: ___。|A: Bagaimana caranya ke stasiun? B: Naik bus.|バスで 行[い]きます|5分[ふん]ぐらいです|駅[えき]の 前[まえ]です|明日[あした] 行[い]きます","o|この/漢字[かんじ]は/どうやって/書[か]きますか|Bagaimana cara menulis kanji ini?"]},
{b:17,t:"Bentuk ない",d:"Bentuk ない adalah bentuk negatif biasa dan menjadi dasar pola-pola Bab 17. Grup I: bunyi -i sebelum ます diganti bunyi -a, lalu tambah <b>ない</b> (書きます → 書かない, 待ちます → 待たない); bunyi い berubah menjadi <b>わ</b> (買います → 買わない). Grup II: buang ます, tambah <b>ない</b> (食べます → 食べない). Grup III: します → <b>しない</b>, 来ます → <b>来ない</b> (こない).",
 ex:[["ここで たばこを 吸[す]わないで ください。","Tolong jangan merokok di sini."],["明日[あした]は 6時[じ]に 起[お]きなければ なりません。","Besok saya harus bangun jam 6."],["土曜日[どようび]は 会社[かいしゃ]へ 来[こ]なくても いいです。","Hari Sabtu Anda tidak perlu datang ke kantor."]],
 q:["m|書[か]きます → ___|Bentuk ない dari 書きます|書[か]かない|書[か]きない|書[か]くない|書[か]こない","m|買[か]います → ___|Bentuk ない dari 買います|買[か]わない|買[か]あない|買[か]いない|買[か]まない","m|来[き]ます → ___|Bentuk ない dari 来ます|こない|きない|くない|かない","o|この/写真[しゃしん]を/見[み]ないで/ください|Tolong jangan lihat foto ini."]},
{b:17,t:"～ないで ください",d:"Bentuk ない + <b>で ください</b> = 'tolong jangan ...' (忘れます → 忘れない → 忘れないで ください). Ini permintaan yang halus, lebih lembut daripada larangan ～ては いけません. Dipakai juga untuk menenangkan orang: 心配しないで ください (jangan khawatir).",
 ex:[["危[あぶ]ないですから、ここで 遊[あそ]ばないで ください。","Berbahaya, jadi tolong jangan bermain di sini."],["パスポートを 忘[わす]れないで ください。","Jangan lupa membawa paspor."]],
 q:["m|ここに 荷物[にもつ]を ___ ください。|Tolong jangan menaruh barang di sini.|置[お]かないで|置[お]かなくて|置[お]かない|置[お]きません","m|私[わたし]は 元気[げんき]ですから、心配[しんぱい]___で ください。|Saya baik-baik saja, jadi jangan khawatir.|しない|さない|すない|こない","o|この/部屋[へや]に/入[はい]らないで/ください|Tolong jangan masuk ke kamar ini."]},
{b:17,t:"～なければ なりません",d:"'Harus ...'. Ambil bentuk ない, lalu ganti ない dengan <b>なければ なりません</b>: 行かない → 行かなければ なりません, 食べない → 食べなければ なりません. Walaupun ada ない di dalamnya, artinya positif: kegiatan itu wajib dilakukan.",
 ex:[["今日[きょう]は 銀行[ぎんこう]へ 行[い]かなければ なりません。","Hari ini saya harus pergi ke bank."],["ここで 靴[くつ]を 脱[ぬ]がなければ なりません。","Di sini sepatu harus dilepas."],["レポートを 書[か]かなければ なりませんから、今晩[こんばん]は 出[で]かけません。","Karena harus menulis laporan, malam ini saya tidak keluar."]],
 q:["m|毎朝[まいあさ] 7時[じ]に うちを ___ なりません。|Setiap pagi saya harus berangkat dari rumah jam 7.|出[で]なければ|出[で]ないで|出[で]なくても|出[で]ません","m|急[いそ]ぎます → ___ なりません|Bentuk 'harus' dari 急ぎます|急[いそ]がなければ|急[いそ]ぎなければ|急[いそ]ぐなければ|急[いそ]かなければ","o|今日[きょう]は/早[はや]く/帰[かえ]らなければ/なりません|Hari ini saya harus pulang cepat."]},
{b:17,t:"～なくても いいです",d:"'Tidak perlu ...' atau 'tidak usah ...'. Ambil bentuk ない, lalu ganti ない dengan <b>なくても いいです</b>: 来ない → 来なくても いいです. Pola ini dipakai untuk menjawab いいえ atas pertanyaan ～なければ なりませんか.",
 ex:[["靴[くつ]は 脱[ぬ]がなくても いいです。","Sepatunya tidak perlu dilepas."],["時間[じかん]が ありますから、急[いそ]がなくても いいですよ。","Waktunya masih ada, jadi tidak usah buru-buru."]],
 q:["m|A: 明日[あした]も 来[こ]なければ なりませんか。 B: いいえ、___ いいです。|A: Besok juga harus datang? B: Tidak, tidak perlu datang.|こなくても|きなくても|くなくても|こないても","m|使[つか]います → ___ いいです|Bentuk 'tidak perlu' dari 使います|使[つか]わなくても|使[つか]あなくても|使[つか]いなくても|使[つか]わないても","o|この/漢字[かんじ]は/覚[おぼ]えなくても/いいです|Kanji ini tidak perlu dihafal."]},
{b:17,t:"Waktu までに (paling lambat)",d:"Waktu + <b>までに</b> = paling lambat pada waktu itu; kegiatannya cukup terjadi sekali sebelum batas tersebut (金曜日までに 返します). Bandingkan dengan <b>まで</b> (Bab 4) yang berarti kegiatan berlangsung terus sampai waktu itu (5時まで 働きます). Jadi までに cocok untuk pulang, menyerahkan, atau mengembalikan; まで untuk bekerja, menunggu, atau belajar.",
 ex:[["この 本[ほん]は 金曜日[きんようび]までに 返[かえ]して ください。","Tolong kembalikan buku ini paling lambat hari Jumat."],["毎日[まいにち] 5時[じ]まで 働[はたら]きます。","Setiap hari saya bekerja sampai jam 5."],["10時[じ]までに うちへ 帰[かえ]らなければ なりません。","Saya harus sudah pulang ke rumah paling lambat jam 10."]],
 q:["m|宿題[しゅくだい]は 明日[あした]___ 出[だ]して ください。|Tolong serahkan PR paling lambat besok.|までに|まで|を|が","m|駅[えき]で 6時[じ]___ 待[ま]ちます。|Saya menunggu di stasiun sampai jam 6.|まで|までに|へ|が","o|8時[じ]までに/会社[かいしゃ]へ/来[き]て/ください|Tolong datang ke kantor paling lambat jam 8.|会社[かいしゃ]へ/8時[じ]までに/来[き]て/ください"]},
{b:18,t:"Bentuk kamus",d:"Bentuk kamus adalah bentuk dasar kata kerja, yang tercantum di kamus. Grup I: bunyi -i sebelum ます diganti bunyi -u (書きます → 書く, 待ちます → 待つ, 買います → 買う). Grup II: buang ます, tambah <b>る</b> (食べます → 食べる, 起きます → 起きる). Grup III: します → <b>する</b>, 来ます → <b>来る</b> (くる).",
 ex:[["日本語[にほんご]で 手紙[てがみ]を 書[か]く ことが できます。","Saya bisa menulis surat dalam bahasa Jepang."],["朝[あさ]ご飯[はん]を 食[た]べる まえに、シャワーを 浴[あ]びます。","Sebelum sarapan, saya mandi."],["日本[にほん]へ 来[く]る まえに、日本語[にほんご]を 勉強[べんきょう]しました。","Sebelum datang ke Jepang, saya belajar bahasa Jepang."]],
 q:["m|待[ま]ちます → ___|Bentuk kamus dari 待ちます|待[ま]つ|待[ま]ちる|待[ま]ぬ|待[ま]す","m|起[お]きます → ___|Bentuk kamus dari 起きます (Grup II)|起[お]きる|起[お]く|起[お]きむ|起[お]かる","m|来[き]ます → ___|Bentuk kamus dari 来ます|くる|きる|こる|きす","o|私[わたし]は/車[くるま]を/運転[うんてん]する/ことが/できます|Saya bisa menyetir mobil."]},
{b:18,t:"～ことが できます",d:"'Bisa/dapat ...', untuk kemampuan (bisa berenang) atau kemungkinan (di perpustakaan ini bisa memakai internet). Kata kerja bentuk kamus + <b>ことが できます</b>: 泳ぐ ことが できます. Kata benda cukup ditambah <b>が できます</b>: 日本語が できます, 運転が できます.",
 ex:[["妹[いもうと]は ピアノを 弾[ひ]く ことが できます。","Adik perempuan saya bisa bermain piano."],["この 図書館[としょかん]で インターネットを 使[つか]う ことが できます。","Di perpustakaan ini kita bisa memakai internet."],["父[ちち]は 運転[うんてん]が できません。","Ayah saya tidak bisa menyetir."]],
 q:["m|私[わたし]は 100メートル ___ ことが できます。|Saya bisa berenang 100 meter.|泳[およ]ぐ|泳[およ]ぎます|泳[およ]いで|泳[およ]ぎ","m|ここで 写真[しゃしん]を 撮[と]る ___ できます。|Di sini kita bisa mengambil foto.|ことが|ことに|ことへ|ことと","o|田中[たなか]さんは/馬[うま]に/乗[の]る/ことが/できます|Tanaka-san bisa naik kuda.","o|兄[あに]は/日本語[にほんご]と/英語[えいご]が/できます|Kakak laki-laki saya bisa bahasa Jepang dan bahasa Inggris."]},
{b:18,t:"趣味は ～ことです",d:"Untuk menyebut hobi: 趣味は + kata kerja bentuk kamus + <b>ことです</b>. こと mengubah kegiatan menjadi kata benda ('hal ...'). Hobi juga bisa disebut dengan kata benda saja (趣味は写真です), tetapi dengan kata kerja hasilnya lebih spesifik (趣味は山の写真を撮ることです).",
 ex:[["私[わたし]の 趣味[しゅみ]は 写真[しゃしん]を 撮[と]る ことです。","Hobi saya memotret."],["兄[あに]の 趣味[しゅみ]は 釣[つ]りです。","Hobi kakak laki-laki saya memancing."],["母[はは]の 趣味[しゅみ]は インドネシアの 歌[うた]を 歌[うた]う ことです。","Hobi ibu saya menyanyikan lagu-lagu Indonesia."]],
 q:["m|私[わたし]の 趣味[しゅみ]は 本[ほん]を ___ ことです。|Hobi saya membaca buku.|読[よ]む|読[よ]みます|読[よ]んで|読[よ]み","m|妹[いもうと]の 趣味[しゅみ]は 絵[え]を かく ___。|Hobi adik perempuan saya menggambar.|ことです|です|ことが できます|ます","o|私[わたし]の/趣味[しゅみ]は/インドネシア料理[りょうり]を/作[つく]る/ことです|Hobi saya memasak masakan Indonesia."]},
{b:18,t:"～まえに",d:"'Sebelum ...'. Kata kerja bentuk kamus + <b>まえに</b> (出かける まえに), kata benda + <b>の まえに</b> (会議の まえに), jumlah waktu + <b>まえに</b> = '... yang lalu' (2年 まえに). Kata kerja sebelum まえに selalu bentuk kamus, walaupun kejadiannya sudah lampau: 日本へ来るまえに、勉強しました.",
 ex:[["出[で]かける まえに、電気[でんき]を 消[け]します。","Sebelum pergi, saya mematikan lampu."],["会議[かいぎ]の まえに、資料[しりょう]を コピーします。","Sebelum rapat, saya memfotokopi bahan rapat."],["2年[ねん]まえに、この 町[まち]へ 来[き]ました。","Saya datang ke kota ini 2 tahun yang lalu."]],
 q:["m|うちを ___ まえに、窓[まど]を 閉[し]めます。|Sebelum keluar rumah, saya menutup jendela.|出[で]る|出[で]ます|出[で]て|出[で]ません","m|食事[しょくじ]___ まえに、手[て]を 洗[あら]います。|Sebelum makan, saya mencuci tangan.|の|が|に|で","o|会社[かいしゃ]へ/行[い]く/まえに/ジョギングします|Sebelum berangkat ke kantor, saya joging."]},
{b:19,t:"Bentuk た",d:"Bentuk た (bentuk lampau biasa) dibuat persis seperti bentuk-て: ganti て dengan <b>た</b>, atau で dengan <b>だ</b>. Contoh: 書いて → 書いた, 飲んで → 飲んだ, 食べて → 食べた, して → した, 来て → 来た (きた), 行って → 行った. Di Bab 19 bentuk ini dipakai untuk ～たことが あります dan ～たり ～たり します.",
 ex:[["日本[にほん]の お酒[さけ]を 飲[の]んだ ことが あります。","Saya pernah minum sake Jepang."],["すき焼[や]きを 食[た]べた ことが ありますか。","Pernahkah kamu makan sukiyaki?"],["日曜日[にちようび]は 掃除[そうじ]したり、洗濯[せんたく]したり します。","Hari Minggu saya bersih-bersih, mencuci baju, dan sebagainya."]],
 q:["m|書[か]きます → ___|Bentuk た dari 書きます|書[か]いた|書[か]きた|書[か]った|書[か]んだ","m|行[い]きます → ___|Bentuk た dari 行きます (pengecualian)|行[い]った|行[い]いた|行[い]きた|行[い]んだ","m|泳[およ]ぎます → ___|Bentuk た dari 泳ぎます|泳[およ]いだ|泳[およ]いた|泳[およ]んだ|泳[およ]ぎた","o|日本[にほん]の/歌[うた]を/歌[うた]った/ことが/あります|Saya pernah menyanyikan lagu Jepang."]},
{b:19,t:"～たことが あります",d:"Bentuk た + <b>ことが あります</b> = 'pernah ...' (pengalaman). Belum pernah: <b>～たことが ありません</b>, sering ditambah 一度も (sekali pun). Untuk kejadian pada waktu tertentu (kemarin, tahun lalu) cukup pakai ～ました: 去年 日本へ 行きました.",
 ex:[["私[わたし]は 新幹線[しんかんせん]に 乗[の]った ことが あります。","Saya pernah naik Shinkansen."],["雪[ゆき]を 見[み]た ことが ありますか。","Pernahkah kamu melihat salju?"],["まだ 一度[いちど]も 日本[にほん]へ 行[い]った ことが ありません。","Saya belum pernah sekali pun pergi ke Jepang."]],
 q:["m|私[わたし]は 刺身[さしみ]を 食[た]べた ことが ___。|Saya belum pernah makan sashimi.|ありません|いません|しません|なりません","m|日本[にほん]の お茶[ちゃ]を ___ ことが ありますか。|Pernahkah kamu minum teh Jepang?|飲[の]んだ|飲[の]みた|飲[の]んで|飲[の]みます","o|一度[いちど]も/飛行機[ひこうき]に/乗[の]った/ことが/ありません|Saya belum pernah sekali pun naik pesawat.|飛行機[ひこうき]に/一度[いちど]も/乗[の]った/ことが/ありません"]},
{b:19,t:"～たり ～たり します",d:"Bentuk た + <b>り</b> untuk menyebut beberapa contoh kegiatan, tanpa urutan tertentu dan tidak harus lengkap ('..., ..., dan lain-lain'). Kalimat ditutup dengan <b>します</b>; untuk masa lampau cukup ubah bagian akhir: ～たり、～たり しました. Bandingkan ～て、～て (Bab 16) yang menyebut kegiatan secara berurutan.",
 ex:[["週末[しゅうまつ]は 映画[えいが]を 見[み]たり、買[か]い物[もの]を したり します。","Akhir pekan saya menonton film, berbelanja, dan lain-lain."],["昨日[きのう]は うちで 本[ほん]を 読[よ]んだり、手紙[てがみ]を 書[か]いたり しました。","Kemarin di rumah saya membaca buku, menulis surat, dan sebagainya."]],
 q:["m|パーティーで 歌[うた]を 歌[うた]ったり、___ しました。|Di pesta kami bernyanyi, berdansa, dan lain-lain.|ダンスを したり|ダンスを しました|ダンスを して|ダンスを します","m|日曜日[にちようび]は 散歩[さんぽ]したり、友達[ともだち]に ___ します。|Hari Minggu saya jalan-jalan, bertemu teman, dan sebagainya.|会[あ]ったり|会[あ]って|会[あ]いたり|会[あ]ったら","o|夜[よる]は/テレビを/見[み]たり/音楽[おんがく]を/聞[き]いたり/します|Malam hari saya menonton TV, mendengarkan musik, dan sebagainya.|夜[よる]は/音楽[おんがく]を/聞[き]いたり/テレビを/見[み]たり/します"]},
{b:19,t:"～く / ～に なります",d:"なります = 'menjadi', untuk perubahan keadaan. Kata sifat-い: ganti い dengan <b>く</b> (寒い → 寒く なります; いい → よく なります). Kata sifat-な dan kata benda: tambah <b>に</b> (元気 → 元気に なります, 医者 → 医者に なります).",
 ex:[["秋[あき]に なって、涼[すず]しく なりました。","Sudah masuk musim gugur, udaranya jadi sejuk."],["体[からだ]の 調子[ちょうし]が よく なりました。","Kondisi badan saya sudah membaik."],["私[わたし]は 医者[いしゃ]に なりたいです。","Saya ingin menjadi dokter."]],
 q:["m|日本語[にほんご]が 上手[じょうず]___ なりました。|Bahasa Jepang Anda sudah menjadi mahir.|に|く|な|で","m|かぜは もう ___ なりました。|Masuk anginnya sudah sembuh.|よく|いく|いいに|よいに","m|姉[あね]は 先生[せんせい]___ なりました。|Kakak perempuan saya sudah menjadi guru.|に|く|を|が","o|冬[ふゆ]は/夜[よる]が/長[なが]く/なります|Pada musim dingin, malam menjadi panjang."]},
{b:20,t:"Bentuk biasa (普通形)",d:"Bentuk biasa adalah bentuk tanpa です/ます, dipakai dalam obrolan akrab dan di dalam banyak pola lain. <b>Kata kerja</b>: 行きます → 行く, 行きません → 行かない, 行きました → 行った, 行きませんでした → 行かなかった (ingat: ありません → ない). <b>Sifat-い</b>: cukup buang です: 高い, 高くない, 高かった, 高くなかった. <b>Sifat-な dan kata benda</b>: です → <b>だ</b>, じゃありません → じゃない, でした → <b>だった</b>, じゃありませんでした → じゃなかった.",
 ex:[["昨日[きのう]は 何[なに]も 食[た]べなかった。","Kemarin aku tidak makan apa-apa."],["今日[きょう]の 試験[しけん]は 難[むずか]しかった。","Ujian hari ini sulit."],["昨日[きのう]は 雨[あめ]だった。","Kemarin hujan."]],
 q:["m|飲[の]みませんでした → ___|Bentuk biasa dari 飲みませんでした|飲[の]まなかった|飲[の]みなかった|飲[の]まないでした|飲[の]んだない","m|昨日[きのう]は とても 寒[さむ]___。|Kemarin dingin sekali.|かった|だった|いだった|くだった","m|先週[せんしゅう]は 暇[ひま]___。|Minggu lalu aku senggang.|だった|かった|いだった|くなかった","o|あの/人[ひと]は/先生[せんせい]/じゃ/ない|Orang itu bukan guru."]},
{b:20,t:"Percakapan dengan bentuk biasa",d:"Dengan teman akrab dan keluarga, orang Jepang bicara memakai bentuk biasa. Pertanyaan tidak memakai か, cukup diucapkan dengan intonasi naik (行く？), dan だ pada kata benda atau sifat-な ikut dibuang (暇？). Jawabannya <b>うん</b> (ya) atau <b>ううん</b> (tidak), dan partikel は, が, を, へ sering dihilangkan (ご飯、食べた？). Kepada guru, atasan, atau orang yang belum akrab, tetap pakai です/ます.",
 ex:[["日曜日[にちようび]、暇[ひま]？","Hari Minggu kamu senggang?"],["明日[あした]、学校[がっこう] 行[い]く？ うん、行[い]く。","Besok kamu ke sekolah? Iya."],["昨日[きのう]の パーティー、行[い]った？ ううん、行[い]かなかった。","Kemarin kamu ke pesta? Nggak, aku nggak pergi."]],
 q:["m|A: 昨日[きのう]、何[なに] ___？ B: 映画[えいが] 見[み]た。|Kemarin kamu ngapain? Nonton film.|した|する|しない|します","m|A: 宿題[しゅくだい]、もう した？ B: ___、まだ。|Sudah bikin PR? Belum.|ううん|うん|はい|ええ","m|A: 明日[あした]、___？ B: うん、休[やす]みだよ。|Besok kamu libur? Iya, libur.|休[やす]み|休[やす]みだ|休[やす]みな|休[やす]みに","o|ううん/今日[きょう]は/行[い]かない|Nggak, hari ini aku nggak pergi."]},
{b:21,t:"～と 思います",d:"Untuk menyampaikan pendapat atau perkiraan: 'saya kira / menurut saya ...'. Polanya bentuk biasa + <b>と 思います</b>; kata benda dan sifat-な tetap memakai <b>だ</b> (静かだと思います). Kalau perkiraannya negatif, yang dibuat negatif adalah bagian depannya: 来ないと思います (saya kira dia tidak datang). Untuk menanyakan pendapat orang lain: ～について どう 思いますか.",
 ex:[["週末[しゅうまつ]は 天気[てんき]が いいと 思[おも]います。","Saya kira akhir pekan nanti cuacanya bagus."],["あの 先生[せんせい]は とても 親切[しんせつ]だと 思[おも]います。","Menurut saya guru itu sangat baik hati."],["兄[あに]は 今晩[こんばん] 帰[かえ]らないと 思[おも]います。","Saya kira kakak laki-laki saya tidak pulang malam ini."]],
 q:["m|あの 公園[こうえん]は 静[しず]か___ 思[おも]います。|Menurut saya taman itu tenang.|だと|と|なと|でと","m|明日[あした]は たぶん 雪[ゆき]が ___と 思[おも]います。|Saya kira besok mungkin turun salju.|降[ふ]る|降[ふ]ります|降[ふ]って|降[ふ]り","o|この/問題[もんだい]は/簡単[かんたん]だと/思[おも]います|Menurut saya soal ini mudah.","m|A: 日本[にほん]の 生活[せいかつ]に ついて ___ 思[おも]いますか。 B: 楽[たの]しいと 思[おも]います。|Bagaimana pendapatmu tentang kehidupan di Jepang? Menurut saya menyenangkan.|どう|どんな|どれ|どこ"]},
{b:21,t:"～と 言いました",d:"Dipakai untuk menyampaikan ucapan orang. Kutipan langsung: tulis ucapannya persis di dalam 「 」, lalu <b>と 言いました</b>. Kutipan tidak langsung: ubah ucapannya ke bentuk biasa, lalu と 言いました. Orang yang diajak bicara ditandai <b>に</b> (先生に ～と 言いました).",
 ex:[["先生[せんせい]は 「明日[あした] 試験[しけん]を します」と 言[い]いました。","Guru berkata, \"Besok kita ujian.\""],["弟[おとうと]は おなかが 痛[いた]いと 言[い]いました。","Adik laki-laki bilang perutnya sakit."],["私[わたし]は 友達[ともだち]に 「ごめんなさい」と 言[い]いました。","Saya bilang \"maaf\" kepada teman."]],
 q:["m|兄[あに]は 明日[あした] 帰[かえ]る___ 言[い]いました。|Kakak laki-laki bilang dia pulang besok.|と|を|に|が","m|私[わたし]は 先生[せんせい]___ 「おはよう ございます」と 言[い]いました。|Saya mengucapkan \"selamat pagi\" kepada guru.|に|を|で|の","o|妹[いもうと]は/パーティーに/行[い]かないと/言[い]いました|Adik perempuan bilang dia tidak akan pergi ke pesta.|パーティーに/行[い]かないと/妹[いもうと]は/言[い]いました","m|アリさんは 試験[しけん]が ___と 言[い]いました。|Ali bilang ujiannya sulit.|難[むずか]しかった|難[むずか]しいだった|難[むずか]しかっただ|難[むずか]しくた"]},
{b:21,t:"～でしょう？ (meminta persetujuan)",d:"Diucapkan dengan intonasi naik untuk meminta lawan bicara membenarkan atau menyetujui sesuatu, mirip '..., kan?'. Polanya bentuk biasa + <b>でしょう？</b>; kata sifat-い tetap memakai い (暑いでしょう？), tetapi だ pada kata benda dan sifat-な dibuang (暇でしょう？, 雨でしょう？); bentuk lampaunya tetap だった (雨だったでしょう？).",
 ex:[["アリさんは 毎晩[まいばん] 遅[おそ]く 寝[ね]るでしょう？","Ali, kamu tiap malam tidur larut, kan?"],["日本[にほん]の 夏[なつ]は 暑[あつ]いでしょう？","Musim panas di Jepang panas, kan?"],["この 町[まち]は 静[しず]かでしょう？","Kota ini tenang, kan?"]],
 q:["m|この 公園[こうえん]は きれい___？|Taman ini indah, kan?|でしょう|だでしょう|なでしょう|いでしょう","m|昨日[きのう]、図書館[としょかん]へ ___でしょう？|Kemarin kamu pergi ke perpustakaan, kan?|行[い]った|行[い]く|行[い]って|行[い]き","o|あの/レストランの/料理[りょうり]は/おいしい/でしょう|Masakan restoran itu enak, kan?","m|A: 日本語[にほんご]の 勉強[べんきょう]は 大変[たいへん]___？ B: ええ、でも 楽[たの]しいです。|Belajar bahasa Jepang itu berat, kan? Iya, tapi menyenangkan.|でしょう|だでしょう|かったでしょう|くないでしょう"]},
{b:21,t:"Tempat で Acara が あります",d:"Untuk acara seperti pesta, rapat, festival, atau pertandingan, あります berarti 'diadakan'. Polanya: Tempat <b>で</b> Acara <b>が</b> あります. Bedakan dengan benda, yang memakai に (机の上に本があります); tempat acara memakai で.",
 ex:[["日曜日[にちようび]に 公園[こうえん]で お祭[まつ]りが あります。","Hari Minggu ada festival di taman."],["三時[さんじ]から 会議室[かいぎしつ]で 会議[かいぎ]が あります。","Mulai jam tiga ada rapat di ruang rapat."],["昨日[きのう] 学校[がっこう]で 野球[やきゅう]の 試合[しあい]が ありました。","Kemarin ada pertandingan bisbol di sekolah."]],
 q:["m|明日[あした]、大学[だいがく]___ パーティーが あります。|Besok ada pesta di kampus.|で|に|を|へ","m|今晩[こんばん]、ホテルで パーティー___ あります。|Malam ini ada pesta di hotel.|が|を|に|へ","o|駅[えき]の/前[まえ]で/お祭[まつ]りが/あります|Ada festival di depan stasiun.|お祭[まつ]りが/駅[えき]の/前[まえ]で/あります","m|A: 会議[かいぎ]は どこ___ ありますか。 B: 三階[さんがい]の 会議室[かいぎしつ]です。|Rapatnya diadakan di mana? Di ruang rapat lantai tiga.|で|に|を|が"]},
{b:22,t:"Klausa penjelas kata benda",d:"Penjelas kata benda diletakkan <b>di depan</b> kata bendanya, tanpa kata 'yang': 私が作ったケーキ = kue yang saya buat. Kata kerja di dalamnya memakai bentuk biasa, bukan ます: 眼鏡をかけている人 = orang yang memakai kacamata. Subjek di dalam penjelas ditandai <b>が</b>, bukan は. Kata sifat juga bisa ikut: 髪が長い人, 料理が上手な人.",
 ex:[["姉[あね]が 作[つく]った ケーキは とても おいしいです。","Kue yang dibuat kakak perempuan saya enak sekali."],["眼鏡[めがね]を かけて いる 男[おとこ]の 人[ひと]は 私[わたし]の 父[ちち]です。","Laki-laki yang memakai kacamata itu ayah saya."],["日本[にほん]で 買[か]った カメラは とても 便利[べんり]です。","Kamera yang saya beli di Jepang sangat praktis."]],
 q:["o|これは/私[わたし]が/生[う]まれた/町[まち]/です|Ini kota tempat saya lahir.","m|帽子[ぼうし]を ___ 人[ひと]は 誰[だれ]ですか。|Siapa orang yang memakai topi itu?|かぶって いる|かぶって います|かぶりて いる|かぶるって いる","m|これは 父[ちち]___ 撮[と]った 写真[しゃしん]です。|Ini foto yang diambil ayah.|が|は|で|へ","m|昨日[きのう] 学校[がっこう]に ___ 人[ひと]は 三人[さんにん]でした。|Ada tiga orang yang tidak datang ke sekolah kemarin.|来[こ]なかった|来[き]ませんでした|来[こ]ないでした|来[く]るなかった"]},
{b:22,t:"Bentuk kamus + 時間/約束/用事",d:"Bentuk kamus diletakkan di depan 時間 (waktu), 約束 (janji), atau 用事 (urusan) untuk menjelaskan isinya: 寝る時間 = waktu untuk tidur, 友達に会う約束 = janji bertemu teman, 郵便局へ行く用事 = urusan ke kantor pos. Biasanya diikuti あります atau ありません: 寝る時間がありません = tidak sempat tidur.",
 ex:[["忙[いそが]しいですから、テレビを 見[み]る 時間[じかん]が ありません。","Saya sibuk, jadi tidak sempat menonton TV."],["土曜日[どようび]は 兄[あに]と テニスを する 約束[やくそく]が あります。","Hari Sabtu saya ada janji main tenis dengan kakak laki-laki."],["午後[ごご] 銀行[ぎんこう]で お金[かね]を 下[お]ろす 用事[ようじ]が あります。","Siang nanti saya ada urusan mengambil uang di bank."]],
 q:["m|すみません、今日[きょう]は 病院[びょういん]へ ___ 用事[ようじ]が あります。|Maaf, hari ini saya ada urusan ke rumah sakit.|行[い]く|行[い]きます|行[い]って|行[い]き","o|新聞[しんぶん]を/読[よ]む/時間[じかん]が/ありません|Saya tidak sempat membaca koran.","m|今晩[こんばん]は 母[はは]に 電話[でんわ]を ___ 約束[やくそく]が あります。|Malam ini saya ada janji menelepon ibu.|かける|かけます|かけて|かけるの"]},
{b:23,t:"～とき、～",d:"<b>とき</b> = 'ketika/saat ...', disambung dengan bentuk biasa: 出かけるとき, 分からないとき, 寒いとき, 暇<b>な</b>とき, 子供<b>の</b>とき. Bentuk kamus + とき berarti tindakannya belum selesai: 日本へ行くとき = saat akan berangkat ke Jepang. Bentuk た + とき berarti tindakannya sudah selesai: 日本へ行ったとき = waktu sudah sampai di Jepang.",
 ex:[["子供[こども]の とき、よく 川[かわ]で 泳[およ]ぎました。","Waktu kecil, saya sering berenang di sungai."],["暇[ひま]な とき、よく マンガを 読[よ]みます。","Saat senggang, saya sering membaca manga."],["日本[にほん]へ 行[い]った とき、着物[きもの]を 買[か]いました。","Waktu ke Jepang, saya membeli kimono di sana."]],
 q:["m|雨[あめ]___ とき、タクシーで 会社[かいしゃ]へ 行[い]きます。|Saat hujan, saya pergi ke kantor naik taksi.|の|な|だ|で","m|ご飯[はん]を ___ とき、「いただきます」と 言[い]います。|Saat akan makan, kita mengucapkan \"itadakimasu\".|食[た]べる|食[た]べた|食[た]べて|食[た]べます","o|道[みち]を/渡[わた]る/とき、/気[き]をつけて/ください|Hati-hati saat menyeberang jalan.","m|お金[かね]が ___ とき、銀行[ぎんこう]へ 行[い]きます。|Saat tidak punya uang tunai, saya pergi ke bank.|ない|ありません|なくて|あらない"]},
{b:23,t:"Bentuk kamus + と、～ (kalau/setiap kali)",d:"Bentuk kamus + <b>と</b>、... = 'kalau/setiap kali ..., (pasti) ...'. Dipakai untuk akibat yang selalu atau otomatis terjadi, misalnya cara memakai mesin dan petunjuk jalan; bentuk ない juga bisa (入れないと). Bagian kedua <b>tidak boleh</b> berisi keinginan, ajakan, atau permintaan (～たい, ～ましょう, ～てください).",
 ex:[["春[はる]に なると、暖[あたた]かく なります。","Kalau musim semi tiba, udaranya menjadi hangat."],["この 道[みち]を まっすぐ 行[い]くと、左[ひだり]に 駅[えき]が あります。","Kalau Anda berjalan lurus menyusuri jalan ini, stasiun ada di sebelah kiri."],["お金[かね]を 入[い]れないと、切符[きっぷ]は 出[で]ません。","Kalau uangnya tidak dimasukkan, tiketnya tidak keluar."]],
 q:["m|あの 角[かど]を 左[ひだり]へ ___と、駐車場[ちゅうしゃじょう]が あります。|Kalau belok kiri di sudut itu, ada tempat parkir.|曲[ま]がる|曲[ま]がって|曲[ま]がった|曲[ま]がり","m|この スイッチを 押[お]すと、___。|Kalau tombol ini ditekan, air panas keluar.|お湯[ゆ]が 出[で]ます|お湯[ゆ]を 出[だ]して ください|お湯[ゆ]を 飲[の]みましょう|お湯[ゆ]が 飲[の]みたいです","o|この/橋[はし]を/渡[わた]ると/病院[びょういん]が/あります|Kalau menyeberangi jembatan ini, ada rumah sakit.","m|毎朝[まいあさ] コーヒーを ___と、元気[げんき]が 出[で]ません。|Kalau tidak minum kopi setiap pagi, saya tidak bersemangat.|飲[の]まない|飲[の]まなくて|飲[の]まなかった|飲[の]みない"]},
{b:23,t:"を + kata kerja gerak (橋を 渡ります)",d:"Pada kata kerja gerak seperti 渡ります, 歩きます, 散歩します, dan 曲がります, partikel <b>を</b> menandai <b>tempat yang dilewati</b>: 橋を渡ります = menyeberangi jembatan, 町を歩きます = berjalan menyusuri kota. Arah tujuannya tetap memakai へ: 角を右へ曲がります = belok kanan di sudut.",
 ex:[["毎晩[まいばん] 家[いえ]の 近[ちか]くを 散歩[さんぽ]します。","Setiap malam saya berjalan-jalan di sekitar rumah."],["この 道[みち]を まっすぐ 歩[ある]いて ください。","Silakan berjalan lurus menyusuri jalan ini."],["信号[しんごう]が 青[あお]の とき、道[みち]を 渡[わた]ります。","Kita menyeberang jalan saat lampu lalu lintas hijau."]],
 q:["m|車[くるま]に 気[き]を つけて、道[みち]___ 渡[わた]りましょう。|Ayo menyeberang jalan dengan hati-hati, awas mobil.|を|が|に|の","m|次[つぎ]の 交差点[こうさてん]___ 左[ひだり]へ 曲[ま]がって ください。|Tolong belok kiri di perempatan berikutnya.|を|に|へ|が","o|あの/橋[はし]を/渡[わた]って/ください|Tolong seberangi jembatan itu."]},

function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

function roots(w) {
  const out = new Set([w]), d = w.match(/^([a-z]+) \1(an)?$/); if (d) out.add(d[1]);
  for (const x of [...out]) for (const p of ['meng', 'meny', 'mem', 'men', 'me', 'ber', 'be']) {
    const r = x.startsWith(p) && x.slice(p.length); if (!r || !/^[a-z]{4,}$/.test(r)) continue;
    out.add(r); const sub = /^[aiueo]/.test(r) && { men: 't', mem: 'p', meng: 'k', meny: 's' }[p]; if (sub) out.add(sub + r);
  }
  for (const x of [...out]) { const s = x.match(/^([a-z]{4,}?)(kan|i|nya)$/); if (s) out.add(s[1]); }
  return [...out];
}

const splitMeaning = (m, sep = /[\/,;]/) => m.replace(/\([^)]*\)/g, p => p.replace(/[\/,;]/g, ' ')).split(sep);
function matchMeaning(input, meaning) {
  // laki2 = laki-laki = laki laki · 10.000 = 10000
  const n = s => s.toLowerCase().replace(/(\d)\.(?=\d{3})/g, '$1').replace(/[()]/g, ' ').replace(/([a-z]+)2\b/g, '$1 $1').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  const x = n(input); if (!x) return 0;
  // "berapa (harga)": "berapa" dan "berapa harga" sama-sama benar
  const alts = splitMeaning(meaning).flatMap(a => [n(a.replace(/\(.*?\)/g, '')), n(a)]).filter(Boolean).flatMap(a => [a, ...(SYN[a] || '').split('/').filter(Boolean)]);
  const xs = NUM[x] ? [NUM[x]] : roots(x), nos = s => s.replace(/ /g, ''); // di mana = dimana
  if (alts.some(a => nos(a) === nos(x) || roots(a).some(r => xs.includes(r)))) return 2;
  return alts.some(a => lev(a, x) <= (a.length > 8 ? 2 : a.length > 4 ? 1 : 0)) ? 1 : 0;
}
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const KR = Object.fromEntries('あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo ぁa ぃi ぅu ぇe ぉo'
  .split(' ').map(x => [x[0], x.slice(1)]));
function toRomaji(kanaStr) {
  // ungkapan ditulis per kata dengan spasi; partikel は/へ yang berdiri sendiri dibaca wa/e (おなまえ は → onamae wa)
  if (/\S\s+\S/.test(kanaStr)) return kanaStr.trim().split(/\s+/).map(t => t === 'は' ? 'wa' : t === 'へ' ? 'e' : toRomaji(t)).join(' ');
  const s = [...toHira(kanaStr)]; let out = '', dbl = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], nx = s[i + 1];
    if (ch === 'っ') { dbl = true; continue; }
    if (ch === 'ー') { out += out.slice(-1); continue; }
    let r = KR[ch] ?? ch;
    if ('ゃゅょ'.includes(nx || '_') && r.endsWith('i')) { const v = { ゃ: 'a', ゅ: 'u', ょ: 'o' }[nx]; r = /^(sh|ch|j)i$/.test(r) ? r.slice(0, -1) + v : r.slice(0, -1) + 'y' + v; i++; }
    if (dbl) { out += r[0]; dbl = false; }
    out += r;
  }
  return out.replace(/^(konnichi|konban)ha$/, '$1wa'); // は partikel dibaca "wa"
}
// samakan ejaan Hepburn/Kunrei: shi=si, chi=ti, tsu=tu, fu=hu, ja=zya, nn=n, ō=ou, shimbun=shinbun
const normR = s => s.toLowerCase().replace(/[āâ]/g, 'aa').replace(/[īî]/g, 'ii').replace(/[ūû]/g, 'uu').replace(/[ēê]/g, 'ee').replace(/[ōô]/g, 'ou').replace(/ei/g, 'ee')
  .replace(/[^a-z]/g, '').replace(/oo/g, 'ou').replace(/m(?=[bpm])/g, 'n').replace(/cch/g, 'tch').replace(/tch/g, 'tt').replace(/wo/g, 'o')
  .replace(/sh/g, 'sy').replace(/ch/g, 'ty').replace(/tsu/g, 'tu').replace(/j/g, 'zy').replace(/fu/g, 'hu')
  .replace(/([stz])yi/g, '$1i').replace(/nn(?![aiueoy])/g, 'n');

const shortV = s => s.replace(/ou/g, 'o').replace(/([aiueo])\1/g, '$1');
function matchReading(input, reading) {
  const x = input.replace(/\s+/g, ''); if (!x) return 0;
  reading = reading.replace(/～/g, ''); // akhiran seperti ～さん cukup dijawab さん
  const bare = t => toHira(t).replace(/[\s、。？！?!]/g, ''); // ungkapan: spasi & tanda baca tidak dinilai
  if (/[぀-ヿ]/.test(x)) { const a = bare(x), b = bare(reading); return a === b ? 2 : b.length > 3 && lev(a, b) <= 1 ? 1 : 0; }
  const a = normR(x), b = normR(toRomaji(reading));
  if (a === b || shortV(a) === shortV(b)) return 2; // arigato, gakko, kyo: ejaan tanpa vokal panjang umum dipakai
  return b.length > 4 && lev(a, b) <= 1 ? 1 : 0;
}

function autoGrade(score, secs, len) {
  if (!score) return 1;

  return secs <= 4 + len * .2 ? 4 : 3;
}

// grade: 1 Lupa, 2 Sulit, 3 Bagus, 4 Mudah. ivl dalam hari.
function schedule(card, g, now = Date.now()) {
  const c = { ease: 2.5, ivl: 0, reps: 0, lapses: 0, ...card };
  if (g === 1) {
    c.lapses++; c.reps = 0; c.ivl = 0; c.ease = Math.max(1.3, c.ease - .2); c.due = now + 10 * MIN; return c;
  }
  if (g === 2) { c.ivl = c.reps ? Math.max(c.ivl + 1, Math.round(c.ivl * 1.2)) : 1; c.ease = Math.max(1.3, c.ease - .15); }
  if (g === 3) c.ivl = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.max(c.ivl + 1, Math.round(c.ivl * c.ease));
  if (g === 4) { c.ivl = c.reps === 0 ? 3 : Math.max(c.ivl + 2, Math.round(c.ivl * c.ease * 1.3)); c.ease += .15; }
  c.reps++; c.due = now + c.ivl * DAY; return c;
}

  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  if (!local) schedulePush();
}
let S = load();
function rollDay() { if (S.day !== today()) { S.day = today(); S.newToday = 0; S.doneToday = 0; save(true); } }
function touchStreak() { const t = today(); if (S.lastDay === t) return; S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1; S.lastDay = t; }
const streak = () => (S.lastDay === today() || S.lastDay === yesterday()) ? S.streak : 0;
const xpFor = L => 40 * (L - 1) ** 2;
const level = xp => Math.floor(Math.sqrt(xp / 40)) + 1;
function addXP(n) { const b = level(S.xp); S.xp += n; if (level(S.xp) > b) { toast(`⬆️ Naik ke Level ${level(S.xp)}! すごい！`); confetti(); } }
function checkGoal() {
  if (S.doneToday >= S.goal && S.goalDay !== today()) { S.goalDay = today(); addXP(50); confetti(); toast('🎯 Target harian tercapai! +50 XP'); }
}

const relParts = k => { const m = k.rel.match(/^(.+?)\((.+?)\)\s*(.*)$/); return m ? { w: m[1], r: m[2], m: m[3] } : null; };
// Cara baca utama = bacaan yang dipakai saat kanji berdiri sendiri (七 = なな). Bacaan lain muncul di kata gabungan.
const MAIN_READ = { 一: 'いち', 二: 'に', 三: 'さん', 四: 'よん', 五: 'ご', 六: 'ろく', 七: 'なな', 八: 'はち', 九: 'きゅう', 十: 'じゅう', 百: 'ひゃく', 千: 'せん', 万: 'まん', 円: 'えん',
  分: 'ふん', 半: 'はん', 本: 'ほん', 語: 'ご', 天: 'てん', 下: 'した', 午: 'ご', 毎: 'まい', 年: 'ねん', 時: 'じ', 金: 'かね', 土: 'つち', 木: 'き', 水: 'みず', 火: 'ひ', 日: 'ひ' };
const readList = x => x === '—' ? [] : x.split(/,\s*/).map(r => toHira(r.replace(/[()]/g, '')));
const baseRead = k => MAIN_READ[k.c] || readList(k.kun)[0] || readList(k.on)[0];

// Kanji dalam konteks: cara baca yang ditanyakan & urutan munculnya mengikuti kata PERTAMA yang memakai kanji itu
// di urutan metode belajar (tema/bab). Contoh metode bab: 行 pertama muncul di 銀行員 (Bab 1), jadi dibaca こう.
const KBYC = Object.fromEntries(KANJI.map(k => [k.c, k]));
const DAKU = { か: 'が', き: 'ぎ', く: 'ぐ', け: 'げ', こ: 'ご', さ: 'ざ', し: 'じ', す: 'ず', せ: 'ぜ', そ: 'ぞ', た: 'だ', ち: 'ぢ', つ: 'づ', て: 'で', と: 'ど', は: 'ば', ひ: 'び', ふ: 'ぶ', へ: 'べ', ほ: 'ぼ' };
const HANDA = { は: 'ぱ', ひ: 'ぴ', ふ: 'ぷ', へ: 'ぺ', ほ: 'ぽ' };
function kanjiCands(k) { // [bentuk di dalam kata, bentuk yang ditampilkan, berubah bunyi?], terpanjang dulu
  const out = [], add = (surf, disp) => {
    out.push([surf, disp, false]);
    if (DAKU[surf[0]]) out.push([DAKU[surf[0]] + surf.slice(1), disp, true]);      // rendaku: ひ → び
    if (HANDA[surf[0]]) out.push([HANDA[surf[0]] + surf.slice(1), disp, true]);
    if (surf.length > 1 && 'つちくき'.includes(surf.slice(-1))) out.push([surf.slice(0, -1) + 'っ', disp, true]); // がく → がっ
  };
  if (k.on !== '—') k.on.split(/,\s*/).forEach(r => add(toHira(r), toHira(r)));
  if (k.kun !== '—') k.kun.split(/,\s*/).forEach(r => { const stem = toHira(r.replace(/\(.*$/, '')), full = toHira(r.replace(/[()]/g, '')); add(stem, full); if (full !== stem) add(full, full); });
  return out.sort((a, b) => b[0].length - a[0].length);
}
// cara baca kanji c di kata w (bacaan r): cocokkan huruf demi huruf; kanji di luar daftar boleh 1–4 kana.
// null kalau tidak bisa dipecah per kanji (今日 = きょう, 日本 = にほん)
function kanjiReadIn(w, r, c) {

/* ---------- grammar ---------- */
let GS = null;
function parseEx(s) {
  const [t, ...r] = s.split('|');
  return t === 'o' ? { t, tok: r[0].split('/'), tr: r[1], alt: r.slice(2) } : { t, q: r[0], tr: r[1], o: r.slice(2, 6) };
}
function initEx(i, e) {
  const ex = parseEx(GRAMMAR[i].q[e]);
  GS = { i, e, ex, res: null, tries: 0, sel: [], pick: null, showAns: false };
  if (ex.t === 'o') { let p; do p = shuffle(ex.tok.map((_, k) => k)); while (ex.tok.length > 2 && p.every((v, k) => v === k)); GS.pool = p; }
  else GS.opts = shuffle([0, 1, 2, 3]);
}
// urutan tampil pola: per bab di metode Bab, urutan asli di metode Tema (indeks tetap dipakai untuk progres)
const gOrder = () => { const ix = GRAMMAR.map((_, i) => i); return babMode() ? ix.sort((a, b) => GRAMMAR[a].b - GRAMMAR[b].b || a - b) : ix; };
function vGrammarList() {
  return `<div class="row"><h1>🧩 Grammar N5${helpBtn('grammar')}</h1><span class="sp"></span><span class="muted">${Object.keys(S.grammar).length}/${GRAMMAR.length} tuntas</span></div>
  <p class="muted">Satu pola per hari sudah cukup. Baca → dengarkan contoh → susun kalimat sendiri.${babMode() ? ' Urut sesuai bab Minna no Nihongo I.' : ''}</p>
  <div class="gl">${gOrder().map((i, n) => { const g = GRAMMAR[i]; return `<a class="gi ${S.grammar[i] ? 'done' : ''}" href="#grammar/${i}" style="animation:rise .35s ${n * .02}s both">
    <span class="n">${S.grammar[i] ? '✓' : n + 1}</span><div><div class="p">${g.t}</div><div class="muted" style="font-size:13px">📘 Bab ${g.b} · ${g.q.length} latihan</div></div></a>`; }).join('')}</div>`;
}
function vGrammar(arg) {
  const i = parseInt(arg);
  if (isNaN(i) || !GRAMMAR[i]) return vGrammarList();
  const g = GRAMMAR[i], ord = gOrder(), pos = ord.indexOf(i), nx = ord[pos + 1];
  if (!GS || GS.i !== i) initEx(i, 0);
  const done = GS.e >= g.q.length;
  let exHTML;
  if (done) {
    exHTML = `<div style="text-align:center;padding:20px"><div style="font-size:56px">🎊</div><h2>Pola ini tuntas!</h2>
      <div class="row" style="justify-content:center">${nx !== undefined ? `<a class="btn" href="#grammar/${nx}">Pola berikutnya →</a>` : ''}<button class="btn ghost" onclick="initEx(${i},0);render()">↺ Ulangi</button></div></div>`;
  } else {
    const ex = GS.ex, res = GS.res;
    if (ex.t === 'o') {
      exHTML = `<p class="muted">Susun kalimat: <b style="color:var(--text)">${esc(ex.tr)}</b></p>
        <div class="slot ${res || ''}" id="slot">${GS.sel.map((k, n) => `<button class="tok" onclick="unpickTok(${n})">${furi(ex.tok[k])}</button>`).join('') || '<span class="muted">Klik kepingan di bawah…</span>'}</div>
        <div class="pool">${GS.pool.map((k, n) => `<button class="tok" onclick="pickTok(${n})">${furi(ex.tok[k])}</button>`).join('')}</div>
        ${GS.showAns ? `<div class="ex"><span class="jp">${furi(ex.tok.join(''))}</span></div>` : ''}`;
    } else {
      const filled = GS.pick !== null ? `<span class="blank">${furi(ex.o[GS.pick])}</span>` : '<span class="blank">？</span>';
      exHTML = `<p class="muted">Pilih yang tepat: <b style="color:var(--text)">${esc(ex.tr)}</b></p>
        <div class="jp" id="slot" style="font-size:24px;text-align:center;padding:10px">${furi(ex.q).replace('___', filled)}</div>
        <div class="opts">${GS.opts.map(k => `<button class="opt ${GS.pick === k ? (k === 0 ? 'ok' : 'bad') : res === 'ok' && k === 0 ? 'ok' : ''}" onclick="pickOpt(${k})">${furi(ex.o[k])}</button>`).join('')}</div>`;
    }
    exHTML += `<div class="row" style="margin-top:14px">
      ${res === 'ok' ? `<b style="color:var(--good)">✓ 正解！Benar!</b><span class="sp"></span><button class="btn" onclick="nextEx()">Lanjut →</button>`
        : `${res === 'bad' ? `<b style="color:var(--bad)">✗ Belum tepat, coba lagi</b>` : ''}<span class="sp"></span>
           ${GS.tries >= 1 && ex.t === 'o' && !GS.showAns ? `<button class="btn ghost" onclick="GS.showAns=true;render()">Lihat jawaban</button>` : ''}
           ${ex.t === 'o' ? `<button class="btn" onclick="checkTok()" ${GS.pool.length ? 'disabled style="opacity:.5"' : ''}>Periksa</button>` : ''}`}
    </div>`;
  }
  return `<a href="#grammar" class="muted" style="text-decoration:none">← Semua pola</a>
  <div class="grid g2" style="margin-top:10px;align-items:start">
    <div class="card"><span class="chip">Pola ${pos + 1} / ${GRAMMAR.length}</span> <span class="chip">📘 Bab ${g.b}</span><div><span class="pat">${g.t}</span></div>
      <p>${g.d}</p>
      ${g.ex.map(([jp, id]) => `<div class="ex"><div class="row"><span class="jp">${furi(jp)}</span><span class="sp"></span>${spk(kana(jp))}</div><div class="muted">${esc(id)}</div></div>`).join('')}
    </div>
    <div class="card" id="exc"><div class="row"><h2>✍️ Latihan${helpBtn('grammar')}</h2><span class="sp"></span><span class="muted">${Math.min(GS.e + 1, g.q.length)} / ${g.q.length}</span></div>
      <div class="prog"><i style="width:${GS.e / g.q.length * 100}%"></i></div>${exHTML}</div>
  </div>`;
}
function pickTok(n) { if (GS.res === 'ok') return; GS.sel.push(GS.pool.splice(n, 1)[0]); GS.res = null; render(); }
function unpickTok(n) { if (GS.res === 'ok') return; GS.pool.push(GS.sel.splice(n, 1)[0]); GS.res = null; render(); }
function checkTok() {
  const ex = GS.ex, ans = GS.sel.map(k => ex.tok[k]).join('/');
  const ok = ans === ex.tok.join('/') || ex.alt.includes(ans);
  exResult(ok, kana(ex.tok.join('')));
}
function pickOpt(k) {
  if (GS.res === 'ok') return;
  GS.pick = k; exResult(k === 0, kana(GS.ex.q.replace('___', GS.ex.o[0])).replace(/^.*→/, '').replace(/[A-Z]:/g, ''));
}
function exResult(ok, say) {

}
