<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nihongo Dojo</title>
<meta name="description" content="Belajar kosakata, kanji, dan grammar JLPT N5 dengan spaced repetition.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf2f8;--bg2:#eee8ff;--glass:rgba(255,255,255,.72);--solid:#fff;--line:rgba(90,50,140,.14);
  --text:#2a1840;--muted:#6f5d8c;--pink:#ff4f93;--violet:#7b5cff;--cyan:#12b5c4;--good:#12a974;--bad:#e93b63;--warn:#e8950c;
  --shadow:0 2px 10px rgba(60,20,100,.10);
  --grad:linear-gradient(135deg,#ff4f93,#7b5cff);--grad2:linear-gradient(135deg,#12b5c4,#7b5cff);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130b24;--bg2:#1f1240;--glass:rgba(255,255,255,.06);--solid:#241a3d;--line:rgba(255,255,255,.1);
  --text:#f5efff;--muted:#b3a3d3;--good:#3ddc97;--bad:#ff5c7a;--warn:#ffb84d;
  --shadow:0 2px 12px rgba(0,0,0,.35);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#130b24;--bg2:#1f1240;--glass:rgba(255,255,255,.06);--solid:#241a3d;--line:rgba(255,255,255,.1);
  --text:#f5efff;--muted:#b3a3d3;--good:#3ddc97;--bad:#ff5c7a;--warn:#ffb84d;
  --shadow:0 2px 12px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--text);font:16px/1.55 'Plus Jakarta Sans','Noto Sans JP',system-ui,sans-serif;background:var(--bg);overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 0% 0%,rgba(255,79,147,.22),transparent 60%),
             radial-gradient(800px 520px at 100% 15%,rgba(123,92,255,.26),transparent 60%),
             radial-gradient(700px 500px at 50% 110%,rgba(18,181,196,.16),transparent 60%),
             linear-gradient(180deg,var(--bg),var(--bg2))}
.jp,ruby,.big,.kchar{font-family:'Noto Sans JP',sans-serif}
h1,h2,h3{font-family:'Zen Maru Gothic','Plus Jakarta Sans',sans-serif;margin:0 0 .4em;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
rt{font-size:.45em;color:var(--muted);-webkit-text-fill-color:var(--muted);font-weight:500}
body.nofuri rt{visibility:hidden}


/* header / nav */
header{position:sticky;top:0;z-index:20;
  background:var(--solid);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;white-space:nowrap}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#fff;
  font:900 20px 'Noto Sans JP';box-shadow:0 6px 18px rgba(255,79,147,.45);transform:rotate(-6deg)}
.brand small{display:block;font:500 11px 'Noto Sans JP';color:var(--muted)}
nav{display:flex;gap:4px;margin-left:auto}
nav a{position:relative;text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:.2s}
nav a:hover{color:var(--text);background:var(--glass)}
nav a.on{color:#fff;background:var(--grad);box-shadow:0 6px 18px rgba(123,92,255,.4)}
nav a .ic{margin-right:6px}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;
  font-size:11px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--solid)}
.tools{display:flex;gap:6px}
.tbtn{width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font:700 15px 'Noto Sans JP';transition:.2s}
.tbtn:hover{transform:translateY(-2px)}
.tbtn.off{opacity:.45;text-decoration:line-through}
.tbtn.on{background:var(--grad);color:#fff;border-color:transparent}
@media (max-width:400px){.tbtn{width:34px;height:34px}.brand small{display:none}}
@media (max-width:760px){
  nav{position:fixed;bottom:0;left:0;right:0;margin:0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:var(--solid);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.12);z-index:30}
  nav a{display:flex;flex-direction:column;align-items:center;padding:6px 8px;font-size:10.5px;border-radius:14px}
  nav a .ic{margin:0;font-size:19px}
  main{padding-bottom:96px!important}
  .tools{margin-left:auto}
}

main{position:relative;z-index:1;max-width:1080px;margin:auto;padding:24px 16px 48px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:16px;font-weight:800;
  color:#fff;background:var(--grad);box-shadow:0 8px 22px rgba(255,79,147,.35),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,box-shadow .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,79,147,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.alt{background:var(--grad2);box-shadow:0 8px 22px rgba(18,181,196,.3)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.big{font-size:19px;padding:18px 30px;border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.spk{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--grad2);color:#fff;font-size:15px;box-shadow:0 4px 12px rgba(18,181,196,.35);flex:none;transition:.15s}
.spk:hover{transform:scale(1.12)}

/* home */
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;overflow:hidden;position:relative}
.hero:after{content:'学';position:absolute;right:-10px;bottom:-60px;font:900 220px 'Noto Sans JP';opacity:.06;pointer-events:none}
.lvl{width:84px;height:84px;border-radius:26px;background:var(--grad);color:#fff;display:grid;place-items:center;text-align:center;
  box-shadow:0 12px 30px rgba(123,92,255,.45);transform:rotate(-4deg);flex:none}
.lvl b{font-size:32px;line-height:1}.lvl small{font-size:11px;opacity:.85;display:block}
.xpbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s}
.stat{display:flex;gap:14px;align-items:center}
.stat .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none}
.stat b{font-size:26px;display:block;line-height:1.1}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap span{position:absolute;font-weight:800;font-size:18px}
ol.method{padding-left:20px;margin:0}ol.method li{margin:6px 0}
select{font:inherit;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--solid);color:var(--text)}

/* review */
.rv{max-width:640px;margin:auto;width:100%}
main.wide{max-width:1480px}
.rvgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.rvgrid .rv{order:-1}
@media (min-width:1100px){
  .rvgrid{grid-template-columns:minmax(0,1fr) minmax(0,600px) minmax(0,1fr);align-items:start}
  .rvgrid .rv{grid-column:2;grid-row:1;margin:0 auto}.side-l{grid-column:1;grid-row:1}.side-r{grid-column:3;grid-row:1}
  .side{margin-top:38px;padding:26px;font-size:17px}
  .side h3{font-size:21px}
  .side .lbl{font-size:12.5px}
  .side .xw{font-size:60px}.side .xm{font-size:28px}.side .xr{font-size:22px}
  .side .kc{font-size:16px}.side .kc b{font-size:26px}
  .side .ex .jp,.side .rdg b{font-size:21px}
}
aside:empty{display:none}
.side{padding:18px;animation:up .35s both}
.side h3{font-size:17px;margin-bottom:10px}
.xw{font-size:36px;font-weight:700;line-height:1.2}.xm{display:block;font-size:20px;font-weight:800;line-height:1.3}.xr{display:block;font-size:18px}
.kvg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 20px}
.kv{margin-top:12px}.kv.full{grid-column:1/-1}
.kc{display:inline-flex;gap:6px;align-items:center;margin:4px 6px 0 0;padding:4px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:14px}
.kc b{font:700 20px 'Noto Sans JP'}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--grad);transition:width .4s}
.qcard{text-align:center;padding:34px 22px;position:relative}
.big{font-size:clamp(52px,13vw,92px);font-weight:700;line-height:1.25;margin:10px 0 6px;text-shadow:0 6px 30px rgba(123,92,255,.25)}
.big.id{font:800 clamp(28px,7vw,40px) 'Plus Jakarta Sans'}
.tag{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:-20px -8px 24px}
.tag .mode{margin:0;gap:6px;padding:4px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.tag .mode span{font-size:10px;padding:0 5px;border-radius:6px}
.tag>span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--line)}
.tag .new{background:var(--grad);color:#fff}
.tag>span,.tag .mode{display:inline-flex;align-items:center;height:28px}
.tag .mode .ib{width:20px;height:20px;margin-left:2px;font-size:11px}
.ans{margin-top:16px;display:flex;gap:8px}
.ans input{flex:1;min-width:0;font:600 17px 'Plus Jakarta Sans';padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--solid);color:var(--text);outline:none;transition:.2s}
.ans input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(123,92,255,.18)}
.ans input.ok{border-color:var(--good);background:rgba(18,169,116,.1)}
.ans input.bad{border-color:var(--bad);background:rgba(233,59,99,.08)}
.reveal{margin-top:18px;padding:18px;border-radius:20px;background:var(--solid);border:1px solid var(--line);text-align:left;animation:up .35s cubic-bezier(.2,1.2,.4,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.reveal .mean{font-size:22px;font-weight:800}
.ex{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--glass);border-left:4px solid var(--pink)}
.ex .jp{font-size:19px}
.mn{margin-top:10px;padding:12px 14px;border-radius:14px;background:rgba(245,165,36,.12);border-left:4px solid var(--warn)}
.vd{margin-top:16px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;color:#fff;text-align:left;animation:up .35s both}
.vd .vi{font-size:30px;line-height:1}.vd b{font-size:20px;display:block}.vd small{opacity:.92}
.v1{background:linear-gradient(135deg,#ff5c7a,#e2335a)}.v2{background:linear-gradient(135deg,#ffb84d,#f08a00)}
.v3{background:linear-gradient(135deg,#3ddc97,#10a86f)}.v4{background:linear-gradient(135deg,#4fc3ff,#6a5cff)}
.linkbtn{font-size:13px;color:var(--muted);text-decoration:underline;margin-top:8px}
.mode{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border-radius:999px;font-weight:800;font-size:14px;margin-top:6px}
.mode span{font:900 13px 'Noto Sans JP';padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.35)}
.m-mean{background:rgba(18,181,196,.16);color:var(--cyan)}.m-jp{background:rgba(255,79,147,.16);color:var(--pink)}.m-romaji{background:rgba(232,149,12,.18);color:var(--warn)}
.lbl{display:block;font:800 11px 'Plus Jakarta Sans';letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.rdg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rdg>div{padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.rdg b{font-size:18px}
details.info{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:14px;background:rgba(123,92,255,.08)}
details.info summary{cursor:pointer;color:var(--violet);font-weight:700}
details.info p{margin:6px 0}
/* tombol ? keterangan + isi modal keterangan */
.ib{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:6px;border-radius:50%;font:800 12px 'Plus Jakarta Sans',sans-serif;color:var(--violet);background:rgba(123,92,255,.14);vertical-align:middle;flex:none}
.ib:hover{background:var(--violet);color:#fff}
.vd .ib{color:#fff;background:rgba(255,255,255,.3)}
.modal .card.help{max-width:620px}
.help table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
.help th,.help td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.help ul{margin:6px 0;padding-left:18px}.help li{margin:4px 0}
/* grammar: rumus kalimat, contoh susunan, arti singkatan, kenapa-pakai, penjelasan detail */
.rumus{margin:12px 0;padding:12px 14px;border-radius:16px;background:rgba(123,92,255,.08);border:1px solid var(--line)}
.rm{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:7px 0}
.rr{padding:3px 9px;border-radius:8px;background:var(--grad);color:#fff;font-weight:800;font-size:13px}
.rj{padding:2px 9px;border-radius:8px;background:var(--solid);border:1px solid var(--line);font:700 16px 'Noto Sans JP',sans-serif}
.rp{color:var(--muted);font-weight:800}
.rcx{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.rcx .jp{font-size:17px;margin-left:4px}
.ist{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.ist td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.ist td:first-child{width:1%;white-space:nowrap}
.whyk table{width:100%;border-collapse:collapse;font-size:14.5px;margin:4px 0 12px}
.whyk td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
.whyk td:first-child{white-space:nowrap;width:1%;font:700 16px 'Noto Sans JP',sans-serif;color:var(--pink)}
.gx{margin:4px 0 12px;padding-left:22px;font-size:14.5px;line-height:1.65}.gx li{margin:8px 0;padding-left:2px}.gx li::marker{color:var(--violet);font-weight:800}
.gsec{margin-top:22px}.gsec>.lbl{font-size:12px;margin-bottom:8px}
.lead{font-size:16px;line-height:1.6;margin:12px 0 4px}
.box{margin:10px 0;padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.65;border:1px solid var(--line)}
.box>b:first-child{display:block;margin-bottom:4px}
.box.warn{background:rgba(233,59,99,.07);border-color:rgba(233,59,99,.25)}.box.warn>b:first-child{color:var(--bad)}
.box.tip{background:rgba(232,149,12,.09);border-color:rgba(232,149,12,.28)}.box.tip>b:first-child{color:var(--warn)}
.box p{margin:4px 0}
.xx{color:var(--bad);font-weight:800}.okx{color:var(--good);font-weight:800}
/* partikel berwarna: は pink, の ungu, lainnya cyan */
.pt{color:var(--cyan);font-weight:800}.pt.wa{color:var(--pink)}.pt.no{color:var(--violet)}
.ptl{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:0 0 4px}
details.pk{margin:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:14.5px;line-height:1.65}
details.pk summary{cursor:pointer;padding:11px 14px;font-weight:800}
details.pk>div{padding:0 14px 12px}details.pk p{margin:6px 0}
details.pk table{width:100%;border-collapse:collapse;margin:6px 0}
details.pk td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
details.pk td:first-child{width:40%;font-size:13.5px;color:var(--muted)}
details.pk td small{display:block;color:var(--muted)}
@media (min-width:761px){#exc{position:sticky;top:84px}}
.kb{margin-top:12px;padding:8px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.kbg{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.kbf{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr 1.3fr 2fr;gap:4px;margin-top:6px}
.kk{font:600 17px 'Noto Sans JP';padding:7px 0;border-radius:10px;background:var(--solid);border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.kk:active{transform:translateY(2px);box-shadow:none}
.kk.ok{background:var(--grad);color:#fff;border:0;font:800 14px 'Plus Jakarta Sans'}
@media (max-width:480px){.kk{font-size:14px;padding:6px 0;border-radius:8px}.kbg,.kbf{gap:3px}}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.verdict{font-weight:800;margin-top:10px}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* vocab flip cards */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.fcg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.fc{height:200px;perspective:1000px;cursor:pointer}
.fc-in{position:relative;height:100%;transition:transform .65s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.fc.on .fc-in{transform:rotateY(180deg)}
.fc:hover .fc-in{box-shadow:none}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line)}
.fc-f{background:var(--solid)}
.fc-f .w{font:700 34px 'Noto Sans JP'}
.fc-b{transform:rotateY(180deg);background:var(--grad);color:#fff;gap:6px}
.fc-b rt{color:#ffe;-webkit-text-fill-color:#ffe}
.fc-b .m{font-weight:800;font-size:18px}
.fc-b .e{font-size:12.5px;opacity:.95}
.dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--warn);box-shadow:0 0 10px var(--warn)}.dot.m{background:var(--good);box-shadow:0 0 10px var(--good)}

/* kanji */
.kg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.kt{aspect-ratio:1;border-radius:20px;background:var(--solid);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:var(--shadow);transition:.2s}
.kt:hover{transform:translateY(-4px) rotate(-2deg);border-color:var(--pink)}
.kt .kchar{font-size:38px;font-weight:700;line-height:1.1}
.kt small{font-size:11px;color:var(--muted);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt.l{border-color:var(--warn)}.kt.m{border-color:var(--good);background:linear-gradient(160deg,var(--solid),rgba(18,169,116,.15))}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,5,25,.6);display:grid;place-items:center;padding:16px;animation:rise .25s}

.kbig{font:900 110px/1 'Noto Sans JP';text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0}

/* grammar */
.gl{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gi{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);transition:.2s;text-decoration:none}
.gi:hover{transform:translateY(-3px);border-color:var(--violet)}
.gi .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--line);font-weight:800;flex:none}
.gi.done .n{background:var(--grad);color:#fff}
.gi .p{font:700 17px 'Noto Sans JP'}
.pat{display:inline-block;font:700 22px 'Noto Sans JP';padding:10px 18px;border-radius:16px;background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(123,92,255,.35);margin:6px 0 12px}
.slot{min-height:64px;border-radius:18px;border:2px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;transition:.2s}
.slot.ok{border-color:var(--good);border-style:solid;background:rgba(18,169,116,.1)}
.slot.bad{border-color:var(--bad);border-style:solid}
.tok{font:600 19px 'Noto Sans JP';padding:8px 14px;border-radius:14px;background:var(--solid);border:1px solid var(--line);box-shadow:0 4px 0 var(--line);transition:.12s}
.tok:hover{transform:translateY(-2px)}
.tok:active{transform:translateY(2px);box-shadow:none}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--pink);margin:0 4px;text-align:center;color:var(--pink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{padding:14px;border-radius:16px;background:var(--solid);border:2px solid var(--line);font:600 18px 'Noto Sans JP';transition:.15s;box-shadow:0 4px 0 var(--line)}
.opt:hover{border-color:var(--violet);transform:translateY(-2px)}
.opt.ok{border-color:var(--good);background:rgba(18,169,116,.15)}
.opt.bad{border-color:var(--bad);background:rgba(233,59,99,.12)}
.opt .k{font:800 11px 'Plus Jakarta Sans';color:var(--muted);margin-right:6px}

/* quiz */
.timer{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--grad2);transition:width .1s linear}
.combo{font:900 22px 'Plus Jakarta Sans';background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.score{font:900 64px 'Plus Jakarta Sans';line-height:1}

/* toast + confetti */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);opacity:0;z-index:100;background:var(--solid);color:var(--text);border:1px solid var(--line);
  padding:12px 20px;border-radius:16px;box-shadow:var(--shadow);font-weight:700;transition:.35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:760px){#toast{bottom:92px}}

/* mini player musik */
#dock{position:fixed;left:16px;bottom:16px;z-index:40;display:flex;gap:10px;align-items:center;padding:8px;border-radius:18px;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
#dock:not(.show){display:none}
.dk{min-width:0}.dk b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dk small{color:var(--muted);font-size:12px}
body.music main{padding-bottom:130px}
@media (max-width:760px){#dock{bottom:calc(76px + env(safe-area-inset-bottom))}#dock .tbtn{width:34px;height:34px}body.music main{padding-bottom:200px!important}}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

 q:["o|これ/は/何[なん]/です/か|Ini apa?", "m|トイレは どこです___。|Toilet di mana?|か|が|を|の", "o|ハサンさん/は/会社員[かいしゃいん]/です/か|Apakah Pak Hasan karyawan perusahaan?", "o|あの人[ひと]/は/だれ/です/か|Orang itu siapa?", "m|アリさんは 研究者[けんきゅうしゃ]___か。|Apakah Pak Ali peneliti?|です|じゃ|の|は", "m|A：リナちゃんは ___ですか。 B：7歳[さい]です。|A: Dik Rina umur berapa? B: 7 tahun.|何歳[なんさい]|だれ|学生[がくせい]|日本人[にほんじん]", "o|はい、/私[わたし]は/教師[きょうし]/です|(Ditanya: Apakah Anda guru?) Ya, saya guru.", "m|A：アリさんは 医者[いしゃ]ですか。 B：___、医者[いしゃ]じゃ ありません。|A: Apakah Pak Ali dokter? B: Bukan, dia bukan dokter.|いいえ|はい|です|か"]},
{b:1,t:"A の B",d:"<b>の</b> menghubungkan dua kata benda: kepemilikan (\"B milik A\") atau penjelas (\"B tentang A\"). Urutannya selalu A + の + B: penjelas di depan, inti di belakang.",
 r:["KB1 + の + KB2", "S + は + KB1 + の + KB2 + です"],
 s:"S + は + KB1 + の + KB2 + です → ハサンさんは 大学[だいがく]の 先生[せんせい]です。",
 k:[["の", "Penghubung dua kata benda. KB1 di depan の menerangkan KB2 di belakangnya, misalnya milik siapa atau dari lembaga mana. Dua kata benda biasanya tidak bisa dijejerkan begitu saja tanpa の."], ["KB1 (penjelas)", "Kata benda yang menerangkan, misalnya pemilik atau tempat kerja. Letaknya selalu di depan の: 大学[だいがく]の 先生[せんせい] = dosen universitas."], ["KB2 (inti)", "Kata benda utama, yaitu orang atau benda yang sebenarnya dibicarakan. Letaknya selalu di belakang の."], ["だれの", "Gabungan だれ + の untuk bertanya \"... siapa\": だれの 先生[せんせい]ですか (guru siapa?)."]],
 x:["<b>KB1 の KB2</b> membentuk satu frasa benda. Intinya KB2, sedangkan KB1 hanya menerangkan. 大学[だいがく]の 先生[せんせい] adalah seorang dosen, jadi intinya 先生[せんせい].", "Penjelas (KB1) selalu di depan の, kata inti (KB2) di belakang: 大学[だいがく]の 先生[せんせい] = dosen universitas. Intinya adalah 先生[せんせい], sedangkan 大学[だいがく] menjelaskan dosen yang mana.", "Di Bab 1, の sering dipakai untuk menyebut tempat seseorang bekerja atau belajar: ABCの 社員[しゃいん] (karyawan ABC), さくら病院[びょういん]の 医者[いしゃ] (dokter Rumah Sakit Sakura). Kata 社員[しゃいん] hampir selalu dipakai bersama nama perusahaan seperti ini.", "の juga menyatakan milik atau hubungan: 私[わたし]の 先生[せんせい] (guru saya), あなたの 先生[せんせい] (guru Anda). Untuk bertanya, pakai だれの: あの人[ひと]は だれの 先生[せんせい]ですか。", "Kesalahan umum: membalik urutan KB1 dan KB2. 先生[せんせい]の 大学[だいがく] artinya \"universitas si dosen\", jadi untuk \"dosen universitas\" yang benar adalah 大学[だいがく]の 先生[せんせい].", "の bisa dipakai lebih dari sekali: 私[わたし]の 大学[だいがく]の 先生[せんせい] (dosen di universitas saya). Untuk menerjemahkannya, baca dari belakang: 先生[せんせい] → 大学[だいがく] → 私[わたし]."],
 ex:[["私[わたし]の 本[ほん]です。", "Buku saya."], ["日本語[にほんご]の 先生[せんせい]", "Guru bahasa Jepang"]],
 q:["o|これ/は/私[わたし]/の/かばん/です|Ini tas saya.", "m|それは 誰[だれ]___ 傘[かさ]ですか。|Itu payung siapa?|の|は|に|を", "o|リナさんは/あおば大学[だいがく]/の/学生[がくせい]/です|Mbak Rina mahasiswi Universitas Aoba.", "o|ハサンさんは/みどり病院[びょういん]/の/医者[いしゃ]/です|Pak Hasan dokter di Rumah Sakit Midori.", "m|ブディさんは 大学[だいがく]___ 先生[せんせい]です。|Pak Budi dosen universitas.|の|は|も|です", "m|トムさんは ___です。|Pak Tom dosen Universitas Indonesia.|インドネシア大学[だいがく]の 先生[せんせい]|先生[せんせい]の インドネシア大学[だいがく]|インドネシア大学[だいがく]は 先生[せんせい]|先生[せんせい]は インドネシア大学[だいがく]", "o|あなた/の/先生[せんせい]/は/だれ/ですか|Guru Anda siapa?", "m|A：あの人[ひと]は ___ 先生[せんせい]ですか。 B：ブディさんの 先生[せんせい]です。|A: Orang itu guru siapa? B: Guru Pak Budi.|だれの|だれ|だれは|だれも"]},
{b:2,t:"これ・それ・あれ・どれ",d:"<b>これ</b> dekat pembicara, <b>それ</b> dekat lawan bicara, <b>あれ</b> jauh dari keduanya, <b>どれ</b> = yang mana.",
 r:["これ/それ/あれ + は + KB + です", "これ/それ/あれ + は + 何[なん] + ですか", "KB + は + どれ + ですか"],
 s:"これ + は + P + です → これは 辞書[じしょ]です。",
 k:[["これ", "\"Ini\": benda yang dekat dengan pembicara. Berdiri sendiri sebagai kata benda, jadi bisa langsung diberi は."], ["それ", "\"Itu\": benda yang dekat dengan lawan bicara, misalnya benda yang sedang dipegang temanmu."], ["あれ", "\"Itu (di sana)\": benda yang jauh dari pembicara maupun lawan bicara."], ["どれ", "Kata tanya \"yang mana\" untuk memilih satu dari beberapa benda. Sebagai kata tanya, どれ tidak diberi は; letakkan di posisi P: あなたの 傘[かさ]は どれですか."], ["は", "Menandai これ/それ/あれ sebagai S. Sesudahnya datang P (kata benda) dan です."]],
 x:["Bahasa Jepang punya tiga kata penunjuk: <b>これ</b> (dekat saya), <b>それ</b> (dekat kamu), <b>あれ</b> (jauh dari kita berdua). Pilihannya ditentukan oleh posisi benda terhadap pembicara dan lawan bicara.", "Cara menyusun: これ/それ/あれ + は + KB + です. Untuk bertanya \"ini apa?\", ganti KB dengan 何[なん]: それは 何[なん]ですか.", "Dalam percakapan, kata penunjuknya berganti mengikuti posisi. Kalau temanmu bertanya それは 何[なん]ですか tentang benda yang kamu pegang, jawablah これは ～です.", "これ, それ, dan あれ menggantikan kata benda, jadi tidak bisa langsung diikuti kata benda lain (これ 本[ほん] ✗). Untuk \"buku ini\" pakai この 本[ほん]. Untuk menunjuk orang, lebih sopan memakai この人[ひと] atau あの人[ひと] daripada これ atau あれ.", "Kesalahan umum: memberi は pada どれ (どれは ✗). Letakkan どれ di posisi P: ハサンさんの かばんは どれですか (tas Pak Hasan yang mana?). Di latihan kamu juga akan melihat どれが ～ですか; partikel が di situ baru dibahas di bab yang lebih lanjut."],
 ex:[["これは 何[なん]ですか。", "Ini apa?"], ["それは 時計[とけい]です。", "Itu jam."], ["あれは 山[やま]です。", "Itu (di sana) gunung."]],
 q:["m|___は 駅[えき]です。|Itu (di sana, jauh dari kita berdua) stasiun.|あれ|これ|それ|どれ", "m|___が あなたの 傘[かさ]ですか。|Yang mana payungmu?|どれ|これ|あれ|それ", "o|それ/は/私[わたし]/の/ペン/です|Itu pena saya.", "o|これは/ハサンさんの/名刺[めいし]/です|Ini kartu nama Pak Hasan.", "o|あれ/は/だれ/の/かばん/ですか|Itu (yang di sana) tas siapa?", "m|A：___は 何[なん]ですか。 B：それは インドネシアの お土産[みやげ]です。|A: Ini (yang saya pegang) apa? B: Itu oleh-oleh dari Indonesia.|これ|それ|あれ|どれ", "m|A：ブディさんの 車[くるま]は ___ですか。 B：あれです。|A: Mobil Pak Budi yang mana? B: Yang itu (di sana).|どれ|何[なん]|だれ|この", "o|それは/コンピューター/の/雑誌[ざっし]/ですか|Apakah itu (yang di dekatmu) majalah komputer?"]},
{b:6,t:"Objek を Kata kerja",d:"<b>を</b> (dibaca <b>o</b>) menandai objek. Kata kerja selalu di akhir kalimat: S – O – K.",
 r:["S + は + O + を + KK-ます", "S + は + K-waktu + O + を + KK-ました/ませんでした", "S + は + 何[なに] + を + KK-ます + か"],
 s:"S + は + O + を + P → 私[わたし]は パンを 買[か]います。",
 k:[["は", "Menandai S (topik), yaitu orang yang dibicarakan dan melakukan kegiatan. Ditulis は tetapi dibaca wa. Kalau pelakunya sudah jelas, 私[わたし]は sering tidak diucapkan."], ["を", "Menandai O (objek), yaitu benda yang dikenai kegiatan. Kata kerja seperti makan, minum, membaca, dan membeli butuh sasaran (makan apa? membeli apa?), dan sasaran itu diberi を. Ditulis を, dibaca o."], ["KK-ます", "Menjadi P (predikat) dan selalu diletakkan paling akhir, setelah objek. Bentuk ます membuat kalimat sopan dan dipakai untuk kebiasaan atau rencana."], ["何[なに]を ～か", "Untuk menanyakan objek, ganti bendanya dengan 何[なに] (apa), tetap pakai を, lalu tambahkan か di akhir: 何[なに]を 買[か]いますか (membeli apa?)."]],
 x:["<b>Fungsi:</b> を menandai benda yang dikenai kegiatan, yaitu O. O + を selalu datang <b>sebelum</b> kata kerja: <b>コーヒーを</b> 飲[の]みます (minum kopi).", "<b>Cara menyusun:</b> (1) S + は: 私[わたし]は; (2) keterangan waktu kalau ada: 毎晩[まいばん]; (3) benda + を: テレビを; (4) kata kerja di akhir: 見[み]ます. Hasilnya: 私[わたし]は 毎晩[まいばん] テレビを 見[み]ます。", "<b>Variasi:</b> 飲[の]みます (minum) → 飲[の]みません (tidak minum) → 飲[の]みました (minum, lampau) → 飲[の]みませんでした (tidak minum, lampau). Untuk bertanya cukup tambahkan か: ジュースを 飲[の]みますか。", "<b>Kesalahan umum:</b> menaruh kata kerja di tengah, misalnya 私[わたし]は 飲[の]みます コーヒーを ✗. Kata kerja harus di akhir. Jangan juga memakai を untuk tempat tujuan: 学校[がっこう]を 行[い]きます salah, yang benar 学校[がっこう]へ 行[い]きます.", "<b>Perhatikan 会[あ]います:</b> orang yang ditemui diberi に, bukan を: 友達[ともだち]に 会[あ]います (bertemu teman).", "<b>Tips:</b> tanyakan 'apa?' pada kata kerjanya. Kalau jawabannya benda (makan apa? → roti), benda itu diberi を."],
 ex:[["パンを 食[た]べます。", "(Saya) makan roti."], ["水[みず]を 飲[の]みます。", "(Saya) minum air."]],
 q:["o|私[わたし]/は/本[ほん]/を/読[よ]みます|Saya membaca buku.", "m|コーヒー___ 飲[の]みます。|Saya minum kopi.|を|に|へ|が", "o|毎朝[まいあさ]/新聞[しんぶん]/を/読[よ]みます|Setiap pagi saya membaca koran.|新聞[しんぶん]/を/毎朝[まいあさ]/読[よ]みます", "o|私[わたし]は/たばこ/を/吸[す]いません|Saya tidak merokok.", "o|ミラーさんは/手紙[てがみ]/を/書[か]きます|Pak Miller menulis surat.", "m|スーパーで 野菜[やさい]___ 買[か]いました。|Saya membeli sayur di pasar swalayan.|を|で|へ|に", "m|写真[しゃしん]を ___。|Saya mengambil foto.|撮[と]ります|飲[の]みます|吸[す]います|食[た]べます", "m|駅[えき]で 友達[ともだち]___ 会[あ]います。|Saya bertemu teman di stasiun.|に|を|へ|で"]},
{b:5,t:"Tempat へ/に 行きます",d:"<b>へ</b> (dibaca <b>e</b>) atau <b>に</b> menunjukkan arah tujuan untuk 行きます (pergi), 来ます (datang), 帰ります (pulang).",
 r:["S + は + K-tempat + へ/に + 行[い]きます/来[き]ます/帰[かえ]ります", "S + は + K-waktu + K-tempat + へ + 行[い]きます", "S + は + どこ + へ + 行[い]きます + か"],
 s:"S + は + K-tempat + へ + P → 私[わたし]は 図書館[としょかん]へ 行[い]きます。",
 k:[["へ", "Menandai K-tempat yang menjadi arah tujuan, artinya 'ke'. Dipakai karena 行[い]きます, 来[き]ます, dan 帰[かえ]ります adalah kata kerja gerak yang butuh arah. Ditulis へ tetapi dibaca e."], ["に", "Boleh menggantikan へ dengan arti yang hampir sama: 学校[がっこう]に 行[い]きます. へ lebih menekankan arah, に lebih menekankan tempat tiba. Untuk pemula, keduanya sama-sama benar."], ["行[い]きます / 来[き]ます / 帰[かえ]ります", "Tiga kata kerja gerak yang menjadi P. 行[い]きます = pergi menjauh dari tempat pembicara, 来[き]ます = datang ke tempat pembicara berada, 帰[かえ]ります = pulang ke rumah atau negara asal."], ["どこへ ～か", "Untuk bertanya 'ke mana', ganti nama tempat dengan どこ, tetap pakai へ, lalu tambahkan か di akhir: どこへ 行[い]きますか."]],
 x:["<b>Fungsi:</b> pola ini menyatakan seseorang bergerak menuju suatu tempat. Tempat tujuan diberi へ (atau に), lalu kata kerja gerak diletakkan di akhir.", "<b>Cara menyusun:</b> (1) S + は: 私[わたし]は; (2) waktu kalau ada: 明日[あした]; (3) tempat + へ: 銀行[ぎんこう]へ; (4) kata kerja: 行[い]きます. Hasilnya: 私[わたし]は 明日[あした] 銀行[ぎんこう]へ 行[い]きます。", "<b>Variasi:</b> 行[い]きます → 行[い]きません → 行[い]きました → 行[い]きませんでした. Pertanyaan: どこへ 行[い]きますか (pergi ke mana?).", "<b>Memilih kata kerja:</b> 来[き]ます dipakai kalau tujuannya tempat pembicara sedang berada, misalnya orang yang sedang berada di Jepang berkata 日本[にほん]へ 来[き]ました. 帰[かえ]ります dipakai untuk kembali ke tempat asal: うちへ 帰[かえ]ります (pulang ke rumah), 国[くに]へ 帰[かえ]ります (pulang ke negara asal).", "<b>Kesalahan umum:</b> memakai を atau で untuk tujuan (駅[えき]を 行[い]きます dan 駅[えき]で 行[い]きます salah), atau menaruh kata kerja di tengah (行[い]きます 駅[えき]へ salah). Tempat + へ dulu, kata kerja paling akhir.", "<b>Tips:</b> へ sebagai partikel dibaca e, sama seperti は topik yang dibaca wa. Tulisannya tetap へ dan は."],
 ex:[["学校[がっこう]へ 行[い]きます。", "Saya pergi ke sekolah."], ["家[いえ]に 帰[かえ]ります。", "Saya pulang ke rumah."]],
 q:["o|私[わたし]/は/東京[とうきょう]/へ/行[い]きます|Saya pergi ke Tokyo.", "m|日本[にほん]___ 来[き]ました。|Saya datang ke Jepang.|へ|を|で|の", "o|来月[らいげつ]/国[くに]/へ/帰[かえ]ります|Bulan depan saya pulang ke negara asal.|国[くに]/へ/来月[らいげつ]/帰[かえ]ります", "o|私[わたし]は/郵便局[ゆうびんきょく]/に/行[い]きます|Saya pergi ke kantor pos.", "o|ミラーさんは/どこ/へ/行[い]きますか|Pak Miller pergi ke mana?", "m|A：昨日[きのう] どこへ 行[い]きましたか。 B：スーパー___ 行[い]きました。|A: Kemarin kamu pergi ke mana? B: Saya pergi ke pasar swalayan.|へ|を|で|が", "m|毎晩[まいばん] 九時[くじ]に うちへ ___。|Setiap malam saya pulang ke rumah jam sembilan.|帰[かえ]ります|来[き]ます|働[はたら]きます|起[お]きます", "m|ワンさんは 去年[きょねん] インドネシア___ 来[き]ました。|Pak Wang datang ke Indonesia tahun lalu.|へ|で|を|と"]},
{b:6,t:"Tempat/Alat で",d:"<b>で</b> = tempat terjadinya aktivitas (\"di\") atau alat/cara (\"dengan/naik\").",
 r:["S + は + K-tempat + で + O + を + KK-ます", "S + は + K-alat + で + K-tempat + へ + 行[い]きます/来[き]ます/帰[かえ]ります"],
 s:"S + は + K-tempat + で + O + を + P → 私[わたし]は 食堂[しょくどう]で パンを 食[た]べます。",
 k:[["で (tempat)", "Menandai K-tempat, yaitu tempat sebuah kegiatan berlangsung, seperti 'di': 図書館[としょかん]で 勉強[べんきょう]します. Dipakai karena kegiatannya (belajar, makan, membeli) terjadi di tempat itu."], ["で (alat/kendaraan)", "Menandai K-alat, yaitu sarana atau kendaraan yang dipakai, seperti 'dengan' atau 'naik': バスで 行[い]きます. Partikelnya sama; artinya terlihat dari kata bendanya: tempat atau alat."], ["を", "Menandai O (objek) kalau kegiatannya punya sasaran: 店[みせ]で パンを 買[か]います. Letaknya setelah keterangan tempat dan sebelum kata kerja."], ["へ", "Dalam kalimat kendaraan, tujuan tetap diberi へ: バスで 駅[えき]へ 行[い]きます (naik bus ke stasiun). で untuk kendaraannya, へ untuk tujuannya."]],
 x:["<b>Dua fungsi で:</b> (1) tempat kegiatan, artinya 'di': 学校[がっこう]で テニスを します; (2) alat atau kendaraan, artinya 'dengan/naik': 電車[でんしゃ]で 来[き]ます. Lihat kata bendanya: kalau tempat, artinya 'di'; kalau benda atau kendaraan, artinya 'dengan/naik'.", "<b>Cara menyusun (tempat):</b> S + は → tempat + で → benda + を → kata kerja: 私[わたし]は 図書館[としょかん]で 雑誌[ざっし]を 読[よ]みます。 <b>(kendaraan):</b> S + は → kendaraan + で → tujuan + へ → 行[い]きます/来[き]ます/帰[かえ]ります: 私[わたし]は 地下鉄[ちかてつ]で 会社[かいしゃ]へ 行[い]きます。", "<b>Kesalahan umum, で atau に?</b> Untuk tempat terjadinya kegiatan (makan, belajar, bekerja di …) pakai で: 食堂[しょくどう]で 食[た]べます, bukan 食堂[しょくどう]に 食[た]べます. Untuk tujuan gerakan pakai へ atau に, bukan で: 駅[えき]で 行[い]きます salah.", "<b>Jalan kaki:</b> 'berjalan kaki' cukup 歩[ある]いて, tanpa で: 歩[ある]いて 学校[がっこう]へ 行[い]きます (pergi ke sekolah berjalan kaki).", "<b>Tips:</b> urutan yang paling umum adalah waktu → tempat atau kendaraan → objek atau tujuan → kata kerja: 明日[あした] 図書館[としょかん]で 本[ほん]を 読[よ]みます."],
 ex:[["図書館[としょかん]で 勉強[べんきょう]します。", "Saya belajar di perpustakaan."], ["バスで 行[い]きます。", "Saya pergi naik bus."]],
 q:["o|図書館[としょかん]/で/勉強[べんきょう]します|Saya belajar di perpustakaan.", "m|電車[でんしゃ]___ 会社[かいしゃ]へ 行[い]きます。|Saya ke kantor naik kereta.|で|を|に|が", "o|デパート/で/靴[くつ]/を/買[か]いました|Saya membeli sepatu di toserba.|靴[くつ]/を/デパート/で/買[か]いました", "o|自転車[じてんしゃ]/で/学校[がっこう]/へ/行[い]きます|Saya pergi ke sekolah naik sepeda.|学校[がっこう]/へ/自転車[じてんしゃ]/で/行[い]きます", "o|私[わたし]は/銀行[ぎんこう]/で/働[はたら]きます|Saya bekerja di bank.", "m|庭[にわ]___ 写真[しゃしん]を 撮[と]りました。|Saya mengambil foto di halaman.|で|に|へ|を", "m|タクシー___ うちへ 帰[かえ]りました。|Saya pulang ke rumah naik taksi.|で|に|を|と", "m|A：どこで 傘[かさ]を 買[か]いましたか。 B：駅[えき]の 店[みせ]___ 買[か]いました。|A: Kamu membeli payung di mana? B: Saya membelinya di toko di stasiun.|で|に|へ|を"]},
{b:4,t:"Waktu に",d:"Waktu spesifik (jam, hari, tanggal) memakai <b>に</b>. Kata relatif seperti 今日, 明日, 毎日 <b>tanpa</b> に.",
 r:["S + は + K-waktu + に + KK-ます", "S + は + K-waktu relatif + KK-ます", "S + は + K-waktu relatif + K-waktu + に + KK-ます"],
 s:"S + は + K-waktu + に + P → 私[わたし]は 六時[ろくじ]半[はん]に 起[お]きます。",
 k:[["に", "Menandai K-waktu yang berupa titik waktu dengan angka: jam (六時[ろくじ]に), tanggal, bulan, atau tahun. Artinya mirip 'pada'. Dipakai supaya jelas kapan tepatnya kegiatan terjadi."], ["tanpa に", "Kata waktu relatif, yaitu yang maknanya bergantung pada hari ini (今日[きょう], 明日[あした], 昨日[きのう], 今晩[こんばん]), dan kata waktu yang berulang (毎朝[まいあさ], 毎日[まいにち]) langsung dipakai tanpa partikel. Kata-kata ini sudah menjadi keterangan dengan sendirinya."], ["～曜日[ようび]", "Nama hari boleh memakai に atau tidak: 日曜日[にちようび]に 休[やす]みます dan 日曜日[にちようび] 休[やす]みます sama-sama benar."], ["KK-ます", "P (predikat) tetap di akhir. Keterangan waktu diletakkan sebelum kata kerja, biasanya setelah S + は."]],
 x:["<b>Fungsi:</b> に setelah kata waktu menunjukkan kapan sebuah kegiatan terjadi, seperti 'pada' dalam 'pada jam tujuh'. Biasanya dipakai dengan kegiatan yang terjadi pada satu titik waktu, misalnya 起[お]きます, 寝[ね]ます, 終[お]わります.", "<b>Pakai に:</b> jam dan menit (七時[しちじ]に, 七時[しちじ]半[はん]に), juga tanggal, bulan, dan tahun. <b>Tanpa に:</b> 今[いま], 今日[きょう], 明日[あした], あさって, 昨日[きのう], おととい, けさ, 今晩[こんばん], 毎朝[まいあさ], 毎晩[まいばん], 毎日[まいにち]. <b>Boleh dengan atau tanpa に:</b> nama hari, misalnya 月曜日[げつようび](に).", "<b>Cara menyusun:</b> S + は → kata waktu relatif (kalau ada) → jam + に → kata kerja: 私[わたし]は 毎晩[まいばん] 十時[じゅうじ]半[はん]に 寝[ね]ます (setiap malam saya tidur jam setengah sebelas).", "<b>Pertanyaan:</b> 何時[なんじ]に 起[お]きますか (bangun jam berapa?). 何時[なんじ] juga memakai に karena menanyakan jam. Jawablah dengan jam + に: 六時[ろくじ]に 起[お]きます.", "<b>Kesalahan umum:</b> menambahkan に pada 明日[あした] atau 毎日[まいにち]. 明日[あした]に 休[やす]みます salah; yang benar 明日[あした] 休[やす]みます. Sebaliknya, jam jangan dibiarkan tanpa に: 六時[ろくじ] 起[お]きます kurang tepat."],
 ex:[["七時[しちじ]に 起[お]きます。", "Saya bangun jam tujuh."], ["日曜日[にちようび]に 映画[えいが]を 見[み]ます。", "Hari Minggu saya menonton film."]],
 q:["o|六時[ろくじ]/に/起[お]きます|Saya bangun jam enam.", "m|十時[じゅうじ]___ 寝[ね]ます。|Saya tidur jam sepuluh.|に|で|を|へ", "o|会議[かいぎ]/は/四時[よじ]/に/終[お]わります|Rapatnya selesai jam empat.", "o|おととい/九時[くじ]/に/寝[ね]ました|Kemarin lusa saya tidur jam sembilan.", "o|私[わたし]は/毎朝[まいあさ]/五時[ごじ]/に/起[お]きます|Setiap pagi saya bangun jam lima.|毎朝[まいあさ]/私[わたし]は/五時[ごじ]/に/起[お]きます", "m|___ 勉強[べんきょう]します。|Setiap hari saya belajar.|毎日[まいにち]|毎日[まいにち]に|毎日[まいにち]で|毎日[まいにち]を", "m|昼休[ひるやす]みは 一時[いちじ]___ 終[お]わります。|Istirahat siang selesai jam satu.|に|を|へ|と", "m|A：今晩[こんばん] 何時[なんじ]___ 寝[ね]ますか。 B：十一時[じゅういちじ]に 寝[ね]ます。|A: Malam ini kamu tidur jam berapa? B: Saya tidur jam sebelas.|に|へ|を|と"]},
{b:10,t:"あります / います",d:"\"Ada\". <b>あります</b> untuk benda mati & tumbuhan, <b>います</b> untuk manusia & hewan. Pola: Tempat に Benda が あります.",
 r:["K-tempat + に + KB (benda mati/tumbuhan) + が + あります", "K-tempat + に + KB (orang/hewan) + が + います", "K-tempat + に + 何[なに]/だれ + が + ありますか/いますか"],
 s:"K-tempat + に + KB + が + います → 教室[きょうしつ]に 先生[せんせい]が います。",
 k:[["に", "Menandai tempat beradanya sesuatu, sama dengan \"di\". Untuk keberadaan benda dan orang (あります/います), tempatnya ditandai に. Partikel で dipakai untuk tempat melakukan kegiatan, jadi tidak cocok di sini."], ["が", "Menandai benda atau orang yang ada. Pola ini memperkenalkan sesuatu yang belum diketahui pendengar, dan hal baru seperti itu ditandai が."], ["あります", "Kata kerja \"ada\" untuk benda mati dan tumbuhan, yaitu hal yang tidak bergerak atas kemauannya sendiri: buku, meja, gedung, pohon."], ["います", "Kata kerja \"ada\" untuk makhluk yang bisa bergerak sendiri, yaitu manusia dan hewan: guru, anak, anjing, kucing."], ["何[なに] / だれ + が", "Untuk bertanya \"ada apa?\" pakai 何[なに]が ありますか, untuk \"ada siapa?\" pakai だれが いますか. Kata tanya yang menjadi subjek selalu memakai が, tidak memakai は."]],
 x:["Pola ini menyatakan bahwa sesuatu <b>ada</b> di suatu tempat. Biasanya dipakai untuk menggambarkan isi sebuah tempat atau memperkenalkan benda dan orang yang baru disebut.", "Cara menyusun: (1) sebut tempatnya, lalu tambah に: 部屋[へや]に; (2) sebut benda atau orangnya, lalu tambah が: テレビが; (3) tutup dengan <b>あります</b> untuk benda mati dan tumbuhan, atau <b>います</b> untuk manusia dan hewan.", "Bentuk lainnya sama seperti kata kerja biasa: ありません / いません (tidak ada), ありました / いました (dulu ada), ありますか / いますか (adakah?). \"Tidak ada apa-apa\" menjadi 何[なに]も ありません, \"tidak ada siapa-siapa\" menjadi だれも いません.", "Kesalahan yang sering terjadi: memakai あります untuk hewan (猫[ねこ]が あります salah) atau います untuk pohon (木[き]が います salah). Pohon memang hidup, tetapi tidak bergerak sendiri, jadi tetap あります.", "Tempat keberadaan juga sering diberi で karena meniru kata \"di\". 公園[こうえん]で 犬[いぬ]が います salah, yang benar 公園[こうえん]に 犬[いぬ]が います. で baru dipakai kalau ada kegiatan: 公園[こうえん]で テニスを します.", "Kalimat dimulai dari tempat, lalu benda atau orangnya, dan ditutup dengan あります/います: 庭[にわ]に 猫[ねこ]が います (ada kucing di halaman)."],
 ex:[["机[つくえ]の 上[うえ]に 本[ほん]が あります。", "Ada buku di atas meja."], ["公園[こうえん]に 犬[いぬ]が います。", "Ada anjing di taman."]],
 q:["m|部屋[へや]に 猫[ねこ]が ___。|Ada kucing di kamar.|います|あります|です|します", "m|かばんの 中[なか]に 財布[さいふ]が ___。|Ada dompet di dalam tas.|あります|います|です|行[い]きます", "o|駅[えき]/の/前[まえ]/に/銀行[ぎんこう]/が/あります|Ada bank di depan stasiun.|銀行[ぎんこう]/が/駅[えき]/の/前[まえ]/に/あります", "m|公園[こうえん]に 大[おお]きい 木[き]が ___。|Ada pohon besar di taman.|あります|います|です|します", "m|車[くるま]の 中[なか]に 犬[いぬ]が ___。|Ada anjing di dalam mobil.|います|あります|です|します", "m|喫茶店[きっさてん]___ 友達[ともだち]が います。|Ada teman saya di kedai kopi.|に|で|を|へ", "o|冷蔵庫[れいぞうこ]/に/何[なに]/が/ありますか|Ada apa di dalam kulkas?|何[なに]/が/冷蔵庫[れいぞうこ]/に/ありますか", "o|教室[きょうしつ]/に/だれも/いません|Tidak ada siapa-siapa di kelas.|だれも/教室[きょうしつ]/に/いません"]},
{b:4,t:"～ました / ～ませんでした",d:"Bentuk lampau sopan. ます → <b>ました</b> (sudah), ません → <b>ませんでした</b> (tidak).",
 r:["S + は + (K-waktu) + KK-ました", "S + は + (K-waktu) + KK-ませんでした", "S + は + (K-waktu) + KK-ました + か"],
 s:"S + は + K-waktu + P (KK-ました) → 私[わたし]は 昨日[きのう] 働[はたら]きました。",
 k:[["ました", "Akhiran lampau untuk kalimat positif: ます diganti ました. Diperlukan karena kata kerja Jepang sendiri berubah untuk menandai masa lampau; kata 昨日[きのう] saja tidak cukup."], ["ませんでした", "Akhiran lampau untuk kalimat negatif: ません ditambah でした. Artinya 'tidak …' untuk kejadian yang sudah lewat: 昨日[きのう] 働[はたら]きませんでした (kemarin tidak bekerja)."], ["か", "Ditambahkan di akhir untuk bertanya: 勉強[べんきょう]しましたか (tadi/kemarin belajar?). Jawabannya はい、～ました atau いいえ、～ませんでした."], ["K-waktu", "Kata seperti 昨日[きのう], おととい, dan けさ menunjukkan bahwa kejadiannya sudah lewat, dan dipakai tanpa に. Jam tetap memakai に: 昨日[きのう] 十時[じゅうじ]に 寝[ね]ました."]],
 x:["<b>Fungsi:</b> bahasa Jepang menandai masa lampau pada kata kerjanya. Walaupun sudah ada kata 昨日[きのう] (kemarin), akhirannya tetap wajib diubah: 働[はたら]きます → 働[はたら]きました.", "<b>Tabel perubahan:</b> 休[やす]みます (libur) → 休[やす]みません (tidak libur) → 休[やす]みました (kemarin libur) → 休[やす]みませんでした (kemarin tidak libur). Caranya: buang ます, lalu ganti dengan ません, ました, atau ませんでした.", "<b>Pertanyaan dan jawaban:</b> 昨日[きのう] 十一時[じゅういちじ]に 寝[ね]ましたか。 → はい、寝[ね]ました。 / いいえ、寝[ね]ませんでした。 Biasanya kata kerjanya diulang dalam jawaban.", "<b>Kesalahan umum:</b> memakai ません untuk kejadian yang sudah lewat. 昨日[きのう] 働[はたら]きません salah, yang benar 昨日[きのう] 働[はたら]きませんでした. Hal yang sudah terjadi hari ini pun memakai ました: けさ 勉強[べんきょう]しました (tadi pagi saya belajar).", "<b>Tips:</b> kata kerja dengan します berubah dengan cara yang sama: 勉強[べんきょう]します → 勉強[べんきょう]しました → 勉強[べんきょう]しませんでした. Yang berubah hanya bagian ます."],
 ex:[["昨日[きのう] テレビを 見[み]ました。", "Kemarin saya menonton TV."], ["朝[あさ]ご飯[はん]を 食[た]べませんでした。", "Saya tidak sarapan."]],
 q:["m|昨日[きのう] 友達[ともだち]に 会[あ]い___。|Kemarin saya bertemu teman.|ました|ます|ません|ましょう", "o|映画[えいが]/を/見[み]ませんでした|Saya tidak menonton film.", "o|私[わたし]は/昨日[きのう]/休[やす]みませんでした|Kemarin saya tidak beristirahat.|昨日[きのう]/私[わたし]は/休[やす]みませんでした", "o|けさ/七時[しちじ]/に/起[お]きました|Tadi pagi saya bangun jam tujuh.", "o|会議[かいぎ]/は/何時[なんじ]/に/終[お]わりましたか|Tadi rapatnya selesai jam berapa?", "m|おととい 十二時[じゅうにじ]に 寝[ね]___。|Kemarin lusa saya tidur jam dua belas.|ました|ます|ません|ますか", "m|A：土曜日[どようび] 働[はたら]きましたか。 B：いいえ、働[はたら]き___。|A: Hari Sabtu kemarin kamu bekerja? B: Tidak, saya tidak bekerja.|ませんでした|ません|ました|ます", "m|昨日[きのう] 十時[じゅうじ]まで 勉強[べんきょう]___。|Kemarin saya belajar sampai jam sepuluh.|しました|ました|します|しません"]},
{b:8,t:"Kata sifat -い",d:"Negatif: ganti い → <b>くない</b>. Lampau: い → <b>かった</b>. Pengecualian: いい → よくない.",
 r:["S + は + KS-i + です", "S + は + KS-i (～い → ～くない) + です", "S + は + KS-i + KB + です"],
 s:"S + は + KS-i + KB + です → これは 新[あたら]しい 車[くるま]です。",
 k:[["です", "Arti \"dingin\" atau \"mahal\" sudah terkandung di dalam kata sifat -い. です di belakangnya hanya membuat kalimat sopan, jadi tidak perlu diterjemahkan \"adalah\"."], ["～くない", "Untuk menyangkal, kata sifatnya sendiri yang berubah: い terakhir diganti くない, lalu ditambah です. 寒[さむ]い → 寒[さむ]くないです. Karena kata sifatnya sudah berubah, じゃ ありません tidak dipakai."], ["いい → よくない", "いい (bagus) punya bentuk lain, よい. Bentuk negatif dibuat dari よい, sehingga hasilnya よくないです. Bentuk いくないです salah."], ["KS-i + KB", "Saat menerangkan benda, kata sifat -い langsung diletakkan di depan kata benda tanpa tambahan apa pun: おいしい パン (roti enak)."]],
 x:["Kata sifat -い (KS-i) dalam bentuk kamus selalu berakhir dengan い: 大[おお]きい, 新[あたら]しい, 暑[あつ]い, おいしい. Kata ini menerangkan sifat benda atau orang, juga keadaan seperti cuaca.", "Membuat bentuk negatif langkah demi langkah: (1) ambil kata sifatnya, 高[たか]い; (2) buang い terakhir, 高[たか]; (3) tambahkan くない, 高[たか]くない; (4) tutup dengan です, 高[たか]くないです. Contoh lain: おもしろい → おもしろくないです, 新[あたら]しい → 新[あたら]しくないです.", "Di Bab 8 hanya いい yang tidak beraturan. Negatifnya <b>よくないです</b>, misalnya この 辞書[じしょ]は よくないです (kamus ini tidak bagus).", "Bertanya dan menjawab: この 本[ほん]は おもしろいですか。 Jawabannya はい、おもしろいです atau いいえ、おもしろくないです.", "Untuk menerangkan benda, susunannya KS-i + KB: 黒[くろ]い かばん (tas hitam), 小[ちい]さい 町[まち] (kota kecil). Kata sifat selalu di depan kata benda.", "Kesalahan yang sering muncul: 高[たか]いじゃ ありません (seharusnya 高[たか]くないです), 高[たか]いな 車[くるま] atau 高[たか]いの 車[くるま] (seharusnya 高[たか]い 車[くるま]), dan menganggap きれい sebagai KS-i karena berakhir dengan い. きれい termasuk KS-na, jadi negatifnya きれいじゃ ありません."],
 ex:[["この ラーメンは おいしいです。", "Ramen ini enak."], ["今日[きょう]は 寒[さむ]くないです。", "Hari ini tidak dingin."], ["昨日[きのう]は 暑[あつ]かったです。", "Kemarin panas."]],
 q:["m|この 本[ほん]は 高[たか]___です。|Buku ini tidak mahal.|くない|じゃない|いない|くなかった", "o|日本語[にほんご]/は/楽[たの]しい/です|Bahasa Jepang menyenangkan.", "m|この カメラは ___。|Kamera ini tidak bagus.|よくないです|いくないです|いいじゃ ありません|いいくないです", "m|あれは ___ 山[やま]です。|Itu gunung yang tinggi.|高[たか]い|高[たか]いな|高[たか]いの|高[たか]く", "m|この 寮[りょう]は ___。|Asrama ini tidak baru.|新[あたら]しくないです|新[あたら]しいじゃ ありません|新[あたら]しいくないです|新[あたら]しないです", "o|赤[あか]い/傘[かさ]/を/買[か]いました|Saya membeli payung merah.", "o|この/コーヒー/は/冷[つめ]たくない/です|Kopi ini tidak dingin.", "o|その/辞書[じしょ]/は/新[あたら]しい/ですか|Apakah kamus itu baru?"]},
{b:8,t:"Kata sifat -な",d:"Saat menerangkan benda, tambahkan <b>な</b>: 静かな町. Di akhir kalimat cukup です: 町は静かです. Negatif: 静かじゃありません.",
 r:["S + は + KS-na + です", "S + は + KS-na + じゃ ありません", "S + は + KS-na + な + KB + です"],
 s:"S + は + KS-na + な + KB + です → 母[はは]は 親切[しんせつ]な 人[ひと]です。",
 k:[["な", "な menghubungkan KS-na dengan kata benda sesudahnya: 静[しず]かな 町[まち]. Fungsinya mirip \"yang\" dalam \"kota yang tenang\", hanya saja letaknya sesudah kata sifat."], ["です", "Di akhir kalimat, KS-na langsung diikuti です tanpa な: この 町[まち]は 静[しず]かです."], ["じゃ ありません", "Negatif KS-na dibuat seperti negatif kata benda: です diganti じゃ ありません. Kata sifatnya tidak berubah, jadi くない tidak dipakai."]],
 x:["Kata sifat -な (KS-na) memerlukan な saat berdiri di depan kata benda. KS-na di Bab 8: 静[しず]か, にぎやか, 有名[ゆうめい], 親切[しんせつ], 元気[げんき], 暇[ひま], 便利[べんり], きれい, すてき, ハンサム.", "Ada tiga bentuk yang perlu dihafal. Contoh dengan 便利[べんり] (praktis): (1) akhir kalimat: 便利[べんり]です; (2) negatif: 便利[べんり]じゃ ありません; (3) di depan benda: 便利[べんり]な 辞書[じしょ]. Kata sifatnya tidak pernah berubah; yang berganti hanya bagian sesudahnya.", "Bertanya dan menjawab: この 町[まち]は にぎやかですか。 Jawabannya はい、にぎやかです atau いいえ、にぎやかじゃ ありません. Bentuk では ありません juga benar dan terdengar lebih resmi.", "Kesalahan yang sering muncul: 静[しず]かなです (な tidak dipakai sebelum です), 有名[ゆうめい]の 人[ひと] (seharusnya 有名[ゆうめい]な 人[ひと]), dan 静[しず]かくないです (くない hanya untuk KS-i).", "Kata sifat yang tulisannya tidak berakhir dengan い pasti KS-na, misalnya 静[しず]か, 元気[げんき], 暇[ひま]. Hati-hati dengan きれい dan 有名[ゆうめい] (ゆうめい): bunyinya berakhir い, tetapi keduanya KS-na. Jadi きれいな 部屋[へや], きれいじゃ ありません."],
 ex:[["静[しず]かな 町[まち]です。", "Kota yang tenang."], ["この 公園[こうえん]は きれいです。", "Taman ini indah."]],
 q:["m|有名[ゆうめい]___ 人[ひと]ですね。|Orang yang terkenal ya.|な|の|い|に", "o|ここ/は/静[しず]か/な/部屋[へや]/です|Ini kamar yang tenang.", "m|サントスさんは ___ 人[ひと]です。|Santos-san orang yang bersemangat.|元気[げんき]な|元気[げんき]|元気[げんき]の|元気[げんき]い", "m|この パソコンは とても ___です。|Komputer ini sangat praktis.|便利[べんり]|便利[べんり]な|便利[べんり]い|便利[べんり]の", "m|この 花[はな]は ___。|Bunga ini tidak indah.|きれいじゃ ありません|きれくないです|きれいくないです|きれいなです", "o|きれい/な/花[はな]/を/買[か]いました|Saya membeli bunga yang indah.", "o|あの/レストラン/は/有名[ゆうめい]/です|Restoran itu terkenal.", "o|今日[きょう]/は/暇[ひま]/じゃ ありません|Hari ini saya tidak senggang."]},
{b:9,t:"～が 好きです",d:"Suka/tidak suka/pandai memakai partikel <b>が</b>, bukan を: 好き, 嫌い, 上手, 下手.",
 r:["S + は + O + が + 好[す]きです / 嫌[きら]いです", "S + は + O + が + 上手[じょうず]です / 下手[へた]です", "S + は + どんな + KB + が + 好[す]きですか"],
 s:"S + は + O + が + 好[す]きです → 私[わたし]は サッカーが 好[す]きです。",
 k:[["が", "Dengan 好[す]き, 嫌[きら]い, 上手[じょうず], dan 下手[へた], hal yang disukai atau dikuasai ditandai が. Keempat kata ini adalah kata sifat -な yang menyatakan keadaan, bukan kata kerja, sehingga tidak memakai を."], ["は", "は menandai orang yang suka atau pandai. Jadi dalam satu kalimat ada dua penanda: は untuk orangnya, が untuk hal yang disukai."], ["じゃ ありません", "Karena termasuk KS-na, negatifnya 好[す]きじゃ ありません dan 上手[じょうず]じゃ ありません. Bentuk 好[す]きくないです salah."], ["好[す]きな + KB", "Di depan kata benda, 好[す]き memakai な seperti KS-na lain: 好[す]きな 飲[の]み物[もの] (minuman kesukaan)."], ["上手[じょうず] / 下手[へた]", "上手[じょうず] biasanya dipakai untuk memuji kemampuan orang lain. Menyebut diri sendiri 上手[じょうず] terdengar sombong, jadi untuk diri sendiri orang Jepang lebih sering berkata まだ 下手[へた]です atau あまり 上手[じょうず]じゃ ありません."]],
 x:["Pola ini menyatakan suka (好[す]き), tidak suka (嫌[きら]い), pandai (上手[じょうず]), dan kurang pandai (下手[へた]). Hal yang disukai atau dikuasai selalu diletakkan sebelum が.", "Menyusun langkah demi langkah: (1) orangnya + は: 夫[おっと]は; (2) hal yang disukai + が: 歌舞伎[かぶき]が; (3) predikat: 好[す]きです. Hasilnya: 夫[おっと]は 歌舞伎[かぶき]が 好[す]きです.", "Variasi: negatif 好[す]きじゃ ありません; pertanyaan ジャズが 好[す]きですか; menanyakan jenis dengan どんな: どんな 音楽[おんがく]が 好[す]きですか, dijawab クラシックが 好[す]きです. Untuk menguatkan atau melemahkan, tambahkan とても atau あまり: とても 好[す]きです, あまり 好[す]きじゃ ありません.", "Sebelum が harus ada kata benda. \"Pandai menyanyi\" ditulis 歌[うた]が 上手[じょうず]です dengan kata benda 歌[うた] (lagu, nyanyian), dan \"pandai memasak\" menjadi 料理[りょうり]が 上手[じょうず]です. Kata kerja seperti 食[た]べます tidak bisa langsung diletakkan di sana.", "Kesalahan yang sering muncul: memakai を, misalnya 音楽[おんがく]を 好[す]きです ✗. Partikel yang benar adalah が. Selain itu, 嫌[きら]いです terdengar keras; dalam percakapan sopan, あまり 好[す]きじゃ ありません lebih aman."],
 ex:[["私[わたし]は 猫[ねこ]が 好[す]きです。", "Saya suka kucing."], ["弟[おとうと]は 野菜[やさい]が 嫌[きら]いです。", "Adik tidak suka sayur."]],
 q:["m|私[わたし]は 音楽[おんがく]___ 好[す]きです。|Saya suka musik.|が|を|に|で", "o|母[はは]/は/料理[りょうり]/が/上手[じょうず]/です|Ibu pandai memasak.", "m|私[わたし]は お酒[さけ]が ___。|Saya tidak suka minuman beralkohol.|好[す]きじゃ ありません|好[す]きくないです|好[す]きません|好[す]きないです", "m|ワンさんは 歌[うた]が ___。|Wang-san tidak pandai menyanyi.|下手[へた]です|上手[じょうず]です|好[す]きです|嫌[きら]いです", "m|A: ___ スポーツが 好[す]きですか。 B: 野球[やきゅう]が 好[す]きです。|A: Kamu suka olahraga apa? B: Saya suka bisbol.|どんな|どう|どこ|どれ", "o|妻[つま]/は/カラオケ/が/好[す]きじゃ ありません|Istri saya tidak suka karaoke.", "o|子供[こども]/は/絵[え]/が/とても/上手[じょうず]です|Anak saya sangat pandai menggambar.|子供[こども]/は/とても/絵[え]/が/上手[じょうず]です", "o|どんな/料理[りょうり]/が/好[す]きですか|Kamu suka masakan apa?"]},
{b:13,t:"～たいです",d:"\"Ingin ...\". Hapus ます lalu tambah <b>たい</b>: 食べます → 食べたいです.",
 r:["S + は + KB + を/が + KK-ます(tanpa ます) + たいです", "S + は + K-tempat + へ + KK-ます(tanpa ます) + たいです", "KK-ます(tanpa ます) + たくないです (negatif) / たいですか (tanya)"],
 s:"S + は + O + を/が + KK-ます(tanpa ます) + たいです → 私[わたし]は 日本[にほん]の 映画[えいが]が 見[み]たいです。",
 k:[["たい", "Akhiran yang berarti \"ingin\". Ditempel di belakang kata kerja bentuk-ます yang ます-nya sudah dibuang: 飲[の]みます → 飲[の]み → 飲[の]みたい."], ["です", "Kata kerja yang diberi たい berubah menjadi seperti kata sifat-い (berakhiran い). Karena itu kalimatnya ditutup です, sama seperti 高[たか]いです."], ["を / が", "Objek boleh tetap memakai を atau diganti が: 映画[えいが]を 見[み]たいです dan 映画[えいが]が 見[み]たいです sama-sama benar. Partikel lain seperti へ, に, dan で tidak berubah."], ["私[わたし]は (diri sendiri)", "～たいです dipakai untuk keinginan pembicara sendiri, atau untuk bertanya langsung kepada lawan bicara: 何[なに]が 食[た]べたいですか. Keinginan orang ketiga (田中[たなか]さんは ～たいです) tidak diungkapkan dengan pola ini."], ["たくないです", "Bentuk negatif \"tidak ingin\". い di ujung たい diganti くないです, persis seperti 高[たか]い → 高[たか]くないです: 行[い]きたくないです."]],
 x:["Pola ini menyatakan keinginan pembicara untuk <b>melakukan</b> sesuatu. Kalau yang diinginkan adalah sebuah <b>benda</b>, pakai pola ～が ほしいです.", "Cara membentuk: ambil bentuk-ます, buang ます, lalu tambah <b>たいです</b>. 食[た]べます → 食[た]べたいです; 行[い]きます → 行[い]きたいです; 勉強[べんきょう]します → 勉強[べんきょう]したいです; 来[き]ます → 来[き]たいです.", "Karena berubah seperti kata sifat-い, bentuk lainnya mengikuti aturan yang sama: 行[い]きたくないです (tidak ingin pergi), 行[い]きたかったです (dulu ingin pergi), 行[い]きたいですか (ingin pergi?).", "Kesalahan yang sering terjadi: lupa membuang ます (食[た]べますたいです salah), memakai pola ini untuk orang ketiga (田中[たなか]さんは 行[い]きたいです terdengar janggal), dan memakai たい untuk benda (カメラが たいです salah; yang benar カメラが ほしいです).", "Menawari atasan atau tamu dengan ～たいですか terdengar kurang sopan, misalnya コーヒーが 飲[の]みたいですか. Untuk menawarkan, pakai いかがですか: コーヒーは いかがですか."],
 ex:[["日本[にほん]へ 行[い]きたいです。", "Saya ingin pergi ke Jepang."], ["水[みず]が 飲[の]みたいです。", "Saya ingin minum air."]],
 q:["m|すしを 食[た]べ___です。|Saya ingin makan sushi.|たい|ます|たく|ました", "o|新[あたら]しい/車[くるま]/を/買[か]いたい/です|Saya ingin membeli mobil baru.", "m|週末[しゅうまつ] 友達[ともだち]と テニスを ___たいです。|Akhir pekan ini saya ingin bermain tenis dengan teman.|し|します|しました|しません", "m|疲[つか]れましたから、今日[きょう]は どこも 行[い]き___。|Saya lelah, jadi hari ini saya tidak ingin pergi ke mana-mana.|たくないです|たいです|ます|ました", "m|夏休[なつやす]みに 国[くに]___ 帰[かえ]りたいです。|Liburan musim panas nanti saya ingin pulang ke negara asal saya.|へ|を|で|が", "m|A: 晩[ばん]ご飯[はん]は 何[なに]が 食[た]べたいですか。 B: てんぷらが ___。|A: Untuk makan malam, kamu ingin makan apa? B: Saya ingin makan tempura.|食[た]べたいです|食[た]べたくないです|食[た]べましょう|食[た]べました", "o|来年[らいねん]/日本[にほん]で/働[はたら]きたい/です|Tahun depan saya ingin bekerja di Jepang.|日本[にほん]で/来年[らいねん]/働[はたら]きたい/です", "o|週末[しゅうまつ]は/何[なに]/を/したい/ですか|Akhir pekan ini kamu ingin melakukan apa?"]},
{b:6,t:"～ましょう / ～ませんか",d:"Ajakan. <b>ましょう</b> = \"ayo ...!\" <b>ませんか</b> = \"maukah ...?\" (lebih halus).",
 r:["(K-waktu) + (いっしょに) + O + を + KK-ませんか", "(いっしょに) + (O + を) + KK-ましょう"],
 s:"いっしょに + O + を + KK-ませんか → いっしょに ビデオを 見[み]ませんか。",
 k:[["ませんか", "Bentuknya negatif ません + か, tetapi artinya ajakan sopan: 'maukah …?' atau 'bagaimana kalau …?'. Terdengar halus karena lawan bicara diberi ruang untuk menolak."], ["ましょう", "Akhiran ajakan langsung: 'ayo …!' atau 'mari …'. Dipakai saat mengajak dengan semangat, saat menerima ajakan (ええ、行[い]きましょう), atau saat pembicara yakin lawan bicara juga mau."], ["いっしょに", "Artinya 'bersama-sama'. Sering muncul dalam ajakan supaya jelas bahwa pembicara juga ikut. Letaknya sebelum objek atau tujuan."], ["を", "Tetap menandai O (objek) seperti biasa: 映画[えいが]を 見[み]ませんか. Bentuk ajakan hanya mengubah akhir kata kerja, partikelnya tetap."]],
 x:["<b>Fungsi:</b> ～ませんか dipakai untuk mengajak dengan sopan sambil menanyakan kemauan orang lain. ～ましょう dipakai untuk mengajak secara langsung ('ayo!') atau untuk menerima ajakan.", "<b>Cara membentuk:</b> ambil bentuk ます, lalu ganti ます: 飲[の]みます → 飲[の]みませんか / 飲[の]みましょう; します → しませんか / しましょう; 行[い]きます → 行[い]きませんか / 行[い]きましょう.", "<b>Contoh percakapan:</b> A: 明日[あした] いっしょに 図書館[としょかん]で 勉強[べんきょう]しませんか。 B: ええ、いいですね。しましょう。 B menerima ajakan dengan ～ましょう.", "<b>Kesalahan umum:</b> mengira ～ませんか adalah pertanyaan negatif biasa ('tidak minum?'). Dalam ajakan artinya 'maukah minum?'. Untuk menanyakan kebiasaan orang, pakai ～ますか, bukan ～ませんか: たばこを 吸[す]いますか = apakah kamu merokok?", "<b>Tips:</b> ～ませんか cocok untuk mengajak orang yang belum akrab atau yang lebih tinggi kedudukannya. ～ましょう cocok setelah lawan bicara setuju, atau saat semua orang sudah pasti ikut: じゃ、行[い]きましょう."],
 ex:[["一緒[いっしょ]に 帰[かえ]りましょう。", "Ayo pulang bersama."], ["映画[えいが]を 見[み]ませんか。", "Maukah menonton film?"]],
 q:["m|少[すこ]し 休[やす]み___。|Ayo istirahat sebentar.|ましょう|ました|ません|たい", "o|お茶[ちゃ]/を/飲[の]みませんか|Maukah minum teh?", "o|いっしょに/晩[ばん]ご飯[はん]/を/食[た]べませんか|Maukah makan malam bersama?|晩[ばん]ご飯[はん]/を/いっしょに/食[た]べませんか", "o|駅[えき]/で/会[あ]いましょう|Mari kita bertemu di stasiun.", "o|日曜日[にちようび]に/お花見[はなみ]/を/しませんか|Hari Minggu maukah kita melihat bunga sakura?|お花見[はなみ]/を/日曜日[にちようび]に/しませんか", "m|先生[せんせい]、いっしょに コーヒーを 飲[の]み___。|Bu Guru, maukah minum kopi bersama kami?|ませんか|ました|ませんでした|ます", "m|A：明日[あした] いっしょに 美術館[びじゅつかん]へ 行[い]き___。 B：ええ、いいですね。|A: Besok maukah pergi ke museum seni bersama? B: Ya, boleh.|ませんか|ません|ました|ましたか", "m|A：昼休[ひるやす]みに いっしょに 写真[しゃしん]を 撮[と]りませんか。 B：いいですね。___。|A: Waktu istirahat siang, maukah kita berfoto bersama? B: Boleh. Ayo kita berfoto!|撮[と]りましょう|撮[と]りません|撮[と]りました|撮[と]りませんでした"]},
{b:14,t:"Bentuk -て + ください",d:"Aturan bentuk-て: う・つ・る → <b>って</b> | む・ぶ・ぬ → <b>んで</b> | く → <b>いて</b> | ぐ → <b>いで</b> | す → <b>して</b> | ru-verb: る → <b>て</b>. Pengecualian: 行く→行って, する→して, 来る→来て. ～てください = \"tolong ...\".",
 r:["(O + を) + KK-て + ください", "すみませんが、 + (O + を) + KK-て + ください"],
 s:"O + を + KK-て + ください → タクシーを 呼[よ]んで ください。",
 k:[["KK-て", "ください tidak bisa menempel langsung ke bentuk ます. Kata kerja diubah dulu ke bentuk-て, dan bentuk-て inilah yang menyambungkannya dengan ください."], ["ください", "Arti aslinya 'tolong berikan'. Diletakkan di belakang bentuk-て, kata ini membuat kalimat menjadi permintaan yang sopan: 'tolong ...'."], ["を", "Menandai objek, yaitu benda yang dikenai perbuatan, sama seperti di kalimat ～ます biasa. Kalau kata kerjanya tidak punya objek, を tidak dipakai: ちょっと 待[ま]って ください."], ["すみませんが、", "Pembuka supaya permintaan terdengar lebih halus, kira-kira 'maaf, ...'. Biasanya dipakai saat meminta tolong kepada orang yang tidak terlalu akrab."]],
 x:["<b>Fungsi:</b> ～て ください dipakai untuk meminta tolong, memberi instruksi dengan sopan, atau mempersilakan. Contoh: ちょっと 待[ま]って ください (tolong tunggu sebentar), どうぞ 座[すわ]って ください (silakan duduk).", "<b>Kelompok I</b>, lihat bunyi sebelum ます: い・ち・り → <b>って</b> (買[か]います → 買[か]って, 待[ま]ちます → 待[ま]って, 取[と]ります → 取[と]って); み・び・に → <b>んで</b> (飲[の]みます → 飲[の]んで, 呼[よ]びます → 呼[よ]んで); き → <b>いて</b> (書[か]きます → 書[か]いて); ぎ → <b>いで</b> (急[いそ]ぎます → 急[いそ]いで); し → <b>して</b> (話[はな]します → 話[はな]して). Satu pengecualian: 行[い]きます → <b>行[い]って</b>.", "<b>Kelompok II:</b> buang ます, tambah て: 食[た]べます → 食[た]べて, 見[み]せます → 見[み]せて, 起[お]きます → 起[お]きて. <b>Kelompok III:</b> します → して, 来[き]ます → 来[き]て (dibaca きて).", "<b>Lebih sopan:</b> tambahkan すみませんが、di depan: すみませんが、塩[しお]を 取[と]って ください (maaf, tolong ambilkan garamnya). Untuk meminta <b>barang</b>, cukup KB + を + ください tanpa bentuk-て, misalnya これを ください.", "<b>Kesalahan umum:</b> menempelkan ください ke bentuk ます (✗ 書[か]きます ください) atau membuat bentuk-て Kelompok I seperti Kelompok II (✗ 書[か]きて, ✗ 飲[の]みて). Perhatikan juga urutannya: ください selalu di akhir kalimat."],
 ex:[["ちょっと 待[ま]って ください。", "Tolong tunggu sebentar."], ["名前[なまえ]を 書[か]いて ください。", "Tolong tulis nama Anda."]],
 q:["m|飲[の]む → ___|Bentuk-て dari 飲む|飲[の]んで|飲[の]みて|飲[の]って|飲[の]いて", "m|書[か]く → ___|Bentuk-て dari 書く|書[か]いて|書[か]って|書[か]んで|書[か]きて", "m|行[い]く → ___|Bentuk-て dari 行く (pengecualian)|行[い]って|行[い]いて|行[い]んで|行[い]きて", "o|ゆっくり/話[はな]して/ください|Tolong bicara pelan-pelan.", "m|待[ま]ちます → ___|Bentuk-て dari 待ちます|待[ま]って|待[ま]ちて|待[ま]んで|待[ま]いて", "m|すみませんが、ボールペンを ___ ください。|Maaf, tolong pinjami saya bolpoin.|貸[か]して|貸[か]いて|貸[か]って|貸[か]しって", "o|ここに/住所[じゅうしょ]と/名前[なまえ]を/書[か]いて/ください|Tolong tulis alamat dan nama Anda di sini.|住所[じゅうしょ]と/名前[なまえ]を/ここに/書[か]いて/ください", "o|すみませんが、/ドアを/開[あ]けて/ください|Maaf, tolong bukakan pintunya."]},
{b:14,t:"～て います",d:"Bentuk-て + <b>います</b> = sedang berlangsung, atau keadaan yang berlanjut (tinggal, menikah, bekerja).",
 r:["S + は + (O + を) + KK-て + います", "KB + が + KK-て + います (gejala alam: 雨[あめ]が 降[ふ]って います)", "(S + は) + 今[いま] + 何[なに]を + して + いますか"],
 s:"S + は + O + を + KK-て + います → アニさんは テレビを 見[み]て います。",
 k:[["KK-て", "います tidak bisa langsung digabung dengan bentuk ます. Kata kerja diubah dulu ke bentuk-て, baru disambung dengan います."], ["います", "Di pola ini います tidak berarti 'ada' seperti di Bab 10. Gabungan ～て います menunjukkan perbuatan yang sedang berlangsung, sama dengan kata 'sedang'."], ["は", "Menandai topik, yaitu orang yang sedang melakukan perbuatan itu. Partikel ini dibaca wa."], ["が (雨[あめ]が)", "Untuk gejala alam yang sedang terlihat, seperti hujan atau salju turun, pakai が: 雨[あめ]が 降[ふ]って います (sedang hujan). Kata 雨[あめ]が wajib disebut."]],
 x:["<b>Fungsi:</b> ～て います menunjukkan perbuatan yang sedang berlangsung saat ini, seperti kata 'sedang'. Contoh: 今[いま] 何[なに]を して いますか (Sekarang sedang apa?) → 日本語[にほんご]を 勉強[べんきょう]して います (Sedang belajar bahasa Jepang).", "<b>Cara membentuk:</b> ubah kata kerja ke bentuk-て, lalu tambah います. 読[よ]みます → 読[よ]んで います, 待[ま]ちます → 待[ま]って います, 食[た]べます → 食[た]べて います, 勉強[べんきょう]します → 勉強[べんきょう]して います.", "<b>Variasi:</b> pertanyaan → ～て いますか; jawaban negatif → いいえ、～て いません (読[よ]んで いません = tidak sedang membaca); lampau → ～て いました (waktu itu sedang ...): 昨日[きのう]の 晩[ばん] 9時[じ]ごろ、うちで 本[ほん]を 読[よ]んで いました.", "<b>Kata pendamping:</b> 今[いま] (sekarang) sering dipakai bersama pola ini. Untuk gejala alam, yang turun ditandai が: 今[いま] 雨[あめ]が 降[ふ]って います, 雪[ゆき]が 降[ふ]って います.", "<b>Kesalahan umum:</b> memakai あります atau です (✗ 寝[ね]て あります, ✗ 寝[ね]て です). Untuk arti 'sedang', pasangan bentuk-て selalu います. Catatan: ～て います juga punya arti kedua, yaitu keadaan yang berlanjut, seperti 東京[とうきょう]に 住[す]んで います (tinggal di Tokyo). Arti ini dibahas di Bab 15."],
 ex:[["今[いま] 雨[あめ]が 降[ふ]って います。", "Sekarang sedang hujan."], ["東京[とうきょう]に 住[す]んで います。", "Saya tinggal di Tokyo."]],
 q:["m|弟[おとうと]は 今[いま] 寝[ね]て ___。|Adik sedang tidur.|います|あります|です|ください", "o|母[はは]/は/料理[りょうり]/を/作[つく]って/います|Ibu sedang memasak.", "m|今[いま] 雪[ゆき]___ 降[ふ]って います。|Sekarang sedang turun salju.|が|を|に|で", "m|A: 今[いま] 何[なに]を して いますか。 B: 手紙[てがみ]を ___ います。|A: Sekarang sedang apa? B: Sedang menulis surat.|書[か]いて|書[か]きて|書[か]って|書[か]いで", "m|ミラーさんは 今[いま] 友達[ともだち]と ___ います。|Miller-san sekarang sedang berbicara dengan teman.|話[はな]して|話[はな]しって|話[はな]いて|話[はな]んで", "m|A: 雨[あめ]が 降[ふ]って いますか。 B: いいえ、___。|A: Apakah sedang hujan? B: Tidak, tidak sedang hujan.|降[ふ]って いません|降[ふ]りません|降[ふ]って ください|降[ふ]りましょう", "o|外[そと]は/雨[あめ]が/降[ふ]って/います|Di luar sedang hujan.", "o|父[ちち]は/今[いま]/新聞[しんぶん]を/読[よ]んで/います|Ayah sekarang sedang membaca koran.|今[いま]/父[ちち]は/新聞[しんぶん]を/読[よ]んで/います|父[ちち]は/新聞[しんぶん]を/今[いま]/読[よ]んで/います"]},
{b:9,t:"～から (karena)",d:"Alasan + <b>から</b>、hasil. Alasan selalu di depan.",
 r:["Kalimat (alasan) + から、 + Kalimat (hasil)", "KB / KS + です + から、 + Kalimat (hasil)", "KK-ます / KK-ません + から、 + Kalimat (hasil)"],
 s:"Alasan + から、 + hasil → お金[かね]が ありませんから、車[くるま]を 買[か]いません。",
 k:[["から", "から diletakkan di belakang alasan: 忙[いそが]しいですから artinya \"karena sibuk\". Dalam satu kalimat, bagian alasan + から diletakkan di depan, lalu hasilnya."], ["です / ます", "Di level ini kalimat alasan memakai bentuk sopan sebelum から: 寒[さむ]いですから, 用事[ようじ]が ありますから, 時間[じかん]が ありませんから."], ["Urutan alasan → hasil", "Dalam satu kalimat, alasan selalu di depan dan hasil di belakang. Kalau ingin menyebut hasil lebih dulu, pecah menjadi dua kalimat: 行[い]きません。忙[いそが]しいですから。"], ["から \"karena\" dan から \"dari\"", "Bentuknya sama dengan から \"dari\" di Bab 4. Bedakan dari kata di depannya: setelah waktu atau tempat (九時[くじ]から) artinya \"dari\"; setelah kalimat yang berakhir です atau ます artinya \"karena\"."]],
 x:["から menyatakan sebab. Bagian sebelum から adalah alasan; bagian sesudahnya adalah akibat, keputusan, atau ajakan.", "Menyusun langkah demi langkah: (1) tulis alasan dalam bentuk sopan: 明日[あした]は 休[やす]みです; (2) tambahkan から dan koma: 明日[あした]は 休[やす]みですから、; (3) tulis hasilnya: 今晩[こんばん] 映画[えいが]を 見[み]ます. Hasilnya: 明日[あした]は 休[やす]みですから、今晩[こんばん] 映画[えいが]を 見[み]ます.", "Alasan bisa berupa kata benda, kata sifat, atau kata kerja, positif maupun negatif: 学生[がくせい]ですから, おいしいですから, 静[しず]かですから, 時間[じかん]が ありませんから. Hasilnya juga bisa berupa ajakan: 暑[あつ]いですから、ビールを 飲[の]みませんか.", "Kesalahan yang sering muncul: から ditaruh di depan (から 忙[いそが]しいです ✗). Yang benar 忙[いそが]しいですから. Hati-hati juga agar isinya tidak terbalik: 行[い]きませんから、忙[いそが]しいです berarti \"karena tidak pergi, saya sibuk\".", "Dalam percakapan, hasil sering tidak diucapkan karena sudah jelas: A: 行[い]きませんか。 B: すみません、ちょっと 用事[ようじ]が ありますから。 Jawaban seperti ini terdengar sopan karena penolakannya tidak diucapkan langsung."],
 ex:[["雨[あめ]ですから、家[いえ]に います。", "Karena hujan, saya di rumah."], ["忙[いそが]しいですから、行[い]きません。", "Karena sibuk, saya tidak pergi."]],
 q:["m|時間[じかん]が ありません___、タクシーで 行[い]きます。|Karena tidak ada waktu, saya naik taksi.|から|まで|より|でも", "o|暑[あつ]い/です/から/窓[まど]/を/開[あ]けます|Karena panas, saya buka jendela.", "m|この 店[みせ]は 安[やす]いです___、いつも ここで 買[か]います。|Karena toko ini murah, saya selalu berbelanja di sini.|から|まで|を|に", "m|___、今日[きょう]は 会社[かいしゃ]を 休[やす]みます。|Karena ada urusan, hari ini saya tidak masuk kerja.|用事[ようじ]が ありますから|から 用事[ようじ]が あります|用事[ようじ]を ありますから|用事[ようじ]が ありますまで", "m|A: 映画[えいが]を 見[み]ませんか。 B: すみません、明日[あした]は 試験[しけん]です___。|A: Mau menonton film? B: Maaf, soalnya besok ada ujian.|から|まで|を|で", "o|漢字[かんじ]が/わかりません/から、/ひらがなで/書[か]きます|Karena tidak mengerti kanji, saya menulis dengan hiragana.", "o|今日[きょう]は/日曜日[にちようび]です/から、/会社[かいしゃ]へ/行[い]きません|Karena hari ini hari Minggu, saya tidak pergi ke kantor.|日曜日[にちようび]です/から、/今日[きょう]は/会社[かいしゃ]へ/行[い]きません", "o|この/本[ほん]は/おもしろいです/から、/毎晩[まいばん]/読[よ]みます|Karena buku ini menarik, saya membacanya setiap malam."]},
{b:1,t:"～も (juga)",d:"<b>も</b> = \"juga\". Menggantikan は, が, atau を.",
 r:["S + も + KB + です", "S1 + も + S2 + も + KB + です"],
 s:"S + も + P + です → アリさんも 医者[いしゃ]です。",
 k:[["も", "Artinya \"juga\". Ditempel tepat sesudah S yang punya keterangan sama dengan orang atau hal yang baru disebut."], ["tanpa は", "も menggantikan は, jadi keduanya tidak dipakai bersama. Tulis アリさんも, jangan アリさんはも atau アリさんもは."], ["いいえ + は", "Untuk jawaban \"tidak\", kembali ke は: いいえ、アリさんは 医者[いしゃ]じゃ ありません. Kalau memakai も, artinya berubah menjadi \"juga bukan\"."], ["S1 も S2 も", "Kalau dua S punya keterangan yang sama, masing-masing diberi も. Artinya \"A maupun B\" atau \"A dan B sama-sama\"."]],
 x:["<b>も</b> berarti \"juga\". Kalau kalimat sebelumnya menyebut sesuatu tentang A dan B punya keterangan yang sama, ganti は dengan も: ハサンさんは 医者[いしゃ]です。アリさんも 医者[いしゃ]です。", "Cara menyusun: mulai dari kalimat biasa (アリさんは 医者[いしゃ]です), lalu ganti は dengan も (アリさんも 医者[いしゃ]です). Bagian P dan です tidak berubah.", "Pertanyaan: アリさんも 医者[いしゃ]ですか (Apakah Pak Ali juga dokter?). Jawaban ya: はい、アリさんも 医者[いしゃ]です. Jawaban tidak: いいえ、アリさんは 医者[いしゃ]じゃ ありません. Perhatikan bahwa jawaban \"tidak\" memakai は lagi.", "Kesalahan umum: memakai は dan も bersamaan (アリさんはも ✗), atau tetap memakai も pada jawaban \"tidak\". アリさんも 医者[いしゃ]じゃ ありません artinya \"Pak Ali juga bukan dokter\", jadi hanya cocok kalau orang yang disebut sebelumnya juga bukan dokter.", "<b>A も B も</b> berarti \"A maupun B\": ハサンさんも アリさんも 医者[いしゃ]です (Pak Hasan dan Pak Ali sama-sama dokter)."],
 ex:[["私[わたし]も 学生[がくせい]です。", "Saya juga pelajar."], ["肉[にく]も 魚[さかな]も 好[す]きです。", "Saya suka daging maupun ikan."]],
 q:["m|A: 私[わたし]は 学生[がくせい]です。 B: 私[わたし]___ 学生[がくせい]です。|Saya juga pelajar.|も|は|が|の", "o|妹[いもうと]/も/犬[いぬ]/が/好[す]き/です|Adik perempuan juga suka anjing.", "o|ブディさん/も/会社員[かいしゃいん]/です|Pak Budi juga karyawan perusahaan.", "o|リナさん/も/インドネシア人[じん]/ですか|Apakah Mbak Rina juga orang Indonesia?", "m|ハサンさんは 医者[いしゃ]です。アリさん___ 医者[いしゃ]ですか。|Pak Hasan dokter. Apakah Pak Ali juga dokter?|も|は|の|か", "m|A：マイクさんも 先生[せんせい]ですか。 B：いいえ、マイクさん___ 先生[せんせい]じゃ ありません。|A: Apakah Pak Mike juga guru? B: Bukan, Pak Mike bukan guru.|は|も|の|か", "o|はい、/デウィさん/も/医者[いしゃ]/です|(Ditanya: Apakah Mbak Dewi juga dokter?) Ya, Mbak Dewi juga dokter.", "o|ハサンさん/も/アリさん/も/学生[がくせい]/です|Pak Hasan dan Pak Ali sama-sama mahasiswa.|アリさん/も/ハサンさん/も/学生[がくせい]/です"]},
{b:4,t:"～と (dan / bersama)",d:"<b>と</b> = \"dan\" (menggabungkan kata benda) atau \"bersama\" (dengan orang).",
 r:["KB + と + KB", "S + は + KB + と + KB + です", "S + は + K-penyerta + と + KK-ます"],
 s:"S + は + K-penyerta + と + P → 私[わたし]は ワンさんと 働[はたら]きます。",
 k:[["と (dan)", "Menyambung dua kata benda atau lebih, seperti 'dan': 月曜日[げつようび]と 水曜日[すいようび]. Hanya untuk kata benda; tidak dipakai untuk menyambung kata kerja atau kalimat."], ["と (bersama)", "Diletakkan setelah orang untuk menyatakan siapa yang ikut melakukan kegiatan (K-penyerta), seperti 'bersama' atau 'dengan': ワンさんと 働[はたら]きます."], ["は", "Menandai S (topik), yaitu orang atau hal yang dibicarakan. Pelaku utama diberi は, sedangkan orang yang menemani diberi と."], ["です / KK-ます", "P (predikat) tetap di akhir. Kalimat 'dan' sering ditutup です (休[やす]みは 土曜日[どようび]と 日曜日[にちようび]です), kalimat 'bersama' ditutup kata kerja."]],
 x:["<b>Dua arti と:</b> (1) 'dan' di antara kata benda: 図書館[としょかん]と 美術館[びじゅつかん]; (2) 'bersama/dengan' setelah orang: 先生[せんせい]と 勉強[べんきょう]します.", "<b>Cara menyusun 'dan':</b> KB1 + と + KB2, lalu lanjutkan kalimatnya seperti biasa: 会議[かいぎ]は 火曜日[かようび]と 金曜日[きんようび]です (rapatnya hari Selasa dan Jumat).", "<b>Cara menyusun 'bersama':</b> S + は + orang + と + kata kerja. Orang + と selalu datang sebelum kata kerja: 私[わたし]は 先生[せんせい]と 勉強[べんきょう]しました.", "<b>Kesalahan umum:</b> memakai と untuk menyambung kata kerja, misalnya 'saya bangun dan belajar' menjadi 起[お]きますと 勉強[べんきょう]します. Ini salah, karena と hanya menyambung kata benda. Kesalahan lain: lupa と, sehingga orang yang menemani malah terdengar seperti pelaku.", "<b>Tips:</b> と dipakai bila semua bendanya disebut satu per satu, dan diulang di antara setiap kata: 月曜日[げつようび]と 水曜日[すいようび]と 金曜日[きんようび]. Untuk menyebut beberapa contoh saja, nanti ada partikel や di Bab 10."],
 ex:[["パンと 牛乳[ぎゅうにゅう]を 買[か]いました。", "Saya membeli roti dan susu."], ["友達[ともだち]と 公園[こうえん]へ 行[い]きました。", "Saya pergi ke taman bersama teman."]],
 q:["m|家族[かぞく]___ 旅行[りょこう]します。|Saya bepergian bersama keluarga.|と|を|で|が", "o|りんご/と/バナナ/を/ください|Minta apel dan pisang.|バナナ/と/りんご/を/ください", "o|試験[しけん]/は/月曜日[げつようび]/と/木曜日[もくようび]/です|Ujiannya hari Senin dan Kamis.|試験[しけん]/は/木曜日[もくようび]/と/月曜日[げつようび]/です|月曜日[げつようび]/と/木曜日[もくようび]/は/試験[しけん]/です|木曜日[もくようび]/と/月曜日[げつようび]/は/試験[しけん]/です", "o|鍵[かぎ]/と/時計[とけい]/は/私[わたし]の/です|Kunci dan jam itu milik saya.|時計[とけい]/と/鍵[かぎ]/は/私[わたし]の/です", "o|私[わたし]は/カリナさん/と/勉強[べんきょう]します|Saya belajar bersama Karina.", "m|銀行[ぎんこう]___ 郵便局[ゆうびんきょく]は 九時[くじ]からです。|Bank dan kantor pos buka mulai jam sembilan.|と|を|で|が", "m|ミラーさんは 毎晩[まいばん] サントスさん___ 勉強[べんきょう]します。|Setiap malam Pak Miller belajar bersama Pak Santos.|と|を|で|は", "m|A：休[やす]みは 何曜日[なんようび]ですか。 B：水曜日[すいようび]___ 日曜日[にちようび]です。|A: Liburnya hari apa? B: Hari Rabu dan Minggu.|と|も|の|を"]},
{b:12,t:"A は B より ～",d:"Perbandingan. <b>A は B より</b> Adj = A lebih ... daripada B. <b>B より A の ほうが</b> Adj = A-lah yang lebih ....",
 r:["KB1 + は + KB2 + より + (ずっと) + KS + です", "KB2 + より + KB1 + の + ほう + が + KS + です", "KB1 + は + KB2 + より + KS-i(tanpa い) + かったです / KS-na + でした"],
 s:"KB1 + は + KB2 + より + KS + です → ジャカルタは バンドンより にぎやかです。",
 k:[["は", "Menandai KB1, yaitu hal yang sedang diterangkan. Kalimatnya kira-kira berbunyi: \"KB1 itu, dibanding KB2, lebih ...\"."], ["より", "Berarti \"daripada\" dan selalu ditempel di <b>belakang</b> pembanding: バスより = daripada bus. Jangan menaruhnya di depan: より バス ✗."], ["KS + です (tanpa kata \"lebih\")", "Bahasa Jepang tidak memerlukan kata \"lebih\" di sini. Kata sifat biasa seperti 大[おお]きい atau 便利[べんり] sudah cukup, karena より yang memberi arti perbandingan."], ["ずっと", "Boleh disisipkan sebelum kata sifat untuk arti \"jauh lebih\": 新幹線[しんかんせん]は バスより ずっと 高[たか]いです."], ["の ほうが", "Cara lain untuk menonjolkan pihak yang lebih: KB2 より KB1 の ほうが ～です. ほう berarti \"pihak\", jadi KB1 の ほう adalah \"pihak KB1\", dan が menandai pihak yang lebih itu."]],
 x:["Pola ini membandingkan dua hal: KB1 lebih ... daripada KB2. Kata sifatnya bisa kata sifat-い (高[たか]い), kata sifat-な (便利[べんり]), atau juga 好[す]き dan 上手[じょうず].", "Cara menyusun: (1) KB1 + は; (2) KB2 + より; (3) kata sifat + です. Contoh: 夏[なつ]は 春[はる]より 暑[あつ]いです (musim panas lebih panas daripada musim semi).", "Untuk masa lalu, cukup ubah kata sifatnya ke bentuk lampau: 先週[せんしゅう]は 今週[こんしゅう]より 忙[いそが]しかったです. Untuk \"jauh lebih\", tambahkan ずっと sebelum kata sifat.", "Kesalahan yang sering terjadi: menaruh より di depan pembanding (より バス salah, yang benar バスより). Arah perbandingan juga sering terbalik. Benda yang memakai は adalah yang \"lebih\", sedangkan benda yang memakai より adalah pembandingnya.", "Cara mudah mengingat: baca より sebagai \"dibanding\". 象[ぞう]は 犬[いぬ]より 大[おお]きいです dibaca \"gajah, dibanding anjing, besar\", artinya gajah lebih besar."],
 ex:[["東京[とうきょう]は 大阪[おおさか]より 大[おお]きいです。", "Tokyo lebih besar daripada Osaka."], ["夏[なつ]より 冬[ふゆ]の ほうが 好[す]きです。", "Saya lebih suka musim dingin daripada musim panas."]],
 q:["m|電車[でんしゃ]は バス___ 速[はや]いです。|Kereta lebih cepat daripada bus.|より|から|ほう|まで", "o|犬[いぬ]/より/猫[ねこ]/の/ほう/が/好[す]き/です|Saya lebih suka kucing daripada anjing.|猫[ねこ]/の/ほう/が/犬[いぬ]/より/好[す]き/です", "m|私[わたし]の 部屋[へや]は 姉[あね]の 部屋[へや]___ 小[ちい]さいです。|Kamar saya lebih kecil daripada kamar kakak perempuan saya.|より|から|ほう|まで", "m|去年[きょねん]の 冬[ふゆ]は 今年[ことし]の 冬[ふゆ]より ___。|Musim dingin tahun lalu lebih dingin daripada musim dingin tahun ini.|寒[さむ]かったです|寒[さむ]いでした|寒[さむ]いです|寒[さむ]くないです", "m|この 辞書[じしょ]は あの 辞書[じしょ]より ___ 便利[べんり]です。|Kamus ini jauh lebih praktis daripada kamus itu.|ずっと|いちばん|どちら|ほう", "o|この/かばんは/あの/かばんより/軽[かる]いです|Tas ini lebih ringan daripada tas itu.|あの/かばんより/この/かばんは/軽[かる]いです", "o|ジャカルタ/は/東京[とうきょう]/より/ずっと/暑[あつ]いです|Jakarta jauh lebih panas daripada Tokyo.|東京[とうきょう]/より/ジャカルタ/は/ずっと/暑[あつ]いです", "o|昨日[きのう]/は/今日[きょう]/より/暖[あたた]かかった/です|Kemarin lebih hangat daripada hari ini.|今日[きょう]/より/昨日[きのう]/は/暖[あたた]かかった/です"]},
{b:1,t:"～さん (panggilan sopan)",d:"Tempelkan <b>さん</b> di belakang nama orang lain supaya sopan, seperti Pak, Bu, atau Mas/Mbak: 田中さん, ミラーさん. Jangan pakai さん untuk namamu sendiri. Kalau sudah tahu nama lawan bicara, panggil dia dengan nama + さん, karena あなた bisa terdengar kurang sopan. Untuk guru, pakai 先生 sebagai ganti さん: 田中先生.",
 r:["Nama orang lain + さん", "Nama guru + 先生[せんせい]", "私[わたし] + は + Nama sendiri + です"],
 s:"Nama + さん + は + P + です → ハサンさんは 医者[いしゃ]です。",
 k:[["さん", "Akhiran sopan di belakang nama orang lain, setara dengan Pak, Bu, Mas, atau Mbak. Dipakai untuk laki-laki maupun perempuan, dengan nama keluarga maupun nama depan."], ["先生[せんせい]", "Dipakai sebagai pengganti さん untuk guru atau dosen (juga dokter): 山田[やまだ]先生[せんせい]. Jangan digabung menjadi 先生[せんせい]さん."], ["nama sendiri", "さん dan 先生[せんせい] adalah sebutan hormat untuk orang lain. Untuk diri sendiri cukup sebut nama: 私[わたし]は アリです."], ["ちゃん", "Versi akrab dari さん untuk anak kecil, misalnya リナちゃん. Untuk orang dewasa yang belum akrab, tetap pakai さん."]],
 x:["<b>さん</b> ditempel langsung di belakang nama: ハサンさん, 山田[やまだ]さん. さん tidak membedakan laki-laki atau perempuan, jadi dalam terjemahan bisa menjadi Pak, Bu, Mas, atau Mbak sesuai situasi.", "Sebutan selalu ada di belakang nama: \"Pak Hasan\" menjadi ハサンさん, dan \"Bu Guru Yamada\" menjadi 山田[やまだ]先生[せんせい].", "Jangan memakai さん untuk dirimu sendiri. Saat memperkenalkan diri, ucapkan 私[わたし]は アリです atau cukup アリです. Kalau kamu guru, sebut pekerjaanmu 教師[きょうし]; 先生[せんせい] adalah sebutan hormat yang dipakai orang lain untukmu.", "<b>ちゃん</b> dipakai untuk anak kecil: リナちゃんは 7歳[さい]です. Untuk memperkenalkan orang lain, pakai ungkapan こちらは ～さんです: こちらは 山田[やまだ]さんです (Ini Bu Yamada)."],
 ex:[["カリナさんは 学生[がくせい]です。", "Mbak Karina seorang mahasiswa."], ["はじめまして。私[わたし]は 山田[やまだ]です。", "Perkenalkan, saya Yamada."], ["A：あの 人[ひと]は だれですか。 B：田中[たなか]先生[せんせい]です。", "A: Orang itu siapa? B: Itu Pak Guru Tanaka."]],
 q:["m|はじめまして。私[わたし]は 木村[きむら]___。|Perkenalkan, saya Kimura.|です|さんです|じゃ ありません|ですか", "m|A：あの 人[ひと]は だれですか。 B：佐藤[さとう]___です。|A: Orang itu siapa? B: Itu Bu Sato.|さん|の|も|は", "o|あの/人[ひと]は/ミラー/さん/ですか|Apakah orang itu Pak Miller?", "m|あの 人[ひと]は 山田[やまだ]___です。|Orang itu Bu Guru Yamada.|先生[せんせい]|先生[せんせい]さん|さん先生[せんせい]|の 先生[せんせい]", "o|リナ/さん/は/医者[いしゃ]/です|Mbak Rina dokter.", "o|こちらは/ハサン/さん/です|(Memperkenalkan teman) Ini Pak Hasan.", "m|A：失礼[しつれい]ですが、お名前[なまえ]は？ B：___です。|A: Maaf, nama Anda siapa? B: (Saya) Budi.|ブディ|ブディさん|ブディ先生[せんせい]|ブディちゃん", "m|はじめまして。山田[やまだ]です。私[わたし]は ___です。|Perkenalkan, saya Yamada. Saya guru.|教師[きょうし]|山田[やまだ]先生[せんせい]|教師[きょうし]さん|先生[せんせい]さん"]},
{b:2,t:"この・その・あの + kata benda",d:"<b>この</b>, <b>その</b>, dan <b>あの</b> selalu diikuti kata benda: この 本 (buku ini, dekat saya), その 本 (buku itu, dekat lawan bicara), あの 本 (buku itu, jauh dari kita berdua). これ, それ, あれ dipakai tanpa kata benda, jadi kita bilang これは 鍵です (ini kunci), tetapi この 鍵は 車の 鍵です (kunci ini kunci mobil).",
 r:["この/その/あの + KB", "この/その/あの + KB + は + P + です"],
 s:"この + KB + は + P + です → この 本[ほん]は 日本語[にほんご]の 本[ほん]です。",
 k:[["この / その / あの", "Penunjuk yang selalu menempel di depan kata benda. Tidak bisa berdiri sendiri, jadi この saja tidak bisa menjadi S."], ["KB", "Wajib ada sesudah この/その/あの, karena kata benda inilah yang ditunjuk: この 傘[かさ] = payung ini."], ["は", "Ditaruh sesudah seluruh frasa この + KB, karena frasa itu bersama-sama menjadi S: この 傘[かさ]は ..."]],
 x:["<b>この</b> KB = KB ini (dekat pembicara), <b>その</b> KB = KB itu (dekat lawan bicara), <b>あの</b> KB = KB itu (jauh dari keduanya). Pembagian jaraknya sama dengan これ, それ, あれ.", "Penunjuk この/その/あの selalu ada di depan kata benda: この 本[ほん] = buku ini.", "Bedanya dengan これ/それ/あれ: これ berdiri sendiri sebagai \"ini\", sedangkan この harus diikuti kata benda. これは 本[ほん]です ✓, この 本[ほん]は 私[わたし]のです ✓, このは ✗, これ 本[ほん] ✗.", "Frasa この + KB bisa dipakai di semua pola yang sudah kamu kenal: この かばんは だれのですか, あの 人[ひと]は 先生[せんせい]ですか, その 雑誌[ざっし]は 英語[えいご]の 雑誌[ざっし]じゃ ありません.", "Dalam percakapan, penunjuknya berganti mengikuti posisi. Payung yang dipegang lawan bicara kamu sebut その 傘[かさ], tetapi dia sendiri menyebutnya この 傘[かさ]."],
 ex:[["この 鍵[かぎ]は 車[くるま]の 鍵[かぎ]です。", "Kunci ini kunci mobil."], ["その 雑誌[ざっし]は 何[なん]の 雑誌[ざっし]ですか。", "Majalah itu majalah tentang apa?"], ["あの 車[くるま]は だれの 車[くるま]ですか。", "Mobil yang di sana itu punya siapa?"]],
