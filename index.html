 x:["Satuan lama waktu: ～分[ふん] menit (kadang berbunyi ぷん: 十分[じゅっぷん]), ～時間[じかん] jam, ～日[にち] hari, ～週間[しゅうかん] minggu, ～か月[げつ] bulan, ～年[ねん] tahun. Satu hari dibaca 一日[いちにち]; dua sampai sepuluh hari dibaca seperti tanggal: 二日[ふつか], 三日[みっか].", "Bunyi yang berubah: 一週間[いっしゅうかん], 一[いっ]か月[げつ], 六[ろっ]か月[げつ], 十[じゅっ]か月[げつ]. Untuk bertanya lama waktu, pakai どのくらい: 毎日[まいにち] どのくらい 勉強[べんきょう]しますか → 二時間[にじかん]ぐらいです.", "Frekuensi disusun dari rentang waktu + に + jumlah 回[かい]: 一日[いちにち]に 三回[さんかい] (tiga kali sehari), 一[いっ]か月[げつ]に 一回[いっかい] (sebulan sekali). Untuk bertanya, pakai 何回[なんかい]: 一週間[いっしゅうかん]に 何回[なんかい] 料理[りょうり]を しますか.", "Untuk frekuensi, sebut rentang waktunya dulu, lalu に, lalu jumlah kali: 一週間[いっしゅうかん]に 三回[さんかい] = tiga kali seminggu.", "Kesalahan yang sering terjadi: tertukar 時[じ] (pukul) dan 時間[じかん] (lama jam). 二時[にじ]に 起[お]きました = bangun pukul dua; 二時間[にじかん] 勉強[べんきょう]しました = belajar selama dua jam. Begitu juga 三月[さんがつ] (bulan Maret) dan 三[さん]か月[げつ] (tiga bulan).", "Lama waktu tidak diberi に: 二時間[にじかん]に 勉強[べんきょう]しました salah. に hanya muncul dalam frekuensi, sesudah rentang waktunya."],
 ex:[["毎日[まいにち] 二時間[にじかん] 勉強[べんきょう]します。", "Setiap hari saya belajar dua jam."], ["一週間[いっしゅうかん]に 三回[さんかい] テニスを します。", "Saya bermain tenis tiga kali seminggu."], ["駅[えき]まで 歩[ある]いて 十五分[じゅうごふん]ぐらい かかります。", "Jalan kaki ke stasiun makan waktu sekitar 15 menit."]],
 q:["m|一週間[いっしゅうかん]___ 二回[にかい] 図書館[としょかん]へ 行[い]きます。|Saya pergi ke perpustakaan dua kali seminggu.|に|を|が|の", "m|兄[あに]は アメリカに ___ いました。|Kakak laki-laki saya tinggal di Amerika selama tiga bulan.|三[さん]か月[げつ]|三月[さんがつ]|三日[みっか]|三回[さんかい]", "o|一年[いちねん]/に/二回[にかい]/旅行[りょこう]します|Saya berwisata dua kali setahun.", "o|毎日[まいにち]/八時間[はちじかん]/働[はたら]きます|Setiap hari saya bekerja delapan jam.", "m|昨日[きのう]は ___ 寝[ね]ました。|Kemarin saya tidur selama enam jam.|六時間[ろくじかん]|六時[ろくじ]|六日[むいか]|六回[ろっかい]", "m|A: うちから 学校[がっこう]まで ___ かかりますか。 B: 自転車[じてんしゃ]で 二十分[にじゅっぷん]ぐらいです。|A: Dari rumah ke sekolah makan waktu berapa lama? B: Sekitar dua puluh menit naik sepeda.|どのくらい|何回[なんかい]|いつ|どこ", "o|毎晩[まいばん]/一時間[いちじかん]/本[ほん]を/読[よ]みます|Setiap malam saya membaca buku selama satu jam.|毎晩[まいばん]/本[ほん]を/一時間[いちじかん]/読[よ]みます", "o|父[ちち]は/一[いっ]か月[げつ]/に/一回[いっかい]/映画[えいが]を/見[み]ます|Ayah saya menonton film sebulan sekali.|父[ちち]は/映画[えいが]を/一[いっ]か月[げつ]/に/一回[いっかい]/見[み]ます"]},
{b:11,t:"～だけ (hanya)",d:"<b>だけ</b> berarti \"hanya\" atau \"saja\". Letakkan langsung sesudah kata benda atau kata jumlah: 水だけ, 一人だけ, 少しだけ. Partikel を dan が sesudah だけ boleh dihilangkan, jadi cukup 水だけ 飲みました.",
 r:["S + は + KB + だけ + KK (を/が boleh dihilangkan)", "K-tempat + に + KB + が + jumlah + だけ + あります/います", "KB + は + KB/jumlah + だけ + です"],
 s:"S + は + O + だけ + KK → 私[わたし]は お茶[ちゃ]だけ 飲[の]みます。",
 k:[["だけ", "Berarti \"hanya\" atau \"saja\", dan ditempel langsung <b>sesudah</b> kata yang dibatasi: 水[みず]だけ = hanya air."], ["を / が yang hilang", "Sesudah だけ, partikel を dan が boleh dihilangkan karena artinya sudah jelas: パンだけ 食[た]べました. Kalau ditulis pun tetap benar: パンだけを 食[た]べました."], ["一人[ひとり]だけ (jumlah + だけ)", "Untuk jumlah, だけ ditempel sesudah kata bilangannya: 一人[ひとり]だけ, 二回[にかい]だけ, 三十分[さんじゅっぷん]だけ. Posisi jumlah tetap sebelum kata kerja."], ["だけです", "Kalau bagian yang dibatasi menjadi predikat di akhir kalimat, tutup dengan です: 休[やす]みは 日曜日[にちようび]だけです (liburnya hanya hari Minggu)."]],
 x:["だけ membatasi jumlah atau jenis: \"hanya ini, tidak ada yang lain\". Kata ini bisa menempel pada kata benda (コーヒーだけ), kata bilangan (一[ひと]つだけ), dan kata waktu (日曜日[にちようび]だけ).", "Cara menyusun: tentukan kata yang dibatasi, tempelkan だけ di belakangnya; を atau が sesudahnya boleh dihapus. 牛乳[ぎゅうにゅう]を 飲[の]みます → 牛乳[ぎゅうにゅう]だけ 飲[の]みます.", "Dengan jumlah, posisinya tidak berubah, hanya ditambah だけ: テレビが 一台[いちだい] あります → テレビが 一台[いちだい]だけ あります (hanya ada satu televisi).", "Kesalahan yang sering terjadi: menaruh だけ di depan seperti kata \"hanya\" (だけ パン salah), atau menempelkannya pada kata kerja bentuk-ます (食[た]べますだけ salah). だけ menempel pada benda atau jumlah yang dibatasi.", "Untuk jawaban singkat, cukup KB + だけです. A: 何[なに]を 買[か]いましたか。 B: 卵[たまご]だけです."],
 ex:[["朝[あさ]は コーヒーだけ 飲[の]みます。", "Pagi hari saya hanya minum kopi."], ["休[やす]みは 一日[いちにち]だけです。", "Liburnya hanya satu hari."], ["日本語[にほんご]は 少[すこ]しだけ 分[わ]かります。", "Saya hanya mengerti sedikit bahasa Jepang."]],
 q:["m|昼[ひる]ご飯[はん]は パン___ 食[た]べました。|Untuk makan siang, saya hanya makan roti.|だけ|も|や|と", "m|この クラスの 留学生[りゅうがくせい]は 二人[ふたり]___です。|Pelajar asing di kelas ini hanya dua orang.|だけ|ぐらい|から|まで", "o|会議[かいぎ]/は/三十分[さんじゅっぷん]/だけ/です|Rapatnya hanya tiga puluh menit.", "o|妹[いもうと]/は/野菜[やさい]/だけ/食[た]べます|Adik perempuan saya hanya makan sayur.", "m|教室[きょうしつ]に 学生[がくせい]が 三人[さんにん]___ います。|Di kelas hanya ada tiga orang pelajar.|だけ|や|を|に", "m|この 店[みせ]は 土曜日[どようび]と 日曜日[にちようび]___ 休[やす]みです。|Toko ini hanya tutup pada hari Sabtu dan Minggu.|だけ|や|を|へ", "o|日本語[にほんご]の クラスに/男[おとこ]の人[ひと]が/一人[ひとり]/だけ/います|Di kelas bahasa Jepang hanya ada satu orang laki-laki.|男[おとこ]の人[ひと]が/日本語[にほんご]の クラスに/一人[ひとり]/だけ/います", "o|けさは/みかんを/一[ひと]つ/だけ/食[た]べました|Tadi pagi saya hanya makan satu buah jeruk."]},
{b:12,t:"Bentuk lampau: でした / ～かったです",d:"Kata benda dan kata sifat-な: です menjadi <b>でした</b>, negatifnya <b>じゃ ありませんでした</b>. Kata sifat-い: い diganti <b>かったです</b> (寒い → 寒かったです), negatifnya <b>くなかったです</b>. Kata sifat-い tidak memakai でした, jadi 寒いでした salah. Pengecualian: いい menjadi <b>よかったです</b> dan よくなかったです.",
 r:["KB / KS-na + でした / じゃ ありませんでした", "KS-i (tanpa い) + かったです / くなかったです", "いい → よ + かったです / くなかったです"],
 s:"K-waktu + は + KS-i (tanpa い) + かったです → 昨日[きのう]は 寒[さむ]かったです。",
 k:[["でした", "Bentuk lampau dari です, dipakai untuk kata benda dan kata sifat-な: 雨[あめ]でした, 静[しず]かでした. Kata benda dan kata sifat-な sendiri tidak berubah; yang berubah hanya です."], ["かったです", "Kata sifat-い berubah sendiri: い dibuang lalu diganti かった. です di belakangnya hanya penanda sopan dan tidak ikut berubah: 暑[あつ]い → 暑[あつ]かったです."], ["じゃ ありませんでした", "Negatif lampau untuk kata benda dan kata sifat-な, gabungan dari じゃ ありません + でした: 暇[ひま]じゃ ありませんでした (waktu itu tidak senggang)."], ["くなかったです", "Negatif lampau kata sifat-い. Asalnya negatif sekarang ～くないです, lalu ない diubah menjadi なかった: 高[たか]くないです → 高[たか]くなかったです."], ["よかったです", "いい adalah pengecualian. Semua bentuk turunannya memakai よ: よかったです, よくないです, よくなかったです. Bentuk いかったです tidak ada."]],
 x:["Bentuk ini menyatakan keadaan di masa lalu. Walaupun sudah ada kata waktu seperti 昨日[きのう], bentuk predikatnya tetap harus diubah ke bentuk lampau.", "Kata benda dan kata sifat-な: です → <b>でした</b>, じゃ ありません → <b>じゃ ありませんでした</b>. Contoh: 昨日[きのう]は 雪[ゆき]でした; 町[まち]は にぎやかじゃ ありませんでした.", "Kata sifat-い: buang い, tambah <b>かったです</b> (高[たか]い → 高[たか]かったです). Negatifnya <b>くなかったです</b> (高[たか]くなかったです). Pengecualian: いい → よかったです / よくなかったです.", "Untuk menanyakan kesan tentang sesuatu yang sudah lewat, pakai どうでしたか: パーティーは どうでしたか → とても おもしろかったです.", "Kesalahan yang sering terjadi: 寒[さむ]いでした (kata sifat-い tidak memakai でした), 寒[さむ]かったでした (tanda lampau dobel), dan 静[しず]かかったです (kata sifat-な tidak memakai かった). Hati-hati juga dengan きれい dan 嫌[きら]い: keduanya berakhiran い tetapi termasuk kata sifat-な, jadi lampaunya きれいでした dan 嫌[きら]いでした.", "Cara mudah mengingat: kata sifat-い menyimpan tanda lampau di dalam dirinya (かった), sedangkan kata benda dan kata sifat-な menitipkannya pada です (でした)."],
 ex:[["おとといは 雨[あめ]でした。", "Kemarin lusa hujan."], ["旅行[りょこう]は とても 楽[たの]しかったです。", "Perjalanannya sangat menyenangkan."], ["先週[せんしゅう]は 暇[ひま]じゃ ありませんでした。", "Minggu lalu saya tidak senggang."]],
 q:["m|けさは とても 寒[さむ]___。|Tadi pagi sangat dingin.|かったです|いでした|でした|くなかったです", "m|いい → ___|Bentuk lampau positif dari いいです|よかったです|いかったです|いいでした|よくなかったです", "m|昨日[きのう]は 休[やす]み___。|Kemarin bukan hari libur.|じゃ ありませんでした|じゃ ありません|くなかったです|でした", "o|先週[せんしゅう]/の/試験[しけん]/は/簡単[かんたん]/でした|Ujian minggu lalu mudah.", "m|おととい 公園[こうえん]で 紅葉[もみじ]を 見[み]ました。とても きれい___。|Kemarin lusa saya melihat daun musim gugur di taman. Indah sekali.|でした|かったです|いでした|くなかったです", "m|昨日[きのう]の 宿題[しゅくだい]は あまり ___。|PR kemarin tidak begitu sulit.|難[むずか]しくなかったです|難[むずか]しかったです|難[むずか]しいでした|難[むずか]しくないでした", "o|昨日[きのう]は/天気[てんき]が/よくなかった/です|Kemarin cuacanya tidak bagus.", "o|ホテルの/部屋[へや]は/あまり/静[しず]かじゃ/ありませんでした|Kamar hotelnya tidak begitu tenang."]},
{b:12,t:"A と B と どちらが ～ / ～の ほうが ～",d:"Untuk membandingkan dua hal, tanyakan <b>A と B と どちらが</b> + kata sifat + ですか. Jawab dengan <b>B の ほうが</b> + kata sifat + です (B yang lebih ...). Kalau keduanya sama, jawab <b>どちらも</b> + kata sifat + です. どちら dipakai untuk dua pilihan apa saja, termasuk orang dan tempat.",
 r:["KB1 + と + KB2 + と + どちら + が + KS + ですか", "KB + の + ほう + が + KS + です", "どちらも + KS + です"],
 s:"KB1 + と + KB2 + と + どちらが + KS + ですか → 牛肉[ぎゅうにく]と とり肉[にく]と どちらが 高[たか]いですか。",
 k:[["と … と", "Kedua pilihan disebut lebih dulu, masing-masing diberi と: 牛肉[ぎゅうにく]と とり肉[にく]と. と yang kedua menutup daftar pilihan, sehingga jelas yang dibandingkan hanya dua hal itu."], ["どちら", "Kata tanya \"yang mana\" untuk <b>dua</b> pilihan, apa pun jenisnya: benda, orang, tempat, atau waktu. Untuk orang pun tetap どちら, tidak memakai だれ."], ["が (sesudah どちら)", "Kata tanya yang menjadi subjek selalu memakai が, tidak memakai は. Jawabannya juga memakai が: ～の ほうが."], ["の ほう", "ほう berarti \"pihak\" atau \"sisi\". A の ほう berarti \"pihak A\", yaitu pilihan yang dipilih dari dua hal itu."], ["どちらも", "\"Dua-duanya\". Dipakai kalau kedua pilihan sama saja: どちらも 好[す]きです. Dengan bentuk negatif artinya \"dua-duanya tidak\": どちらも 好[す]きじゃ ありません."]],
 x:["Pola ini dipakai untuk bertanya dan menjawab mana yang \"lebih ...\" dari <b>dua</b> pilihan. Untuk tiga pilihan atau lebih, pakai pola ～で 何[なに]が いちばん ～ですか.", "Cara menyusun pertanyaan: (1) sebut kedua pilihan dengan と: 春[はる]と 秋[あき]と; (2) tambah どちらが; (3) kata sifat + ですか. Hasilnya: 春[はる]と 秋[あき]と どちらが 好[す]きですか.", "Cara menjawab: pilihan + の ほうが + kata sifat + です: 秋[あき]の ほうが 好[す]きです. Pembandingnya boleh ditambahkan dengan より: 春[はる]より 秋[あき]の ほうが 好[す]きです. Kalau sama saja, jawab どちらも 好[す]きです.", "Kesalahan yang sering terjadi: menjawab dengan は (秋[あき]は 好[す]きです tidak menjawab perbandingan), lupa の (秋[あき]ほうが salah), atau memakai どれ untuk dua pilihan.", "Untuk orang juga dipakai どちら: ミラーさんと サントスさんと どちらが 忙[いそが]しいですか. Jawabannya: ミラーさんの ほうが 忙[いそが]しいです."],
 ex:[["山[やま]と 海[うみ]と どちらが 好[す]きですか。", "Kamu lebih suka gunung atau laut?"], ["海[うみ]の ほうが 好[す]きです。", "Saya lebih suka laut."], ["どちらも 好[す]きです。", "Saya suka dua-duanya."]],
 q:["m|バス___ ほうが 安[やす]いです。|Bus yang lebih murah.|の|が|と|は", "m|インドネシアと 日本[にほん]と どちら___ 暑[あつ]いですか。|Mana yang lebih panas, Indonesia atau Jepang?|が|は|を|の", "o|インドネシア/の/ほう/が/暑[あつ]い/です|Indonesia yang lebih panas.", "o|犬[いぬ]/と/猫[ねこ]/と/どちらが/好[す]きですか|Kamu lebih suka anjing atau kucing?|猫[ねこ]/と/犬[いぬ]/と/どちらが/好[す]きですか", "m|コーヒーと 紅茶[こうちゃ]と ___が 好[す]きですか。|Kamu lebih suka kopi atau teh?|どちら|どれ|何[なに]|だれ", "m|A: 肉[にく]と 魚[さかな]と どちらが 好[す]きですか。 B: ___ 好[す]きです。|A: Kamu lebih suka daging atau ikan? B: Saya suka dua-duanya.|どちらも|どちらが|どちらか|どちらの", "o|日本語[にほんご]/と/英語[えいご]/と/どちらが/難[むずか]しいですか|Mana yang lebih sulit, bahasa Jepang atau bahasa Inggris?|英語[えいご]/と/日本語[にほんご]/と/どちらが/難[むずか]しいですか", "o|バスより/電車[でんしゃ]の/ほうが/ずっと/便利[べんり]です|Kereta jauh lebih praktis daripada bus.|電車[でんしゃ]の/ほうが/バスより/ずっと/便利[べんり]です"]},
{b:12,t:"～で 何が いちばん ～ですか",d:"Untuk menanyakan yang paling ... di antara tiga hal atau lebih, pakai lingkup + <b>で</b> + kata tanya + <b>が いちばん</b> + kata sifat + ですか, misalnya 果物で (di antara buah-buahan). Pilih kata tanya sesuai jawabannya: 何 untuk benda, どこ untuk tempat, だれ untuk orang, いつ untuk waktu. Jawabannya <b>N が いちばん</b> + kata sifat + です.",
 r:["KB (lingkup) + (の 中[なか]) + で + 何[なに]/どこ/だれ/いつ + が + いちばん + KS + ですか", "KB + が + いちばん + KS + です"],
 s:"lingkup + で + kata tanya + が + いちばん + KS + ですか → スポーツで 何[なに]が いちばん 好[す]きですか。",
 k:[["で", "Menandai lingkup atau kelompok yang dibandingkan (\"di antara ...\", \"dalam ...\"): クラスで, 一年[いちねん]で, 果物[くだもの]で. Di sini で menandai batas kelompok yang dibandingkan, bukan tempat kegiatan."], ["何[なに]・どこ・だれ・いつ + が", "Pilih kata tanya sesuai jawaban yang diharapkan: 何[なに] untuk benda, どこ untuk tempat, だれ untuk orang, いつ untuk waktu. Kata tanya yang menjadi subjek selalu memakai が."], ["いちばん", "Berarti \"paling\" (arti aslinya \"nomor satu\"). Diletakkan di depan bagian yang diterangkan, biasanya tepat sebelum kata sifat: いちばん 高[たか]いです."], ["が (dalam jawaban)", "Jawaban juga memakai が karena benda itulah jawaban atas kata tanya: すしが いちばん 好[す]きです."], ["の 中[なか]で", "Lingkup boleh dipertegas dengan の 中[なか]で (\"di antara\"): 友達[ともだち]の 中[なか]で. Artinya sama dengan で saja."]],
 x:["Pola ini membandingkan <b>tiga hal atau lebih</b> dan menanyakan mana yang \"paling ...\". Untuk dua pilihan saja, pakai どちら.", "Cara menyusun: (1) lingkup + で (家族[かぞく]で, 日本[にほん]で); (2) kata tanya + が; (3) いちばん + kata sifat + ですか. Contoh: 日本[にほん]で どこが いちばん 寒[さむ]いですか.", "Cara menjawab: ganti kata tanya dengan jawabannya, partikel が tetap. クラスで だれが いちばん 元気[げんき]ですか → ワンさんが いちばん 元気[げんき]です. Dalam percakapan, jawaban singkat ワンさんです juga wajar.", "Kesalahan yang sering terjadi: memakai は sesudah kata tanya (何[なに]は いちばん ～ salah), atau memakai どちら untuk tiga pilihan atau lebih.", "いちばん juga bisa dipakai dalam kalimat biasa tanpa pertanyaan: この 店[みせ]で この カレーが いちばん おいしいです."],
 ex:[["果物[くだもの]で 何[なに]が いちばん 好[す]きですか。", "Di antara buah-buahan, kamu paling suka apa?"], ["みかんが いちばん 好[す]きです。", "Saya paling suka jeruk."], ["クラスで だれが いちばん 日本語[にほんご]が 上手[じょうず]ですか。", "Di kelas, siapa yang paling pandai bahasa Jepang?"]],
 q:["m|インドネシアは 一年[いちねん]で ___が いちばん 暑[あつ]いですか。|Di Indonesia, kapan paling panas dalam setahun?|いつ|どこ|だれ|何[なに]", "m|家族[かぞく]で ___が いちばん 忙[いそが]しいですか。|Di keluargamu, siapa yang paling sibuk?|だれ|いつ|どこ|何[なに]", "o|この/町[まち]で/どこが/いちばん/にぎやかですか|Di kota ini, tempat mana yang paling ramai?|どこが/この/町[まち]で/いちばん/にぎやかですか", "o|父[ちち]/が/いちばん/忙[いそが]しい/です|Ayah yang paling sibuk.", "m|飲[の]み物[もの]___ 何[なに]が いちばん 好[す]きですか。|Di antara minuman, kamu paling suka apa?|で|に|を|へ", "m|友達[ともだち]の 中[なか]で だれ___ いちばん 料理[りょうり]が 上手[じょうず]ですか。|Di antara teman-temanmu, siapa yang paling pandai memasak?|が|は|を|で", "o|インドネシア料理[りょうり]で/何[なに]が/いちばん/おいしいですか|Di antara masakan Indonesia, apa yang paling enak?|何[なに]が/インドネシア料理[りょうり]で/いちばん/おいしいですか", "o|一週間[いっしゅうかん]で/金曜日[きんようび]が/いちばん/忙[いそが]しいです|Dalam seminggu, hari Jumat yang paling sibuk.|金曜日[きんようび]が/一週間[いっしゅうかん]で/いちばん/忙[いそが]しいです"]},
{b:13,t:"N が ほしいです",d:"<b>N が ほしいです</b> berarti ingin memiliki suatu benda; bendanya ditandai が. ほしい adalah kata sifat-い, jadi negatifnya ほしくないです. Kalau ingin melakukan sesuatu, pakai ～たいです. Pola ini hanya untuk keinginan sendiri atau untuk bertanya kepada lawan bicara, tidak untuk orang ketiga.",
 r:["S + は + KB + が + ほしいです", "S + は + 何[なに] + が + ほしいですか", "S + は + KB + が + ほしくないです / ほしかったです"],
 s:"S + は + KB + が + ほしいです → 私[わたし]は 新[あたら]しい 自転車[じてんしゃ]が ほしいです。",
 k:[["が", "Benda yang diinginkan ditandai が, tidak memakai を, karena ほしい adalah kata sifat, bukan kata kerja. Kata sifat tidak punya objek, jadi bendanya ditandai が, sama seperti pada ～が 好[す]きです."], ["ほしい", "Kata sifat-い yang berarti \"ingin memiliki\". Bentuknya berubah seperti 高[たか]い: ほしくないです (tidak ingin), ほしかったです (dulu ingin)."], ["です", "Menutup kalimat dengan sopan, sama seperti kata sifat-い lain (高[たか]いです). Bentuk ほしいます tidak ada karena ほしい bukan kata kerja."], ["私[わたし]は (diri sendiri)", "Pola ini dipakai untuk keinginan pembicara sendiri, atau untuk bertanya langsung kepada lawan bicara (何[なに]が ほしいですか). Keinginan orang ketiga tidak diungkapkan dengan ～が ほしいです."], ["ほしい atau ～たい", "ほしい untuk <b>benda</b> (ingin punya), ～たい untuk <b>kegiatan</b> (ingin melakukan). Ingin punya mobil: 車[くるま]が ほしいです. Ingin minum air: 水[みず]が 飲[の]みたいです."]],
 x:["Pola ini menyatakan bahwa pembicara ingin memiliki atau mendapatkan suatu benda. Dalam bentuk pertanyaan, pola ini menanyakan keinginan lawan bicara: お土産[みやげ]は 何[なに]が ほしいですか.", "Cara menyusun: (1) 私[わたし]は, yang sering dihilangkan; (2) benda + が; (3) ほしいです. Bendanya boleh diberi kata sifat: 大[おお]きい 冷蔵庫[れいぞうこ]が ほしいです.", "Bentuknya berubah seperti kata sifat-い: ほしくないです (negatif), ほしかったです (lampau), ほしくなかったです (negatif lampau).", "Kesalahan yang sering terjadi: memakai を (カメラを ほしいです salah), menambah ます (ほしいます salah), atau memakai ほしい untuk kegiatan (旅行[りょこう]が ほしいです salah; yang benar 旅行[りょこう]したいです).", "Seperti ～たいですか, pertanyaan ～が ほしいですか kurang sopan kalau diajukan kepada atasan atau tamu. Untuk menawarkan sesuatu, pakai ～は いかがですか."],
 ex:[["私[わたし]は 新[あたら]しい パソコンが ほしいです。", "Saya ingin punya komputer baru."], ["誕生日[たんじょうび]に 何[なに]が ほしいですか。", "Untuk ulang tahun, kamu ingin apa?"], ["今[いま]は 何[なに]も ほしくないです。", "Sekarang saya tidak ingin apa-apa."]],
 q:["m|私[わたし]は カメラ___ ほしいです。|Saya ingin punya kamera.|が|を|に|で", "m|新[あたら]しい 靴[くつ]が ___。|Saya ingin sepatu baru.|ほしいです|ほしいます|ほしいでした|ほしくないです", "o|私[わたし]/は/広[ひろ]い/部屋[へや]/が/ほしいです|Saya ingin kamar yang luas.", "m|のどが かわきました。水[みず]が 飲[の]み___。|Saya haus. Saya ingin minum air.|たいです|ほしいです|たくないです|ました", "m|A: 新[あたら]しい ケータイが ほしいですか。 B: いいえ、___。|A: Kamu ingin punya ponsel baru? B: Tidak, saya tidak ingin.|ほしくないです|ほしいじゃ ありません|ほしいません|ほしくなかったです", "m|A: 何[なに]か 飲[の]みたいですか。 B: ええ、冷[つめ]たい ジュースが ___。|A: Kamu ingin minum sesuatu? B: Ya, saya ingin jus dingin.|ほしいです|飲[の]みます|ほしいます|飲[の]みたくないです", "o|私[わたし]は/日本人[にほんじん]の/友達[ともだち]が/ほしいです|Saya ingin punya teman orang Jepang.", "o|去年[きょねん]は/大[おお]きい/テレビが/ほしかったです|Tahun lalu saya ingin punya televisi besar."]},
{b:13,t:"Tempat へ ～に 行きます (tujuan)",d:"Tujuan kepergian ditulis sebelum <b>に</b>: Tempat へ + tujuan + に + 行きます / 来ます / 帰ります. Tujuannya bisa kata kerja bentuk ます tanpa ます (買います → <b>買いに</b>) atau kata benda kegiatan seperti 買い物, 食事, 散歩 (<b>散歩に</b> 行きます). Objeknya tetap memakai を: パンを 買いに 行きます.",
 r:["S + は + K-tempat + へ + (O + を) + KK-ます(tanpa ます) + に + 行[い]きます", "S + は + K-tempat + へ + KB (kegiatan) + に + 行[い]きます", "S + は + K-tempat + へ + KK-ます(tanpa ます) + に + 来[き]ます/帰[かえ]ります"],
 s:"S + は + K-tempat + へ + O + を + KK-ます(tanpa ます) + に + 行[い]きます → 私[わたし]は 郵便局[ゆうびんきょく]へ 荷物[にもつ]を 送[おく]りに 行[い]きます。",
 k:[["へ", "Menandai tempat tujuan perjalanan (\"ke\"). に juga boleh, tetapi pola ini biasanya memakai へ supaya tidak ada dua に yang berdekatan."], ["買[か]い (ます dibuang)", "Kegiatan yang menjadi tujuan memakai bentuk-ます yang ます-nya dibuang: 買[か]います → 買[か]い, 見[み]ます → 見[み], 勉強[べんきょう]します → 勉強[べんきょう]し."], ["に (tujuan)", "に di sini berarti \"untuk\". Ia ditempel pada kegiatan tujuan, lalu langsung diikuti kata kerja gerak: 買[か]いに 行[い]きます."], ["を", "Objek dari kegiatan tujuan tetap memakai を: 本[ほん]を 借[か]りに 行[い]きます. Partikelnya tidak berubah."], ["散歩[さんぽ]に (kata benda kegiatan)", "Kata benda kegiatan seperti 散歩[さんぽ], 買[か]い物[もの], 食事[しょくじ], 旅行[りょこう], dan 釣[つ]り langsung diberi に tanpa します: 買[か]い物[もの]に 行[い]きます."], ["行[い]きます・来[き]ます・帰[かえ]ります", "Pola ini hanya dipakai dengan kata kerja gerak. Kata kerja lain tidak bisa dipakai di akhir: 買[か]いに 食[た]べます salah."]],
 x:["Pola ini menyatakan <b>tujuan</b> pergi, datang, atau pulang: \"pergi ke ... untuk ...\". Kata kerja di akhir selalu kata kerja gerak: 行[い]きます, 来[き]ます, atau 帰[かえ]ります.", "Cara menyusun: (1) tempat + へ; (2) objek + を, kalau ada; (3) kata kerja tujuan dalam bentuk-ます tanpa ます (買[か]います → 買[か]い); (4) に; (5) 行[い]きます. Hasilnya: スーパーへ 野菜[やさい]を 買[か]いに 行[い]きます.", "Untuk kata kerja します, bentuk tanpa ます-nya adalah し: 友達[ともだち]の うちへ 料理[りょうり]を しに 行[い]きます. Kata benda kegiatan cukup diberi に: 散歩[さんぽ]に, 食事[しょくじ]に, 買[か]い物[もの]に.", "Untuk menanyakan tujuannya, pakai 何[なに]を しに: 日本[にほん]へ 何[なに]を しに 行[い]きますか. Bentuk lampau cukup mengubah kata kerja geraknya: 買[か]いに 行[い]きました.", "Kesalahan yang sering terjadi: memakai bentuk ます lengkap atau bentuk たい (買[か]いますに dan 買[か]いたいに salah), atau menaruh 行[い]きます di depan. Kata kerja gerak selalu di akhir kalimat.", "Tempat dan tujuan boleh bertukar posisi: プールへ 泳[およ]ぎに 行[い]きます dan 泳[およ]ぎに プールへ 行[い]きます sama-sama benar."],
 ex:[["図書館[としょかん]へ 本[ほん]を 借[か]りに 行[い]きます。", "Saya pergi ke perpustakaan untuk meminjam buku."], ["友達[ともだち]が うちへ 遊[あそ]びに 来[き]ました。", "Teman datang ke rumah untuk bermain."], ["週末[しゅうまつ] 川[かわ]へ 釣[つ]りに 行[い]きました。", "Akhir pekan lalu saya pergi memancing ke sungai."]],
 q:["m|デパートへ 靴[くつ]を ___に 行[い]きます。|Saya pergi ke toserba untuk membeli sepatu.|買[か]い|買[か]います|買[か]いたい|買[か]いました", "m|駅[えき]へ 友達[ともだち]を 迎[むか]え___ 行[い]きます。|Saya pergi ke stasiun untuk menjemput teman.|に|へ|で|を", "o|海[うみ]へ/泳[およ]ぎ/に/行[い]きました|Saya pergi berenang ke laut.|泳[およ]ぎ/に/海[うみ]へ/行[い]きました", "m|日曜日[にちようび] 公園[こうえん]へ 散歩[さんぽ]___ 行[い]きます。|Hari Minggu saya pergi jalan-jalan ke taman.|に|を|で|が", "m|日本[にほん]へ 日本語[にほんご]を 勉強[べんきょう]___に 来[き]ました。|Saya datang ke Jepang untuk belajar bahasa Jepang.|し|します|しました|したい", "m|美術館[びじゅつかん]へ 絵[え]を ___に 行[い]きました。|Saya pergi ke museum seni untuk melihat lukisan.|見[み]|見[み]ます|見[み]たい|見[み]ました", "o|公園[こうえん]へ/写真[しゃしん]を/撮[と]りに/行[い]きます|Saya pergi ke taman untuk memotret.|写真[しゃしん]を/撮[と]りに/公園[こうえん]へ/行[い]きます", "o|友達[ともだち]が/うちへ/晩[ばん]ご飯[はん]を/食[た]べに/来[き]ます|Teman saya datang ke rumah untuk makan malam.|友達[ともだち]が/晩[ばん]ご飯[はん]を/食[た]べに/うちへ/来[き]ます|うちへ/友達[ともだち]が/晩[ばん]ご飯[はん]を/食[た]べに/来[き]ます"]},
{b:13,t:"どこか / 何か",d:"<b>どこか</b> berarti suatu tempat dan <b>何か</b> berarti sesuatu; partikel へ dan を sesudahnya boleh dihilangkan. どこか 行きますか artinya \"pergi ke suatu tempat?\" dan dijawab はい atau いいえ, sedangkan どこへ 行きますか menanyakan \"ke mana?\". Jawaban negatifnya memakai どこも / 何も + bentuk negatif: いいえ、何も 食べませんでした.",
 r:["S + は + どこか + (へ) + 行[い]きますか", "S + は + 何[なに]か + (を) + KK-ますか", "いいえ + どこも/何[なに]も + KK-ません/ませんでした"],
 s:"S + は + 何[なに]か + KK-ます(tanpa ます) + たいです → 私[わたし]は 何[なに]か 買[か]いたいです。",
 k:[["か (sesudah kata tanya)", "Kata tanya + か membentuk kata tak tentu: 何[なに]か = sesuatu, どこか = suatu tempat. か di sini bagian dari kata itu, jadi tidak membuat kalimat menjadi pertanyaan."], ["を / へ dihilangkan", "Sesudah 何[なに]か dan どこか, partikel を dan へ boleh dihilangkan: 何[なに]か 食[た]べます, どこか 行[い]きます."], ["はい / いいえ", "Pertanyaan dengan 何[なに]か atau どこか adalah pertanyaan ya/tidak, jadi dijawab はい atau いいえ dulu. Pertanyaan dengan 何[なに]を atau どこへ menanyakan isinya, jadi dijawab langsung dengan benda atau tempatnya."], ["何[なに]も・どこも + negatif", "\"Tidak ... apa-apa\" dan \"tidak ... ke mana-mana\" memakai 何[なに]も atau どこも + bentuk negatif: 何[なに]も 買[か]いませんでした. Kedua kata ini selalu berpasangan dengan bentuk negatif."]],
 x:["何[なに]か berarti \"sesuatu\" dan どこか berarti \"suatu tempat\". Keduanya dipakai kalau bendanya atau tempatnya belum pasti atau tidak penting untuk disebut.", "Cara menyusun: taruh 何[なに]か atau どこか di posisi objek atau tempat; を atau へ sesudahnya boleh dihilangkan. 何[なに]かを 食[た]べます → 何[なに]か 食[た]べます; どこかへ 行[い]きます → どこか 行[い]きます.", "Bedakan tiga bentuk ini. 何[なに]を 飲[の]みましたか = minum apa? (dijawab: お茶[ちゃ]を 飲[の]みました). 何[なに]か 飲[の]みましたか = sudah minum sesuatu? (dijawab はい atau いいえ). 何[なに]も 飲[の]みませんでした = tidak minum apa-apa.", "Jawaban positif biasanya menyebut isinya: A: 昨日[きのう] どこか 行[い]きましたか。 B: はい、図書館[としょかん]へ 行[い]きました.", "Kesalahan yang sering terjadi: memakai 何[なに]も dengan bentuk positif (何[なに]も 食[た]べました salah), atau tertukar 何[なに]か (untuk kalimat positif dan pertanyaan) dengan 何[なに]も (untuk kalimat negatif).", "何[なに]か juga sering dipakai dalam ajakan dan keinginan: 何[なに]か 見[み]ませんか (mau menonton sesuatu?), 何[なに]か 読[よ]みたいです (ingin membaca sesuatu)."],
 ex:[["週末[しゅうまつ] どこか 行[い]きましたか。", "Akhir pekan kemarin kamu pergi ke suatu tempat?"], ["いいえ、どこも 行[い]きませんでした。", "Tidak, saya tidak pergi ke mana-mana."], ["のどが かわきましたから、何[なに]か 飲[の]みたいです。", "Saya haus, jadi ingin minum sesuatu."]],
 q:["m|おなかが すきましたから、___ 食[た]べませんか。|Saya lapar. Bagaimana kalau kita makan sesuatu?|何[なに]か|何[なに]も|何[なに]を|どこか", "m|日曜日[にちようび] ___ 行[い]きますか。|Hari Minggu kamu pergi ke suatu tempat?|どこか|どこ|どこも|何[なに]か", "o|かばんの/中[なか]に/何[なに]か/ありますか|Apakah ada sesuatu di dalam tas?|何[なに]か/かばんの/中[なか]に/ありますか", "m|A: 何[なに]か 食[た]べましたか。 B: いいえ、___ 食[た]べませんでした。|A: Kamu sudah makan sesuatu? B: Tidak, saya tidak makan apa-apa.|何[なに]も|何[なに]か|何[なに]を|何[なに]が", "m|A: 昨日[きのう] デパートで ___ 買[か]いましたか。 B: はい、シャツを 買[か]いました。|A: Kemarin kamu membeli sesuatu di toserba? B: Ya, saya membeli kemeja.|何[なに]か|何[なに]を|何[なに]も|どこか", "m|A: 来週[らいしゅう] どこか 行[い]きますか。 B: ___、バリへ 行[い]きます。|A: Minggu depan kamu pergi ke suatu tempat? B: Ya, saya pergi ke Bali.|ええ|いいえ|どこへ|何[なに]か", "o|週末[しゅうまつ]は/どこか/行[い]きたい/です|Akhir pekan ini saya ingin pergi ke suatu tempat.", "o|昨日[きのう]は/何[なに]も/買[か]いませんでした|Kemarin saya tidak membeli apa-apa."]},
{b:14,t:"Kelompok kata kerja (I・II・III)",d:"Lihat bunyi tepat sebelum ます: bunyi <b>-i</b> (書きます, 飲みます, 帰ります) umumnya <b>Kelompok I</b>. Bunyi <b>-e</b> (食べます, 寝ます) selalu <b>Kelompok II</b>, begitu juga beberapa kata berbunyi -i yang perlu dihafal: 見ます, 起きます, 借ります, います. <b>Kelompok III</b> hanya します (termasuk 勉強します, 散歩します) dan 来ます. Kelompok ini menentukan cara membuat bentuk-て.",
 r:["Kelompok I: bunyi -i + ます (書[か]きます, 飲[の]みます, 帰[かえ]ります)", "Kelompok II: bunyi -e + ます (食[た]べます, 寝[ね]ます); juga 見[み]ます, 起[お]きます, 借[か]ります, います", "Kelompok III: します, KB + します (勉強[べんきょう]します), 来[き]ます"],
 s:"KK-て + ください (bentuk-て tergantung kelompok) → 待[ま]って ください (I), 食[た]べて ください (II), 来[き]て ください (III)",
 k:[["Bunyi sebelum ます", "Bunyi inilah petunjuk utama kelompok. Bunyi -i seperti か<b>き</b>ます dan よ<b>み</b>ます biasanya Kelompok I, sedangkan bunyi -e seperti た<b>べ</b>ます dan <b>ね</b>ます selalu Kelompok II."], ["Kelompok I", "Kelompok terbesar. Bentuk-て-nya berubah mengikuti bunyi sebelum ます (き → いて, み → んで, り → って, dan seterusnya), jadi kelompok ini paling perlu dilatih."], ["Kelompok II", "Paling mudah: buang ます, tambah て (食[た]べます → 食[た]べて). Ada beberapa kata berbunyi -i yang ikut kelompok ini, misalnya 見[み]ます dan 起[お]きます, jadi kata-kata itu harus dihafal."], ["Kelompok III", "Hanya します (termasuk KB + します seperti 勉強[べんきょう]します) dan 来[き]ます. Bentuknya tidak beraturan, jadi langsung dihafal: して dan 来[き]て."]],
 x:["<b>Kenapa perlu dikelompokkan?</b> Kata kerja Jepang berubah bentuk (sekarang bentuk-て, nanti bentuk lain di bab berikutnya), dan cara mengubahnya berbeda untuk tiap kelompok. Jadi sebelum mengubah kata kerja, tentukan dulu kelompoknya.", "<b>Langkah 1:</b> lihat bunyi tepat sebelum ます. Bunyi -i (い, き, ぎ, し, ち, に, び, み, り) biasanya Kelompok I: 使[つか]います, 書[か]きます, 急[いそ]ぎます, 話[はな]します, 待[ま]ちます, 呼[よ]びます, 読[よ]みます, 取[と]ります. Kecuali します itu sendiri dan 来[き]ます, yang masuk Kelompok III.", "<b>Langkah 2:</b> bunyi -e (け, せ, ね, べ, め, で, dan lain-lain) selalu Kelompok II: 開[あ]けます, 見[み]せます, 寝[ね]ます, 食[た]べます, 閉[し]めます, 出[で]ます. Beberapa kata berbunyi -i juga Kelompok II dan harus dihafal: 見[み]ます, 起[お]きます, 借[か]ります, います.", "<b>Langkah 3:</b> します, semua KB + します (勉強[べんきょう]します, 散歩[さんぽ]します, コピーします), dan 来[き]ます adalah Kelompok III.", "<b>Kesalahan umum:</b> menganggap 借[か]ります atau 起[お]きます sebagai Kelompok I, lalu membuat ✗ 借[か]って atau ✗ 起[お]いて. Yang benar 借[か]りて dan 起[お]きて. Sebaliknya, kata berakhiran ～ります seperti 帰[かえ]ります, 取[と]ります, 座[すわ]ります, dan 入[はい]ります tetap Kelompok I: 帰[かえ]って, 入[はい]って.", "<b>Tips:</b> setiap kali belajar kata kerja baru, hafalkan tiga hal sekaligus: bentuk ます, kelompok, dan bentuk-て. Contoh: 待[ま]ちます (I) → 待[ま]って; 見[み]せます (II) → 見[み]せて; 来[き]ます (III) → 来[き]て."],
 ex:[["毎朝[まいあさ] 新聞[しんぶん]を 読[よ]みます。", "Setiap pagi saya membaca koran. (yo-mi-masu: bunyi -i, Kelompok I)"], ["毎晩[まいばん] テレビを 見[み]ます。", "Setiap malam saya menonton TV. (mi-masu: bunyi -i, tetapi Kelompok II)"], ["明日[あした] 友達[ともだち]が うちへ 来[き]ます。", "Besok teman datang ke rumah. (ki-masu: Kelompok III)"]],
 q:["m|Kelompok I → ___|Kata kerja mana yang termasuk Kelompok I?|帰[かえ]ります|食[た]べます|見[み]ます|来[き]ます", "m|Kelompok II → ___|Kata kerja mana yang termasuk Kelompok II?|借[か]ります|話[はな]します|待[ま]ちます|勉強[べんきょう]します", "m|起[お]きます → ___|Bentuk-て dari 起きます (Kelompok II)|起[お]きて|起[お]いて|起[お]って|起[お]きって", "o|電気[でんき]/を/つけて/ください|Tolong nyalakan lampunya.", "m|Kelompok III → ___|Kata kerja mana yang termasuk Kelompok III?|コピーします|話[はな]します|貸[か]します|消[け]します", "m|入[はい]ります → ___|Bentuk-て dari 入ります|入[はい]って|入[はい]りて|入[はい]んで|入[はい]いて", "o|すみませんが、/ちょっと/手伝[てつだ]って/ください|Maaf, tolong bantu saya sebentar.", "o|明日[あした]/また/来[き]て/ください|Tolong datang lagi besok.|また/明日[あした]/来[き]て/ください"]},
{b:14,t:"～ましょうか (menawarkan bantuan)",d:"Bentuk ます tanpa ます + <b>ましょうか</b> dipakai untuk menawarkan bantuan, artinya \"Perlu saya ...?\". Yang melakukannya adalah pembicara sendiri. Jawab <b>ええ、お願いします</b> kalau mau dibantu, atau <b>いいえ、けっこうです</b> kalau tidak perlu.",
 r:["(O + を) + KK-ます (buang ます) + ましょうか", "Jawaban: ええ、 + お願[ねが]いします / いいえ、 + けっこうです"],
 s:"O + を + KK + ましょうか → ドアを 開[あ]けましょうか。",
 k:[["ましょう", "Bentuk yang sudah dikenal dari ajakan 'mari ...' (Bab 6). Di sini ia menyatakan kesediaan pembicara untuk melakukan perbuatan itu sendiri."], ["か", "Mengubah kesediaan itu menjadi pertanyaan. Pembicara bertanya dulu apakah lawan bicara mau dibantu, jadi ましょう + か berarti 'Perlu saya ...?'."], ["Tanpa 私[わたし]は", "Yang akan melakukan sudah jelas pembicara sendiri, jadi 私[わたし]は biasanya tidak diucapkan."], ["お願[ねが]いします / けっこうです", "Dua jawaban untuk tawaran. ええ、お願[ねが]いします berarti 'ya, tolong'; いいえ、けっこうです menolak dengan sopan: 'tidak usah, terima kasih'."]],
 x:["<b>Fungsi:</b> menawarkan diri untuk melakukan sesuatu bagi lawan bicara, 'Perlu saya ...?'. Biasanya diucapkan setelah melihat orang lain repot atau butuh bantuan. Contoh: コピーしましょうか (Perlu saya fotokopikan?), 電気[でんき]を つけましょうか (Perlu saya nyalakan lampunya?).", "<b>Cara membentuk:</b> ambil bentuk ます, ganti ます dengan ましょうか. 持[も]ちます → 持[も]ちましょうか, 呼[よ]びます → 呼[よ]びましょうか, 見[み]せます → 見[み]せましょうか, コピーします → コピーしましょうか. Caranya sama untuk ketiga kelompok, jadi tidak perlu bentuk-て.", "<b>Dua arti ～ましょうか:</b> di Bab 14 artinya tawaran 'perlu saya ...?'. Kalau dipakai untuk kegiatan bersama, misalnya いっしょに 行[い]きましょうか atau 何時[なんじ]に 会[あ]いましょうか, artinya ajakan atau usul 'bagaimana kalau kita ...?'. Konteks yang menentukan.", "<b>Cara menjawab:</b> menerima → ええ、お願[ねが]いします atau すみません、お願[ねが]いします. Menolak → いいえ、けっこうです. Bisa juga menerima sambil memberi petunjuk dengan ～て ください: ええ、じゃ、窓[まど]を 閉[し]めて ください.", "<b>Kesalahan umum:</b> menjawab tawaran dengan ✗ ええ、開[あ]けましょう. Jawaban itu terdengar seperti mengajak membuka bersama-sama. Karena yang menawarkan akan melakukannya sendiri, cukup jawab ええ、お願[ねが]いします."],
 ex:[["荷物[にもつ]が 多[おお]いですね。一[ひと]つ 持[も]ちましょうか。", "Barangnya banyak, ya. Perlu saya bawakan satu?"], ["地図[ちず]を 書[か]きましょうか。", "Perlu saya gambarkan petanya?"], ["いいえ、けっこうです。", "Tidak usah, terima kasih."]],
 q:["m|暑[あつ]いですね。エアコンを つけ___。|Panas, ya. Perlu saya nyalakan AC-nya?|ましょうか|ませんか|てください|ました", "m|A: 傘[かさ]を 貸[か]しましょうか。 B: ええ、___。|A: Perlu saya pinjamkan payung? B: Ya, tolong.|お願[ねが]いします|けっこうです|貸[か]しましょう|どういたしまして", "o|寒[さむ]いですね。/窓[まど]/を/閉[し]めましょうか|Dingin, ya. Perlu saya tutup jendelanya?", "m|大変[たいへん]ですね。___。|Repot, ya. Perlu saya bantu?|手伝[てつだ]いましょうか|手伝[てつだ]いませんか|手伝[てつだ]って ください|手伝[てつだ]いました", "m|A: タクシーを 呼[よ]びましょうか。 B: いいえ、___。 駅[えき]は 近[ちか]いですから。|A: Perlu saya panggilkan taksi? B: Tidak usah, terima kasih. Stasiunnya dekat.|けっこうです|お願[ねが]いします|呼[よ]びましょう|どういたしまして", "m|見[み]せます → ___|Bentuk tawaran 'Perlu saya perlihatkan?' dari 見せます|見[み]せましょうか|見[み]せて ましょうか|見[み]せませんか|見[み]せましたか", "o|すみません、/写真[しゃしん]を/撮[と]りましょうか|Permisi, perlu saya fotokan?", "o|この/問題[もんだい]の/答[こた]えを/教[おし]えましょうか|Perlu saya beri tahu jawaban soal ini?"]},
{b:15,t:"～ても いいですか (minta izin)",d:"Bentuk-て + <b>も いいですか</b> dipakai untuk meminta izin: \"Bolehkah saya ...?\". Kalau boleh, jawab ええ、いいですよ atau どうぞ; kalau tidak, jawab dengan halus すみません、ちょっと…. Tanpa か, <b>～ても いいです</b> berarti \"boleh ...\".",
 r:["(O + を) + KK-て + も + いいですか", "(O + を) + KK-て + も + いいです (memberi izin)", "Jawaban: ええ、 + いいですよ / ええ、 + どうぞ / すみません、 + ちょっと…"],
 s:"O + を + KK-て + も + いいですか → この カタログを 見[み]ても いいですか。",
 k:[["KK-て", "Bentuk-て di sini bekerja bersama も. Kata kerja harus diubah ke bentuk-て dulu, baru bisa ditambah も いいですか."], ["も", "Gabungan ～ても berarti 'walaupun ...' atau 'kalaupun ...'. Jadi ～ても いいです harfiahnya 'kalaupun dilakukan, tidak apa-apa', yaitu 'boleh'."], ["いいです", "Kata sifat いい (baik). Dalam pola ini artinya 'tidak apa-apa' atau 'boleh'."], ["か", "Penanda pertanyaan. Dengan か, kalimat menjadi permintaan izin 'Bolehkah ...?'. Tanpa か, kalimat memberi izin: '... boleh'."]],
 x:["<b>Fungsi:</b> ～ても いいですか dipakai untuk meminta izin dengan sopan, dan ～ても いいです untuk memberi izin. Contoh: テレビを つけても いいですか (Bolehkah saya menyalakan TV?).", "<b>Cara membentuk:</b> bentuk-て + も いいですか. 使[つか]います → 使[つか]っても, 書[か]きます → 書[か]いても, 帰[かえ]ります → 帰[かえ]っても, 見[み]ます → 見[み]ても, 研究[けんきゅう]します → 研究[けんきゅう]しても, 来[き]ます → 来[き]ても. Kalau bentuk-て berakhiran で, hasilnya でも: 読[よ]んでも, 休[やす]んでも.", "<b>Cara menjawab:</b> kalau boleh → ええ、いいですよ atau ええ、どうぞ. Kalau tidak boleh, jawaban halusnya すみません、ちょっと…, sedangkan jawaban tegasnya いいえ、いけません (pola berikutnya). Dalam percakapan sehari-hari, jawaban halus lebih aman.", "<b>Kesopanan:</b> permintaan izin biasanya dibuka dengan すみません、atau あのう、supaya terdengar lebih halus: あのう、窓[まど]を 開[あ]けても いいですか (Maaf, bolehkah saya membuka jendela?).", "<b>Kesalahan umum:</b> memakai bentuk ます (✗ 使[つか]いますも いいですか) atau salah membuat bentuk-て (✗ 読[よ]みても). Dalam obrolan, orang Jepang kadang menghilangkan も (使[つか]って いいですか), tetapi untuk pemula pakai saja bentuk lengkapnya."],
 ex:[["すみません、ここに 座[すわ]っても いいですか。", "Permisi, bolehkah saya duduk di sini?"], ["ええ、どうぞ。", "Ya, silakan."], ["試験[しけん]で 辞書[じしょ]を 使[つか]っても いいです。", "Waktu ujian boleh memakai kamus."]],
 q:["m|この 電話[でんわ]を 使[つか]って___ いいですか。|Bolehkah saya memakai telepon ini?|も|は|を|が", "m|ここに 荷物[にもつ]を ___も いいですか。|Bolehkah saya menaruh barang di sini?|置[お]いて|置[お]きて|置[お]って|置[お]んで", "o|すみません、/ちょっと/休[やす]んでも/いいですか|Maaf, bolehkah saya istirahat sebentar?", "m|A: この 本[ほん]を 借[か]りても いいですか。 B: ええ、___。|A: Bolehkah saya meminjam buku ini? B: Ya, silakan.|どうぞ|どういたしまして|お願[ねが]いします|いただきます", "m|ここで 写真[しゃしん]を ___も いいですか。|Bolehkah saya memotret di sini?|撮[と]って|撮[と]りて|撮[と]んで|撮[と]いて", "m|A: ここで たばこを 吸[す]っても いいですか。 B: すみません、___。 子供[こども]が いますから。|A: Bolehkah saya merokok di sini? B: Maaf, sebaiknya jangan... Ada anak kecil di sini.|ちょっと…|どうぞ|いいですよ|お願[ねが]いします", "o|この/資料[しりょう]を/コピーしても/いいですか|Bolehkah saya memfotokopi dokumen ini?", "o|今日[きょう]は/早[はや]く/帰[かえ]っても/いいですか|Bolehkah hari ini saya pulang lebih awal?"]},
{b:15,t:"～ては いけません (larangan)",d:"Bentuk-て + <b>は いけません</b> berarti \"tidak boleh ...\" (は di sini dibaca wa). Larangan ini tegas, biasanya untuk aturan atau dari atasan kepada bawahan, jadi jangan dipakai kepada orang yang lebih tinggi. Pola ini juga menjadi jawaban \"tidak\" yang tegas untuk ～ても いいですか: いいえ、いけません.",
 r:["(K-tempat + で) + (O + を) + KK-て + は + いけません", "Jawaban: KK-て + も + いいですか → いいえ、 + いけません"],
 s:"K-tempat + で + O + を + KK-て + は + いけません → この 部屋[へや]で たばこを 吸[す]っては いけません。",
 k:[["KK-て", "Bentuk-て di sini kira-kira berarti 'kalau melakukan ...'. Dari bentuk-て inilah pola larangan dibangun."], ["は", "Partikel topik yang dibaca wa (ditulis は, bukan わ). Ia menyorot perbuatan itu sebagai hal yang tidak boleh."], ["いけません", "Artinya 'tidak baik' atau 'tidak boleh'. Kata ini yang membuat kalimat menjadi larangan; harfiahnya 'kalau melakukan ..., itu tidak boleh'."], ["で (K-tempat)", "Menandai tempat perbuatan dilakukan. Larangan sering berlaku di tempat tertentu, jadi で banyak muncul di pola ini: 病院[びょういん]で, 教室[きょうしつ]で."]],
 x:["<b>Fungsi:</b> menyatakan larangan, 'tidak boleh ...'. Biasanya dipakai untuk aturan (di sekolah, kantor, tempat umum) atau oleh orang yang berwenang, misalnya guru kepada murid atau orang tua kepada anak.", "<b>Cara membentuk:</b> bentuk-て + は いけません. 撮[と]ります → 撮[と]っては, 泳[およ]ぎます → 泳[およ]いでは, 置[お]きます → 置[お]いては, 入[はい]ります → 入[はい]っては, 見[み]ます → 見[み]ては, 話[はな]します → 話[はな]しては, 来[き]ます → 来[き]ては いけません.", "<b>Kesopanan:</b> pola ini terdengar keras. Jangan dipakai untuk melarang orang yang lebih tinggi kedudukannya, misalnya guru atau tamu. Untuk menolak permintaan izin dengan halus, pakai すみません、ちょっと….", "<b>Pasangan pola:</b> pertanyaan ～ても いいですか bisa dijawab ええ、いいですよ (boleh) atau いいえ、いけません (tidak boleh). Jawaban pendek いいえ、いけません sudah cukup, kata kerjanya tidak perlu diulang.", "<b>Kesalahan umum:</b> tertukar dengan ～ても いいです. Bedanya ada pada partikel dan akhirannya: ～て<b>も</b> いいです = boleh, ～て<b>は</b> いけません = tidak boleh. Kesalahan lain: memakai bentuk ます (✗ 吸[す]いますは いけません)."],
 ex:[["美術館[びじゅつかん]で 写真[しゃしん]を 撮[と]っては いけません。", "Di museum seni tidak boleh memotret."], ["教室[きょうしつ]で ジュースを 飲[の]んでは いけません。", "Di kelas tidak boleh minum jus."], ["ここに 車[くるま]を 止[と]めても いいですか。…いいえ、いけません。", "Bolehkah saya parkir mobil di sini? …Tidak, tidak boleh."]],
 q:["m|病院[びょういん]で たばこを ___は いけません。|Di rumah sakit tidak boleh merokok.|吸[す]って|吸[す]いて|吸[す]んで|吸[す]きて", "m|A: 鉛筆[えんぴつ]で 書[か]いても いいですか。 B: いいえ、鉛筆[えんぴつ]で 書[か]いては ___。|A: Bolehkah saya menulis dengan pensil? B: Tidak, tidak boleh menulis dengan pensil.|いけません|いいです|ください|いいですか", "o|この/川[かわ]/で/泳[およ]いでは/いけません|Tidak boleh berenang di sungai ini.", "o|会議室[かいぎしつ]/で/食[た]べては/いけません|Tidak boleh makan di ruang rapat.", "m|プールで 写真[しゃしん]を 撮[と]って___ いけません。|Di kolam renang tidak boleh memotret.|は|を|が|に", "m|遊[あそ]びます → ___ いけません|Bentuk larangan dari 遊びます|遊[あそ]んでは|遊[あそ]びては|遊[あそ]っては|遊[あそ]いでは", "m|A: この 川[かわ]で 釣[つ]りを しても いいですか。 B: いいえ、___。|A: Bolehkah saya memancing di sungai ini? B: Tidak, tidak boleh.|いけません|いいです|しません|どうぞ", "o|教室[きょうしつ]で/ケータイを/使[つか]っては/いけません|Di kelas tidak boleh memakai HP.|ケータイを/教室[きょうしつ]で/使[つか]っては/いけません"]},
{b:16,t:"～て、～て (urutan kegiatan)",d:"Untuk menyebut dua kegiatan atau lebih secara berurutan, ubah kata kerja ke bentuk-て lalu sambung dengan koma: 起きて、食べて、行きます. Urutannya mengikuti urutan kejadian. Hanya kata kerja terakhir yang memakai ます/ました, dan kata kerja itulah yang menentukan waktunya (sekarang/nanti atau lampau).",
 r:["KK1-て、 + KK2-て、 + KK3-ます", "KK1-て、 + KK2-ました (lampau: hanya kata kerja terakhir yang berubah)"],
 s:"KK1-て、 + KK2-て、 + KK3-ます → 起[お]きて、シャワーを 浴[あ]びて、朝[あさ]ご飯[はん]を 食[た]べます。",
 k:[["KK-て (di tengah)", "Bentuk-て bekerja seperti 'lalu' atau 'kemudian'. Ia menyambung satu kegiatan ke kegiatan berikutnya tanpa menutup kalimat."], ["、(koma)", "Koma sesudah bentuk-て memisahkan tiap kegiatan supaya mudah dibaca. Tidak wajib, tetapi lazim dipakai."], ["KK-ます / KK-ました (di akhir)", "Hanya kata kerja terakhir yang memakai ます atau ました. Bagian ini menentukan waktu dan kesopanan seluruh kalimat, termasuk semua kegiatan sebelumnya."]],
 x:["<b>Fungsi:</b> menyebut dua kegiatan atau lebih yang dilakukan berurutan, artinya '..., lalu ...'. Urutan kata kerja harus sama dengan urutan kejadian.", "<b>Cara membentuk:</b> semua kata kerja kecuali yang terakhir diubah ke bentuk-て. Kelompok I: 乗[の]ります → 乗[の]って, 出[だ]します → 出[だ]して, 飲[の]みます → 飲[の]んで. Kelompok II: 浴[あ]びます → 浴[あ]びて, 降[お]ります → 降[お]りて, 入[い]れます → 入[い]れて (浴[あ]びます dan 降[お]ります berbunyi -i, tetapi termasuk Kelompok II). Kelompok III: します → して, 来[き]ます → 来[き]て.", "<b>Waktu kalimat</b> ditentukan kata kerja terakhir: 毎朝[まいあさ] ジョギングを して、シャワーを 浴[あ]びます (kebiasaan) ↔ 昨日[きのう]は ジョギングを して、シャワーを 浴[あ]びました (sudah terjadi). Bentuk-て di tengah tidak berubah.", "<b>Partikel tetap ikut kata kerjanya:</b> setiap kegiatan membawa partikelnya sendiri, misalnya 電車[でんしゃ]<b>に</b> 乗[の]ります (naik kereta) dan 電車[でんしゃ]<b>を</b> 降[お]ります (turun dari kereta). Biasanya cukup dua atau tiga kegiatan; kalau lebih, pecah kalimatnya dan pakai それから (lalu).", "<b>Kesalahan umum:</b> memakai ます atau ました di tengah kalimat (✗ 起[お]きます、食[た]べます、行[い]きます). Kata kerja di tengah wajib bentuk-て; hanya kata kerja terakhir yang memakai ます."],
 ex:[["毎朝[まいあさ] 6時[じ]に 起[お]きて、朝[あさ]ご飯[はん]を 食[た]べて、学校[がっこう]へ 行[い]きます。", "Setiap pagi saya bangun jam 6, sarapan, lalu berangkat ke sekolah."], ["昨日[きのう]は 図書館[としょかん]で 本[ほん]を 借[か]りて、うちで 読[よ]みました。", "Kemarin saya meminjam buku di perpustakaan, lalu membacanya di rumah."]],
 q:["m|毎晩[まいばん] 日本語[にほんご]を 勉強[べんきょう]___、11時[じ]に 寝[ね]ます。|Setiap malam saya belajar bahasa Jepang, lalu tidur jam 11.|して|します|しました|しませんか", "m|駅[えき]で 友達[ともだち]に ___、いっしょに 昼[ひる]ご飯[はん]を 食[た]べました。|Saya bertemu teman di stasiun, lalu makan siang bersama.|会[あ]って|会[あ]いて|会[あ]んで|会[あ]いで", "o|電車[でんしゃ]を/降[お]りて/バスに/乗[の]ります|Saya turun dari kereta, lalu naik bus.", "o|うちへ 帰[かえ]って/シャワーを/浴[あ]びて/寝[ね]ました|Saya pulang ke rumah, mandi, lalu tidur.", "m|昨日[きのう]は 友達[ともだち]と 映画[えいが]を 見[み]て、レストランで 晩[ばん]ご飯[はん]を ___。|Kemarin saya menonton film dengan teman, lalu makan malam di restoran.|食[た]べました|食[た]べて|食[た]べます|食[た]べましょう", "m|コーヒーに 砂糖[さとう]を ___、飲[の]みます。|Saya memasukkan gula ke dalam kopi, lalu meminumnya.|入[い]れて|入[はい]って|入[い]んで|入[い]れって", "o|郵便局[ゆうびんきょく]へ 行[い]って/切手[きって]を/買[か]って/手紙[てがみ]を 出[だ]しました|Saya pergi ke kantor pos, membeli perangko, lalu mengirim surat.", "o|日曜日[にちようび]は/お寺[てら]を/見学[けんがく]して/写真[しゃしん]を/撮[と]りました|Hari Minggu saya berkunjung ke kuil, lalu memotret."]},
{b:16,t:"～くて / ～で (menyambung kata sifat & kata benda)",d:"Untuk menyambung dua sifat atau keterangan. Kata sifat-い: buang い, tambah <b>くて</b> (安い → 安くて; いい → よくて). Kata sifat-な dan kata benda: tambah <b>で</b> (静か → 静かで, 医者 → 医者で). Untuk kata sifat, pakai pola ini kalau kedua sifat searah (sama-sama baik atau sama-sama buruk); kalau berlawanan, pakai が (tetapi).",
 r:["S + は + KS-i (い → くて)、 + KS + です", "S + は + KS-na / KB + で、 + KS / KB + です"],
 s:"S + は + KS1-くて、 + KS2 + です → この 本[ほん]は 易[やさ]しくて、おもしろいです。",
 k:[["くて (KS-i)", "と hanya bisa menyambung kata benda, jadi kata sifat-い tidak bisa disambung dengan と. Caranya, ganti い dengan くて; bentuk ini berfungsi seperti 'dan'."], ["で (KS-na / KB)", "Kata sifat-な dan kata benda disambung dengan で, yaitu bentuk sambung dari です: 親切[しんせつ]で = 'baik hati dan ...', 学生[がくせい]で = 'seorang pelajar dan ...'."], ["です (di akhir)", "Hanya bagian terakhir yang memakai です atau bentuk lampaunya. Bagian ini menentukan waktu kalimat: 安[やす]くて、おいしかったです = (waktu itu) murah dan enak."]],
 x:["<b>Fungsi:</b> menyambung dua sifat atau keterangan tentang hal yang sama dalam satu kalimat, seperti 'dan'. Contoh: ワンさんは 若[わか]くて、元気[げんき]です (Wang-san muda dan bersemangat).", "<b>KS-i:</b> buang い, tambah くて. 若[わか]い → 若[わか]くて, 長[なが]い → 長[なが]くて, 明[あか]るい → 明[あか]るくて. Pengecualian: いい → <b>よくて</b> (✗ いくて).", "<b>KS-na dan KB:</b> tambah で. 便利[べんり] → 便利[べんり]で, 有名[ゆうめい] → 有名[ゆうめい]で, 学生[がくせい] → 学生[がくせい]で. Hati-hati dengan きれい: bunyinya berakhiran い, tetapi termasuk KS-na, jadi bentuknya きれいで (✗ きれくて).", "<b>Waktu</b> ditentukan bagian terakhir: 昨日[きのう]の パーティーは にぎやかで、楽[たの]しかったです (Pesta kemarin ramai dan menyenangkan).", "<b>Searah atau berlawanan:</b> pola ini dipakai kalau kedua sifat sama-sama positif atau sama-sama negatif. Kalau berlawanan, pakai が (tetapi): この 部屋[へや]は 広[ひろ]いですが、暗[くら]いです. Kalimat ✗ 広[ひろ]くて、暗[くら]いです terdengar janggal.", "<b>Kesalahan umum:</b> menyambung kata sifat dengan と karena terbawa kata 'dan' (✗ 安[やす]いと おいしいです). と hanya untuk kata benda: パンと 卵[たまご]."],
 ex:[["あの レストランは 安[やす]くて、おいしいです。", "Restoran itu murah dan enak."], ["この 公園[こうえん]は 静[しず]かで、きれいです。", "Taman ini tenang dan indah."], ["父[ちち]は 医者[いしゃ]で、45歳[さい]です。", "Ayah saya dokter, umurnya 45 tahun."]],
 q:["m|安[やす]い → ___|Bentuk sambung dari 安い|安[やす]くて|安[やす]いで|安[やす]いくて|安[やす]で", "m|この ホテルは サービスが ___、安[やす]いです。|Hotel ini pelayanannya bagus dan murah.|よくて|いくて|いいで|よいで", "m|田中[たなか]さんは 親切[しんせつ]___、おもしろいです。|Tanaka-san baik hati dan lucu.|で|な|くて|に", "o|この/かばんは/軽[かる]くて/便利[べんり]です|Tas ini ringan dan praktis.", "m|きれい → ___|Bentuk sambung dari きれい|きれいで|きれくて|きれいくて|きれいな", "m|ミラーさんは 背[せ]が 高[たか]___、ハンサムです。|Miller-san tinggi dan tampan.|くて|で|いで|な", "o|この/部屋[へや]は/明[あか]るくて/広[ひろ]いです|Kamar ini terang dan luas.", "o|サントスさんは/ブラジル人[じん]で/会社員[かいしゃいん]です|Santos-san orang Brasil dan bekerja sebagai karyawan perusahaan."]},
{b:16,t:"～てから",d:"Bentuk-て + <b>から</b> = 'setelah ..., (baru) ...': kegiatan pertama selesai dulu, lalu kegiatan kedua dilakukan (宿題をしてから、遊びます). Waktu kalimat ditentukan oleh kata kerja di akhir. Jangan tertukar dengan ～から 'karena' (Bab 9), yang menempel pada bentuk ます/です: 行きますから.",
 r:["KK1-て + から、 + KK2-ます / KK2-ました", "KK1-て + から、 + KK2-て + ください"],
 s:"O + を + KK1-て + から、 + KK2-ます → 切符[きっぷ]を 買[か]ってから、入[はい]ります。",
 k:[["KK-て", "Menandai kegiatan pertama. から dengan arti 'setelah' hanya menempel pada bentuk-て, jadi kata kerja diubah dulu ke bentuk-て."], ["から", "Arti dasarnya 'dari' atau 'sejak'. Di belakang bentuk-て, から berarti 'setelah ... selesai' dan menegaskan bahwa kegiatan kedua baru dimulai sesudah kegiatan pertama selesai."], ["KK2-ます / KK2-ました", "Kata kerja terakhir menentukan waktu seluruh kalimat: 食[た]べてから、寝[ね]ます (nanti atau kebiasaan), 食[た]べてから、寝[ね]ました (sudah terjadi)."]],
 x:["<b>Fungsi:</b> 'setelah ..., (baru) ...'. Kegiatan pertama harus selesai dulu, baru kegiatan kedua dimulai. Cocok untuk urutan yang penting, misalnya langkah kerja atau aturan.", "<b>Cara membentuk:</b> bentuk-て + から. 帰[かえ]ります → 帰[かえ]ってから, 終[お]わります → 終[お]わってから, 浴[あ]びます → 浴[あ]びてから, 電話[でんわ]します → 電話[でんわ]してから, 来[き]ます → 来[き]てから.", "<b>Bedanya dengan ～て、～て:</b> ～て、～て hanya menyebut urutan beberapa kegiatan. ～てから menekankan 'baru setelah itu', dan biasanya hanya menyambung dua kegiatan.", "<b>Bedanya dengan から 'karena' (Bab 9):</b> から 'karena' menempel pada kalimat lengkap dengan ます/です: 時間[じかん]が ありませんから (karena tidak ada waktu). から 'setelah' menempel pada bentuk-て: 食[た]べてから (setelah makan).", "<b>Kesalahan umum:</b> ✗ 食[た]べますから、寝[ね]ます. Kalimat ini berarti 'karena makan, saya tidur', jadi artinya lain. Jangan juga menaruh から di awal kalimat seperti kata 'setelah'; から selalu di belakang kata kerja pertama."],
 ex:[["宿題[しゅくだい]を してから、テレビを 見[み]ます。", "Setelah mengerjakan PR, (baru) saya menonton TV."], ["日本[にほん]へ 来[き]てから、漢字[かんじ]の 勉強[べんきょう]を 始[はじ]めました。", "Setelah datang ke Jepang, saya mulai belajar kanji."], ["仕事[しごと]が 終[お]わってから、ジョギングを します。", "Setelah pekerjaan selesai, saya joging."]],
 q:["m|うちへ ___から、電話[でんわ]します。|Setelah pulang ke rumah, saya akan menelepon.|帰[かえ]って|帰[かえ]りて|帰[かえ]んで|帰[かえ]いて", "m|お金[かね]を 下[お]ろして___、買[か]い物[もの]を します。|Setelah mengambil uang, saya berbelanja.|から|が|を|に", "o|晩[ばん]ご飯[はん]を/食[た]べてから/公園[こうえん]を/散歩[さんぽ]します|Setelah makan malam, saya berjalan-jalan di taman.", "m|新聞[しんぶん]を ___から、朝[あさ]ご飯[はん]を 食[た]べます。|Setelah membaca koran, (baru) saya sarapan.|読[よ]んで|読[よ]みて|読[よ]って|読[よ]いで", "m|___から、会社[かいしゃ]へ 行[い]きます。|Setelah joging, baru saya berangkat ke kantor.|ジョギングを して|ジョギングを します|ジョギングを しました|ジョギングを しましょう", "m|昨日[きのう]は 晩[ばん]ご飯[はん]を 作[つく]ってから、テレビを ___。|Kemarin, setelah memasak makan malam, saya menonton TV.|見[み]ました|見[み]ます|見[み]て|見[み]ましょう", "o|ボタンを/押[お]してから/カードを/入[い]れて/ください|Tolong tekan tombolnya dulu, baru masukkan kartunya.", "o|電話[でんわ]を/かけてから/友達[ともだち]の/うちへ/行[い]きます|Setelah menelepon, saya pergi ke rumah teman."]},
{b:16,t:"N1 は N2 が kata sifat",d:"Pola untuk menerangkan ciri sesuatu: N1 は (yang dibicarakan) + N2 が (bagian atau aspeknya) + kata sifat. 象は鼻が長いです = 'Gajah belalainya panjang'. Ungkapan yang sering dipakai: 背が高い (tinggi badannya), 頭がいい (pintar).",
 r:["KB1 + は + KB2 + が + KS-i / KS-na + です", "KB1 + は + KB2 + が + KS1-くて、 + KS2 + です"],
 s:"KB1 + は + KB2 + が + KS + です → 父[ちち]は 髪[かみ]が 短[みじか]いです。",
 k:[["は (KB1)", "Menandai topik, yaitu orang, hewan, benda, atau tempat yang sedang dibicarakan secara keseluruhan."], ["が (KB2)", "Menandai bagian atau aspek dari topik yang diberi sifat. Kata sifatnya menerangkan KB2: 象[ぞう]は 鼻[はな]が 長[なが]いです berarti yang panjang adalah belalainya."], ["KS + です", "Kata sifat di akhir menerangkan KB2. Bisa KS-i (長[なが]いです) atau KS-na (きれいです), dan bisa dibuat negatif atau lampau seperti biasa."]],
 x:["<b>Fungsi:</b> menerangkan ciri sesuatu lewat salah satu bagiannya, misalnya bagian tubuh (背[せ], 目[め], 髪[かみ]), kemampuan (頭[あたま]), atau ciri sebuah tempat (果物[くだもの], 緑[みどり]). Contoh: アニさんは 髪[かみ]が 長[なが]いです (rambut Ani panjang).", "<b>Cara memakai:</b> KB1 (keseluruhan) + は, lalu KB2 (bagian atau aspek) + が, lalu kata sifat + です. Jangan dibalik: ✗ 鼻[はな]は 象[ぞう]が 長[なが]いです.", "<b>Variasi:</b> negatif → 姉[あね]は 背[せ]が 高[たか]くないです; lampau → 昨日[きのう]は 天気[てんき]が よかったです (ingat いい → よかった); pertanyaan → インドネシアは どこが きれいですか.", "<b>Ungkapan yang sering dipakai:</b> 背[せ]が 高[たか]い / 低[ひく]い (tinggi / pendek badannya), 頭[あたま]が いい (pintar), 目[め]が 大[おお]きい (matanya besar), 髪[かみ]が 長[なが]い / 短[みじか]い (rambutnya panjang / pendek).", "<b>Bedanya dengan の:</b> 象[ぞう]の 鼻[はな]は 長[なが]いです juga benar, tetapi topiknya menjadi 'belalai gajah'. Kalau yang ingin diterangkan adalah gajahnya, pakai 象[ぞう]は 鼻[はな]が 長[なが]いです. Hindari juga は dua kali (象[ぞう]は 鼻[はな]は ...) kecuali memang sedang membandingkan."],
 ex:[["姉[あね]は 背[せ]が 高[たか]いです。", "Kakak perempuan saya tinggi badannya."], ["インドネシアは 果物[くだもの]が おいしいです。", "Indonesia itu buah-buahannya enak."], ["田中[たなか]さんは 頭[あたま]が いいです。", "Tanaka-san pintar."]],
 q:["m|象[ぞう]は 鼻[はな]___ 長[なが]いです。|Gajah belalainya panjang.|が|を|で|に", "m|この 部屋[へや]___ 窓[まど]が 大[おお]きいです。|Kamar ini jendelanya besar.|は|を|へ|に", "o|この/町[まち]は/緑[みどり]が/多[おお]いです|Kota ini banyak tanaman hijaunya.", "o|田中[たなか]さんの/弟[おとうと]さんは/目[め]が/大[おお]きいです|Adik laki-laki Tanaka-san matanya besar.", "m|日本[にほん]は ___ 有名[ゆうめい]ですか。|Apa yang terkenal di Jepang?|何[なに]が|何[なに]を|何[なに]に|何[なに]へ", "m|あの 犬[いぬ]は ___ 長[なが]いです。|Anjing itu telinganya panjang.|耳[みみ]が|耳[みみ]を|耳[みみ]で|耳[みみ]に", "o|私[わたし]の/妹[いもうと]は/髪[かみ]が/長[なが]いです|Adik perempuan saya rambutnya panjang.", "o|インドネシアは/海[うみ]が/きれいです|Indonesia lautnya indah."]},
{b:16,t:"どうやって (bagaimana caranya)",d:"どうやって = 'dengan cara bagaimana', untuk menanyakan cara melakukan sesuatu atau jalan menuju suatu tempat. Letakkan sebelum kata kerja: 駅までどうやって行きますか. Jawabannya sering memakai ～て、～て untuk menjelaskan langkah-langkahnya.",
 r:["(K-tempat + まで) + どうやって + KK-ますか", "O + は + どうやって + KK-ますか", "Jawaban: KK1-て、 + KK2-ます"],
 s:"K-tempat + まで + どうやって + KK-ますか → 郵便局[ゆうびんきょく]まで どうやって 行[い]きますか。",
 k:[["どうやって", "Kata tanya untuk cara atau langkah, 'dengan cara bagaimana'. Biasanya diletakkan di depan kata kerja yang ditanyakan caranya."], ["まで", "Menandai tujuan akhir perjalanan, 'sampai ke'. Dengan まで, yang ditanyakan adalah seluruh perjalanan sampai tempat itu."], ["は (benda)", "Untuk menanyakan cara memakai atau membuat sesuatu, benda itu dijadikan topik dengan は: この カメラは どうやって 使[つか]いますか."], ["KK-て、～ (jawaban)", "Cara biasanya terdiri dari beberapa langkah, jadi jawabannya sering memakai ～て、～て: バスに 乗[の]って、駅[えき]で 降[お]ります."]],
 x:["<b>Fungsi:</b> menanyakan cara melakukan sesuatu, misalnya cara pergi ke suatu tempat, cara memakai alat, atau cara membuat dan menulis sesuatu.", "<b>Letak:</b> どうやって diletakkan di depan kata kerja. Paling umum tepat sebelum kata kerja, setelah tempat tujuan atau benda yang ditanyakan: 空港[くうこう]まで どうやって 行[い]きますか. Boleh juga di awal: どうやって 空港[くうこう]まで 行[い]きますか.", "<b>Cara menjawab:</b> sebutkan langkahnya berurutan dengan ～て、～て. Kata まず (pertama) dan 次[つぎ]に (berikutnya) membantu: まず 駅[えき]まで バスで 行[い]って、次[つぎ]に 電車[でんしゃ]に 乗[の]ります.", "<b>Bedakan dengan kata tanya lain:</b> 何[なん]で 行[い]きますか (Bab 6) hanya menanyakan kendaraan, jawabannya cukup バスで. どうやって menanyakan seluruh caranya. どう (Bab 8) menanyakan kesan atau keadaan: 仕事[しごと]は どうですか.", "<b>Kesalahan umum:</b> memakai どう untuk menanyakan cara. Keduanya bisa diartikan 'bagaimana', tetapi どうやって untuk cara, sedangkan どう untuk kesan. Selain itu, jawaban どうやって harus berupa cara atau langkah, bukan waktu atau tempat."],
 ex:[["空港[くうこう]まで どうやって 行[い]きますか。", "Bagaimana cara pergi ke bandara?"], ["うちから 駅[えき]まで 歩[ある]いて、電車[でんしゃ]で 空港[くうこう]へ 行[い]きます。", "Dari rumah saya jalan kaki ke stasiun, lalu naik kereta ke bandara."], ["この カメラは どうやって 使[つか]いますか。", "Bagaimana cara memakai kamera ini?"]],
 q:["m|図書館[としょかん]まで ___ 行[い]きますか。|Bagaimana cara pergi ke perpustakaan?|どうやって|どんな|どの|どれ", "m|A: 駅[えき]まで どうやって 行[い]きますか。 B: ___。|A: Bagaimana caranya ke stasiun? B: Naik bus.|バスで 行[い]きます|5分[ふん]ぐらいです|駅[えき]の 前[まえ]です|明日[あした] 行[い]きます", "o|この/漢字[かんじ]は/どうやって/書[か]きますか|Bagaimana cara menulis kanji ini?", "m|A: 日本[にほん]の 生活[せいかつ]は ___ですか。 B: 楽[たの]しいです。|A: Bagaimana kehidupan di Jepang? B: Menyenangkan.|どう|どうやって|どれ|どの", "m|この 料理[りょうり]は ___ 作[つく]りますか。|Bagaimana cara membuat masakan ini?|どうやって|どれ|どこ|だれ", "o|大学[だいがく]まで/どうやって/行[い]きますか|Bagaimana cara pergi ke universitas?|どうやって/大学[だいがく]まで/行[い]きますか", "o|ここから/駅[えき]まで/歩[ある]いて/電車[でんしゃ]に/乗[の]ります|Dari sini saya berjalan kaki ke stasiun, lalu naik kereta.", "o|この/電子辞書[でんしじしょ]は/どうやって/使[つか]いますか|Bagaimana cara memakai kamus elektronik ini?"]},
{b:17,t:"Bentuk ない",d:"Bentuk ない adalah bentuk negatif biasa dan menjadi dasar pola-pola Bab 17. Grup I: bunyi -i sebelum ます diganti bunyi -a, lalu tambah <b>ない</b> (書きます → 書かない, 待ちます → 待たない); bunyi い berubah menjadi <b>わ</b> (買います → 買わない). Grup II: buang ます, tambah <b>ない</b> (食べます → 食べない). Grup III: します → <b>しない</b>, 来ます → <b>来ない</b> (こない).",
 r:["Kelompok I: KK-ます (bunyi -i → -a) + ない → 書[か]か + ない, 買[か]わ + ない", "Kelompok II: KK-ます (buang ます) + ない → 食[た]べ + ない", "Kelompok III: し + ない (します), 来[こ] + ない (来[き]ます)"],
 s:"KK-ない → 書[か]かない, 食[た]べない",
 k:[["-a (Kelompok I)", "Pada Kelompok I, bunyi -i sebelum ます diganti bunyi -a, baru ditambah ない: き → か, み → ま, り → ら. Contoh: か<b>き</b>ます → か<b>か</b>ない."], ["わ (bukan あ)", "Kata kerja yang bunyinya い sebelum ます, seperti 買[か]います dan 使[つか]います, berubah menjadi わない, bukan ✗ あない: 買[か]わない, 使[つか]わない."], ["ない", "Akhiran negatif bentuk biasa. Artinya sama dengan ～ません, tetapi bukan bentuk sopan. Di Bab 17 bentuk ini menjadi bahan untuk ～ないで ください, ～なければ なりません, dan ～なくても いいです."], ["来[こ]ない", "来[き]ます tidak beraturan. Bentuk ない-nya dibaca こない, bukan ✗ きない."]],
 x:["<b>Fungsi:</b> bentuk ない adalah bentuk negatif biasa (bukan bentuk sopan) dari ～ません. Di Bab 17 bentuk ini belum dipakai sendirian dalam percakapan. Ia menjadi bahan untuk tiga pola: ～ないで ください, ～なければ なりません, dan ～なくても いいです.", "<b>Kelompok I:</b> ganti bunyi -i sebelum ます dengan bunyi -a, lalu tambah ない. 書[か]きます → 書[か]かない, 急[いそ]ぎます → 急[いそ]がない, 話[はな]します → 話[はな]さない, 待[ま]ちます → 待[ま]たない, 呼[よ]びます → 呼[よ]ばない, 飲[の]みます → 飲[の]まない, 取[と]ります → 取[と]らない. Khusus い → <b>わ</b>: 払[はら]います → 払[はら]わない.", "<b>Kelompok II:</b> buang ます, tambah ない. 食[た]べます → 食[た]べない, 覚[おぼ]えます → 覚[おぼ]えない, 見[み]ます → 見[み]ない, 起[お]きます → 起[お]きない. <b>Kelompok III:</b> します → しない (心配[しんぱい]します → 心配[しんぱい]しない), 来[き]ます → 来[こ]ない.", "<b>Kesalahan umum:</b> ✗ 書[か]きない (bunyi lupa diganti), ✗ 買[か]あない (seharusnya 買[か]わない), ✗ 来[き]ない (seharusnya こない), dan menganggap 帰[かえ]ります sebagai Kelompok II (✗ 帰[かえ]ない).", "<b>Tips:</b> ingat baris kana か・き・く・け・こ. Bentuk ます memakai bunyi -i (書[か]<b>き</b>ます), bentuk ない memakai bunyi -a dari baris yang sama (書[か]<b>か</b>ない): き → か, み → ま, り → ら. Satu lagi yang perlu dihafal: あります → ない (bukan ✗ あらない)."],
 ex:[["ここで たばこを 吸[す]わないで ください。", "Tolong jangan merokok di sini."], ["明日[あした]は 6時[じ]に 起[お]きなければ なりません。", "Besok saya harus bangun jam 6."], ["土曜日[どようび]は 会社[かいしゃ]へ 来[こ]なくても いいです。", "Hari Sabtu Anda tidak perlu datang ke kantor."]],
 q:["m|書[か]きます → ___|Bentuk ない dari 書きます|書[か]かない|書[か]きない|書[か]くない|書[か]こない", "m|買[か]います → ___|Bentuk ない dari 買います|買[か]わない|買[か]あない|買[か]いない|買[か]まない", "m|来[き]ます → ___|Bentuk ない dari 来ます|こない|きない|くない|かない", "o|この/写真[しゃしん]を/見[み]ないで/ください|Tolong jangan lihat foto ini.", "m|帰[かえ]ります → ___|Bentuk ない dari 帰ります|帰[かえ]らない|帰[かえ]ない|帰[かえ]りない|帰[かえ]るない", "m|忘[わす]れます → ___|Bentuk ない dari 忘れます|忘[わす]れない|忘[わす]らない|忘[わす]れらない|忘[わす]かない", "o|この/お金[かね]は/使[つか]わないで/ください|Tolong jangan pakai uang ini.", "o|日本語[にほんご]で/話[はな]さなければ/なりません|Saya harus berbicara dalam bahasa Jepang."]},
{b:17,t:"～ないで ください",d:"Bentuk ない + <b>で ください</b> = 'tolong jangan ...' (忘れます → 忘れない → 忘れないで ください). Ini permintaan yang halus, lebih lembut daripada larangan ～ては いけません. Dipakai juga untuk menenangkan orang: 心配しないで ください (jangan khawatir).",
 r:["(O + を) + KK-ない + で + ください", "Kalimat + から、 + KK-ない + で + ください"],
 s:"K-tempat + に + KK-ない + で + ください → この 椅子[いす]に 座[すわ]らないで ください。",
 k:[["KK-ない", "Bentuk ない membawa arti 'tidak melakukan'. ません tidak bisa disambung dengan ください, jadi yang dipakai adalah bentuk ない."], ["で", "Penyambung antara ない dan ください, perannya mirip bentuk-て pada ～て ください. Tanpa で kalimatnya salah: ✗ 座[すわ]らない ください."], ["ください", "Membuat kalimat menjadi permintaan sopan. Jadi ～ないで ください berarti 'tolong jangan ...'."], ["から (alasan)", "Alasan sering disebut lebih dulu dengan から supaya permintaan terdengar lebih halus dan mudah diterima: 危[あぶ]ないですから、～ないで ください."]],
 x:["<b>Fungsi:</b> meminta dengan sopan agar seseorang tidak melakukan sesuatu, 'tolong jangan ...'. Juga dipakai untuk menenangkan orang: 心配[しんぱい]しないで ください (jangan khawatir).", "<b>Cara membentuk:</b> ubah ke bentuk ない, lalu tambah で ください. 吸[す]います → 吸[す]わない → 吸[す]わないで ください; 忘[わす]れます → 忘[わす]れない → 忘[わす]れないで ください; 来[き]ます → 来[こ]ない → 来[こ]ないで ください; 心配[しんぱい]します → 心配[しんぱい]しない → 心配[しんぱい]しないで ください.", "<b>Bandingkan:</b> ～て ください (tolong lakukan) ↔ ～ないで ください (tolong jangan lakukan). ～ては いけません (Bab 15) juga melarang, tetapi nadanya keras seperti aturan; ～ないで ください berupa permintaan, jadi lebih halus.", "<b>Tambahkan alasan:</b> orang Jepang sering menyebut alasan dulu dengan から: 子供[こども]が 寝[ね]て いますから、テレビを つけないで ください (Anak sedang tidur, jadi tolong jangan nyalakan TV).", "<b>Kesalahan umum:</b> ✗ 座[すわ]らない ください (lupa で), ✗ 座[すわ]りませんで ください (memakai ません), ✗ 座[すわ]って ないで ください (mencampur bentuk-て dan ない)."],
 ex:[["危[あぶ]ないですから、ここで 遊[あそ]ばないで ください。", "Berbahaya, jadi tolong jangan bermain di sini."], ["パスポートを 忘[わす]れないで ください。", "Jangan lupa membawa paspor."]],
 q:["m|ここに 荷物[にもつ]を ___ ください。|Tolong jangan menaruh barang di sini.|置[お]かないで|置[お]かなくて|置[お]かない|置[お]きません", "m|私[わたし]は 元気[げんき]ですから、心配[しんぱい]___で ください。|Saya baik-baik saja, jadi jangan khawatir.|しない|さない|すない|こない", "o|この/部屋[へや]に/入[はい]らないで/ください|Tolong jangan masuk ke kamar ini.", "m|大切[たいせつ]な 資料[しりょう]ですから、___で ください。|Ini dokumen penting, jadi tolong jangan dihilangkan.|なくさない|なくしない|なくすない|なくさなく", "m|A: 窓[まど]を 開[あ]けましょうか。 B: すみません、寒[さむ]いですから、___。|A: Perlu saya buka jendelanya? B: Maaf, dingin, jadi tolong jangan dibuka.|開[あ]けないで ください|開[あ]けて ください|開[あ]けなければ なりません|開[あ]けても いいです", "m|押[お]します → ___ ください|Bentuk 'tolong jangan' dari 押します|押[お]さないで|押[お]しないで|押[お]すないで|押[お]さなくて", "o|熱[ねつ]が ありますから、/今日[きょう]は/出[で]かけないで/ください|Anda demam, jadi hari ini jangan bepergian.|今日[きょう]は/熱[ねつ]が ありますから、/出[で]かけないで/ください", "o|ここに/自転車[じてんしゃ]を/止[と]めないで/ください|Tolong jangan parkir sepeda di sini.|自転車[じてんしゃ]を/ここに/止[と]めないで/ください"]},
{b:17,t:"～なければ なりません",d:"'Harus ...'. Ambil bentuk ない, lalu ganti ない dengan <b>なければ なりません</b>: 行かない → 行かなければ なりません, 食べない → 食べなければ なりません. Walaupun ada ない di dalamnya, artinya positif: kegiatan itu wajib dilakukan.",
 r:["(O + を) + KK-ない(い→ければ) + なりません", "Pertanyaan: KK-ない(い→ければ) + なりませんか"],
 s:"S + は + O + を + KK-ない(い→ければ) + なりません → 私[わたし]は レポートを 出[だ]さなければ なりません。",
 k:[["KK-ない", "Bentuk ない adalah dasar pola ini, artinya 'tidak melakukan'. Jadi kata kerja diubah dulu ke bentuk ない."], ["なければ", "Ganti い pada ない dengan ければ, hasilnya berarti 'kalau tidak ...': 行[い]かなければ = 'kalau tidak pergi'."], ["なりません", "Kira-kira berarti 'tidak bisa' atau 'tidak baik'. Gabungannya 'kalau tidak melakukan, tidak bisa', yaitu 'harus'. Dua bentuk negatif ini menghasilkan arti positif: wajib."]],
 x:["<b>Fungsi:</b> menyatakan kewajiban atau keharusan, 'harus ...', baik karena aturan maupun karena keadaan.", "<b>Cara membentuk:</b> (1) ubah ke bentuk ない; (2) ganti い terakhir dengan ければ; (3) tambah なりません. 払[はら]います → 払[はら]わない → 払[はら]わなければ なりません; 出[だ]します → 出[だ]さない → 出[だ]さなければ なりません; 覚[おぼ]えます → 覚[おぼ]えない → 覚[おぼ]えなければ なりません; 残業[ざんぎょう]します → 残業[ざんぎょう]しない → 残業[ざんぎょう]しなければ なりません.", "<b>Tanya-jawab:</b> ～なければ なりませんか (harus ...?). Kalau memang harus, jawab ええ、～なければ なりません. Kalau tidak perlu, jawab いいえ、～なくても いいです (pola berikutnya).", "<b>Memberi alasan:</b> pola ini sering dipakai bersama から, misalnya untuk menolak ajakan dengan sopan: すみません、明日[あした]は 早[はや]く 起[お]きなければ なりませんから….", "<b>Kesalahan umum:</b> memakai bentuk ます (✗ 行[い]きなければ), tidak membuang い (✗ 行[い]かないければ), atau lupa なりません. Jangan bingung karena ada ない di dalamnya: artinya tetap positif, 'harus'."],
 ex:[["今日[きょう]は 銀行[ぎんこう]へ 行[い]かなければ なりません。", "Hari ini saya harus pergi ke bank."], ["ここで 靴[くつ]を 脱[ぬ]がなければ なりません。", "Di sini sepatu harus dilepas."], ["レポートを 書[か]かなければ なりませんから、今晩[こんばん]は 出[で]かけません。", "Karena harus menulis laporan, malam ini saya tidak keluar."]],
 q:["m|毎朝[まいあさ] 7時[じ]に うちを ___ なりません。|Setiap pagi saya harus berangkat dari rumah jam 7.|出[で]なければ|出[で]ないで|出[で]なくても|出[で]ません", "m|急[いそ]ぎます → ___ なりません|Bentuk 'harus' dari 急ぎます|急[いそ]がなければ|急[いそ]ぎなければ|急[いそ]ぐなければ|急[いそ]かなければ", "o|今日[きょう]は/早[はや]く/帰[かえ]らなければ/なりません|Hari ini saya harus pulang cepat.", "m|返[かえ]します → ___ なりません|Bentuk 'harus' dari 返します|返[かえ]さなければ|返[かえ]しなければ|返[かえ]すなければ|返[かえ]さないければ", "m|明日[あした]は 試験[しけん]が ありますから、今晩[こんばん]は 勉強[べんきょう]___。|Besok ada ujian, jadi malam ini saya harus belajar.|しなければ なりません|しなくても いいです|しないで ください|しても いいです", "m|来[き]ます → ___ なりません|Bentuk 'harus' dari 来ます|こなければ|きなければ|くなければ|こないければ", "o|毎日[まいにち]/薬[くすり]を/飲[の]まなければ/なりません|Saya harus minum obat setiap hari.|薬[くすり]を/毎日[まいにち]/飲[の]まなければ/なりません", "o|来週[らいしゅう]は/中国[ちゅうごく]へ/出張[しゅっちょう]しなければ/なりません|Minggu depan saya harus dinas ke Tiongkok."]},
{b:17,t:"～なくても いいです",d:"'Tidak perlu ...' atau 'tidak usah ...'. Ambil bentuk ない, lalu ganti ない dengan <b>なくても いいです</b>: 来ない → 来なくても いいです. Pola ini dipakai untuk menjawab いいえ atas pertanyaan ～なければ なりませんか.",
 r:["(O + を / は) + KK-ない(い→くても) + いいです", "KK-ない(い→ければ) + なりませんか → いいえ、 + KK-ない(い→くても) + いいです"],
 s:"O + は + KK-ない(い→くても) + いいです → 名前[なまえ]は 書[か]かなくても いいです。",
 k:[["KK-ない", "Bentuk ない menjadi dasar pola ini, artinya 'tidak melakukan'. Jadi kata kerja diubah dulu ke bentuk ない."], ["なくても", "Ganti い pada ない dengan くても. Bagian ても sama dengan ～ても いいです di Bab 15, artinya 'walaupun': 書[か]かなくても = 'walaupun tidak menulis'."], ["いいです", "Artinya 'tidak apa-apa'. Jadi ～なくても いいです = 'walaupun tidak dilakukan, tidak apa-apa', yaitu 'tidak perlu ...'."], ["は (objek)", "Objek sering diberi は sebagai topik, terutama saat menjawab: 靴[くつ]は 脱[ぬ]がなくても いいです. Dengan begitu benda itu menjadi pokok pembicaraan."]],
 x:["<b>Fungsi:</b> menyatakan bahwa sesuatu tidak wajib, 'tidak perlu ...' atau 'tidak usah ...'. Pola ini juga menjadi jawaban 'tidak' untuk pertanyaan ～なければ なりませんか.", "<b>Cara membentuk:</b> ubah ke bentuk ない, ganti い terakhir dengan くても, lalu tambah いいです. 急[いそ]ぎます → 急[いそ]がない → 急[いそ]がなくても いいです; 覚[おぼ]えます → 覚[おぼ]えなくても いいです; 心配[しんぱい]します → 心配[しんぱい]しなくても いいです; 来[き]ます → 来[こ]なくても いいです.", "<b>Tiga pola sekaligus:</b> 住所[じゅうしょ]を 書[か]かなければ なりません (harus menulis alamat) ↔ 住所[じゅうしょ]は 書[か]かなくても いいです (alamat tidak perlu ditulis) ↔ 住所[じゅうしょ]を 書[か]かないで ください (tolong jangan tulis alamat).", "<b>Objek menjadi topik:</b> dalam jawaban, objek sering diberi は untuk membandingkan: 名前[なまえ]は 書[か]かなくても いいですが、住所[じゅうしょ]は 書[か]いて ください (Nama tidak perlu ditulis, tetapi alamat tolong ditulis).", "<b>Kesalahan umum:</b> tidak membuang い (✗ 書[か]かないくても) atau tertukar dengan ～ないで ください. ～なくても いいです tidak melarang; artinya hanya 'tidak wajib', jadi boleh saja kalau orangnya tetap mau melakukannya."],
 ex:[["靴[くつ]は 脱[ぬ]がなくても いいです。", "Sepatunya tidak perlu dilepas."], ["時間[じかん]が ありますから、急[いそ]がなくても いいですよ。", "Waktunya masih ada, jadi tidak usah buru-buru."]],
 q:["m|A: 明日[あした]も 来[こ]なければ なりませんか。 B: いいえ、___ いいです。|A: Besok juga harus datang? B: Tidak, tidak perlu datang.|こなくても|きなくても|くなくても|こないても", "m|使[つか]います → ___ いいです|Bentuk 'tidak perlu' dari 使います|使[つか]わなくても|使[つか]あなくても|使[つか]いなくても|使[つか]わないても", "o|この/漢字[かんじ]は/覚[おぼ]えなくても/いいです|Kanji ini tidak perlu dihafal.", "m|A: 保険証[ほけんしょう]を 持[も]って 来[こ]なければ なりませんか。 B: いいえ、___。|A: Apakah saya harus membawa kartu asuransi? B: Tidak, tidak perlu dibawa.|持[も]って 来[こ]なくても いいです|持[も]って 来[こ]なければ なりません|持[も]って 来[き]ました|持[も]って 来[き]て ください", "m|見[み]せます → ___ いいです|Bentuk 'tidak perlu' dari 見せます|見[み]せなくても|見[み]さなくても|見[み]せらなくても|見[み]せないくても", "m|今日[きょう]は 日曜日[にちようび]ですから、早[はや]く 起[お]き___。|Hari ini hari Minggu, jadi tidak perlu bangun pagi-pagi.|なくても いいです|なければ なりません|ないで ください|ても いいですか", "o|今日[きょう]は/残業[ざんぎょう]しなくても/いいです|Hari ini Anda tidak perlu lembur.", "o|もう/薬[くすり]を/飲[の]まなくても/いいです|Anda sudah tidak perlu minum obat lagi.|薬[くすり]を/もう/飲[の]まなくても/いいです"]},
{b:17,t:"Waktu までに (paling lambat)",d:"Waktu + <b>までに</b> = paling lambat pada waktu itu; kegiatannya cukup terjadi sekali sebelum batas tersebut (金曜日までに 返します). Bandingkan dengan <b>まで</b> (Bab 4) yang berarti kegiatan berlangsung terus sampai waktu itu (5時まで 働きます). Jadi までに cocok untuk pulang, menyerahkan, atau mengembalikan; まで untuk bekerja, menunggu, atau belajar.",
 r:["K-waktu + までに + KK-ます (kegiatan sekali, ada batas waktu)", "K-waktu + まで + KK-ます (kegiatan berlangsung terus sampai waktu itu)", "K-waktu + までに + KK-て + ください / KK-ない(い→ければ) + なりません"],
 s:"K-waktu + までに + O + を + KK-て + ください → 月曜日[げつようび]までに お金[かね]を 払[はら]って ください。",
 k:[["まで", "Artinya 'sampai'. Bagian ini menunjukkan batas akhir waktu."], ["に", "Partikel titik waktu, seperti pada 7時[じ]に. Ditambahkan ke まで, artinya menjadi 'pada suatu titik sebelum atau tepat pada batas itu', yaitu 'paling lambat'."], ["KK (kegiatan sekali)", "までに dipakai dengan kegiatan yang terjadi sekali lalu selesai, misalnya 返[かえ]します, 出[だ]します, 帰[かえ]ります, 払[はら]います."]],
 x:["<b>Fungsi:</b> menyatakan batas waktu (tenggat): kegiatan harus terjadi pada atau sebelum waktu itu. Artinya 'paling lambat' atau 'sebelum'.", "<b>Bedanya dengan まで:</b> まで = kegiatan berlangsung terus sampai waktu itu: 6時[じ]まで 働[はたら]きます (bekerja terus sampai jam 6). までに = kegiatan cukup terjadi sekali sebelum batas: 6時[じ]までに 帰[かえ]ります (pulang paling lambat jam 6).", "<b>Cara memilih:</b> tanyakan, 'apakah kegiatannya berlangsung terus sampai waktu itu?' Kalau ya, pakai まで (待[ま]ちます, 寝[ね]ます, 勉強[べんきょう]します). Kalau kegiatannya sekali lalu selesai, pakai までに (出[だ]します, 返[かえ]します, 払[はら]います, 来[き]ます).", "<b>Sering muncul bersama</b> ～て ください dan ～なければ なりません: 水曜日[すいようび]までに 返[かえ]して ください; 明日[あした]までに 払[はら]わなければ なりません.", "<b>Kesalahan umum:</b> memakai まで saja untuk batas waktu. ✗ 5時[じ]まで レポートを 出[だ]して ください salah, karena menyerahkan laporan bukan kegiatan yang berlangsung terus. Yang benar: 5時[じ]までに."],
 ex:[["この 本[ほん]は 金曜日[きんようび]までに 返[かえ]して ください。", "Tolong kembalikan buku ini paling lambat hari Jumat."], ["毎日[まいにち] 5時[じ]まで 働[はたら]きます。", "Setiap hari saya bekerja sampai jam 5."], ["10時[じ]までに うちへ 帰[かえ]らなければ なりません。", "Saya harus sudah pulang ke rumah paling lambat jam 10."]],
 q:["m|宿題[しゅくだい]は 明日[あした]___ 出[だ]して ください。|Tolong serahkan PR paling lambat besok.|までに|まで|を|が", "m|駅[えき]で 6時[じ]___ 待[ま]ちます。|Saya menunggu di stasiun sampai jam 6.|まで|までに|へ|が", "o|8時[じ]までに/会社[かいしゃ]へ/来[き]て/ください|Tolong datang ke kantor paling lambat jam 8.|会社[かいしゃ]へ/8時[じ]までに/来[き]て/ください", "m|毎晩[まいばん] 12時[じ]___ 勉強[べんきょう]します。|Setiap malam saya belajar sampai jam 12.|まで|までに|を|が", "m|ホテルは 11時[じ]___ 出[で]なければ なりません。|Kita harus keluar dari hotel paling lambat jam 11.|までに|まで|から|で", "m|A: レポートは いつ___ 出[だ]さなければ なりませんか。 B: 金曜日[きんようび]までに 出[だ]して ください。|A: Laporannya harus diserahkan paling lambat kapan? B: Tolong serahkan paling lambat hari Jumat.|までに|まで|に|が", "o|3時[じ]までに/この/手紙[てがみ]を/出[だ]して/ください|Tolong kirim surat ini paling lambat jam 3.|この/手紙[てがみ]を/3時[じ]までに/出[だ]して/ください", "o|明日[あした]の/朝[あさ]までに/レポートを/書[か]かなければ/なりません|Saya harus menulis laporan paling lambat besok pagi.|レポートを/明日[あした]の/朝[あさ]までに/書[か]かなければ/なりません"]},
{b:18,t:"Bentuk kamus",d:"Bentuk kamus adalah bentuk dasar kata kerja, yang tercantum di kamus. Grup I: bunyi -i sebelum ます diganti bunyi -u (書きます → 書く, 待ちます → 待つ, 買います → 買う). Grup II: buang ます, tambah <b>る</b> (食べます → 食べる, 起きます → 起きる). Grup III: します → <b>する</b>, 来ます → <b>来る</b> (くる).",
 r:["KK-kamus + こと + が + できます", "KK-kamus + まえに、 + KK-ます", "趣味[しゅみ] + は + KK-kamus + こと + です"],
 s:"K-tujuan + へ + KK1-kamus + まえに、 + O + を + KK2-ました → ここへ 来[く]る まえに、切符[きっぷ]を 買[か]いました。",
 k:[["-u (書[か]く)", "Bentuk kamus Grup I selalu berakhiran bunyi -u. Bunyi -i sebelum ます (書[か]<b>き</b>ます) diganti bunyi -u dari baris hiragana yang sama: き → く, み → む, ち → つ, り → る, い → う."], ["る (食[た]べる)", "Grup II cukup membuang ます lalu menambah る. Bagian depannya tidak berubah: 食[た]べ + る, 起[お]き + る, 見[み] + る."], ["する / 来[く]る", "Grup III tidak mengikuti aturan, jadi dihafal saja: します → する, 来[き]ます → 来[く]る. Perhatikan bacaannya: き pada 来[き]ます, く pada 来[く]る."], ["こと / まえに", "Di pola Bab 18 ini, kata kerja yang ditempeli こと atau まえに harus bentuk kamus, karena bentuk ます tidak bisa menempel di depan keduanya. Kesopanan kalimat cukup ditunjukkan oleh できます atau ます di akhir."]],
 x:["<b>Bentuk kamus</b> adalah bentuk dasar kata kerja, bentuk yang tercantum di kamus. Artinya sama dengan bentuk ます (sekarang atau akan datang), hanya tanpa ます. Di Bab 18 bentuk ini dipakai di dalam pola ～ことが できます, 趣味[しゅみ]は ～ことです, dan ～まえに.", "<b>Grup I</b> langkah demi langkah: 1) ambil bentuk ます: 書[か]きます; 2) buang ます: 書[か]き; 3) ganti bunyi -i dengan -u: 書[か]く. Contoh lain: 飲[の]みます → 飲[の]む, 泳[およ]ぎます → 泳[およ]ぐ, 話[はな]します → 話[はな]す, 遊[あそ]びます → 遊[あそ]ぶ, 待[ま]ちます → 待[ま]つ, 買[か]います → 買[か]う, 帰[かえ]ります → 帰[かえ]る.", "<b>Grup II</b>: buang ます, tambah る. 食[た]べます → 食[た]べる, 寝[ね]ます → 寝[ね]る, 見[み]ます → 見[み]る, 起[お]きます → 起[お]きる. <b>Grup III</b>: します → する (勉強[べんきょう]します → 勉強[べんきょう]する), 来[き]ます → 来[く]る.", "Kesalahan umum: 1) salah menebak grup. 起[お]きます dan 見[み]ます termasuk Grup II walaupun berbunyi -i sebelum ます, jadi 起[お]きる (bukan 起[お]く ✗). Sebaliknya 帰[かえ]ります dan 入[はい]ります termasuk Grup I, jadi 帰[かえ]る (bukan 帰[かえ]りる ✗); 2) membaca 来[く]る sebagai きる; 3) memakai bentuk ます di depan こと: 泳[およ]ぎます ことが できます ✗.", "Tips: bentuk ない (Bab 17) membantu menebak bentuk kamus Grup I karena keduanya memakai baris hiragana yang sama: 書[か]かない (か), 書[か]きます (き), 書[か]く (く). Kartu kosakata kata kerja di aplikasi ini juga ditulis dalam bentuk kamus, jadi bisa dipakai untuk mengecek."],
 ex:[["日本語[にほんご]で 手紙[てがみ]を 書[か]く ことが できます。", "Saya bisa menulis surat dalam bahasa Jepang."], ["朝[あさ]ご飯[はん]を 食[た]べる まえに、シャワーを 浴[あ]びます。", "Sebelum sarapan, saya mandi."], ["日本[にほん]へ 来[く]る まえに、日本語[にほんご]を 勉強[べんきょう]しました。", "Sebelum datang ke Jepang, saya belajar bahasa Jepang."]],
 q:["m|待[ま]ちます → ___|Bentuk kamus dari 待ちます|待[ま]つ|待[ま]ちる|待[ま]ぬ|待[ま]す", "m|起[お]きます → ___|Bentuk kamus dari 起きます (Grup II)|起[お]きる|起[お]く|起[お]きむ|起[お]かる", "m|来[き]ます → ___|Bentuk kamus dari 来ます|くる|きる|こる|きす", "o|私[わたし]は/車[くるま]を/運転[うんてん]する/ことが/できます|Saya bisa menyetir mobil.", "m|帰[かえ]ります → ___|Bentuk kamus dari 帰ります (Grup I)|帰[かえ]る|帰[かえ]りる|帰[かえ]らない|帰[かえ]りう", "m|勉強[べんきょう]します → ___|Bentuk kamus dari 勉強します|勉強[べんきょう]する|勉強[べんきょう]しる|勉強[べんきょう]くる|勉強[べんきょう]しない", "o|うちへ/帰[かえ]る/まえに/銀行[ぎんこう]へ 行[い]きます|Sebelum pulang ke rumah, saya pergi ke bank.", "o|姉[あね]は/魚[さかな]を/食[た]べる/ことが/できません|Kakak perempuan saya tidak bisa makan ikan."]},
{b:18,t:"～ことが できます",d:"'Bisa/dapat ...', untuk kemampuan (bisa berenang) atau kemungkinan (di perpustakaan ini bisa memakai internet). Kata kerja bentuk kamus + <b>ことが できます</b>: 泳ぐ ことが できます. Kata benda cukup ditambah <b>が できます</b>: 日本語が できます, 運転が できます.",
 r:["S + は + (O + を) + KK-kamus + こと + が + できます", "S + は + KB + が + できます", "K-tempat + で + (O + を) + KK-kamus + こと + が + できます"],
 s:"S + は + O + を + KK-kamus + こと + が + できます → 私[わたし]は 漢字[かんじ]を 読[よ]む ことが できます。",
 k:[["KK-kamus", "Dalam pola ini, kata kerja yang ditempeli こと harus bentuk kamus (泳[およ]ぐ, 弾[ひ]く, 運転[うんてん]する). Bentuk ます tidak bisa langsung diikuti こと."], ["こと", "こと berarti 'hal'. Kata ini mengubah kegiatan menjadi kata benda: 泳[およ]ぐ (berenang) → 泳[およ]ぐ こと (hal berenang). Setelah menjadi kata benda, barulah bisa diikuti が できます."], ["が", "Seperti pada わかります dan 好[す]きです (Bab 9), hal yang bisa dilakukan ditandai が, bukan を: ピアノが できます, 泳[およ]ぐ ことが できます."], ["を", "Objek kata kerja di dalam bagian こと tetap memakai を: ピアノを 弾[ひ]く ことが できます. を menempel pada 弾[ひ]く, sedangkan が menempel pada こと."], ["できます", "Artinya 'bisa, mampu' atau 'bisa dilakukan'. Negatifnya できません, bentuk lampaunya できました."]],
 x:["Pola ini punya dua arti. <b>Kemampuan</b>: 私[わたし]は 泳[およ]ぐ ことが できます (saya bisa berenang). <b>Kemungkinan</b> di suatu tempat atau keadaan: この 店[みせ]で カードを 使[つか]う ことが できます (di toko ini kartu bisa dipakai).", "Cara membentuk: 1) mulai dari bentuk ます: ピアノを 弾[ひ]きます; 2) ubah kata kerjanya ke bentuk kamus: ピアノを 弾[ひ]く; 3) tambah ことが できます: ピアノを 弾[ひ]く ことが できます.", "Kata benda yang menyatakan kemampuan atau kegiatan tidak perlu こと: 日本語[にほんご]が できます, テニスが できます, 運転[うんてん]が できます. Benda biasa tidak bisa dipakai begitu saja: 'bisa menyetir mobil' adalah 車[くるま]を 運転[うんてん]する ことが できます, bukan 車[くるま]が できます ✗.", "Variasi: negatif ～ことが できません (tidak bisa), pertanyaan ～ことが できますか, lampau ～ことが できました (waktu itu bisa). Jawaban singkat cukup はい、できます atau いいえ、できません.", "Kesalahan umum: 1) できます ditaruh di depan: できます 泳[およ]ぐ ✗; 2) lupa こと: 泳[およ]ぐが できます ✗; 3) memakai を: 泳[およ]ぐ ことを できます ✗; 4) memakai bentuk ます: 泳[およ]ぎます ことが できます ✗.", "Tips: untuk minta izin langsung kepada seseorang, lebih wajar memakai ～ても いいですか (Bab 15): 写真[しゃしん]を 撮[と]っても いいですか. ～ことが できますか lebih cocok untuk menanyakan aturan atau fasilitas: ここで 写真[しゃしん]を 撮[と]る ことが できますか."],
 ex:[["妹[いもうと]は ピアノを 弾[ひ]く ことが できます。", "Adik perempuan saya bisa bermain piano."], ["この 図書館[としょかん]で インターネットを 使[つか]う ことが できます。", "Di perpustakaan ini kita bisa memakai internet."], ["父[ちち]は 運転[うんてん]が できません。", "Ayah saya tidak bisa menyetir."]],
 q:["m|私[わたし]は 100メートル ___ ことが できます。|Saya bisa berenang 100 meter.|泳[およ]ぐ|泳[およ]ぎます|泳[およ]いで|泳[およ]ぎ", "m|ここで 写真[しゃしん]を 撮[と]る ___ できます。|Di sini kita bisa mengambil foto.|ことが|ことに|ことへ|ことと", "o|田中[たなか]さんは/馬[うま]に/乗[の]る/ことが/できます|Tanaka-san bisa naik kuda.", "o|兄[あに]は/日本語[にほんご]と/英語[えいご]が/できます|Kakak laki-laki saya bisa bahasa Jepang dan bahasa Inggris.", "m|兄[あに]は ピアノ___ できます。|Kakak laki-laki saya bisa bermain piano.|が|を|に|で", "m|この 部屋[へや]で たばこを ___ ことが できません。|Di kamar ini kita tidak bisa merokok.|吸[す]う|吸[す]います|吸[す]って|吸[す]いて", "m|駅[えき]の 前[まえ]で 自転車[じてんしゃ]___ 借[か]りる ことが できます。|Di depan stasiun kita bisa meminjam sepeda.|を|が|に|で", "o|母[はは]は/日本語[にほんご]の/新聞[しんぶん]を/読[よ]む/ことが/できません|Ibu saya tidak bisa membaca koran berbahasa Jepang."]},
{b:18,t:"趣味は ～ことです",d:"Untuk menyebut hobi: 趣味は + kata kerja bentuk kamus + <b>ことです</b>. こと mengubah kegiatan menjadi kata benda ('hal ...'). Hobi juga bisa disebut dengan kata benda saja (趣味は写真です), tetapi dengan kata kerja hasilnya lebih spesifik (趣味は山の写真を撮ることです).",
 r:["S + の + 趣味[しゅみ] + は + (O + を) + KK-kamus + こと + です", "S + の + 趣味[しゅみ] + は + KB + です"],
 s:"S + の + 趣味[しゅみ] + は + O + を + KK-kamus + こと + です → 私[わたし]の 趣味[しゅみ]は 切手[きって]を 集[あつ]める ことです。",
 k:[["の", "Menunjukkan pemilik: 私[わたし]の 趣味[しゅみ] = hobi saya. Pemilik di depan の, 趣味[しゅみ] di belakang."], ["は", "Menjadikan 趣味[しゅみ] sebagai topik. Bagian sesudah は menjelaskan apa hobinya, sama seperti pola A は B です (Bab 1)."], ["こと", "Dalam A は B です, bagian B harus kata benda. Kegiatan seperti 切手[きって]を 集[あつ]める masih berupa kata kerja, jadi ditempeli こと supaya menjadi kata benda: 'hal mengumpulkan prangko'."], ["KK-kamus", "Dalam pola ini, kata kerja di depan こと selalu bentuk kamus: 集[あつ]める, bukan 集[あつ]めます."], ["です", "Penutup sopan dari pola A は B です. Tugasnya mirip kata 'adalah', hanya saja letaknya di akhir kalimat."]],
 x:["Pola ini dipakai untuk menyebut hobi secara rinci. Kata benda saja juga bisa (趣味[しゅみ]は 音楽[おんがく]です), tetapi dengan kata kerja kita bisa menjelaskan kegiatannya: 趣味[しゅみ]は 古[ふる]い 映画[えいが]を 見[み]る ことです.", "Cara membentuk: 1) tulis kegiatannya dalam bentuk ます: 花[はな]の 写真[しゃしん]を 撮[と]ります; 2) ubah kata kerjanya ke bentuk kamus: 撮[と]る; 3) tambah ことです di belakang dan 私[わたし]の 趣味[しゅみ]は di depan: 私[わたし]の 趣味[しゅみ]は 花[はな]の 写真[しゃしん]を 撮[と]る ことです.", "Bertanya hobi: 趣味[しゅみ]は 何[なん]ですか. Jawabannya bisa singkat (料理[りょうり]です) atau lengkap (料理[りょうり]を 作[つく]る ことです). Untuk hobi orang lain cukup ganti pemiliknya: 父[ちち]の 趣味[しゅみ]は ～, ミラーさんの 趣味[しゅみ]は ～.", "Hobi yang sudah punya kata benda sendiri, seperti 釣[つ]り, 旅行[りょこう], 料理[りょうり], atau スポーツ, cukup disebut dengan kata benda itu. Untuk menambah rincian, pakai kalimat kedua dengan 特[とく]に (terutama): 趣味[しゅみ]は 音楽[おんがく]を 聞[き]く ことです。特[とく]に ジャズが 好[す]きです.", "Kesalahan umum: menerjemahkan kata per kata 'hobi saya membaca' menjadi 趣味[しゅみ]は 読[よ]みます ✗ atau 趣味[しゅみ]は 読[よ]む です ✗. Yang benar: 趣味[しゅみ]は 本[ほん]を 読[よ]む ことです. Untuk 'hobi saya' pakai 私[わたし]の 趣味[しゅみ], dengan の."],
 ex:[["私[わたし]の 趣味[しゅみ]は 写真[しゃしん]を 撮[と]る ことです。", "Hobi saya memotret."], ["兄[あに]の 趣味[しゅみ]は 釣[つ]りです。", "Hobi kakak laki-laki saya memancing."], ["母[はは]の 趣味[しゅみ]は インドネシアの 歌[うた]を 歌[うた]う ことです。", "Hobi ibu saya menyanyikan lagu-lagu Indonesia."]],
 q:["m|私[わたし]の 趣味[しゅみ]は 本[ほん]を ___ ことです。|Hobi saya membaca buku.|読[よ]む|読[よ]みます|読[よ]んで|読[よ]み", "m|妹[いもうと]の 趣味[しゅみ]は 絵[え]を かく ___。|Hobi adik perempuan saya menggambar.|ことです|です|ことが できます|ます", "o|私[わたし]の/趣味[しゅみ]は/インドネシア料理[りょうり]を/作[つく]る/ことです|Hobi saya memasak masakan Indonesia.", "m|母[はは]の 趣味[しゅみ]は ___です。|Hobi ibu saya memasak.|料理[りょうり]|料理[りょうり]を 作[つく]る|料理[りょうり]を 作[つく]ります|料理[りょうり]を 作[つく]って", "m|A: 趣味[しゅみ]は ___ですか。 B: 映画[えいが]を 見[み]る ことです。|Hobi Anda apa? Menonton film.|何[なん]|どこ|誰[だれ]|いつ", "m|私[わたし]の 趣味[しゅみ]は 友達[ともだち]と テニスを ___ ことです。|Hobi saya bermain tenis dengan teman.|する|します|して|しない", "o|姉[あね]の/趣味[しゅみ]は/ピアノを/弾[ひ]く/ことです|Hobi kakak perempuan saya bermain piano.", "o|弟[おとうと]の/趣味[しゅみ]は/動物[どうぶつ]の/写真[しゃしん]を/撮[と]る/ことです|Hobi adik laki-laki saya memotret binatang."]},
{b:18,t:"～まえに",d:"'Sebelum ...'. Kata kerja bentuk kamus + <b>まえに</b> (出かける まえに), kata benda + <b>の まえに</b> (会議の まえに), jumlah waktu + <b>まえに</b> = '... yang lalu' (2年 まえに). Kata kerja sebelum まえに selalu bentuk kamus, walaupun kejadiannya sudah lampau: 日本へ来るまえに、勉強しました.",
 r:["KK1-kamus + まえに、 + KK2-ます", "KB + の + まえに、 + KK-ます", "K-waktu(jumlah) + まえに、 + KK-ました"],
 s:"KK1-kamus + まえに、 + O + を + KK2-ます → 寝[ね]る まえに、テレビを 消[け]します。",
 k:[["まえに", "まえ berarti 'depan', dan untuk waktu berarti 'sebelum' (bandingkan 駅[えき]の 前[まえ], Bab 10). に menandai titik waktu, sama seperti pada 7時[じ]に. Jadi ～まえに = 'pada waktu sebelum ...'."], ["KK1-kamus", "Kata kerja di depan まえに selalu bentuk kamus, walaupun kejadiannya sudah lewat. Lampau atau tidaknya kalimat ditentukan oleh kata kerja di akhir: 寝[ね]る まえに、電話[でんわ]しました."], ["の", "Kata benda disambung ke まえに dengan の, sama seperti 机[つくえ]の 上[うえ] (Bab 10). Kata bendanya berupa kegiatan atau acara: 食事[しょくじ]の まえに, 試験[しけん]の まえに."], ["3年[ねん] まえに", "Sesudah jumlah waktu, まえに langsung menempel tanpa の dan artinya '... yang lalu': 3年[ねん] まえに = tiga tahun yang lalu. Kata kerjanya biasanya bentuk lampau."], ["KK2-ます", "Kegiatan utama ditulis di akhir kalimat. Kegiatan inilah yang dilakukan lebih dulu; kegiatan di depan まえに terjadi sesudahnya."]],
 x:["Arti: 'sebelum ...'. Dalam 寝[ね]る まえに、本[ほん]を 読[よ]みます, yang dilakukan lebih dulu adalah membaca buku (bagian akhir), sesudah itu baru tidur (bagian depan まえに).", "Cara membentuk: 1) kegiatan yang terjadi belakangan diubah ke bentuk kamus: 行[い]きます → 行[い]く; 2) tambah まえに dan koma; 3) tulis kegiatan utama dalam bentuk ます atau ました: 会社[かいしゃ]へ 行[い]く まえに、新聞[しんぶん]を 読[よ]みます.", "Ada tiga jenis kata yang bisa diletakkan di depan まえに: kata kerja bentuk kamus (出[で]かける まえに), kata benda + の (会議[かいぎ]の まえに), dan jumlah waktu tanpa の (1時間[じかん] まえに = satu jam yang lalu).", "Kesalahan umum: 1) bagian まえに ditaruh di belakang: シャワーを 浴[あ]びます、寝[ね]る まえに ✗. Bagian まえに selalu diletakkan di depan; 2) memakai bentuk ます: 寝[ね]ます まえに ✗; 3) mengubahnya ke bentuk lampau karena kejadiannya sudah lewat: 来[き]ました まえに ✗.", "Bandingkan dengan ～てから (Bab 16), yang urutannya terbalik: 食[た]べてから 寝[ね]ます (makan dulu, lalu tidur) dan 寝[ね]る まえに 食[た]べます (sebelum tidur, saya makan). Isi ceritanya mirip; bedanya hanya kegiatan mana yang dijadikan patokan."],
 ex:[["出[で]かける まえに、電気[でんき]を 消[け]します。", "Sebelum pergi, saya mematikan lampu."], ["会議[かいぎ]の まえに、資料[しりょう]を コピーします。", "Sebelum rapat, saya memfotokopi bahan rapat."], ["2年[ねん]まえに、この 町[まち]へ 来[き]ました。", "Saya datang ke kota ini 2 tahun yang lalu."]],
 q:["m|うちを ___ まえに、窓[まど]を 閉[し]めます。|Sebelum keluar rumah, saya menutup jendela.|出[で]る|出[で]ます|出[で]て|出[で]ません", "m|食事[しょくじ]___ まえに、手[て]を 洗[あら]います。|Sebelum makan, saya mencuci tangan.|の|が|に|で", "o|会社[かいしゃ]へ/行[い]く/まえに/ジョギングします|Sebelum berangkat ke kantor, saya joging.", "m|三日[みっか] ___、友達[ともだち]に 手紙[てがみ]を 書[か]きました。|Tiga hari yang lalu saya menulis surat kepada teman.|まえに|の まえに|まえで|まえへ", "m|先週[せんしゅう]、国[くに]へ ___ まえに、お土産[みやげ]を 買[か]いました。|Minggu lalu, sebelum pulang ke negara saya, saya membeli oleh-oleh.|帰[かえ]る|帰[かえ]りました|帰[かえ]って|帰[かえ]らない", "m|旅行[りょこう]を ___ まえに、ホテルを 予約[よやく]します。|Sebelum berwisata, saya memesan hotel.|する|します|して|しない", "o|晩[ばん]ごはんの/まえに/お風呂[ふろ]に/入[はい]ります|Sebelum makan malam, saya mandi berendam.", "o|電車[でんしゃ]に/乗[の]る/まえに/時刻表[じこくひょう]を 見[み]ます|Sebelum naik kereta, saya melihat jadwal."]},
{b:19,t:"Bentuk た",d:"Bentuk た (bentuk lampau biasa) dibuat persis seperti bentuk-て: ganti て dengan <b>た</b>, atau で dengan <b>だ</b>. Contoh: 書いて → 書いた, 飲んで → 飲んだ, 食べて → 食べた, して → した, 来て → 来た (きた), 行って → 行った. Di Bab 19 bentuk ini dipakai untuk ～たことが あります dan ～たり ～たり します.",
 r:["S + は + (O + を) + KK-た + こと + が + あります", "KK1-た + り、 + KK2-た + り + します"],
 s:"S + は + O + を + KK-た + こと + が + あります → 私[わたし]は 相撲[すもう]を 見[み]た ことが あります。",
