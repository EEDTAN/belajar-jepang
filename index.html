 k:[["た / だ", "Akhiran bentuk lampau biasa. Asalnya dari bentuk て: て diganti た, で diganti だ. Kalau bentuk て sudah hafal, bentuk た tinggal mengganti satu huruf."], ["いた / いだ", "Grup I yang berbunyi き sebelum ます menjadi いた (書[か]きます → 書[か]いた), yang berbunyi ぎ menjadi いだ (泳[およ]ぎます → 泳[およ]いだ)."], ["った / んだ", "Grup I dengan い, ち, り sebelum ます menjadi った (買[か]った, 待[ま]った, 帰[かえ]った). Dengan み, び, に menjadi んだ (飲[の]んだ, 遊[あそ]んだ)."], ["した", "Grup I dengan し sebelum ます cukup mengganti ます dengan た (話[はな]します → 話[はな]した). します dari Grup III juga menjadi した."], ["食[た]べた / 来[き]た", "Grup II: buang ます, tambah た (食[た]べた, 見[み]た). 来[き]ます menjadi 来[き]た, dibaca きた seperti pada 来[き]ます."], ["行[い]った", "Pengecualian: 行[い]きます berbunyi き, tetapi bentuk た-nya 行[い]った, bukan 行[い]いた."]],
 x:["Bentuk た adalah bentuk lampau dari bentuk biasa. Artinya sama dengan ～ました, hanya tanpa ます. Di Bab 19 bentuk ini dipakai di dalam pola: ～た ことが あります (pernah) dan ～たり ～たり します (contoh kegiatan).", "Cara membentuk: 1) buat bentuk て; 2) ganti て dengan た, atau で dengan だ. 書[か]きます → 書[か]いて → 書[か]いた; 飲[の]みます → 飲[の]んで → 飲[の]んだ; 起[お]きます → 起[お]きて → 起[お]きた; 勉強[べんきょう]します → 勉強[べんきょう]して → 勉強[べんきょう]した.", "Ringkasan Grup I menurut bunyi sebelum ます: き → いた, ぎ → いだ, い・ち・り → った, み・び・に → んだ, し → した. Pengecualian: 行[い]きます → 行[い]った. Grup II: ます → た. Grup III: した, 来[き]た.", "Bentuk sopan dan bentuk biasa: 食[た]べました ↔ 食[た]べた, 行[い]きました ↔ 行[い]った. Di dalam pola, kesopanan tetap dijaga oleh bagian akhir kalimat: 食[た]べた ことが あります.", "Kesalahan umum: memakai aturan Grup II untuk Grup I (書[か]きた ✗, 飲[の]みた ✗), lupa pengecualian (行[い]いた ✗), lupa bahwa た berubah menjadi だ (泳[およ]いた ✗, 飲[の]んた ✗), dan salah membaca 来[き]た (くた ✗).", "Tips: ucapkan berpasangan, bentuk て lalu bentuk た: 書[か]いて・書[か]いた, 飲[の]んで・飲[の]んだ, 待[ま]って・待[ま]った. Satu hafalan langsung terpakai untuk dua bentuk."],
 ex:[["日本[にほん]の お酒[さけ]を 飲[の]んだ ことが あります。", "Saya pernah minum sake Jepang."], ["すき焼[や]きを 食[た]べた ことが ありますか。", "Pernahkah kamu makan sukiyaki?"], ["日曜日[にちようび]は 掃除[そうじ]したり、洗濯[せんたく]したり します。", "Hari Minggu saya bersih-bersih, mencuci baju, dan sebagainya."]],
 q:["m|書[か]きます → ___|Bentuk た dari 書きます|書[か]いた|書[か]きた|書[か]った|書[か]んだ", "m|行[い]きます → ___|Bentuk た dari 行きます (pengecualian)|行[い]った|行[い]いた|行[い]きた|行[い]んだ", "m|泳[およ]ぎます → ___|Bentuk た dari 泳ぎます|泳[およ]いだ|泳[およ]いた|泳[およ]んだ|泳[およ]ぎた", "o|日本[にほん]の/歌[うた]を/歌[うた]った/ことが/あります|Saya pernah menyanyikan lagu Jepang.", "m|遊[あそ]びます → ___|Bentuk た dari 遊びます|遊[あそ]んだ|遊[あそ]びた|遊[あそ]った|遊[あそ]いだ", "m|来[き]ます → ___|Bentuk た dari 来ます|きた|くた|こた|きった", "o|私[わたし]は/お寺[てら]に/泊[と]まった/ことが/あります|Saya pernah menginap di kuil.", "o|休[やす]みの 日[ひ]は/ピアノを/弾[ひ]いたり/歌[うた]を/歌[うた]ったり/します|Pada hari libur saya bermain piano, bernyanyi, dan lain-lain.|休[やす]みの 日[ひ]は/歌[うた]を/歌[うた]ったり/ピアノを/弾[ひ]いたり/します"]},
{b:19,t:"～たことが あります",d:"Bentuk た + <b>ことが あります</b> = 'pernah ...' (pengalaman). Belum pernah: <b>～たことが ありません</b>, sering ditambah 一度も (sekali pun). Untuk kejadian pada waktu tertentu (kemarin, tahun lalu) cukup pakai ～ました: 去年 日本へ 行きました.",
 r:["S + は + (O + を) + KK-た + こと + が + あります", "S + は + (一度[いちど]も) + KK-た + こと + が + ありません"],
 s:"S + は + O + を + KK-た + こと + が + あります → 私[わたし]は ゴルフを した ことが あります。",
 k:[["KK-た", "Pengalaman adalah sesuatu yang sudah terjadi, jadi kata kerjanya memakai bentuk lampau, yaitu bentuk た: 行[い]った, 食[た]べた, した."], ["こと", "Mengubah kegiatan menjadi kata benda: 行[い]った こと = 'hal pernah pergi', yaitu sebuah pengalaman. Dengan begitu pengalaman itu bisa dikatakan 'ada' (あります)."], ["が", "Menandai apa yang ada, sama seperti pada 用事[ようじ]が あります (Bab 9). Yang 'ada' di sini adalah pengalaman itu."], ["あります", "Secara harfiah 'ada pengalaman ...'. Pengalaman bukan makhluk hidup, jadi memakai あります, bukan います. Kalau belum pernah: ありません."], ["一度[いちど]も", "Artinya 'sekali pun'. Selalu dipasangkan dengan bentuk negatif untuk menegaskan 'belum pernah sama sekali': 一度[いちど]も 見[み]た ことが ありません."]],
 x:["Arti: 'pernah ...'. Pola ini dipakai untuk pengalaman yang agak istimewa, misalnya naik Shinkansen atau menonton sumo. Kegiatan sehari-hari yang pasti pernah dilakukan semua orang, seperti minum air atau tidur, tidak cocok dengan pola ini.", "Cara membentuk: 1) ubah kata kerja ke bentuk た: 登[のぼ]ります → 登[のぼ]った; 2) tambah ことが あります: 山[やま]に 登[のぼ]った ことが あります.", "Variasi: pertanyaan ～た ことが ありますか dijawab はい、あります atau いいえ、ありません (kata kerjanya tidak perlu diulang). Negatifnya ～た ことが ありません; untuk 'belum pernah sama sekali' tambahkan 一度[いちど]も.", "Kalau waktu kejadiannya disebut dengan jelas (kemarin, minggu lalu), pakai ～ました saja: 昨日[きのう] すき焼[や]きを 食[た]べました. Kalimat 昨日[きのう] すき焼[や]きを 食[た]べた ことが あります terdengar aneh.", "Kesalahan umum: 'sudah' tertukar dengan 'pernah'. 'Sudah makan?' adalah もう 食[た]べましたか (Bab 7), bukan 食[た]べた ことが ありますか. Kesalahan lain: 食[た]べる ことが あります (bentuk kamus, artinya lain), ことを あります ✗, ことが います ✗.", "Tips: jawaban pendek sudah cukup. A: 馬[うま]に 乗[の]った ことが ありますか。 B: いいえ、ありません。一度[いちど] 乗[の]りたいです."],
 ex:[["私[わたし]は 新幹線[しんかんせん]に 乗[の]った ことが あります。", "Saya pernah naik Shinkansen."], ["雪[ゆき]を 見[み]た ことが ありますか。", "Pernahkah kamu melihat salju?"], ["まだ 一度[いちど]も 日本[にほん]へ 行[い]った ことが ありません。", "Saya belum pernah sekali pun pergi ke Jepang."]],
 q:["m|私[わたし]は 刺身[さしみ]を 食[た]べた ことが ___。|Saya belum pernah makan sashimi.|ありません|いません|しません|なりません", "m|日本[にほん]の お茶[ちゃ]を ___ ことが ありますか。|Pernahkah kamu minum teh Jepang?|飲[の]んだ|飲[の]みた|飲[の]んで|飲[の]みます", "o|一度[いちど]も/飛行機[ひこうき]に/乗[の]った/ことが/ありません|Saya belum pernah sekali pun naik pesawat.|飛行機[ひこうき]に/一度[いちど]も/乗[の]った/ことが/ありません", "m|この 映画[えいが]を ___ ことが ありますか。|Pernahkah kamu menonton film ini?|見[み]た|見[み]った|見[み]て|見[み]ました", "m|A: 歌舞伎[かぶき]を 見[み]た ことが ありますか。 B: いいえ、___。|Pernah menonton kabuki? Belum pernah.|ありません|あります|いません|しません", "m|昨日[きのう]、初[はじ]めて 新幹線[しんかんせん]に ___。|Kemarin saya naik Shinkansen untuk pertama kalinya.|乗[の]りました|乗[の]った ことが あります|乗[の]る ことが できます|乗[の]って います", "o|私[わたし]は/日本[にほん]の/お祭[まつ]りに/行[い]った/ことが/あります|Saya pernah pergi ke festival di Jepang.", "o|外国[がいこく]で/働[はたら]いた/ことが/ありますか|Pernahkah Anda bekerja di luar negeri?"]},
{b:19,t:"～たり ～たり します",d:"Bentuk た + <b>り</b> untuk menyebut beberapa contoh kegiatan, tanpa urutan tertentu dan tidak harus lengkap ('..., ..., dan lain-lain'). Kalimat ditutup dengan <b>します</b>; untuk masa lampau cukup ubah bagian akhir: ～たり、～たり しました. Bandingkan ～て、～て (Bab 16) yang menyebut kegiatan secara berurutan.",
 r:["(K-waktu + は) + O1 + を + KK1-た + り、 + O2 + を + KK2-た + り + します", "KK1-た + り、 + KK2-た + り + しました/したいです"],
 s:"K-waktu + は + O1 + を + KK1-た + り、 + KK2-た + り + します → 土曜日[どようび]は テニスを したり、泳[およ]いだり します。",
 k:[["たり", "Ditempelkan pada bentuk た: した + り = したり, 泳[およ]いだ + り = 泳[およ]いだり. Tugasnya menandai bahwa kegiatan itu hanya contoh; masih ada kegiatan lain yang tidak disebut."], ["します", "Bentuk ～たり belum bisa menutup kalimat, jadi kalimat harus diakhiri します. Waktu dan kesopanan kalimat diatur di sini: します, しました, したいです."], ["は", "Kata waktu seperti 土曜日[どようび] dijadikan topik: 'kalau hari Sabtu, ...'. Pola ini memang sering dipakai untuk menjawab pertanyaan 'biasanya melakukan apa pada hari itu?'."], ["を", "Setiap kata kerja tetap membawa objeknya sendiri: テニスを したり、本[ほん]を 読[よ]んだり."]],
 x:["Arti: '..., ..., dan lain-lain'. Kita mengambil dua contoh dari banyak kegiatan. Urutannya bebas dan tidak menunjukkan mana yang dilakukan lebih dulu.", "Cara membentuk: 1) ubah setiap kata kerja ke bentuk た: 読[よ]みます → 読[よ]んだ, 見[み]ます → 見[み]た; 2) tambah り: 読[よ]んだり, 見[み]たり; 3) sambung dengan koma, lalu tutup dengan します: 本[ほん]を 読[よ]んだり、テレビを 見[み]たり します.", "Waktu dan keinginan cukup diubah di akhir: ～たり ～たり しました (lampau), ～たり ～たり したいです (ingin). Contoh tanya jawab: 休[やす]みの 日[ひ]は 何[なに]を しますか。— 掃除[そうじ]したり、買[か]い物[もの]を したり します.", "Bandingkan dengan ～て、～て (Bab 16), yang menyebut kegiatan sesuai urutan waktu: 朝[あさ] 起[お]きて、顔[かお]を 洗[あら]って、ご飯[はん]を 食[た]べます. ～たり hanya memberi contoh, mirip や (Bab 10) untuk kata benda: パンや 卵[たまご]を 買[か]いました (roti, telur, dan lain-lain).", "Kesalahan umum: 1) lupa します di akhir: 本[ほん]を 読[よ]んだり、テレビを 見[み]たり。✗; 2) membentuk dari bentuk ます: 読[よ]みたり ✗; 3) memakai たり hanya pada kata kerja pertama: 本[ほん]を 読[よ]んだり、テレビを 見[み]ます ✗."],
 ex:[["週末[しゅうまつ]は 映画[えいが]を 見[み]たり、買[か]い物[もの]を したり します。", "Akhir pekan saya menonton film, berbelanja, dan lain-lain."], ["昨日[きのう]は うちで 本[ほん]を 読[よ]んだり、手紙[てがみ]を 書[か]いたり しました。", "Kemarin di rumah saya membaca buku, menulis surat, dan sebagainya."]],
 q:["m|パーティーで 歌[うた]を 歌[うた]ったり、___ しました。|Di pesta kami bernyanyi, berdansa, dan lain-lain.|ダンスを したり|ダンスを しました|ダンスを して|ダンスを します", "m|日曜日[にちようび]は 散歩[さんぽ]したり、友達[ともだち]に ___ します。|Hari Minggu saya jalan-jalan, bertemu teman, dan sebagainya.|会[あ]ったり|会[あ]って|会[あ]いたり|会[あ]ったら", "o|夜[よる]は/テレビを/見[み]たり/音楽[おんがく]を/聞[き]いたり/します|Malam hari saya menonton TV, mendengarkan musik, dan sebagainya.|夜[よる]は/音楽[おんがく]を/聞[き]いたり/テレビを/見[み]たり/します", "m|週末[しゅうまつ]は 部屋[へや]で 音楽[おんがく]を 聞[き]いたり、本[ほん]を ___ します。|Akhir pekan saya mendengarkan musik di kamar, membaca buku, dan lain-lain.|読[よ]んだり|読[よ]みたり|読[よ]んで|読[よ]むり", "m|昨日[きのう]は 洗濯[せんたく]したり、料理[りょうり]を 作[つく]ったり ___。|Kemarin saya mencuci baju, memasak, dan lain-lain.|しました|します|しましょう|ました", "m|旅行[りょこう]で 写真[しゃしん]を 撮[と]ったり、お土産[みやげ]を ___ しました。|Waktu berwisata saya memotret, membeli oleh-oleh, dan lain-lain.|買[か]ったり|買[か]いたり|買[か]んだり|買[か]って", "o|パーティーで/食[た]べたり/飲[の]んだり/しました|Di pesta kami makan, minum, dan lain-lain.|パーティーで/飲[の]んだり/食[た]べたり/しました", "o|夏休[なつやす]みは/国[くに]へ/帰[かえ]ったり/旅行[りょこう]したり/したいです|Waktu libur musim panas saya ingin pulang ke negara saya, berwisata, dan lain-lain.|夏休[なつやす]みは/旅行[りょこう]したり/国[くに]へ/帰[かえ]ったり/したいです"]},
{b:19,t:"～く / ～に なります",d:"なります = 'menjadi', untuk perubahan keadaan. Kata sifat-い: ganti い dengan <b>く</b> (寒い → 寒く なります; いい → よく なります). Kata sifat-な dan kata benda: tambah <b>に</b> (元気 → 元気に なります, 医者 → 医者に なります).",
 r:["S + が/は + KS-i(い→く) + なります", "S + が/は + KS-na + に + なります", "S + が/は + KB + に + なります"],
 s:"S + が + KS-i(い→く) + なりました → 部屋[へや]が 暖[あたた]かく なりました。",
 k:[["く", "Kata sifat-い tidak bisa langsung menempel pada なります. Ujung い diganti く supaya bisa menerangkan kata kerja: 寒[さむ]い → 寒[さむ]く なります. Khusus いい menjadi よく."], ["に", "Untuk KS-na dan KB, に menunjukkan hasil akhir perubahan, 'menjadi apa': 元気[げんき]に なります, 医者[いしゃ]に なります. な pada KS-na tidak dipakai."], ["なります", "Kata kerja Grup I yang artinya 'menjadi'. Bentuk なりました dipakai kalau perubahannya sudah terjadi, dan sering diterjemahkan 'sudah jadi' atau 'sekarang sudah'."], ["が / は", "Hal yang berubah adalah subjek dan biasanya ditandai が: 空[そら]が 暗[くら]く なりました. Kalau hal itu dijadikan topik pembicaraan, pakai は: この 町[まち]は にぎやかに なりました."]],
 x:["Arti: 'menjadi ...', untuk perubahan keadaan. Sering juga diterjemahkan 'sudah': よく なりました = sudah sembuh, 10時[じ]に なりました = sudah jam 10.", "Cara membentuk: <b>KS-i</b>: ganti い dengan く, lalu なります (高[たか]い → 高[たか]く なります, 眠[ねむ]い → 眠[ねむ]く なります, いい → よく なります). <b>KS-na</b>: tambah に + なります (きれい → きれいに なります, 上手[じょうず] → 上手[じょうず]に なります). <b>KB</b>: tambah に + なります (先生[せんせい]に なります, 春[はる]に なります).", "Variasi: なりました (sudah berubah), なりませんでした (tidak berubah), なりたいです (ingin menjadi, Bab 13). Kata yang sering ikut: だんだん (sedikit demi sedikit): だんだん 寒[さむ]く なります; もうすぐ (sebentar lagi): もうすぐ 夏[なつ]に なります; なかなか (Bab 18): なかなか 上手[じょうず]に なりません (tidak juga jadi pandai).", "Kesalahan umum: 1) KS-i diberi に: 寒[さむ]いに なります ✗; 2) い tidak diubah: 寒[さむ]い なります ✗; 3) きれい dan 嫌[きら]い dikira KS-i karena berakhiran い: きれく なります ✗, yang benar きれいに なります; 4) いい → いく ✗, yang benar よく.", "Tips: sebelum なります, kata sifatnya diubah dulu: KS-i diganti い → く (寒[さむ]く), KS-na ditambah に (きれいに). Jadi biasakan bertanya: kata sifat ini jenis い atau な?"],
 ex:[["秋[あき]に なって、涼[すず]しく なりました。", "Sudah masuk musim gugur, udaranya jadi sejuk."], ["体[からだ]の 調子[ちょうし]が よく なりました。", "Kondisi badan saya sudah membaik."], ["私[わたし]は 医者[いしゃ]に なりたいです。", "Saya ingin menjadi dokter."]],
 q:["m|日本語[にほんご]が 上手[じょうず]___ なりました。|Bahasa Jepang Anda sudah menjadi mahir.|に|く|な|で", "m|かぜは もう ___ なりました。|Masuk anginnya sudah sembuh.|よく|いく|いいに|よいに", "m|姉[あね]は 先生[せんせい]___ なりました。|Kakak perempuan saya sudah menjadi guru.|に|く|を|が", "o|冬[ふゆ]は/夜[よる]が/長[なが]く/なります|Pada musim dingin, malam menjadi panjang.", "m|日本語[にほんご]の 勉強[べんきょう]は だんだん ___ なりました。|Belajar bahasa Jepang lama-lama jadi menyenangkan.|楽[たの]しく|楽[たの]しい|楽[たの]しいに|楽[たの]しに", "m|部屋[へや]を 掃除[そうじ]しましたから、___ なりました。|Saya sudah membersihkan kamar, jadi kamarnya sudah bersih.|きれいに|きれく|きれいく|きれいな", "o|外[そと]が/だんだん/暗[くら]く/なりました|Di luar lama-lama menjadi gelap.|だんだん/外[そと]が/暗[くら]く/なりました", "o|兄[あに]は/去年[きょねん]/銀行員[ぎんこういん]に/なりました|Kakak laki-laki saya menjadi pegawai bank tahun lalu.|去年[きょねん]/兄[あに]は/銀行員[ぎんこういん]に/なりました"]},
{b:20,t:"Bentuk biasa (普通形)",d:"Bentuk biasa adalah bentuk tanpa です/ます, dipakai dalam obrolan akrab dan di dalam banyak pola lain. <b>Kata kerja</b>: 行きます → 行く, 行きません → 行かない, 行きました → 行った, 行きませんでした → 行かなかった (ingat: ありません → ない). <b>Sifat-い</b>: cukup buang です: 高い, 高くない, 高かった, 高くなかった. <b>Sifat-な dan kata benda</b>: です → <b>だ</b>, じゃありません → じゃない, でした → <b>だった</b>, じゃありませんでした → じゃなかった.",
 r:["S + は + (O + を) + KK-kamus/KK-ない/KK-た/KK-なかった", "S + は + KS-i(い/くない/かった/くなかった)", "S + は + KS-na/KB + だ/じゃない/だった/じゃなかった"],
 s:"K-waktu + は + O + を + KK-なかった → 昨日[きのう]は コーヒーを 飲[の]まなかった。",
 k:[["だ", "Bentuk biasa dari です untuk KS-na dan KB: 暇[ひま]だ, 雨[あめ]だ. KS-i tidak memakai だ karena 高[たか]い sudah lengkap sendiri (高[たか]いだ ✗)."], ["ない", "Penanda negatif. KK memakai bentuk ない (行[い]かない, Bab 17), KS-i mengganti い dengan くない (高[たか]くない), KS-na dan KB memakai じゃない. Khusus あります → ない."], ["た / かった / だった", "Penanda lampau. KK memakai bentuk た (行[い]った), KS-i mengganti い dengan かった (高[たか]かった), KS-na dan KB memakai だった (暇[ひま]だった)."], ["なかった", "Negatif lampau. Bentuk ない diubah seperti KS-i, yaitu い diganti かった: 行[い]かない → 行[い]かなかった, 高[たか]くない → 高[たか]くなかった, 暇[ひま]じゃない → 暇[ひま]じゃなかった."]],
 x:["Bentuk biasa adalah pasangan tidak formal dari bentuk です/ます. Artinya sama, hanya tingkat kesopanannya yang berbeda. Bentuk ini dipakai saat bicara dengan teman dekat dan keluarga, juga dalam tulisan seperti buku harian (日記[にっき]).", "<b>KK</b>, contoh 書[か]きます: 書[か]く (kamus), 書[か]かない (ない), 書[か]いた (た), 書[か]かなかった (ない → なかった). Grup III: する, しない, した, しなかった; 来[く]る, 来[こ]ない, 来[き]た, 来[こ]なかった.", "<b>KS-i</b>: cukup buang です. 高[たか]いです → 高[たか]い, 高[たか]くないです → 高[たか]くない, 高[たか]かったです → 高[たか]かった, 高[たか]くなかったです → 高[たか]くなかった. Pengecualian いい: いい, よくない, よかった, よくなかった.", "<b>KS-na dan KB</b>: です → だ, じゃ ありません → じゃない, でした → だった, じゃ ありませんでした → じゃなかった. Contoh: 元気[げんき]だ, 学生[がくせい]じゃない, 雨[あめ]だった.", "Kesalahan umum: 高[たか]いだ ✗; 高[たか]いだった ✗ (lampau KS-i adalah 高[たか]かった); きれいかった ✗ (きれい termasuk KS-na, jadi きれいだった); あらない ✗ (negatif ある adalah ない); 行[い]かないだった ✗ (yang benar 行[い]かなかった).", "Tips: pola lain juga punya bentuk biasa: ～たいです → ～たい, ～て います → ～て いる, ～なければ なりません → ～なければ ならない. Hafalkan dulu pasangan yang paling sering dipakai: ある/ない, いる/いない, する/しない, 行[い]く/行[い]かない."],
 ex:[["昨日[きのう]は 何[なに]も 食[た]べなかった。", "Kemarin aku tidak makan apa-apa."], ["今日[きょう]の 試験[しけん]は 難[むずか]しかった。", "Ujian hari ini sulit."], ["昨日[きのう]は 雨[あめ]だった。", "Kemarin hujan."]],
 q:["m|飲[の]みませんでした → ___|Bentuk biasa dari 飲みませんでした|飲[の]まなかった|飲[の]みなかった|飲[の]まないでした|飲[の]んだない", "m|昨日[きのう]は とても 寒[さむ]___。|Kemarin dingin sekali.|かった|だった|いだった|くだった", "m|先週[せんしゅう]は 暇[ひま]___。|Minggu lalu aku senggang.|だった|かった|いだった|くなかった", "o|あの/人[ひと]は/先生[せんせい]/じゃ/ない|Orang itu bukan guru.", "m|あります → ___|Bentuk biasa negatif dari あります|ない|あらない|ありない|あるない", "m|この 本[ほん]は あまり おもしろ___。|Buku ini tidak begitu menarik.|くない|いない|じゃない|くないだ", "o|昨日[きのう]/友達[ともだち]は/パーティーに/来[こ]なかった|Kemarin temanku tidak datang ke pesta.|友達[ともだち]は/昨日[きのう]/パーティーに/来[こ]なかった", "o|あの/レストランは/安[やす]くて/おいしかった|Restoran itu murah dan enak."]},
{b:20,t:"Percakapan dengan bentuk biasa",d:"Dengan teman akrab dan keluarga, orang Jepang bicara memakai bentuk biasa. Pertanyaan tidak memakai か, cukup diucapkan dengan intonasi naik (行く？), dan だ pada kata benda atau sifat-な ikut dibuang (暇？). Jawabannya <b>うん</b> (ya) atau <b>ううん</b> (tidak), dan partikel は, が, を, へ sering dihilangkan (ご飯、食べた？). Kepada guru, atasan, atau orang yang belum akrab, tetap pakai です/ます.",
 r:["O(tanpa を) + KK-BB + ？", "KB/KS-na(tanpa だ)/KS-i + ？", "うん/ううん + 、 + BB"],
 s:"O(tanpa を) + KK-た + ？ → 昼[ひる]ごはん、食[た]べた？",
 k:[["？", "Pertanyaan bentuk biasa cukup ditandai nada naik di akhir. か biasanya tidak dipakai karena dalam bentuk biasa terdengar kasar."], ["だ (dibuang)", "Pada pertanyaan dengan KB atau KS-na, だ tidak diucapkan: 暇[ひま]？, 雨[あめ]？. Dalam jawaban pun だ sering dibuang: うん、暇[ひま]."], ["うん / ううん", "Pengganti はい dan いいえ dalam obrolan akrab: うん = ya, ううん = tidak. Kepada guru atau atasan tetap pakai はい / いいえ."], ["(partikel)", "は, が, を, dan へ sering dihilangkan kalau artinya sudah jelas: 宿題[しゅくだい]、した？ Partikel seperti で, に, と, から, まで tetap dipakai karena tanpa partikel itu artinya bisa kabur."], ["～てる", "Dalam obrolan, い pada ～て いる sering tidak diucapkan: 辞書[じしょ]、持[も]ってる？ artinya sama dengan 辞書[じしょ]を 持[も]って いますか."]],
 x:["Bentuk biasa dipakai saat bicara dengan teman dekat, keluarga, atau orang yang lebih muda. Kepada guru, atasan, atau orang yang baru dikenal tetap pakai です/ます. Laki-laki kadang menyebut dirinya 僕[ぼく].", "Membuat pertanyaan: 1) ubah predikat ke bentuk biasa: 行[い]きますか → 行[い]く; 2) buang か; 3) ucapkan dengan nada naik: 行[い]く？ KB dan KS-na tanpa だ: 暇[ひま]ですか → 暇[ひま]？ KS-i tetap utuh: おいしいですか → おいしい？", "Menjawab: うん + bentuk biasa positif (うん、行[い]く), ううん + bentuk biasa negatif (ううん、行[い]かない). Partikel は, が, を, へ sering dibuang: 映画[えいが]、見[み]た？ — うん、見[み]た.", "Kata lain dari Bab 20 yang sering muncul: ～けど (tapi): 行[い]きたいけど、時間[じかん]が ない; よかったら (kalau mau): よかったら、いっしょに 行[い]かない？; こっち, そっち, あっち, どっち sebagai versi santai dari こちら, そちら, あちら, どちら.", "Kesalahan umum: 1) mencampur dua gaya: 行[い]く ですか ✗; 2) memakai だ pada pertanyaan: 暇[ひま]だ？ terdengar janggal; 3) memakai bentuk biasa kepada guru atau atasan, yang terdengar tidak sopan.", "Tips: bentuk biasa terdengar santai dan akrab. Kalimatnya pendek, banyak partikel dibuang, dan untuk bertanya nadanya naik di akhir: 昼[ひる]ごはん、食[た]べた？"],
 ex:[["日曜日[にちようび]、暇[ひま]？", "Hari Minggu kamu senggang?"], ["明日[あした]、学校[がっこう] 行[い]く？ うん、行[い]く。", "Besok kamu ke sekolah? Iya."], ["昨日[きのう]の パーティー、行[い]った？ ううん、行[い]かなかった。", "Kemarin kamu ke pesta? Nggak, aku nggak pergi."]],
 q:["m|A: 昨日[きのう]、何[なに] ___？ B: 映画[えいが] 見[み]た。|Kemarin kamu ngapain? Nonton film.|した|する|しない|します", "m|A: 宿題[しゅくだい]、もう した？ B: ___、まだ。|Sudah bikin PR? Belum.|ううん|うん|はい|ええ", "m|A: 明日[あした]、___？ B: うん、休[やす]みだよ。|Besok kamu libur? Iya, libur.|休[やす]み|休[やす]みだ|休[やす]みな|休[やす]みに", "o|ううん/今日[きょう]は/行[い]かない|Nggak, hari ini aku nggak pergi.", "m|A: その すき焼[や]き、___？ B: うん、とても おいしい。|Sukiyaki itu enak? Iya, enak sekali.|おいしい|おいしいだ|おいしだ|おいしかっただ", "m|A: 辞書[じしょ]、持[も]ってる？ B: ううん、___。|Kamu bawa kamus? Nggak.|持[も]って ない|持[も]ってる|持[も]たないだ|持[も]ちない", "o|明日[あした]の/夜[よる]/暇[ひま]？|Besok malam kamu senggang?", "o|この/カレー/辛[から]いけど/おいしい|Kari ini pedas, tapi enak."]},
{b:21,t:"～と 思います",d:"Untuk menyampaikan pendapat atau perkiraan: 'saya kira / menurut saya ...'. Polanya bentuk biasa + <b>と 思います</b>; kata benda dan sifat-な tetap memakai <b>だ</b> (静かだと思います). Kalau perkiraannya negatif, yang dibuat negatif adalah bagian depannya: 来ないと思います (saya kira dia tidak datang). Untuk menanyakan pendapat orang lain: ～について どう 思いますか.",
 r:["Kalimat(BB) + と + 思[おも]います", "KS-na/KB + だ + と + 思[おも]います", "KB + に ついて + どう + 思[おも]いますか"],
 s:"Kalimat(BB) + と + 思[おも]います → アリさんは 今日[きょう] 来[こ]ないと 思[おも]います。",
 k:[["BB", "Isi pikiran ditulis dalam bentuk biasa (来[く]る, 来[こ]ない, 高[たか]い, 雨[あめ]だ). Kesopanan kalimat sudah ditunjukkan oleh 思[おも]います di akhir, jadi bagian dalam tidak perlu bentuk ます."], ["と", "Penanda kutipan, mirip kata 'bahwa'. と mengikat isi pikiran dengan kata kerja 思[おも]います."], ["だ", "KB dan KS-na wajib memakai だ sebelum と: 便利[べんり]だと, 雨[あめ]だと. Tanpa だ (便利[べんり]と 思[おも]います) salah. KS-i tidak memakai だ: 高[たか]いと 思[おも]います."], ["思[おも]います", "Artinya 'kira, rasa, pikir'. Yang berpikir adalah pembicara sendiri, jadi 私[わたし]は biasanya tidak perlu disebut."], ["どう", "Untuk menanyakan pendapat: ～に ついて どう 思[おも]いますか ('bagaimana pendapatmu tentang ...?')."]],
 x:["Ada dua fungsi. 1) <b>Perkiraan</b> tentang hal yang belum pasti: 午後[ごご]は 雨[あめ]が 降[ふ]ると 思[おも]います (kayaknya nanti sore hujan), sering bersama たぶん atau きっと. 2) <b>Pendapat</b>: 日本[にほん]の 物価[ぶっか]は 高[たか]いと 思[おも]います (menurut saya harga-harga di Jepang mahal).", "Cara membentuk: 1) ubah isi pikiran ke bentuk biasa; 2) untuk KB dan KS-na, pastikan ada だ; 3) tambah と 思[おも]います. Contoh: 来[き]ます → 来[く]ると, 来[き]ません → 来[こ]ないと, 来[き]ました → 来[き]たと, 高[たか]いです → 高[たか]いと, 便利[べんり]です → 便利[べんり]だと 思[おも]います.", "Perkiraan negatif dibuat dengan menegatifkan isi pikirannya: 雨[あめ]は 降[ふ]らないと 思[おも]います (saya kira tidak akan hujan). Bentuk ini lebih wajar daripada 降[ふ]ると 思[おも]いません.", "Menanyakan dan menjawab pendapat: A: 日本[にほん]の 交通[こうつう]に ついて どう 思[おも]いますか。 B: 便利[べんり]だと 思[おも]います. Kalau setuju dengan pendapat orang lain: 私[わたし]も そう 思[おも]います.", "Kesalahan umum: 1) 思[おも]います ditaruh di depan: 思[おも]います、明日[あした] 雨[あめ]が 降[ふ]ります ✗; 2) lupa だ: 静[しず]かと 思[おも]います ✗; 3) memakai bentuk ます di dalam: 行[い]きますと 思[おも]います ✗; 4) memakai だ pada KS-i: おいしいだと 思[おも]います ✗.", "Tips: dalam obrolan akrab (Bab 20), 思[おも]います menjadi 思[おも]う: 明日[あした]、雨[あめ]だと 思[おも]う."],
 ex:[["週末[しゅうまつ]は 天気[てんき]が いいと 思[おも]います。", "Saya kira akhir pekan nanti cuacanya bagus."], ["あの 先生[せんせい]は とても 親切[しんせつ]だと 思[おも]います。", "Menurut saya guru itu sangat baik hati."], ["兄[あに]は 今晩[こんばん] 帰[かえ]らないと 思[おも]います。", "Saya kira kakak laki-laki saya tidak pulang malam ini."]],
 q:["m|あの 公園[こうえん]は 静[しず]か___ 思[おも]います。|Menurut saya taman itu tenang.|だと|と|なと|でと", "m|明日[あした]は たぶん 雪[ゆき]が ___と 思[おも]います。|Saya kira besok mungkin turun salju.|降[ふ]る|降[ふ]ります|降[ふ]って|降[ふ]り", "o|この/問題[もんだい]は/簡単[かんたん]だと/思[おも]います|Menurut saya soal ini mudah.", "m|A: 日本[にほん]の 生活[せいかつ]に ついて ___ 思[おも]いますか。 B: 楽[たの]しいと 思[おも]います。|Bagaimana pendapatmu tentang kehidupan di Jepang? Menurut saya menyenangkan.|どう|どんな|どれ|どこ", "m|ミラーさんは 明日[あした]の パーティーに ___と 思[おも]います。|Saya kira Miller-san tidak datang ke pesta besok.|来[こ]ない|来[き]ません|来[こ]なかった|来[く]る", "m|この 料理[りょうり]は 少[すこ]し 辛[から]___ 思[おも]います。|Menurut saya masakan ini agak pedas.|いと|いだと|だと|くと", "o|この/町[まち]は/交通[こうつう]が/不便[ふべん]だと/思[おも]います|Menurut saya transportasi di kota ini tidak praktis.", "o|明日[あした]は/きっと/いい/天気[てんき]だと/思[おも]います|Saya yakin besok cuacanya pasti bagus.|きっと/明日[あした]は/いい/天気[てんき]だと/思[おも]います"]},
{b:21,t:"～と 言いました",d:"Dipakai untuk menyampaikan ucapan orang. Kutipan langsung: tulis ucapannya persis di dalam 「 」, lalu <b>と 言いました</b>. Kutipan tidak langsung: ubah ucapannya ke bentuk biasa, lalu と 言いました. Orang yang diajak bicara ditandai <b>に</b> (先生に ～と 言いました).",
 r:["S + は + 「Kalimat」 + と + 言[い]いました", "S + は + Kalimat(BB) + と + 言[い]いました", "S + は + KB(orang) + に + 「Kalimat」 + と + 言[い]いました"],
 s:"S + は + KB + に + 「Kalimat」 + と + 言[い]いました → 私[わたし]は 母[はは]に 「おやすみなさい」と 言[い]いました。",
 k:[["「 」", "Tanda kutip bahasa Jepang. Di dalamnya ucapan ditulis persis seperti aslinya, jadi bentuk ます boleh tetap ada: 「行[い]きます」と 言[い]いました."], ["と", "Penanda kutipan yang menunjukkan isi ucapan. Letaknya langsung sesudah ucapan, sebelum 言[い]いました."], ["BB", "Kalau ucapan diceritakan ulang tanpa 「 」, ubah ke bentuk biasa: 「疲[つか]れました」 → 疲[つか]れたと 言[い]いました. KB dan KS-na memakai だ: 暇[ひま]だと 言[い]いました."], ["に", "Menandai orang yang diajak bicara, sama seperti に pada 友達[ともだち]に 電話[でんわ]を かけます (Bab 7)."], ["言[い]いました", "Bentuk lampau dari 言[い]います (berkata), dibaca いいました. Untuk kebiasaan atau aturan, pakai 言[い]います: 食事[しょくじ]の まえに 「いただきます」と 言[い]います."]],
 x:["Pola ini menyampaikan ucapan seseorang: 'dia bilang ...', 'saya berkata ...'. Ada dua cara: kutipan langsung dengan 「 」 dan kutipan tidak langsung dengan bentuk biasa.", "<b>Kutipan langsung</b>: salin ucapannya persis, beri 「 」, lalu tambah と 言[い]いました: 先生[せんせい]は 「宿題[しゅくだい]を 出[だ]して ください」と 言[い]いました.", "<b>Kutipan tidak langsung</b>: 1) ubah ucapan ke bentuk biasa; 2) untuk KB dan KS-na tambah だ; 3) tambah と 言[い]いました. 「明日[あした] 休[やす]みます」 → 明日[あした] 休[やす]むと 言[い]いました; 「暇[ひま]です」 → 暇[ひま]だと 言[い]いました.", "Orang yang diajak bicara ditandai に: 友達[ともだち]に 言[い]いました. Untuk menanyakan isi ucapan, pakai 何[なん]と: 先生[せんせい]は 何[なん]と 言[い]いましたか.", "Kesalahan umum: 1) 言[い]いました ditaruh di depan: 言[い]いました 「…」 ✗, padahal と 言[い]いました selalu di belakang ucapan; 2) orang yang diajak bicara ditandai を: 友達[ともだち]を 言[い]いました ✗; 3) lupa と: 「はい」 言[い]いました ✗.", "Tips: ucapan yang sudah baku, seperti salam, biasanya dikutip langsung: うちへ 帰[かえ]って、「ただいま」と 言[い]います."],
 ex:[["先生[せんせい]は 「明日[あした] 試験[しけん]を します」と 言[い]いました。", "Guru berkata, \"Besok kita ujian.\""], ["弟[おとうと]は おなかが 痛[いた]いと 言[い]いました。", "Adik laki-laki bilang perutnya sakit."], ["私[わたし]は 友達[ともだち]に 「ごめんなさい」と 言[い]いました。", "Saya bilang \"maaf\" kepada teman."]],
 q:["m|兄[あに]は 明日[あした] 帰[かえ]る___ 言[い]いました。|Kakak laki-laki bilang dia pulang besok.|と|を|に|が", "m|私[わたし]は 先生[せんせい]___ 「おはよう ございます」と 言[い]いました。|Saya mengucapkan \"selamat pagi\" kepada guru.|に|を|で|の", "o|妹[いもうと]は/パーティーに/行[い]かないと/言[い]いました|Adik perempuan bilang dia tidak akan pergi ke pesta.|パーティーに/行[い]かないと/妹[いもうと]は/言[い]いました", "m|アリさんは 試験[しけん]が ___と 言[い]いました。|Ali bilang ujiannya sulit.|難[むずか]しかった|難[むずか]しいだった|難[むずか]しかっただ|難[むずか]しくた", "m|先生[せんせい]は 来週[らいしゅう] 試験[しけん]が ___と 言[い]いました。|Guru bilang minggu depan ada ujian.|ある|あった|あるだ|あって", "m|A: ミラーさんは ___と 言[い]いましたか。 B: 「すぐ 行[い]きます」と 言[い]いました。|Miller-san bilang apa? Dia bilang, \"Saya segera ke sana.\"|何[なん]|どう|何[なに]が|どんな", "o|医者[いしゃ]は/私[わたし]に/「お酒[さけ]を 飲[の]まないで ください」と/言[い]いました|Dokter berkata kepada saya, \"Jangan minum minuman beralkohol.\"|医者[いしゃ]は/「お酒[さけ]を 飲[の]まないで ください」と/私[わたし]に/言[い]いました|「お酒[さけ]を 飲[の]まないで ください」と/医者[いしゃ]は/私[わたし]に/言[い]いました", "o|ミラーさんは/日本[にほん]の/生活[せいかつ]は/楽[たの]しいと/言[い]いました|Miller-san bilang kehidupan di Jepang menyenangkan.|日本[にほん]の/生活[せいかつ]は/楽[たの]しいと/ミラーさんは/言[い]いました"]},
{b:21,t:"～でしょう？ (meminta persetujuan)",d:"Diucapkan dengan intonasi naik untuk meminta lawan bicara membenarkan atau menyetujui sesuatu, mirip '..., kan?'. Polanya bentuk biasa + <b>でしょう？</b>; kata sifat-い tetap memakai い (暑いでしょう？), tetapi だ pada kata benda dan sifat-な dibuang (暇でしょう？, 雨でしょう？); bentuk lampaunya tetap だった (雨だったでしょう？).",
 r:["S + は + KK-BB/KS-i + でしょう + ？", "S + は + KS-na/KB + でしょう + ？", "S + は + KS-na/KB + だった + でしょう + ？"],
 s:"K-waktu + は + KB + でしょう + ？ → 明日[あした]は 休[やす]みでしょう？",
 k:[["でしょう", "Dipakai untuk meminta lawan bicara membenarkan sesuatu yang kita yakini, seperti '..., kan?'. Kita cukup yakin, tetapi tetap memberi kesempatan kepada lawan bicara untuk mengiyakan."], ["？", "Diucapkan dengan nada naik. でしょう dengan nada turun punya arti lain, jadi nada naik di sini penting."], ["BB", "Bagian depan memakai bentuk biasa: 行[い]く, 行[い]かない, 行[い]った, 高[たか]い, 高[たか]かった. Bentuk ます tidak dipakai di pola ini."], ["だ (dibuang)", "KB dan KS-na tidak memakai だ sebelum でしょう: 暇[ひま]でしょう？, 雨[あめ]でしょう？ (bukan 暇[ひま]だでしょう ✗). Bentuk lampaunya tetap memakai だった: 雨[あめ]だったでしょう？"]],
 x:["Arti: '..., kan?' atau '..., bukan?'. Pembicara cukup yakin dan ingin lawan bicara mengiyakan. Contoh: 日本[にほん]の 物価[ぶっか]は 高[たか]いでしょう？ (harga-harga di Jepang mahal, kan?).", "Cara membentuk: ubah kalimat ke bentuk biasa, lalu tambah でしょう？ KK: 行[い]く, 行[い]かない, 行[い]った + でしょう？ KS-i: 寒[さむ]い, 寒[さむ]かった + でしょう？ KS-na dan KB: buang だ → 静[しず]かでしょう？, 雨[あめ]でしょう？ Untuk lampau: 静[しず]かだったでしょう？", "Menjawab: kalau setuju, ええ atau はい lalu kalimatnya (ええ、高[たか]いです); kalau tidak, いいえ lalu kalimat negatif (いいえ、そんなに 高[たか]くないです). そんなに + bentuk negatif (Bab 21) berarti 'tidak se... itu'.", "Mirip dengan ね. Bedanya, でしょう？ sering dipakai untuk memastikan hal yang menurut kita sudah diketahui atau dialami lawan bicara: 明日[あした] 試験[しけん]が あるでしょう？ (besok ada ujian, kan? kamu sudah tahu, kan?).", "Kesalahan umum: memakai だ atau な pada KB dan KS-na (暇[ひま]だでしょう ✗, 静[しず]かなでしょう ✗) dan memakai だ pada KS-i (暑[あつ]いだでしょう ✗). Ingat: KS-i tetap utuh (暑[あつ]いでしょう？), KS-na dan KB langsung diikuti でしょう？."],
 ex:[["アリさんは 毎晩[まいばん] 遅[おそ]く 寝[ね]るでしょう？", "Ali, kamu tiap malam tidur larut, kan?"], ["日本[にほん]の 夏[なつ]は 暑[あつ]いでしょう？", "Musim panas di Jepang panas, kan?"], ["この 町[まち]は 静[しず]かでしょう？", "Kota ini tenang, kan?"]],
 q:["m|この 公園[こうえん]は きれい___？|Taman ini indah, kan?|でしょう|だでしょう|なでしょう|いでしょう", "m|昨日[きのう]、図書館[としょかん]へ ___でしょう？|Kemarin kamu pergi ke perpustakaan, kan?|行[い]った|行[い]く|行[い]って|行[い]き", "o|あの/レストランの/料理[りょうり]は/おいしい/でしょう|Masakan restoran itu enak, kan?", "m|A: 日本語[にほんご]の 勉強[べんきょう]は 大変[たいへん]___？ B: ええ、でも 楽[たの]しいです。|Belajar bahasa Jepang itu berat, kan? Iya, tapi menyenangkan.|でしょう|だでしょう|かったでしょう|くないでしょう", "m|昨日[きのう]の 試験[しけん]は 難[むずか]しかった___？|Ujian kemarin sulit, kan?|でしょう|だでしょう|ですでしょう|なでしょう", "m|アリさんは お酒[さけ]を ___でしょう？|Ali tidak minum minuman beralkohol, kan?|飲[の]まない|飲[の]みません|飲[の]まないだ|飲[の]みない", "o|ミラーさんも/あの/映画[えいが]を/見[み]た/でしょう？|Miller-san juga sudah menonton film itu, kan?|あの/映画[えいが]を/ミラーさんも/見[み]た/でしょう？", "o|昨日[きのう]の/パーティーは/にぎやか/だった/でしょう？|Pesta kemarin ramai, kan?"]},
{b:21,t:"Tempat で Acara が あります",d:"Untuk acara seperti pesta, rapat, festival, atau pertandingan, あります berarti 'diadakan'. Polanya: Tempat <b>で</b> Acara <b>が</b> あります. Bedakan dengan benda, yang memakai に (机の上に本があります); tempat acara memakai で.",
 r:["(K-waktu + に) + K-tempat + で + KB(acara) + が + あります", "KB(acara) + は + K-tempat + で + あります"],
 s:"K-waktu + K-tempat + で + KB + が + あります → 来週[らいしゅう] 大学[だいがく]で コンサートが あります。",
 k:[["で", "Tempat acara ditandai で, sama seperti tempat melakukan kegiatan (図書館[としょかん]で 勉強[べんきょう]します, Bab 6). Acara dianggap sebagai sesuatu yang terjadi di tempat itu."], ["が", "Acara yang diadakan adalah subjek dari あります, jadi ditandai が. Kalau acaranya sudah menjadi topik, pakai は: パーティーは どこで ありますか."], ["あります", "Untuk acara, あります berarti 'ada' atau 'diadakan'. Acara bukan makhluk hidup, jadi tidak memakai います."], ["に", "Waktu acara ditandai に seperti biasa: 3時[じ]に, 日曜日[にちようび]に. Kata waktu seperti 明日[あした], 来週[らいしゅう], dan 今晩[こんばん] tidak memakai に."]],
 x:["Arti: 'ada acara ...' atau 'diadakan ...'. Dipakai untuk peristiwa seperti パーティー, 会議[かいぎ], お祭[まつ]り, 試合[しあい], 試験[しけん], dan コンサート.", "Bedakan dengan keberadaan benda. Benda atau orang yang berada di suatu tempat ditandai に (公園[こうえん]に 木[き]が あります, Bab 10), sedangkan acara yang diadakan di suatu tempat ditandai で (公園[こうえん]で お祭[まつ]りが あります). Kata kerjanya sama-sama あります.", "Cara membentuk: (waktu) + tempat + で + acara + が + あります. Bertanya: どこで ありますか (di mana?), いつ ありますか (kapan?), 何時[なんじ]から ありますか (mulai jam berapa?). Negatif: 今日[きょう]は 会議[かいぎ]が ありません.", "Kesalahan umum: 1) memakai に karena terbawa pola keberadaan: 公園[こうえん]に お祭[まつ]りが あります ✗; 2) memakai を karena terbawa kata 'mengadakan': パーティーを あります ✗. Kalau ingin memakai を, kata kerjanya します: うちで パーティーを します (kami mengadakan pesta di rumah).", "Tips: kalau tempatnya tidak penting, cukup sebut waktu dan acaranya: 明日[あした] 試験[しけん]が あります."],
 ex:[["日曜日[にちようび]に 公園[こうえん]で お祭[まつ]りが あります。", "Hari Minggu ada festival di taman."], ["三時[さんじ]から 会議室[かいぎしつ]で 会議[かいぎ]が あります。", "Mulai jam tiga ada rapat di ruang rapat."], ["昨日[きのう] 学校[がっこう]で 野球[やきゅう]の 試合[しあい]が ありました。", "Kemarin ada pertandingan bisbol di sekolah."]],
 q:["m|明日[あした]、大学[だいがく]___ パーティーが あります。|Besok ada pesta di kampus.|で|に|を|へ", "m|今晩[こんばん]、ホテルで パーティー___ あります。|Malam ini ada pesta di hotel.|が|を|に|へ", "o|駅[えき]の/前[まえ]で/お祭[まつ]りが/あります|Ada festival di depan stasiun.|お祭[まつ]りが/駅[えき]の/前[まえ]で/あります", "m|A: 会議[かいぎ]は どこ___ ありますか。 B: 三階[さんがい]の 会議室[かいぎしつ]です。|Rapatnya diadakan di mana? Di ruang rapat lantai tiga.|で|に|を|が", "m|駅[えき]の 前[まえ]___ 大[おお]きい 銀行[ぎんこう]が あります。|Di depan stasiun ada bank besar.|に|で|を|へ", "m|土曜日[どようび]、うちで 誕生日[たんじょうび]の パーティー___ します。|Hari Sabtu kami mengadakan pesta ulang tahun di rumah.|を|が|に|で", "o|日曜日[にちようび]の/試合[しあい]は/どこで/ありますか|Pertandingan hari Minggu diadakan di mana?", "o|大学[だいがく]の/教室[きょうしつ]で/日本語[にほんご]の/試験[しけん]が/あります|Ada ujian bahasa Jepang di ruang kelas kampus.|日本語[にほんご]の/試験[しけん]が/大学[だいがく]の/教室[きょうしつ]で/あります"]},
{b:22,t:"Klausa penjelas kata benda",d:"Penjelas kata benda diletakkan <b>di depan</b> kata bendanya, tanpa kata 'yang': 私が作ったケーキ = kue yang saya buat. Kata kerja di dalamnya memakai bentuk biasa, bukan ます: 眼鏡をかけている人 = orang yang memakai kacamata. Subjek di dalam penjelas ditandai <b>が</b>, bukan は. Kata sifat juga bisa ikut: 髪が長い人, 料理が上手な人.",
 r:["Kalimat-penjelas(BB) + KB", "(S + が) + (O + を) + KK-kamus/KK-ない/KK-た/KK-て いる + KB", "KB + が + KS-i / KS-na + な + KB"],
 s:"Kalimat-penjelas(BB) + KB (penjelas di <b>depan</b> KB) → 昨日[きのう] 私[わたし]が 買[か]った 本[ほん]",
 k:[["Posisi penjelas di depan KB", "Semua penjelas ditaruh sebelum kata benda, sama seperti 赤[あか]い 車[くるま]. Kalimat penjelas juga begitu: 'buku yang saya beli' menjadi 私[わたし]が 買[か]った 本[ほん]."], ["が untuk pelaku di dalam klausa", "Pelaku di dalam klausa penjelas ditandai が. は menandai topik seluruh kalimat, sedangkan klausa penjelas hanya bagian kecil yang menempel pada satu kata benda. Dalam これは 兄[あに]が 書[か]いた 手紙[てがみ]です, topiknya これ dan yang menulis surat adalah 兄[あに]."], ["Bentuk biasa (買[か]った, 読[よ]む, かけて いる)", "Kata kerja yang menempel pada kata benda harus bentuk biasa. Kesopanan (ます) cukup ditunjukkan di akhir kalimat utama, jadi 私[わたし]が 買[か]いました 本[ほん] salah."], ["な pada sifat-な (上手[じょうず]な 人[ひと])", "Kalau klausa berakhir dengan kata sifat, aturannya sama dengan kata sifat biasa di depan kata benda: sifat-い langsung menempel (髪[かみ]が 長[なが]い 人[ひと]), sifat-な memakai な (料理[りょうり]が 上手[じょうず]な 人[ひと])."], ["Partikel setelah KB inti", "Partikel kalimat utama (は, を, に, で) ditaruh setelah kata benda inti. Seluruh [klausa + KB] diperlakukan seperti satu kata benda: 母[はは]が 作[つく]った ケーキを 食[た]べました."]],
 x:["Klausa penjelas menerangkan kata benda di belakangnya, artinya '... yang ...'. Kata benda yang dijelaskan bisa apa saja, termasuk tempat: 私[わたし]が 撮[と]った 写真[しゃしん] (foto yang saya ambil), 友達[ともだち]が 働[はたら]いて いる 会社[かいしゃ] (perusahaan tempat teman bekerja).", "Langkah membuatnya: (1) mulai dari kalimat biasa: 私[わたし]は 昨日[きのう] 本[ほん]を 買[か]いました. (2) Pindahkan kata benda yang mau dijelaskan (本[ほん]) ke paling belakang; partikel を miliknya ikut hilang. (3) Ganti は menjadi <b>が</b> dan 買[か]いました menjadi 買[か]った. (4) Hasilnya 私[わたし]が 昨日[きのう] 買[か]った 本[ほん], yang bisa dipakai dalam kalimat: これは 私[わたし]が 昨日[きのう] 買[か]った 本[ほん]です.", "Bentuk kata kerja di dalam klausa tetap membawa arti waktu dan negatif: 読[よ]む 本[ほん] (buku yang akan atau biasa dibaca), 読[よ]んだ 本[ほん] (buku yang sudah dibaca), 読[よ]まない 本[ほん] (buku yang tidak dibaca), 読[よ]んで いる 本[ほん] (buku yang sedang dibaca).", "Kesalahan yang sering muncul: memakai ます di dalam klausa (✗ 私[わたし]が 買[か]いました 本[ほん]), memakai は untuk pelaku klausa (✗ これは 私[わたし]は 撮[と]った 写真[しゃしん]です), dan menaruh klausa di belakang kata benda (✗ 本[ほん] 私[わたし]が 買[か]った).", "Saat membaca kalimat panjang, cari kata benda yang berada tepat sebelum partikel kalimat utama (は, を, に, で). Kata-kata di depannya, sesudah topik ～は kalau ada, adalah penjelas kata benda itu. Terjemahkan kata bendanya dulu, lalu tambahkan 'yang ...'."],
 ex:[["姉[あね]が 作[つく]った ケーキは とても おいしいです。", "Kue yang dibuat kakak perempuan saya enak sekali."], ["眼鏡[めがね]を かけて いる 男[おとこ]の 人[ひと]は 私[わたし]の 父[ちち]です。", "Laki-laki yang memakai kacamata itu ayah saya."], ["日本[にほん]で 買[か]った カメラは とても 便利[べんり]です。", "Kamera yang saya beli di Jepang sangat praktis."]],
 q:["o|これは/私[わたし]が/生[う]まれた/町[まち]/です|Ini kota tempat saya lahir.", "m|帽子[ぼうし]を ___ 人[ひと]は 誰[だれ]ですか。|Siapa orang yang memakai topi itu?|かぶって いる|かぶって います|かぶりて いる|かぶるって いる", "m|これは 父[ちち]___ 撮[と]った 写真[しゃしん]です。|Ini foto yang diambil ayah.|が|は|で|へ", "m|昨日[きのう] 学校[がっこう]に ___ 人[ひと]は 三人[さんにん]でした。|Ada tiga orang yang tidak datang ke sekolah kemarin.|来[こ]なかった|来[き]ませんでした|来[こ]ないでした|来[く]るなかった", "o|友達[ともだち]が/住[す]んで いる/町[まち]へ/行[い]きました|Saya pergi ke kota tempat teman saya tinggal.", "o|昨日[きのう]/見[み]た/映画[えいが]は/おもしろかったです|Film yang saya tonton kemarin menarik.", "m|交通[こうつう]が 便利[べんり]___ 所[ところ]に 住[す]みたいです。|Saya ingin tinggal di tempat yang transportasinya praktis.|な|の|に|だ", "m|朝[あさ]ご飯[はん]を ___ 人[ひと]が 多[おお]いです。|Banyak orang yang tidak sarapan.|食[た]べない|食[た]べません|食[た]べないで|食[た]べなかったです"]},
{b:22,t:"Bentuk kamus + 時間/約束/用事",d:"Bentuk kamus diletakkan di depan 時間 (waktu), 約束 (janji), atau 用事 (urusan) untuk menjelaskan isinya: 寝る時間 = waktu untuk tidur, 友達に会う約束 = janji bertemu teman, 郵便局へ行く用事 = urusan ke kantor pos. Biasanya diikuti あります atau ありません: 寝る時間がありません = tidak sempat tidur.",
 r:["KK-kamus + 時間[じかん]/約束[やくそく]/用事[ようじ]", "(K-waktu + は) + (O + を / KB + に) + KK-kamus + 時間[じかん]/約束[やくそく]/用事[ようじ] + が + あります/ありません"],
 s:"KB + に + KK-kamus + 約束[やくそく] + が + あります (kegiatan di depan 約束[やくそく]) → 友達[ともだち]に 会[あ]う 約束[やくそく]が あります。",
 k:[["Bentuk kamus (会[あ]う, 書[か]く)", "Kegiatan yang menjelaskan isi waktu, janji, atau urusan memakai bentuk kamus, karena kegiatan itu akan dilakukan atau biasa dilakukan. Bentuk ます dan bentuk て tidak bisa langsung menempel pada kata benda."], ["時間[じかん] / 約束[やくそく] / 用事[ようじ] paling belakang", "Kata benda intinya ditaruh paling belakang, dan kegiatan di depannya menjadi penjelas. Polanya sama dengan klausa penjelas: 手紙[てがみ]を 書[か]く 時間[じかん] = waktu untuk menulis surat."], ["が + あります / ありません", "あります menyatakan ada atau tidaknya sesuatu, dan benda yang ada ditandai が. 時間[じかん]が ありません berarti waktunya tidak ada, jadi 'tidak sempat'."], ["Partikel di dalam penjelas (に, を, と)", "Partikel di depan kata kerja tidak berubah: 友達[ともだち]に 会[あ]う (会[あ]う memakai に), 手紙[てがみ]を 書[か]く (objek memakai を), 姉[あね]と 買[か]い物[もの]する (bersama memakai と)."], ["は pada keterangan waktu (日曜日[にちようび]は)", "Keterangan waktu sering diberi は supaya menjadi topik: 'kalau hari Minggu, saya ada janji ...'. Bentuk ini biasa dipakai saat menolak ajakan dengan sopan."]],
 x:["Arti ketiga kata benda: 時間[じかん] = waktu (sempat atau tidak), 約束[やくそく] = janji yang sudah dibuat dengan orang lain, 用事[ようじ] = urusan atau keperluan yang harus diselesaikan. Kegiatan di depannya menjelaskan waktu, janji, atau urusan yang mana.", "Cara membuatnya: (1) tulis kegiatannya: 手紙[てがみ]を 書[か]きます. (2) Ubah ke bentuk kamus: 手紙[てがみ]を 書[か]く. (3) Taruh kata bendanya di belakang: 手紙[てがみ]を 書[か]く 時間[じかん]. (4) Tambahkan が あります atau が ありません.", "Bandingkan 時間[じかん]が ありません (sedang sibuk, tidak punya waktu) dengan テレビを 見[み]る 時間[じかん]が ありません (tidak sempat menonton TV). Dengan penjelas, kalimatnya menjadi lebih spesifik.", "Pola ini sering dipakai untuk menolak ajakan dengan halus karena alasannya jelas: すみません、日曜日[にちようび]は 友達[ともだち]に 会[あ]う 約束[やくそく]が あります.", "Yang sering keliru: memakai bentuk ます atau て di depan kata benda (✗ 行[い]きます 用事[ようじ], ✗ 行[い]って 用事[ようじ]). Tidak perlu kata tambahan apa pun; bentuk kamus langsung menempel pada kata benda."],
 ex:[["忙[いそが]しいですから、テレビを 見[み]る 時間[じかん]が ありません。", "Saya sibuk, jadi tidak sempat menonton TV."], ["土曜日[どようび]は 兄[あに]と テニスを する 約束[やくそく]が あります。", "Hari Sabtu saya ada janji main tenis dengan kakak laki-laki."], ["午後[ごご] 銀行[ぎんこう]で お金[かね]を 下[お]ろす 用事[ようじ]が あります。", "Siang nanti saya ada urusan mengambil uang di bank."]],
 q:["m|すみません、今日[きょう]は 病院[びょういん]へ ___ 用事[ようじ]が あります。|Maaf, hari ini saya ada urusan ke rumah sakit.|行[い]く|行[い]きます|行[い]って|行[い]き", "o|新聞[しんぶん]を/読[よ]む/時間[じかん]が/ありません|Saya tidak sempat membaca koran.", "m|今晩[こんばん]は 母[はは]に 電話[でんわ]を ___ 約束[やくそく]が あります。|Malam ini saya ada janji menelepon ibu.|かける|かけます|かけて|かけるの", "o|金曜日[きんようび]は/友達[ともだち]と/食事[しょくじ]する/約束[やくそく]が/あります|Hari Jumat saya ada janji makan bersama teman.", "o|郵便局[ゆうびんきょく]で/切手[きって]を/買[か]う/用事[ようじ]が/あります|Saya ada urusan membeli perangko di kantor pos.|切手[きって]を/郵便局[ゆうびんきょく]で/買[か]う/用事[ようじ]が/あります", "m|けさは 朝[あさ]ご飯[はん]を 食[た]べる ___が ありませんでした。|Tadi pagi saya tidak sempat sarapan.|時間[じかん]|約束[やくそく]|用事[ようじ]|時計[とけい]", "m|日曜日[にちようび]は 弟[おとうと]と 公園[こうえん]で ___ 約束[やくそく]が あります。|Hari Minggu saya ada janji bermain di taman dengan adik laki-laki.|遊[あそ]ぶ|遊[あそ]びます|遊[あそ]んで|遊[あそ]びに"]},
{b:23,t:"～とき、～",d:"<b>とき</b> = 'ketika/saat ...', disambung dengan bentuk biasa: 出かけるとき, 分からないとき, 寒いとき, 暇<b>な</b>とき, 子供<b>の</b>とき. Bentuk kamus + とき berarti tindakannya belum selesai: 日本へ行くとき = saat akan berangkat ke Jepang. Bentuk た + とき berarti tindakannya sudah selesai: 日本へ行ったとき = waktu sudah sampai di Jepang.",
 r:["KK-kamus / KK-ない / KK-た / KS-i + とき、+ Kalimat utama", "KS-na + な + とき、+ Kalimat utama", "KB + の + とき、+ Kalimat utama"],
 s:"Kalimat(BB) + とき、+ Kalimat utama (とき di akhir bagian pertama) → 寝[ね]る とき、電気[でんき]を 消[け]します。",
 k:[["とき", "Artinya 'saat' atau 'ketika'. とき sebenarnya kata benda yang berarti 'waktu', jadi ia ditaruh di belakang bagian yang menjelaskannya, sama seperti kata benda yang diberi klausa penjelas di Bab 22."], ["Bentuk biasa sebelum とき", "Bagian sebelum とき adalah penjelas kata benda, jadi kata kerja dan sifat-い memakai bentuk biasa: 行[い]く, 行[い]かない, 寒[さむ]い. Bentuk sopan cukup di akhir kalimat utama."], ["な (暇[ひま]な とき)", "Sifat-な memakai な kalau menerangkan kata benda, dan とき termasuk kata benda. Jadi yang benar 暇[ひま]な とき, bukan 暇[ひま] とき atau 暇[ひま]だ とき."], ["の (子供[こども]の とき)", "Kata benda disambung ke kata benda lain dengan の. Karena itu 子供[こども]の とき (waktu masih kecil) dan 雨[あめ]の とき (saat hujan)."], ["Bentuk kamus atau bentuk た", "Bentuk kamus + とき: kegiatan とき belum selesai saat kalimat utama terjadi. Bentuk た + とき: kegiatan とき sudah selesai lebih dulu. Yang menentukan adalah urutan kejadian, bukan lampau atau sekarang."]],
 x:["とき menyatakan kapan kalimat utama terjadi. Aturan sambungnya sama dengan penjelas kata benda: kata kerja dan sifat-い memakai bentuk biasa, sifat-な ditambah <b>な</b>, kata benda ditambah <b>の</b>.", "Contoh sambungan: 行[い]く とき, 行[い]かない とき, 行[い]った とき (kata kerja); 寒[さむ]い とき (sifat-い); 暇[ひま]な とき (sifat-な); 休[やす]みの とき (kata benda). Setelah とき beri koma, lalu tulis kalimat utama.", "Perhatikan urutannya. 日本[にほん]へ 行[い]く とき、カメラを 買[か]いました: kamera dibeli sebelum sampai di Jepang. 日本[にほん]へ 行[い]った とき、カメラを 買[か]いました: kamera dibeli setelah sampai di Jepang. Kedua kalimat utamanya sama-sama lampau; bentuk sebelum とき berbeda karena urutannya berbeda.", "Kalimat utama boleh berbentuk apa saja, misalnya kebiasaan (～ます), kejadian lampau (～ました), atau permintaan (～て ください): 分[わ]からない とき、先生[せんせい]に 聞[き]いて ください.", "Hindari bentuk seperti ✗ 暇[ひま] とき, ✗ 子供[こども] とき, ✗ 雨[あめ]な とき, dan ✗ 行[い]きます とき. Pasangannya: sifat-な dengan な, kata benda dengan の, kata kerja dengan bentuk biasa."],
 ex:[["子供[こども]の とき、よく 川[かわ]で 泳[およ]ぎました。", "Waktu kecil, saya sering berenang di sungai."], ["暇[ひま]な とき、よく マンガを 読[よ]みます。", "Saat senggang, saya sering membaca manga."], ["日本[にほん]へ 行[い]った とき、着物[きもの]を 買[か]いました。", "Waktu ke Jepang, saya membeli kimono di sana."]],
 q:["m|雨[あめ]___ とき、タクシーで 会社[かいしゃ]へ 行[い]きます。|Saat hujan, saya pergi ke kantor naik taksi.|の|な|だ|で", "m|ご飯[はん]を ___ とき、「いただきます」と 言[い]います。|Saat akan makan, kita mengucapkan \"itadakimasu\".|食[た]べる|食[た]べた|食[た]べて|食[た]べます", "o|道[みち]を/渡[わた]る/とき、/気[き]をつけて/ください|Hati-hati saat menyeberang jalan.", "m|お金[かね]が ___ とき、銀行[ぎんこう]へ 行[い]きます。|Saat tidak punya uang tunai, saya pergi ke bank.|ない|ありません|なくて|あらない", "o|若[わか]い/とき、/よく/山[やま]に/登[のぼ]りました|Waktu masih muda, saya sering mendaki gunung.|若[わか]い/とき、/山[やま]に/よく/登[のぼ]りました", "o|学生[がくせい]の/とき、/毎日[まいにち]/図書館[としょかん]で/勉強[べんきょう]しました|Waktu masih kuliah, saya belajar di perpustakaan setiap hari.|学生[がくせい]の/とき、/図書館[としょかん]で/毎日[まいにち]/勉強[べんきょう]しました", "m|うちに ___ とき、「ただいま」と 言[い]います。|Saat sampai di rumah, kita mengucapkan \"tadaima\".|帰[かえ]った|帰[かえ]る|帰[かえ]って|帰[かえ]ります", "m|大変[たいへん]___ とき、いつも 母[はは]に 電話[でんわ]します。|Saat sedang kesulitan, saya selalu menelepon ibu.|な|の|だ|に"]},
{b:23,t:"Bentuk kamus + と、～ (kalau/setiap kali)",d:"Bentuk kamus + <b>と</b>、... = 'kalau/setiap kali ..., (pasti) ...'. Dipakai untuk akibat yang selalu atau otomatis terjadi, misalnya cara memakai mesin dan petunjuk jalan; bentuk ない juga bisa (入れないと). Bagian kedua <b>tidak boleh</b> berisi keinginan, ajakan, atau permintaan (～たい, ～ましょう, ～てください).",
 r:["KK-kamus + と、+ Kalimat utama", "KK-ない + と、+ Kalimat utama", "K-tempat + を + KK-gerak + と、+ K-tempat + に + KB + が + あります"],
 s:"KK-kamus + と、+ Kalimat utama (と di akhir bagian pertama) → お酒[さけ]を 飲[の]むと、顔[かお]が 赤[あか]く なります。",
 k:[["と", "Menyambung dua kejadian: setiap kali kejadian pertama terjadi, kejadian kedua pasti ikut terjadi. と ditaruh di akhir bagian pertama: お酒[さけ]を 飲[の]むと、…"], ["Bentuk kamus atau ない sebelum と", "Bagian sebelum と memakai bentuk kamus (押[お]す) atau bentuk ない (押[お]さない). Bentuk sopan cukup di akhir kalimat kedua."], ["Kalimat kedua berisi hasil", "Kalimat kedua menceritakan hasil yang terjadi dengan sendirinya: fakta, cara kerja alat, atau keadaan jalan. Karena itu kalimat kedua tidak boleh berisi keinginan (～たい), ajakan (～ましょう), atau permintaan (～て ください)."], ["が di kalimat hasil", "Kalimat hasil sering memakai kata kerja tanpa objek seperti 出[で]ます, なります, dan あります, sehingga bendanya ditandai が: 水[みず]が 出[で]ます, 顔[かお]が 赤[あか]く なります."]],
 x:["Pola ini dipakai untuk akibat yang selalu terjadi, misalnya hal alam, reaksi tubuh, cara memakai alat, dan petunjuk jalan. Contoh: 秋[あき]に なると、涼[すず]しく なります.", "Cara membuatnya: (1) ubah kata kerja pertama ke bentuk kamus atau ない: 押[お]します → 押[お]す / 押[お]さない. (2) Tambahkan と dan koma. (3) Tulis hasilnya dengan bentuk sopan seperti biasa (～ます/～です).", "Kalimat kedua tidak boleh berisi kemauan pembicara: ✗ 日本[にほん]へ 行[い]くと、すしを 食[た]べたいです; ✗ 駅[えき]へ 行[い]くと、電話[でんわ]して ください. Untuk kalimat seperti itu ada pola lain di Bab 25.", "Untuk petunjuk jalan, polanya: tempat を + kata kerja gerak + と、+ tempat に + KB が あります. Contoh: 二[ふた]つ目[め]の 信号[しんごう]を 右[みぎ]へ 曲[ま]がると、左[ひだり]に 銀行[ぎんこう]が あります.", "Jangan tertukar dengan と yang berarti 'dan' atau 'bersama' (本[ほん]と ノート, 友達[ともだち]と 行[い]きます). と yang berarti 'kalau' menempel pada kata kerja bentuk kamus atau ない dan biasanya diikuti koma."],
 ex:[["春[はる]に なると、暖[あたた]かく なります。", "Kalau musim semi tiba, udaranya menjadi hangat."], ["この 道[みち]を まっすぐ 行[い]くと、左[ひだり]に 駅[えき]が あります。", "Kalau Anda berjalan lurus menyusuri jalan ini, stasiun ada di sebelah kiri."], ["お金[かね]を 入[い]れないと、切符[きっぷ]は 出[で]ません。", "Kalau uangnya tidak dimasukkan, tiketnya tidak keluar."]],
 q:["m|あの 角[かど]を 左[ひだり]へ ___と、駐車場[ちゅうしゃじょう]が あります。|Kalau belok kiri di sudut itu, ada tempat parkir.|曲[ま]がる|曲[ま]がって|曲[ま]がった|曲[ま]がり", "m|この スイッチを 押[お]すと、___。|Kalau tombol ini ditekan, air panas keluar.|お湯[ゆ]が 出[で]ます|お湯[ゆ]を 出[だ]して ください|お湯[ゆ]を 飲[の]みましょう|お湯[ゆ]が 飲[の]みたいです", "o|この/橋[はし]を/渡[わた]ると/病院[びょういん]が/あります|Kalau menyeberangi jembatan ini, ada rumah sakit.", "m|毎朝[まいあさ] コーヒーを ___と、元気[げんき]が 出[で]ません。|Kalau tidak minum kopi setiap pagi, saya tidak bersemangat.|飲[の]まない|飲[の]まなくて|飲[の]まなかった|飲[の]みない", "o|ここを/触[さわ]ると/音[おと]が/出[で]ます|Kalau bagian ini disentuh, keluar suara.", "o|この/薬[くすり]を/飲[の]むと/眠[ねむ]く/なります|Kalau minum obat ini, kita jadi mengantuk.", "m|毎日[まいにち] 漢字[かんじ]を ___と、忘[わす]れます。|Kalau tidak berlatih kanji setiap hari, saya jadi lupa.|練習[れんしゅう]しない|練習[れんしゅう]しなくて|練習[れんしゅう]すない|練習[れんしゅう]しないで", "m|冬[ふゆ]に 窓[まど]を ___と、部屋[へや]が 寒[さむ]く なります。|Kalau jendela dibuka saat musim dingin, kamar jadi dingin.|開[あ]ける|開[あ]けて|開[あ]けた|開[あ]け"]},
{b:23,t:"を + kata kerja gerak (橋を 渡ります)",d:"Pada kata kerja gerak seperti 渡ります, 歩きます, 散歩します, dan 曲がります, partikel <b>を</b> menandai <b>tempat yang dilewati</b>: 橋を渡ります = menyeberangi jembatan, 町を歩きます = berjalan menyusuri kota. Arah tujuannya tetap memakai へ: 角を右へ曲がります = belok kanan di sudut.",
 r:["S + は + K-tempat + を + KK-gerak", "K-tempat + を + 右[みぎ]/左[ひだり] + へ + 曲[ま]がります"],
 s:"S + は + K-tempat + を + KK-gerak → 私[わたし]は この 道[みち]を 歩[ある]きます。",
 k:[["を (tempat yang dilewati)", "Dengan kata kerja gerak, を menandai tempat yang dilalui atau dijelajahi, dari satu sisi ke sisi lain atau sepanjang jalurnya. 橋[はし]を 渡[わた]ります berarti melintasi jembatan dari ujung ke ujung."], ["へ (arah)", "へ menunjukkan arah gerak: 右[みぎ]へ 曲[ま]がります (boleh juga 右[みぎ]に). Jadi satu kalimat bisa memakai dua partikel: を untuk tempat yang dilewati dan へ untuk arahnya."], ["Kata kerja gerak", "Arti を ini hanya muncul pada kata kerja yang berarti bergerak berpindah tempat, seperti 渡[わた]ります, 歩[ある]きます, 散歩[さんぽ]します, dan 曲[ま]がります. Untuk kegiatan yang tidak berpindah, seperti 遊[あそ]びます atau 食[た]べます, tempatnya ditandai で."]],
 x:["Dengan kata kerja gerak, を menunjukkan jalur atau tempat yang dilewati: 道[みち]を 歩[ある]きます (berjalan menyusuri jalan), 橋[はし]を 渡[わた]ります (menyeberangi jembatan), 角[かど]を 曲[ま]がります (berbelok di tikungan), 公園[こうえん]を 散歩[さんぽ]します (berjalan-jalan keliling taman).", "Langkah membuatnya: (1) tentukan tempat yang dilewati: 交差点[こうさてん]. (2) Beri を: 交差点[こうさてん]を. (3) Kalau perlu, tambahkan arah: 右[みぎ]へ. (4) Tutup dengan kata kerja gerak: 交差点[こうさてん]を 右[みぎ]へ 曲[ま]がります.", "Bandingkan partikel tempat yang sudah kamu kenal: 公園[こうえん]<b>で</b> 遊[あそ]びます (tempat kegiatan), 公園[こうえん]<b>へ</b> 行[い]きます (tujuan), 公園[こうえん]<b>を</b> 散歩[さんぽ]します (tempat yang dijelajahi sambil bergerak).", "Kesalahan umum: memakai に untuk tempat yang dilewati. ✗ 橋[はし]に 渡[わた]ります dan ✗ 道[みち]に 歩[ある]きます salah; yang benar 橋[はし]を 渡[わた]ります dan 道[みち]を 歩[ある]きます.", "Tidak semua kata kerja gerak memakai を. 山[やま]に 登[のぼ]ります dan 電車[でんしゃ]に 乗[の]ります memakai に karena tempat itu menjadi tujuan (puncak gunung, bagian dalam kereta). Pakai を kalau tempatnya dilewati atau dijelajahi."],
 ex:[["毎晩[まいばん] 家[いえ]の 近[ちか]くを 散歩[さんぽ]します。", "Setiap malam saya berjalan-jalan di sekitar rumah."], ["この 道[みち]を まっすぐ 歩[ある]いて ください。", "Silakan berjalan lurus menyusuri jalan ini."], ["信号[しんごう]が 青[あお]の とき、道[みち]を 渡[わた]ります。", "Kita menyeberang jalan saat lampu lalu lintas hijau."]],
 q:["m|車[くるま]に 気[き]を つけて、道[みち]___ 渡[わた]りましょう。|Ayo menyeberang jalan dengan hati-hati, awas mobil.|を|が|に|の", "m|次[つぎ]の 交差点[こうさてん]___ 左[ひだり]へ 曲[ま]がって ください。|Tolong belok kiri di perempatan berikutnya.|を|に|へ|が", "o|あの/橋[はし]を/渡[わた]って/ください|Tolong seberangi jembatan itu.", "o|自転車[じてんしゃ]で/橋[はし]を/渡[わた]りました|Saya menyeberangi jembatan naik sepeda.|橋[はし]を/自転車[じてんしゃ]で/渡[わた]りました", "o|公園[こうえん]の/中[なか]を/散歩[さんぽ]しましょう|Ayo berjalan-jalan di dalam taman.", "m|毎朝[まいあさ] 犬[いぬ]と 公園[こうえん]___ 散歩[さんぽ]します。|Setiap pagi saya berjalan-jalan di taman bersama anjing.|を|に|へ|が", "m|日曜日[にちようび]は 公園[こうえん]___ 子供[こども]と 遊[あそ]びました。|Hari Minggu saya bermain bersama anak di taman.|で|を|に|へ", "m|あの 交差点[こうさてん]を ___、まっすぐ 行[い]って ください。|Seberangi perempatan itu, lalu jalan terus lurus.|渡[わた]って|渡[わた]りて|渡[わた]て|渡[わた]んで"]},
{b:24,t:"くれます",d:"<b>くれます</b> = orang lain memberi sesuatu <b>kepada saya</b> atau kepada keluarga saya. Polanya: Pemberi は/が (私に) Barang を くれます; 私に biasanya tidak diucapkan. Kalau saya yang memberi, atau orang lain memberi kepada orang lain, pakai あげます. Jadi 'teman memberi saya' = 友達がくれました, bukan あげました.",
 r:["S(orang lain) + が + (私[わたし]に) + O + を + くれます", "S(orang lain) + は/が + KB(keluarga saya) + に + O + を + くれます"],
 s:"S(pemberi) + が + (私[わたし]に) + O + を + くれます → 兄[あに]が 傘[かさ]を くれました。 (私[わたし]に biasanya tidak diucapkan)",
 k:[["くれます", "Kata kerja 'memberi' khusus untuk arah dari orang lain ke saya atau ke keluarga saya. Karena arahnya sudah jelas dari kata kerjanya, 私[わたし]に sering tidak diucapkan."], ["が (pemberi)", "Pemberi ditandai が, terutama saat menyampaikan siapa yang memberi: 父[ちち]が くれました. Kalau pemberi sudah menjadi topik pembicaraan, boleh memakai は: 父[ちち]は 私[わたし]に 時計[とけい]を くれました."], ["に (penerima)", "に menandai penerima: 私[わたし]に, 妹[いもうと]に. Penerima くれます harus saya atau pihak saya (keluarga, dan dalam pertanyaan juga lawan bicara). Kalau penerimanya orang lain, pakai あげます."], ["を (barang)", "Barang yang diberikan adalah objek, jadi ditandai を, sama seperti pada あげます dan もらいます di Bab 7."]],
 x:["くれます dipakai saat orang lain memberi sesuatu kepada saya atau kepada keluarga saya. Bahasa Jepang memilih kata kerja menurut arah pemberian: あげます untuk memberi ke orang lain, くれます kalau saya (atau keluarga saya) yang menerima.", "Susunannya: pemberi + が, lalu (私[わたし]に) yang boleh dihilangkan, barang + を, dan terakhir くれます atau くれました. Contoh: 母[はは]が 手紙[てがみ]を くれました.", "Arah memberi: saya → orang lain = あげます; orang lain → orang lain = あげます; orang lain → saya atau keluarga saya = くれます. もらいます melihat kejadian yang sama dari sisi penerima: 私[わたし]は 友達[ともだち]に 本[ほん]を もらいました sama artinya dengan 友達[ともだち]が 本[ほん]を くれました.", "Kesalahan paling umum: ✗ 友達[ともだち]が 私[わたし]に 本[ほん]を あげました. Kalau penerimanya saya, あげます harus diganti くれます. Kebalikannya juga salah: ✗ 私[わたし]は 友達[ともだち]に 本[ほん]を くれました.", "Bentuk biasanya: くれる, くれない, くれた, くれなかった. Bentuk ini sering muncul di klausa penjelas: 兄[あに]が くれた 辞書[じしょ] (kamus pemberian kakak). Dalam pertanyaan kepada lawan bicara, くれます juga dipakai untuk pemberian kepada 'kamu': その 時計[とけい]は 誰[だれ]が くれましたか."],
 ex:[["友達[ともだち]が 私[わたし]に 花[はな]を くれました。", "Teman memberi saya bunga."], ["誕生日[たんじょうび]に 父[ちち]が 時計[とけい]を くれました。", "Ayah memberi saya jam tangan saat ulang tahun."], ["アリさんは 妹[いもうと]に 辞書[じしょ]を くれました。", "Ali memberi adik perempuan saya kamus."]],
 q:["m|姉[あね]は 私[わたし]に セーターを ___。|Kakak perempuan memberi saya sweater.|くれました|あげました|ください|あげます", "m|私[わたし]は 友達[ともだち]に 本[ほん]を ___。|Saya memberi teman buku.|あげました|くれました|くれます|ください", "o|これは/おばあさんが/くれた/かばん/です|Ini tas yang diberikan nenek kepada saya.", "o|父[ちち]が/くれた/時計[とけい]を/なくしました|Saya menghilangkan jam tangan pemberian ayah.", "o|その/ネクタイは/誰[だれ]が/くれましたか|Siapa yang memberimu dasi itu?", "m|これは 誕生日[たんじょうび]に 友達[ともだち]___ くれた 本[ほん]です。|Ini buku pemberian teman saat saya berulang tahun.|が|を|で|へ", "m|姉[あね]が ___ 古[ふる]い カメラを くれました。|Kakak perempuan memberi saya kamera lamanya.|私[わたし]に|私[わたし]を|私[わたし]が|私[わたし]で", "m|父[ちち]は 私[わたし]に 何[なに]も ___。|Ayah tidak memberi saya apa-apa.|くれませんでした|あげませんでした|くれないでした|くれなかったでした"]},
{b:24,t:"～て あげます / ～て もらいます / ～て くれます",d:"Bentuk-て + あげます/もらいます/くれます = melakukan sesuatu sebagai kebaikan untuk orang lain, arahnya sama seperti memberi barang. <b>～てあげます</b>: saya berbuat baik untuk orang lain. <b>～てもらいます</b>: saya menerima kebaikan dan orang yang menolong ditandai <b>に</b>; <b>～てくれます</b>: orang lain berbuat baik untuk saya. Kepada atasan atau orang yang lebih tua, hindari ～てあげます secara langsung karena terdengar kurang sopan; tawarkan saja dengan ～ましょうか.",
 r:["私[わたし] + は + KB(orang lain) + に/を + (O + を) + KK-て + あげます", "私[わたし] + は + KB(penolong) + に + (O + を) + KK-て + もらいます", "KB(penolong) + が + (私[わたし]に/を) + (O + を) + KK-て + くれます"],
 s:"S + が + O + を + KK-て + くれます → 兄[あに]が 荷物[にもつ]を 持[も]って くれました。",
 k:[["Bentuk て", "Kata kerja kegiatannya diubah ke bentuk て, lalu disambung dengan kata kerja memberi atau menerima. Bagian pertama menjawab 'melakukan apa', bagian kedua menjawab 'untuk siapa'."], ["～て あげます", "Saya (atau pihak saya) berbuat baik untuk orang lain. Kepada orang yang lebih tua atau atasan, bentuk ini terdengar seperti menonjolkan jasa sendiri, jadi lebih baik menawarkan bantuan dengan ～ましょうか."], ["～て もらいます + に", "Saya menjadi subjek dan penerima kebaikan. Orang yang menolong ditandai に: 友達[ともだち]に 手伝[てつだ]って もらいました = saya dibantu teman. Kalimat ini sering terdengar seperti saya yang meminta bantuan itu."], ["～て くれます + が", "Orang lain menjadi subjek dan berbuat baik untuk saya, ditandai が: 友達[ともだち]が 手伝[てつだ]って くれました. Kalimat ini menonjolkan kebaikan hati orang itu."], ["Partikel orang yang dibantu", "Partikelnya mengikuti kata kerja asalnya: 妹[いもうと]に 本[ほん]を 読[よ]んで あげます (membacakan untuk adik), 友達[ともだち]を 駅[えき]まで 送[おく]って あげます (mengantar teman), 友達[ともだち]の 荷物[にもつ]を 持[も]って あげます (membawakan barang teman)."]],
 x:["Pola ini menyatakan bahwa sebuah perbuatan dilakukan sebagai kebaikan atau bantuan. Arahnya sama dengan memberi barang, hanya saja yang diberikan berupa perbuatan. Terjemahannya sering memakai akhiran -kan (membelikan, membacakan) atau kata 'untuk'.", "Langkah membuatnya: (1) ubah kata kerja ke bentuk て: 貸[か]します → 貸[か]して. (2) Pilih kata kerja pemberian sesuai arah: あげます, もらいます, atau くれます. (3) Atur partikelnya: penolong + に untuk もらいます, penolong + が untuk くれます.", "Bandingkan: 私[わたし]は 友達[ともだち]に 傘[かさ]を 貸[か]して あげました = saya meminjamkan payung kepada teman. Kalau teman yang meminjamkan kepada saya, ada dua cara mengatakannya: 私[わたし]は 友達[ともだち]に 傘[かさ]を 貸[か]して もらいました (subjeknya saya) atau 友達[ともだち]が 傘[かさ]を 貸[か]して くれました (subjeknya teman).", "Dua kesalahan yang sering terjadi: (1) memakai ～て あげました untuk kebaikan yang saya terima (✗ 友達[ともだち]が 私[わたし]を 手伝[てつだ]って あげました → ✓ 手伝[てつだ]って くれました). (2) Menandai penolong dengan が pada もらいます (✗ 友達[ともだち]が 手伝[てつだ]って もらいました untuk arti 'saya dibantu teman' → ✓ 私[わたし]は 友達[ともだち]に 手伝[てつだ]って もらいました).", "Soal sopan santun: jangan berkata 先生[せんせい]、荷物[にもつ]を 持[も]って あげます. Lebih sopan: 荷物[にもつ]を 持[も]ちましょうか. Sebaliknya, ～て くれました dan ～て もらいました membawa rasa terima kasih, jadi sering dipakai saat menceritakan kebaikan orang lain."],
 ex:[["私[わたし]は 妹[いもうと]に 本[ほん]を 読[よ]んで あげました。", "Saya membacakan buku untuk adik perempuan."], ["私[わたし]は 友達[ともだち]に 町[まち]を 案内[あんない]して もらいました。", "Teman mengantar saya berkeliling kota."], ["姉[あね]が 晩[ばん]ご飯[はん]を 作[つく]って くれました。", "Kakak perempuan memasakkan makan malam untuk saya."]],
 q:["m|友達[ともだち]が 私[わたし]を 駅[えき]まで 送[おく]って ___。|Teman mengantar saya sampai ke stasiun.|くれました|あげました|もらいました|ください", "m|私[わたし]は 友達[ともだち]___ 写真[しゃしん]を 撮[と]って もらいました。|Saya difotokan oleh teman.|に|が|を|で", "o|私[わたし]は/おばあさんに/道[みち]を/教[おし]えて/あげました|Saya menunjukkan jalan kepada seorang nenek.|私[わたし]は/道[みち]を/おばあさんに/教[おし]えて/あげました", "m|私[わたし]は 弟[おとうと]に お菓子[かし]を 買[か]って ___。|Saya membelikan adik laki-laki kue.|あげました|くれました|くれます|ください", "o|母[はは]が/作[つく]って/くれた/お弁当[べんとう]を/食[た]べました|Saya makan bekal yang dibuatkan ibu.", "m|私[わたし]は 妹[いもうと]に 日本[にほん]の 歌[うた]を ___ あげました。|Saya menyanyikan lagu Jepang untuk adik perempuan.|歌[うた]って|歌[うた]いて|歌[うた]んで|歌[うた]た", "m|友達[ともだち]___ 部屋[へや]の 掃除[そうじ]を 手伝[てつだ]って くれました。|Teman membantu saya membersihkan kamar.|が|に|を|で", "m|私[わたし]は 日本人[にほんじん]の 友達[ともだち]に 手紙[てがみ]を 直[なお]して ___。|Surat saya dikoreksi oleh teman saya yang orang Jepang.|もらいました|くれました|くれます|ください"]},
{b:25,t:"～たら (kalau / seandainya)",d:"Bentuk lampau biasa + <b>ら</b> = 'kalau/seandainya ...': 行ったら, 飲んだら, 行かなかったら; sifat-い: 高かったら; sifat-な dan kata benda: 便利だったら, 雨だったら. Berbeda dengan ～と, bagian kedua boleh berisi keinginan, ajakan, atau permintaan. Tambahkan <b>もし</b> di awal kalimat untuk menegaskan 'seandainya' pada hal yang belum pasti.",
 r:["(もし) + KK-た / KK-なかった + ら、+ Kalimat utama", "(もし) + KS-i(～かった) + ら、+ Kalimat utama", "(もし) + KS-na / KB + だった + ら、+ Kalimat utama"],
 s:"(もし) + KK-た + ら、+ Kalimat utama (ら di akhir bagian pertama) → 時間[じかん]が あったら、海[うみ]へ 行[い]きましょう。",
 k:[["ら (～たら)", "Penanda syarat 'kalau'. ら menempel pada bentuk た, jadi caranya: buat bentuk た, lalu tambahkan ら. 行[い]った → 行[い]ったら."], ["Bentuk た", "Walaupun memakai bentuk た, ～たら tidak berarti lampau. 明日[あした] 雨[あめ]が 降[ふ]ったら = kalau besok hujan. Bentuk た hanya bahan untuk membentuk pola ini."], ["かった / だった", "Sifat-い memakai bentuk lampaunya: 高[たか]かった + ら. Sifat-な dan kata benda memakai だった + ら: 暇[ひま]だったら, 雨[あめ]だったら."], ["もし", "Kata di awal kalimat yang berarti 'seandainya'. もし menegaskan bahwa syaratnya belum pasti. Kata ini boleh dihilangkan, tetapi kalau dipakai harus berpasangan dengan bentuk syarat seperti ～たら."], ["Kalimat utama bebas", "Berbeda dengan と (Bab 23), kalimat setelah ～たら boleh berisi keinginan (～たい), ajakan (～ましょう), atau permintaan (～て ください)."]],
 x:["～たら menyatakan syarat: kalau A terjadi, maka B. B baru terjadi setelah A terpenuhi. Tambahkan もし di awal kalau A hanya pengandaian yang belum tentu terjadi.", "Cara membentuk: ambil bentuk た, tambahkan ら. 行[い]く → 行[い]ったら, 食[た]べる → 食[た]べたら, する → したら, 来[く]る → 来[き]たら, 行[い]かない → 行[い]かなかったら. Sifat-い: 安[やす]い → 安[やす]かったら. Sifat-な: 暇[ひま] → 暇[ひま]だったら. Kata benda: 雨[あめ] → 雨[あめ]だったら.", "Bandingkan dengan と: と hanya untuk hasil yang pasti dan tidak boleh diikuti keinginan atau ajakan, sedangkan ～たら boleh. 雨[あめ]が 降[ふ]ったら、うちで 映画[えいが]を 見[み]ましょう (✓), tetapi ✗ 雨[あめ]が 降[ふ]ると、うちで 映画[えいが]を 見[み]ましょう.", "Yang sering salah: membentuk dari bentuk ます (✗ 飲[の]みたら → ✓ 飲[の]んだら), lupa だった pada sifat-な (✗ 暇[ひま]たら → ✓ 暇[ひま]だったら), dan mengira kalimatnya lampau karena ada た.", "もし sering dipakai untuk berkhayal atau untuk hal yang kecil kemungkinannya: もし 時間[じかん]が たくさん あったら、世界[せかい]を 旅行[りょこう]したいです."],
 ex:[["明日[あした] 雨[あめ]だったら、うちで 映画[えいが]を 見[み]ましょう。", "Kalau besok hujan, ayo menonton film di rumah."], ["もし お金[かね]が たくさん あったら、何[なに]を したいですか。", "Seandainya punya banyak uang, kamu ingin melakukan apa?"], ["暑[あつ]かったら、窓[まど]を 開[あ]けて ください。", "Kalau panas, tolong buka jendelanya."]],
 q:["m|飲[の]む → ___|Bentuk ～たら dari 飲む|飲[の]んだら|飲[の]みたら|飲[の]ったら|飲[の]むたら", "m|もし 明日[あした] 暇[ひま]___、いっしょに 買[か]い物[もの]に 行[い]きませんか。|Kalau besok kamu senggang, mau pergi belanja bersama?|だったら|かったら|たら|だたら", "o|分[わ]からなかったら/先生[せんせい]に/聞[き]いて/ください|Kalau tidak mengerti, tanyakan kepada guru.", "m|___ 明日[あした] 雨[あめ]が 降[ふ]ったら、試合[しあい]は ありません。|Seandainya besok hujan, pertandingannya tidak diadakan.|もし|とても|まだ|もしもし", "m|来[く]る → ___|Bentuk ～たら dari 来る|きたら|くたら|こたら|くるたら", "m|この 靴[くつ]が もう 少[すこ]し ___、買[か]いたいです。|Kalau sepatu ini sedikit lebih murah, saya ingin membelinya.|安[やす]かったら|安[やす]いたら|安[やす]だったら|安[やす]くたら", "o|駅[えき]が/遠[とお]かったら、/タクシーで/行[い]きましょう|Kalau stasiunnya jauh, ayo naik taksi.", "o|もし/一億円[いちおくえん]/あったら、/大[おお]きい/家[いえ]を/買[か]いたいです|Seandainya punya seratus juta yen, saya ingin membeli rumah besar."]},
{b:25,t:"～たら (setelah)",d:"～たら juga dipakai untuk hal yang <b>pasti terjadi</b>, artinya 'setelah/begitu ... (nanti), ...'. Bagian kedua biasanya rencana, ajakan, atau permintaan: 宿題が終わったら、遊びに行きます. Di sini もし tidak dipakai, karena hal yang pertama pasti akan terjadi.",
 r:["KK-た + ら、+ Kalimat utama (rencana/ajakan/permintaan)", "KB(waktu) + に + なった + ら、+ Kalimat utama"],
 s:"KK-た + ら、+ Kalimat utama (ら di akhir bagian pertama) → うちに 帰[かえ]ったら、シャワーを 浴[あ]びます。",
 k:[["ら (setelah)", "Di sini ～たら menunjukkan urutan: kegiatan kedua dilakukan setelah kegiatan pertama terjadi. Kegiatan pertama pasti terjadi, jadi yang dibicarakan hanya kapan kegiatan kedua dimulai."], ["Bentuk た", "Bentuk た menunjukkan bahwa kegiatan pertama sudah selesai lebih dulu. 着[つ]いたら berarti 'setelah sudah sampai'."], ["Tanpa もし", "もし berarti 'seandainya' dan hanya cocok untuk hal yang belum pasti. Misalnya, jam dua belas pasti datang dan pekerjaan pasti selesai, jadi もし tidak dipakai di sini."], ["Kalimat utama untuk nanti", "Kalimat utama biasanya rencana atau permintaan untuk nanti: ～ます (akan), ～たい, ～ましょう, ～て ください. Untuk menceritakan urutan kejadian yang sudah lewat, pakai ～てから (Bab 16)."]],
 x:["Arti pola ini 'setelah A (nanti), B' atau 'begitu A, B'. A adalah hal yang pasti terjadi; B adalah rencana, ajakan, atau permintaan yang dilakukan sesudah A.", "Cara membentuknya sama dengan ～たら 'kalau': bentuk た + ら. 終[お]わる → 終[お]わったら, 着[つ]く → 着[つ]いたら, 帰[かえ]る → 帰[かえ]ったら, 来[く]る → 来[き]たら, する → したら. Untuk waktu: 三時[さんじ]に なったら, 夏[なつ]に なったら.", "Bentuknya sama dengan ～たら 'kalau', jadi artinya ditentukan oleh konteks. 雨[あめ]が 降[ふ]ったら: belum tentu hujan, jadi artinya 'kalau'. 仕事[しごと]が 終[お]わったら: pekerjaan pasti selesai, jadi artinya 'setelah'.", "～てから (Bab 16) juga menyatakan urutan dan bisa dipakai untuk kejadian lampau maupun nanti. ～たら dalam arti ini dipakai untuk rencana atau permintaan ke depan: うちに 帰[かえ]ったら、メールを ください.", "Bentuk yang salah: ✗ 食[た]べるたら dan ✗ 食[た]べますたら (yang benar 食[た]べたら). Jangan juga memakai もし untuk hal yang pasti (✗ もし 十二時[じゅうにじ]に なったら)."],
 ex:[["ホテルに 着[つ]いたら、母[はは]に 電話[でんわ]します。", "Setelah sampai di hotel, saya akan menelepon ibu."], ["大学[だいがく]を 出[で]たら、日本[にほん]で 働[はたら]きたいです。", "Setelah lulus kuliah, saya ingin bekerja di Jepang."], ["夏休[なつやす]みに なったら、田舎[いなか]へ 帰[かえ]ります。", "Nanti kalau sudah libur musim panas, saya pulang kampung."]],
 q:["m|晩[ばん]ご飯[はん]を ___、宿題[しゅくだい]を します。|Setelah makan malam, saya mengerjakan PR.|食[た]べたら|食[た]べるたら|食[た]べったら|食[た]べますたら", "o|仕事[しごと]が/終[お]わったら/飲[の]みに/行[い]きましょう|Nanti setelah pekerjaan selesai, ayo pergi minum.", "m|十二時[じゅうにじ]に ___、昼[ひる]ご飯[はん]を 食[た]べに 行[い]きましょう。|Nanti kalau sudah jam dua belas, ayo pergi makan siang.|なったら|なると|なるたら|なりたら", "o|空港[くうこう]に/着[つ]いたら/すぐ/電話[でんわ]して ください|Begitu sampai di bandara, segera telepon saya.", "o|この/本[ほん]を/読[よ]んだら/貸[か]して ください|Kalau sudah selesai membaca buku ini, tolong pinjamkan kepada saya.", "m|日本[にほん]に ___、何[なに]を したいですか。|Setelah sampai di Jepang, kamu ingin melakukan apa?|着[つ]いたら|着[つ]くたら|着[つ]きたら|着[つ]ったら", "m|子供[こども]が ___、いっしょに 映画[えいが]を 見[み]ましょう。|Setelah anak-anak tidur, ayo kita menonton film bersama.|寝[ね]たら|寝[ね]ると|寝[ね]ったら|寝[ね]ますたら"]},
{b:25,t:"～ても (walaupun)",d:"Bentuk-て + <b>も</b> = 'walaupun ...': hal kedua tetap terjadi (atau tetap tidak terjadi) meskipun ada keadaan pertama. Kata kerja: 降っても, 行かなくても; sifat-い: い → <b>くても</b> (高くても); sifat-な dan kata benda: <b>でも</b> (不便でも, 休みでも). Bandingkan: 雨が降ったら、行きません (kalau hujan, tidak pergi) dengan 雨が降っても、行きます (walaupun hujan, tetap pergi).",
 r:["KK-て / KK-なくて + も、+ Kalimat utama", "KS-i(～くて) + も、+ Kalimat utama", "KS-na / KB + で + も、+ Kalimat utama"],
 s:"KK-て + も、+ Kalimat utama (も di akhir bagian pertama) → 疲[つか]れても、勉強[べんきょう]します。",
 k:[["も (～ても)", "Biasanya も berarti 'juga'. Setelah bentuk て, も memberi arti 'walaupun': keadaan pertama tidak mengubah hasil di kalimat utama."], ["Bentuk て (kata kerja)", "～ても dibuat dari bentuk て, jadi aturan bentuk て tetap berlaku: 降[ふ]る → 降[ふ]って → 降[ふ]っても. Kalau bentuk て-nya berakhir で, hasilnya でも: 飲[の]む → 飲[の]んで → 飲[の]んでも."], ["くても (sifat-い)", "Sifat-い: buang い lalu tambahkan くても: 高[たか]い → 高[たか]くても. Ini bentuk て sifat-い (高[たか]くて) ditambah も."], ["でも (sifat-な dan kata benda)", "Sifat-な dan kata benda memakai でも: 不便[ふべん]でも, 休[やす]みでも. Bentuk て mereka adalah で, lalu ditambah も."], ["なくても (negatif)", "Untuk 'walaupun tidak ...', ubah ない menjadi なくて lalu tambahkan も: 分[わ]からない → 分[わ]からなくても."]],
 x:["Arti pola ini 'walaupun A, B'. Biasanya orang mengira A akan menghalangi B, tetapi B tetap terjadi (atau tetap tidak terjadi). Kalimat utama boleh berisi fakta, keinginan, atau permintaan.", "Cara membentuk dari bentuk て + も: 待[ま]つ → 待[ま]っても, 遊[あそ]ぶ → 遊[あそ]んでも, 来[こ]ない → 来[こ]なくても, 安[やす]い → 安[やす]くても, 静[しず]か → 静[しず]かでも, 子供[こども] → 子供[こども]でも.", "Bandingkan ～たら dan ～ても: 安[やす]かったら、買[か]います (kalau murah, saya beli) dan 安[やす]くても、買[か]いません (walaupun murah, saya tidak beli). Syarat pada ～たら memicu hasilnya; syarat pada ～ても tidak mengubah hasilnya.", "Untuk arti 'sekeras apa pun' atau 'sebanyak apa pun', tambahkan いくら di depan: いくら 考[かんが]えても、分[わ]かりません (sekeras apa pun saya berpikir, tetap tidak mengerti).", "Bentuk yang sering salah: ✗ 寒[さむ]いても, ✗ 暇[ひま]ても, ✗ 読[よ]むても. Buat bentuk て dulu, baru tambah も. Hati-hati juga dengan でも di awal kalimat (Bab 19): itu kata sambung 'tetapi', berbeda dengan でも yang menempel di belakang kata seperti 暇[ひま]でも.", "Arti 'tetap' sudah dibawa oleh ～ても, jadi bagian kedua tidak perlu kata tambahan: 雨[あめ]が 降[ふ]っても、行[い]きます (walaupun hujan, saya tetap pergi)."],
 ex:[["雨[あめ]が 降[ふ]っても、試合[しあい]は あります。", "Walaupun hujan, pertandingannya tetap diadakan."], ["この 時計[とけい]は 高[たか]くても、買[か]いたいです。", "Walaupun jam ini mahal, saya tetap ingin membelinya."], ["病気[びょうき]でも、母[はは]は 休[やす]みませんでした。", "Walaupun sakit, ibu tidak beristirahat."]],
 q:["m|寒[さむ]い → ___|Bentuk ～ても dari 寒い|寒[さむ]くても|寒[さむ]いても|寒[さむ]かっても|寒[さむ]でも", "m|この 部屋[へや]は エアコンを ___、暑[あつ]いです。|Walaupun AC sudah dinyalakan, kamar ini tetap panas.|つけても|つけたら|つけると|つけて", "o|分[わ]からなくても/辞書[じしょ]を/使[つか]わないで/ください|Walaupun tidak mengerti, tolong jangan pakai kamus.", "m|この 町[まち]は 夜[よる]___、にぎやかです。|Kota ini tetap ramai walaupun malam hari.|でも|ても|くても|だても", "m|読[よ]む → ___|Bentuk ～ても dari 読む|読[よ]んでも|読[よ]むても|読[よ]んても|読[よ]みても", "m|父[ちち]は 熱[ねつ]が ___、会社[かいしゃ]を 休[やす]みませんでした。|Walaupun demam, ayah tidak libur kerja.|あっても|あったら|あると|あるても", "o|いくら/練習[れんしゅう]しても/上手[じょうず]に/なりません|Sebanyak apa pun saya berlatih, saya tidak juga menjadi mahir.", "o|日本語[にほんご]が/下手[へた]でも/日本人[にほんじん]と/話[はな]したいです|Walaupun bahasa Jepang saya masih kurang bagus, saya ingin berbicara dengan orang Jepang."]}
];

const VOCAB = Object.entries(VRAW).flatMap(([theme, txt]) => txt.trim().split('\n').map(l => {
  const [w, r, m, ex, exid, ex2, ex2id] = l.split('|').map(s => s.trim());
  return { id: 'v:' + w, type: 'v', w, r, m, ex, exid, ex2, ex2id, theme };
}));
const KANJI = KRAW.trim().split('\n').map(l => {
  const [c, m, on, kun, mn, rel] = l.split('|').map(s => s.trim());
  return { id: 'k:' + c, type: 'k', c, m, on, kun, mn, rel, theme: 'kanji' };

function schedule(card, g, now = Date.now()) {
  const c = { ease: 2.5, ivl: 0, reps: 0, lapses: 0, ...card };
  if (g === 1) {
    c.lapses++; c.reps = 0; c.ivl = 0; c.ease = Math.max(1.3, c.ease - .2); c.due = now + 10 * MIN; return c;
  }
  if (g === 2) { c.ivl = c.reps ? Math.max(c.ivl + 1, Math.round(c.ivl * 1.2)) : 1; c.ease = Math.max(1.3, c.ease - .15); }
  if (g === 3) c.ivl = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.max(c.ivl + 1, Math.round(c.ivl * c.ease));
  if (g === 4) { c.ivl = c.reps === 0 ? 3 : Math.max(c.ivl + 2, Math.round(c.ivl * c.ease * 1.3)); c.ease += .15; }
  c.reps++; c.due = now + c.ivl * DAY; return c;
}

/* ---------- kanji info ---------- */
const relParts = k => { const m = k.rel.match(/^(.+?)\((.+?)\)\s*(.*)$/); return m ? { w: m[1], r: m[2], m: m[3] } : null; };
// Cara baca utama = bacaan yang dipakai saat kanji berdiri sendiri (七 = なな). Bacaan lain muncul di kata gabungan.
const MAIN_READ = { 一: 'いち', 二: 'に', 三: 'さん', 四: 'よん', 五: 'ご', 六: 'ろく', 七: 'なな', 八: 'はち', 九: 'きゅう', 十: 'じゅう', 百: 'ひゃく', 千: 'せん', 万: 'まん', 円: 'えん',
  分: 'ふん', 半: 'はん', 本: 'ほん', 語: 'ご', 天: 'てん', 下: 'した', 午: 'ご', 毎: 'まい', 年: 'ねん', 時: 'じ', 金: 'かね', 土: 'つち', 木: 'き', 水: 'みず', 火: 'ひ', 日: 'ひ' };
const readList = x => x === '—' ? [] : x.split(/,\s*/).map(r => toHira(r.replace(/[()]/g, '')));
const baseRead = k => MAIN_READ[k.c] || readList(k.kun)[0] || readList(k.on)[0];

// Kanji dalam konteks: cara baca yang ditanyakan & urutan munculnya mengikuti kata PERTAMA yang memakai kanji itu
// di urutan metode belajar (tema/bab). Contoh metode bab: 行 pertama muncul di 銀行員 (Bab 1), jadi dibaca こう.
const KBYC = Object.fromEntries(KANJI.map(k => [k.c, k]));
const DAKU = { か: 'が', き: 'ぎ', く: 'ぐ', け: 'げ', こ: 'ご', さ: 'ざ', し: 'じ', す: 'ず', せ: 'ぜ', そ: 'ぞ', た: 'だ', ち: 'ぢ', つ: 'づ', て: 'で', と: 'ど', は: 'ば', ひ: 'び', ふ: 'ぶ', へ: 'べ', ほ: 'ぼ' };
const HANDA = { は: 'ぱ', ひ: 'ぴ', ふ: 'ぷ', へ: 'ぺ', ほ: 'ぽ' };
function kanjiCands(k) { // [bentuk di dalam kata, bentuk yang ditampilkan, berubah bunyi?], terpanjang dulu
  const out = [], add = (surf, disp) => {
    out.push([surf, disp, false]);
    if (DAKU[surf[0]]) out.push([DAKU[surf[0]] + surf.slice(1), disp, true]);      // rendaku: ひ → び
    if (HANDA[surf[0]]) out.push([HANDA[surf[0]] + surf.slice(1), disp, true]);
    if (surf.length > 1 && 'つちくき'.includes(surf.slice(-1))) out.push([surf.slice(0, -1) + 'っ', disp, true]); // がく → がっ
  };
  if (k.on !== '—') k.on.split(/,\s*/).forEach(r => add(toHira(r), toHira(r)));
  if (k.kun !== '—') k.kun.split(/,\s*/).forEach(r => { const stem = toHira(r.replace(/\(.*$/, '')), full = toHira(r.replace(/[()]/g, '')); add(stem, full); if (full !== stem) add(full, full); });
  return out.sort((a, b) => b[0].length - a[0].length);
}
// cara baca kanji c di kata w (bacaan r): cocokkan huruf demi huruf; kanji di luar daftar boleh 1–4 kana.
// null kalau tidak bisa dipecah per kanji (今日 = きょう, 日本 = にほん)
function kanjiReadIn(w, r, c) {
  const W = [...w.replace(/[～\s、。？！?!]/g, '')], R = toHira(r).replace(/[～\s、。？！?!]/g, '');
  let found = null;
  const go = (i, j, got) => {
    if (found) return;
    if (i === W.length) { if (j === R.length && got) found = got; return; }
    const ch = W[i];
    if (!/[々一-鿿]/.test(ch)) { if (toHira(ch) === R[j]) go(i + 1, j + 1, got); return; }
    const k = KBYC[ch === '々' ? W[i - 1] : ch];
    const cs = k ? kanjiCands(k) : [1, 2, 3, 4].map(n => [R.substr(j, n), null, false]);
    for (const [surf, disp, changed] of cs) if (surf && R.startsWith(surf, j)) go(i + 1, j + surf.length, got || (ch === c ? { rd: disp, surf, changed } : null));
  };
  go(0, 0, null);
  return found;
}
let KX = null; // dihitung sekali saat pertama dipakai: { tema|bab: { ctx: kanji → {v, rd, surf, changed}, kanji: urutan kanji } }
function kx() {
  if (!KX) {
    KX = {};
    for (const [m, order] of [['tema', VOCAB], ['bab', VOCAB_BAB]]) {
      const ctx = {}, pos = {};
      for (const k of KANJI) {
        let first = 1e9; // kanji tanpa kata konteks: di urutan kata pertama yang memakainya, atau paling akhir
        for (let i = 0; i < order.length; i++) {
          if (!order[i].w.includes(k.c)) continue;
          first = Math.min(first, i);
          const x = kanjiReadIn(order[i].w, order[i].r, k.c);
          if (x) { ctx[k.c] = { v: order[i], ...x }; first = i; break; }
        }
        pos[k.c] = first;
      }
      KX[m] = { ctx, kanji: [...KANJI].sort((a, b) => pos[a.c] - pos[b.c]) };
    }
  }
  return KX[babMode() ? 'bab' : 'tema'];
}
const kctx = k => kx().ctx[k.c];
const NUMK = '一二三四五六七八九十百千万'; // angka tetap memakai bacaan hitungan (いち, に, さん…), bukan 三日 = みっか
const mainRead = k => (!NUMK.includes(k.c) && kctx(k)?.rd) || baseRead(k);
const otherReads = k => [...new Set([...readList(k.kun), ...readList(k.on)])].filter(r => r !== mainRead(k));
const kanjiReads = k => [...new Set([mainRead(k), ...otherReads(k), ...(k.kun === '—' ? [] : k.kun.split(/,\s*/).map(r => toHira(r.replace(/\(.*$/, ''))))])];
const kanjiReadAnswer = (k, typed) => Math.max(...kanjiReads(k).map(r => matchReading(typed, r)));
const ctxLine = k => { const c = kctx(k); return c ? `Di kosakata: <b class="jp">${c.v.w}</b> (<span class="jp">${c.v.r}</span>) = ${esc(c.v.m)}${babMode() && c.v.bab ? ` · 📘 Bab ${c.v.bab}` : ''}${c.changed ? ` · di kata ini bunyinya berubah jadi <span class="jp">${c.surf}</span>` : ''}` : ''; };
function kanjiInfo(k) {
  const rp = relParts(k), mr = mainRead(k), others = otherReads(k), cl = ctxLine(k);
  return `<div class="rdg" style="grid-template-columns:1fr"><div><span class="lbl">Cara baca</span>
      <div class="row"><b class="jp" style="font-size:24px">${mr}</b><span class="muted">${toRomaji(mr)}</span>${spk(mr)}</div>
      ${cl ? `<small class="muted" style="display:block">${cl}</small>` : ''}
      ${others.length ? `<small class="muted">Di kata lain bisa dibaca: ${others.map(r => `<span class="jp">${r}</span> (${toRomaji(r)})`).join(', ')}</small>` : ''}</div></div>
    <div class="mn">💡 ${esc(k.mn)}</div>
    ${rp ? `<div class="ex"><span class="lbl">Contoh kata</span>
      <div class="row"><span class="jp" style="font-size:22px;font-weight:700"><ruby>${rp.w}<rt>${rp.r}</rt></ruby></span>${spk(rp.r)}<span>= ${esc(rp.m)}</span></div>
      <small class="muted">Dibaca <b class="jp">${rp.r}</b> (${toRomaji(rp.r)}). Arti ${k.c} sendiri tetap "<b>${esc(k.m)}</b>".</small></div>` : ''}`;
}

/* ---------- keyboard kana di layar ---------- */
const KBC = ['あいうえお', 'かきくけこ', 'さしすせそ', 'たちつてと', 'なにぬねの', 'はひふへほ', 'まみむめも', 'や゠ゆ゠よ', 'らりるれろ', 'わ゠゠゠を', 'ん゠゠゠゠'];
const DAK = 'かがきぎくぐけげこごさざしじすずせぜそぞただちぢつづてでとどはばひびふぶへべほぼ', HAN = 'はぱひぴふぷへぺほぽ', SMALL = 'あぁいぃうぅえぇおぉやゃゆゅよょつっ';
const kkey = (label, fn) => `<button type="button" class="kk" onmousedown="event.preventDefault()" onclick="${fn}">${label}</button>`;
let KB_KATA = false; // keyboard di layar: false = hiragana, true = katakana (tombol カナ)
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const kbCh = c => KB_KATA ? toKata(c) : c;
function kbHTML() {
  let g = '';
  for (let r = 0; r < 5; r++) g += KBC.map(c => c[r] === '゠' ? '<span></span>' : kkey(kbCh(c[r]), `kb('${kbCh(c[r])}')`)).join('');
  return `<div class="kb"><div class="kbg">${g}</div><div class="kbf">
    ${kkey(KB_KATA ? 'かな' : 'カナ', 'kbKata()')}${kkey('゛', 'kbMod(DAK)')}${kkey('゜', 'kbMod(HAN)')}${kkey('小', 'kbMod(SMALL)')}${kkey('ー', "kb('ー')")}${kkey('⌫', 'kbDel()')}
    <button type="button" class="kk ok" onmousedown="event.preventDefault()" onclick="kbEnter()">Periksa ↵</button></div>
    <div class="hint" style="margin-top:6px">゛ ゜ 小 mengubah huruf terakhir (か→が, は→ぱ, つ→っ). <b>${KB_KATA ? 'かな' : 'カナ'}</b> = ganti ke ${KB_KATA ? 'hiragana' : 'katakana'}. Kata katakana juga boleh dijawab dengan hiragana.</div></div>`;
}
function kbKata() { KB_KATA = !KB_KATA; const k = $('.kb'); if (k) k.outerHTML = kbHTML(); } // isi jawaban tidak hilang
const kbIn = () => $('#ansIn');
function kb(ch) { const i = kbIn(); if (i) i.value += ch; }
function kbDel() { const i = kbIn(); if (i) i.value = i.value.slice(0, -1); }
// ubah huruf terakhir lewat pasangan (か↔が, つ↔っ); katakana ikut: カ↔ガ, ツ↔ッ
const modLast = (l, pairs) => {
  const kata = /[ァ-ヶ]/.test(l), h = kata ? toHira(l) : l;
  for (let k = 0; k < pairs.length; k += 2) {
    const r = h === pairs[k] ? pairs[k + 1] : h === pairs[k + 1] ? pairs[k] : null;
    if (r) return kata ? toKata(r) : r;
  }
  return null;
};
function kbMod(pairs) { const i = kbIn(); if (!i) return; const r = modLast(i.value.slice(-1), pairs); if (r) i.value = i.value.slice(0, -1) + r; }
function kbEnter() { if (route() === 'review') check(); else if (route() === 'quiz') quizTyped(); }
const jpAnswer = (it, typed) => typed === it.w ? 2 : matchReading(typed, it.r);
// soal arti→Jepang: kata lain yang artinya mencakup soal juga benar ("maaf" → すみません atau ごめんなさい)
const meanKeys = m => splitMeaning(m, '/').map(a => a.trim());
const coversMeaning = (v, it) => { const k = new Set(meanKeys(v.m).flatMap(a => [a, a.replace(/\s*\(.*?\)/g, '')])); return meanKeys(it.m).every(a => k.has(a)); };
const jpByMeaning = (it, typed) => Math.max(jpAnswer(it, typed), ...VOCAB.filter(v => v !== it && coversMeaning(v, it)).map(v => jpAnswer(v, typed)));

/* ---------- tipe soal ---------- */
const MODES = {
  mean: ['ID', 'Jawab artinya (bahasa Indonesia)', 'm-mean'],
  jp: ['あ', 'Jawab dengan huruf Jepang (kana)', 'm-jp'],
  romaji: ['Aa', 'Jawab cara bacanya dalam romaji', 'm-romaji'],
};
function modeBadge(m, help = true) { // help=false di Kuis: jangan buka keterangan saat waktu berjalan
  const [ic, txt, cls] = MODES[m];
  return `<div class="mode ${cls}"><span>${ic}</span>${txt}${help ? helpBtn('soal') : ''}</div>`;
}
function inputAttrs(m, kanji) {
  if (m === 'jp') return 'placeholder="Ketuk huruf di keyboard Jepang ↓" readonly inputmode="none" lang="ja"';
  return `placeholder="${m === 'romaji' ? 'Ketik romaji, mis. gakkou' : kanji ? 'Ketik arti, mis. tujuh' : 'Ketik arti (bahasa Indonesia)…'}"`;
}
// null = jawaban salah jenis (tidak dinilai, hanya diingatkan): huruf salah, atau cara baca di soal arti dan sebaliknya
function validAnswer(m, raw, it) {
  let t = raw.trim(); if (!t) return '';
  if (m === 'jp' && /[a-z]/i.test(t)) { toast('Soal ini dijawab dengan keyboard Jepang di layar.'); return null; }
  if (m === 'romaji' && hasJP(t)) { toast('Soal ini dijawab dengan romaji (huruf latin), mis. gakkou'); return null; }
  if (it && (m === 'mean' || m === 'romaji')) {
    const read = it.type === 'k' ? kanjiReadAnswer(it, t) : matchReading(t, it.r), mean = matchMeaning(t, it.m);
    if (m === 'mean' && read === 2 && !mean) { toast('Soal ini meminta ARTI (bahasa Indonesia), bukan cara bacanya. Coba ketik artinya.'); return null; }
    if (m === 'romaji' && mean === 2 && !read) { toast('Soal ini meminta CARA BACA (romaji), bukan artinya. Coba ketik cara bacanya.'); return null; }
  }
  return t;
}

  if (tag === 'INPUT' && e.key === 'Enter') { e.preventDefault(); return r === 'review' ? check() : r === 'quiz' ? quizTyped() : null; }
  if (tag === 'INPUT' || tag === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (r === 'review' && R && R.i < R.q.length && (e.key === ' ' || e.key === 'Enter')) {
    if (tag === 'BUTTON' && e.key === 'Enter') return; // biarkan tombol yang sedang fokus bekerja
    e.preventDefault();
    if (R.shown) nextCard(); else if (isIntro(R, R.q[R.i])) learned();
  }
  if (r === 'quiz' && Q?.state === 'run' && /^[1-4]$/.test(e.key)) answerQuiz(+e.key - 1);
});

/* ================= SINKRON PC ↔ HP (Google Apps Script) ================= */
// Konfigurasi per perangkat dari "link sinkron" (#sync=...) — URL & kunci tidak ada di repo publik.
const SYNC_KEY = 'nihongo-sync';
let SYNC = null, pushT = null;
try { SYNC = JSON.parse(localStorage.getItem(SYNC_KEY)); } catch (e) { }
function readSyncLink() {
  const m = location.hash.match(/^#sync=(.+)$/); if (!m) return;
  try {
    const c = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    if (!c.url || !c.secret) throw 0;
    SYNC = c; try { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); } catch (e) { }
    setTimeout(() => toast('☁️ Sinkron & pengingat aktif di perangkat ini'), 300);
  } catch (e) { setTimeout(() => toast('Link sinkron tidak valid'), 300); }
  history.replaceState(null, '', location.pathname + location.search + '#home');
}
const summary = () => ({ day: S.day, done: S.doneToday, goal: S.goal, left: dueItems().length + newLeft(), streak: streak() });
function api(body) {
  return fetch(SYNC.url, { method: 'POST', keepalive: true, body: JSON.stringify({ secret: SYNC.secret, ...body }) }).then(r => r.json());
}
function schedulePush() { if (SYNC) { clearTimeout(pushT); pushT = setTimeout(push, 4000); } }
function push() { pushT = null; if (SYNC) return api({ action: 'save', state: S, summary: summary() }).catch(() => { }); }
async function pull() {
  if (!SYNC) return;
  try {
    const r = await api({ action: 'load' }); if (!r.ok) return;
    const remote = r.state, ra = remote?.updatedAt || 0, la = S.updatedAt || 0;
    if (remote && ra > la) {
      S = { ...defaults(), ...remote }; save(true); rollDay(); R = null; GS = null; applyPrefs(); render();
      toast('☁️ Progres disinkronkan');
    } else if (la > ra) push();
  } catch (e) { } // offline: tetap jalan pakai data lokal
}
async function testNotify() {
  try {
    const r = await api({ action: 'test' });
    if (!r.ok) return toast('Gagal: ' + r.error);
    const res = Object.entries(r.sent || {}).map(([ch, code]) => `${ch} ${code === 200 ? '✓' : '✗ (' + (code === 429 ? 'dibatasi' : code || 'error') + ')'}`); // code bisa berupa petunjuk teks
    toast(res.length ? '🔔 ' + res.join(' · ') : 'Belum ada saluran notifikasi yang diisi di Code.gs');
  }
  catch (e) { toast('Gagal terhubung ke server sinkron'); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') pull();
  else if (pushT) { clearTimeout(pushT); push(); } // kirim sebelum tab ditutup
});

readSyncLink(); applyPrefs(); rollDay(); render(); pull();
if (location.search.includes('test')) try { runTests(); } catch (err) { console.error('❌', err); toast('❌ ' + err.message); }
