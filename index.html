<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nihongo Dojo</title>
<meta name="description" content="Belajar kosakata, kanji, dan grammar JLPT N5 dengan spaced repetition.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf2f8;--bg2:#eee8ff;--glass:rgba(255,255,255,.72);--solid:#fff;--line:rgba(90,50,140,.14);
  --text:#2a1840;--muted:#6f5d8c;--pink:#ff4f93;--violet:#7b5cff;--cyan:#12b5c4;--good:#12a974;--bad:#e93b63;--warn:#e8950c;
  --shadow:0 2px 10px rgba(60,20,100,.10);
  --grad:linear-gradient(135deg,#ff4f93,#7b5cff);--grad2:linear-gradient(135deg,#12b5c4,#7b5cff);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130b24;--bg2:#1f1240;--glass:rgba(255,255,255,.06);--solid:#241a3d;--line:rgba(255,255,255,.1);
  --text:#f5efff;--muted:#b3a3d3;--good:#3ddc97;--bad:#ff5c7a;--warn:#ffb84d;
  --shadow:0 2px 12px rgba(0,0,0,.35);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#130b24;--bg2:#1f1240;--glass:rgba(255,255,255,.06);--solid:#241a3d;--line:rgba(255,255,255,.1);
  --text:#f5efff;--muted:#b3a3d3;--good:#3ddc97;--bad:#ff5c7a;--warn:#ffb84d;
  --shadow:0 2px 12px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--text);font:16px/1.55 'Plus Jakarta Sans','Noto Sans JP',system-ui,sans-serif;background:var(--bg);overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 0% 0%,rgba(255,79,147,.22),transparent 60%),
             radial-gradient(800px 520px at 100% 15%,rgba(123,92,255,.26),transparent 60%),
             radial-gradient(700px 500px at 50% 110%,rgba(18,181,196,.16),transparent 60%),
             linear-gradient(180deg,var(--bg),var(--bg2))}
.jp,ruby,.big,.kchar{font-family:'Noto Sans JP',sans-serif}
h1,h2,h3{font-family:'Zen Maru Gothic','Plus Jakarta Sans',sans-serif;margin:0 0 .4em;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
rt{font-size:.45em;color:var(--muted);-webkit-text-fill-color:var(--muted);font-weight:500}
body.nofuri rt{visibility:hidden}


/* header / nav */
header{position:sticky;top:0;z-index:20;
  background:var(--solid);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;white-space:nowrap}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#fff;
  font:900 20px 'Noto Sans JP';box-shadow:0 6px 18px rgba(255,79,147,.45);transform:rotate(-6deg)}
.brand small{display:block;font:500 11px 'Noto Sans JP';color:var(--muted)}
nav{display:flex;gap:4px;margin-left:auto}
nav a{position:relative;text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:.2s}
nav a:hover{color:var(--text);background:var(--glass)}
nav a.on{color:#fff;background:var(--grad);box-shadow:0 6px 18px rgba(123,92,255,.4)}
nav a .ic{margin-right:6px}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;
  font-size:11px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--solid)}
.tools{display:flex;gap:6px}
.tbtn{width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font:700 15px 'Noto Sans JP';transition:.2s}
.tbtn:hover{transform:translateY(-2px)}
.tbtn.off{opacity:.45;text-decoration:line-through}
@media (max-width:760px){
  nav{position:fixed;bottom:0;left:0;right:0;margin:0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:var(--solid);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.12);z-index:30}
  nav a{display:flex;flex-direction:column;align-items:center;padding:6px 8px;font-size:10.5px;border-radius:14px}
  nav a .ic{margin:0;font-size:19px}
  main{padding-bottom:96px!important}
  .tools{margin-left:auto}
}

main{position:relative;z-index:1;max-width:1080px;margin:auto;padding:24px 16px 48px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:16px;font-weight:800;
  color:#fff;background:var(--grad);box-shadow:0 8px 22px rgba(255,79,147,.35),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,box-shadow .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,79,147,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.alt{background:var(--grad2);box-shadow:0 8px 22px rgba(18,181,196,.3)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.big{font-size:19px;padding:18px 30px;border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.spk{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--grad2);color:#fff;font-size:15px;box-shadow:0 4px 12px rgba(18,181,196,.35);flex:none;transition:.15s}
.spk:hover{transform:scale(1.12)}

/* home */
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;overflow:hidden;position:relative}
.hero:after{content:'学';position:absolute;right:-10px;bottom:-60px;font:900 220px 'Noto Sans JP';opacity:.06;pointer-events:none}
.lvl{width:84px;height:84px;border-radius:26px;background:var(--grad);color:#fff;display:grid;place-items:center;text-align:center;
  box-shadow:0 12px 30px rgba(123,92,255,.45);transform:rotate(-4deg);flex:none}
.lvl b{font-size:32px;line-height:1}.lvl small{font-size:11px;opacity:.85;display:block}
.xpbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s}
.stat{display:flex;gap:14px;align-items:center}
.stat .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none}
.stat b{font-size:26px;display:block;line-height:1.1}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap span{position:absolute;font-weight:800;font-size:18px}
ol.method{padding-left:20px;margin:0}ol.method li{margin:6px 0}
select{font:inherit;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--solid);color:var(--text)}

/* review */
.rv{max-width:640px;margin:auto;width:100%}
main.wide{max-width:1480px}
.rvgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.rvgrid .rv{order:-1}
@media (min-width:1100px){
  .rvgrid{grid-template-columns:minmax(0,1fr) minmax(0,600px) minmax(0,1fr);align-items:start}
  .rvgrid .rv{grid-column:2;grid-row:1}.side-l{grid-column:1;grid-row:1}.side-r{grid-column:3;grid-row:1}
  .side{margin-top:38px}
}
aside:empty{display:none}
.side{padding:18px;animation:up .35s both}
.side h3{font-size:17px;margin-bottom:10px}
.kv{margin-top:10px}
.kc{display:inline-flex;gap:6px;align-items:center;margin:4px 6px 0 0;padding:4px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:14px}
.kc b{font:700 20px 'Noto Sans JP'}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--grad);transition:width .4s}
.qcard{text-align:center;padding:34px 22px;position:relative}
.big{font-size:clamp(52px,13vw,92px);font-weight:700;line-height:1.25;margin:10px 0 6px;text-shadow:0 6px 30px rgba(123,92,255,.25)}
.big.id{font:800 clamp(28px,7vw,40px) 'Plus Jakarta Sans'}
.tag{position:absolute;top:14px;left:14px;display:flex;gap:6px}
.tag span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--line)}
.tag .new{background:var(--grad);color:#fff}
.ans{margin-top:16px;display:flex;gap:8px}
.ans input{flex:1;min-width:0;font:600 17px 'Plus Jakarta Sans';padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--solid);color:var(--text);outline:none;transition:.2s}
.ans input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(123,92,255,.18)}
.ans input.ok{border-color:var(--good);background:rgba(18,169,116,.1)}
.ans input.bad{border-color:var(--bad);background:rgba(233,59,99,.08)}
.reveal{margin-top:18px;padding:18px;border-radius:20px;background:var(--solid);border:1px solid var(--line);text-align:left;animation:up .35s cubic-bezier(.2,1.2,.4,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.reveal .mean{font-size:22px;font-weight:800}
.ex{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--glass);border-left:4px solid var(--pink)}
.ex .jp{font-size:19px}
.mn{margin-top:10px;padding:12px 14px;border-radius:14px;background:rgba(245,165,36,.12);border-left:4px solid var(--warn)}
.vd{margin-top:16px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;color:#fff;text-align:left;animation:up .35s both}
.vd .vi{font-size:30px;line-height:1}.vd b{font-size:20px;display:block}.vd small{opacity:.92}
.v1{background:linear-gradient(135deg,#ff5c7a,#e2335a)}.v2{background:linear-gradient(135deg,#ffb84d,#f08a00)}
.v3{background:linear-gradient(135deg,#3ddc97,#10a86f)}.v4{background:linear-gradient(135deg,#4fc3ff,#6a5cff)}
.linkbtn{font-size:13px;color:var(--muted);text-decoration:underline;margin-top:8px}
.mode{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border-radius:999px;font-weight:800;font-size:14px;margin-top:6px}
.mode span{font:900 13px 'Noto Sans JP';padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.35)}
.m-mean{background:rgba(18,181,196,.16);color:var(--cyan)}.m-jp{background:rgba(255,79,147,.16);color:var(--pink)}.m-romaji{background:rgba(232,149,12,.18);color:var(--warn)}
.lbl{display:block;font:800 11px 'Plus Jakarta Sans';letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.rdg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rdg>div{padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.rdg b{font-size:18px}
details.info{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:14px;background:rgba(123,92,255,.08)}
details.info summary{cursor:pointer;color:var(--violet);font-weight:700}
details.info p{margin:6px 0}
.kb{margin-top:12px;padding:8px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.kbg{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.kbf{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.4fr 2fr;gap:4px;margin-top:6px}
.kk{font:600 17px 'Noto Sans JP';padding:7px 0;border-radius:10px;background:var(--solid);border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.kk:active{transform:translateY(2px);box-shadow:none}
.kk.ok{background:var(--grad);color:#fff;border:0;font:800 14px 'Plus Jakarta Sans'}
@media (max-width:480px){.kk{font-size:14px;padding:6px 0;border-radius:8px}.kbg,.kbf{gap:3px}}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.verdict{font-weight:800;margin-top:10px}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* vocab flip cards */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.fcg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.fc{height:200px;perspective:1000px;cursor:pointer}
.fc-in{position:relative;height:100%;transition:transform .65s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.fc.on .fc-in{transform:rotateY(180deg)}
.fc:hover .fc-in{box-shadow:none}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line)}
.fc-f{background:var(--solid)}
.fc-f .w{font:700 34px 'Noto Sans JP'}
.fc-b{transform:rotateY(180deg);background:var(--grad);color:#fff;gap:6px}
.fc-b rt{color:#ffe;-webkit-text-fill-color:#ffe}
.fc-b .m{font-weight:800;font-size:18px}
.fc-b .e{font-size:12.5px;opacity:.95}
.dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--warn);box-shadow:0 0 10px var(--warn)}.dot.m{background:var(--good);box-shadow:0 0 10px var(--good)}

/* kanji */
.kg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.kt{aspect-ratio:1;border-radius:20px;background:var(--solid);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:var(--shadow);transition:.2s}
.kt:hover{transform:translateY(-4px) rotate(-2deg);border-color:var(--pink)}
.kt .kchar{font-size:38px;font-weight:700;line-height:1.1}
.kt small{font-size:11px;color:var(--muted);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt.l{border-color:var(--warn)}.kt.m{border-color:var(--good);background:linear-gradient(160deg,var(--solid),rgba(18,169,116,.15))}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,5,25,.6);display:grid;place-items:center;padding:16px;animation:rise .25s}
.modal .card{background:var(--solid);max-width:460px;width:100%;max-height:90vh;overflow:auto;animation:up .35s cubic-bezier(.2,1.2,.4,1)}
.kbig{font:900 110px/1 'Noto Sans JP';text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0}

/* grammar */
.gl{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gi{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);transition:.2s;text-decoration:none}
.gi:hover{transform:translateY(-3px);border-color:var(--violet)}
.gi .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--line);font-weight:800;flex:none}
.gi.done .n{background:var(--grad);color:#fff}
.gi .p{font:700 17px 'Noto Sans JP'}
.pat{display:inline-block;font:700 22px 'Noto Sans JP';padding:10px 18px;border-radius:16px;background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(123,92,255,.35);margin:6px 0 12px}
.slot{min-height:64px;border-radius:18px;border:2px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;transition:.2s}
.slot.ok{border-color:var(--good);border-style:solid;background:rgba(18,169,116,.1)}
.slot.bad{border-color:var(--bad);border-style:solid}
.tok{font:600 19px 'Noto Sans JP';padding:8px 14px;border-radius:14px;background:var(--solid);border:1px solid var(--line);box-shadow:0 4px 0 var(--line);transition:.12s}
.tok:hover{transform:translateY(-2px)}
.tok:active{transform:translateY(2px);box-shadow:none}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--pink);margin:0 4px;text-align:center;color:var(--pink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{padding:14px;border-radius:16px;background:var(--solid);border:2px solid var(--line);font:600 18px 'Noto Sans JP';transition:.15s;box-shadow:0 4px 0 var(--line)}
.opt:hover{border-color:var(--violet);transform:translateY(-2px)}
.opt.ok{border-color:var(--good);background:rgba(18,169,116,.15)}
.opt.bad{border-color:var(--bad);background:rgba(233,59,99,.12)}
.opt .k{font:800 11px 'Plus Jakarta Sans';color:var(--muted);margin-right:6px}

/* quiz */
.timer{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--grad2);transition:width .1s linear}
.combo{font:900 22px 'Plus Jakarta Sans';background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.score{font:900 64px 'Plus Jakarta Sans';line-height:1}

/* toast + confetti */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);opacity:0;z-index:100;background:var(--solid);color:var(--text);border:1px solid var(--line);
  padding:12px 20px;border-radius:16px;box-shadow:var(--shadow);font-weight:700;transition:.35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:760px){#toast{bottom:92px}}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#home"><span class="logo">道</span><span>Nihongo Dojo<small>日本語道場 · N5</small></span></a>
  <nav id="nav"></nav>
  <div class="tools">
    <button class="tbtn" id="furiBtn" title="Tampilkan/sembunyikan furigana" onclick="toggleFuri()">ふ</button>
    <button class="tbtn" title="Ganti tema terang/gelap" onclick="toggleTheme()">◐</button>
  </div>
</div></header>
<main id="main"></main>
<div id="toast"></div>
<div id="modal"></div>

<script>
/* ================= DATA ================= */
const VRAW = {
'👋 Salam':`
おはよう|おはよう|selamat pagi|おはよう ございます、先生[せんせい]。|Selamat pagi, Pak Guru.|母[はは]に「おはよう」と 言[い]いました。|Saya bilang "selamat pagi" ke ibu.
こんにちは|こんにちは|selamat siang/halo|こんにちは、田中[たなか]さん。|Halo, Tanaka-san.|先生[せんせい]、こんにちは。|Halo, Pak Guru.

/* ================= HELPERS ================= */
const DAY = 864e5, MIN = 6e4, KEY = 'nihongo-dojo-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const RB = /([々一-鿿]+)\[([^\]]+)\]/g;
const furi = s => s.replace(RB, '<ruby>$1<rt>$2</rt></ruby>');
const kana = s => s.replace(RB, '$2').replace(/\s+/g, '');
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const ymd = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const today = () => ymd(new Date());
const yesterday = () => ymd(new Date(Date.now() - DAY));
const wordHTML = v => v.w === v.r ? v.w : `<ruby>${v.w}<rt>${v.r}</rt></ruby>`;
const spk = t => `<button class="spk" title="Dengarkan" onclick="event.stopPropagation();speak('${t}')">🔊</button>`;

function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// skor jawaban: 0 salah · 1 benar tapi ada salah ketik · 2 tepat
function matchMeaning(input, meaning) {
  const n = s => s.toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9\- ]/g, '').replace(/\s+/g, ' ').trim();
  const x = n(input); if (!x) return 0;
  const alts = meaning.split(/[\/,;]/).map(n).filter(Boolean);
  if (alts.includes(x)) return 2;
  return alts.some(a => lev(a, x) <= (a.length > 8 ? 2 : a.length > 4 ? 1 : 0)) ? 1 : 0;
}
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const KR = Object.fromEntries('あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo ぁa ぃi ぅu ぇe ぉo'
  .split(' ').map(x => [x[0], x.slice(1)]));
function toRomaji(kanaStr) {
  const s = [...toHira(kanaStr)]; let out = '', dbl = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], nx = s[i + 1];
    if (ch === 'っ') { dbl = true; continue; }
    if (ch === 'ー') { out += out.slice(-1); continue; }
    let r = KR[ch] ?? ch;
    if ('ゃゅょ'.includes(nx || '_') && r.endsWith('i')) { const v = { ゃ: 'a', ゅ: 'u', ょ: 'o' }[nx]; r = /^(sh|ch|j)i$/.test(r) ? r.slice(0, -1) + v : r.slice(0, -1) + 'y' + v; i++; }
    if (dbl) { out += r[0]; dbl = false; }
    out += r;
  }
  return out;
}
// samakan ejaan Hepburn/Kunrei: shi=si, chi=ti, tsu=tu, fu=hu, ja=zya, nn=n
const normR = s => s.toLowerCase().replace(/[^a-z]/g, '').replace(/cch/g, 'tch').replace(/tch/g, 'tt').replace(/wo/g, 'o')
  .replace(/sh/g, 'sy').replace(/ch/g, 'ty').replace(/tsu/g, 'tu').replace(/j/g, 'zy').replace(/fu/g, 'hu')
  .replace(/([stz])yi/g, '$1i').replace(/nn(?![aiueoy])/g, 'n');
const hasJP = t => /[\u3040-\u30ff\u4e00-\u9fff]/.test(t);
const shortV = s => s.replace(/ou/g, 'o').replace(/([aiueo])\1/g, '$1');
function matchReading(input, reading) {
  const x = input.replace(/\s+/g, ''); if (!x) return 0;
  if (/[぀-ヿ]/.test(x)) { const a = toHira(x), b = toHira(reading); return a === b ? 2 : b.length > 3 && lev(a, b) <= 1 ? 1 : 0; }
  const a = normR(x), b = normR(toRomaji(reading));
  if (a === b) return 2;
  return shortV(a) === shortV(b) || (b.length > 4 && lev(a, b) <= 1) ? 1 : 0;
}
// sistem yang menilai: salah → Lupa, salah ketik/lambat → Sulit, tepat → Bagus, tepat & cepat → Mudah
function autoGrade(score, secs, len) {
  if (!score) return 1;
  if (score === 1 || secs > 20) return 2;
  return secs <= 4 + len * .2 ? 4 : 3;
}

/* ================= SRS (SM-2 ringan) ================= */
// grade: 1 Lupa, 2 Sulit, 3 Bagus, 4 Mudah. ivl dalam hari.
function schedule(card, g, now = Date.now()) {
  const c = { ease: 2.5, ivl: 0, reps: 0, lapses: 0, ...card };
  if (g === 1) {
    c.lapses++; c.reps = 0; c.ivl = 0; c.ease = Math.max(1.3, c.ease - .2); c.due = now + 10 * MIN; return c;
  }
  if (g === 2) { c.ivl = c.reps ? Math.max(1, Math.round(c.ivl * 1.2)) : 1; c.ease = Math.max(1.3, c.ease - .15); }
  if (g === 3) c.ivl = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.max(c.ivl + 1, Math.round(c.ivl * c.ease));
  if (g === 4) { c.ivl = c.reps === 0 ? 3 : Math.max(c.ivl + 2, Math.round(c.ivl * c.ease * 1.3)); c.ease += .15; }
  c.reps++; c.due = now + c.ivl * DAY; return c;
}
const fmtIvl = c => c.ivl === 0 ? '10 mnt' : c.ivl < 30 ? c.ivl + ' hr' : Math.round(c.ivl / 30) + ' bln';
const status = id => { const c = S.cards[id]; return !c ? 'n' : c.ivl >= 21 ? 'm' : 'l'; };

const defaults = () => ({ cards: {}, xp: 0, streak: 0, lastDay: null, day: null, newToday: 0, doneToday: 0, newPerDay: 10, goal: 20, furi: true, focus: null, grammar: {}, best: 0, goalDay: null, theme: null });
function load() { try { return { ...defaults(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { return defaults(); } }
// local=true: simpan di perangkat ini saja (tanpa menandai "lebih baru" dan tanpa kirim ke server)
function save(local) {
  if (!local) S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  if (!local) schedulePush();
}
let S = load();
function rollDay() { if (S.day !== today()) { S.day = today(); S.newToday = 0; S.doneToday = 0; save(true); } }
function touchStreak() { const t = today(); if (S.lastDay === t) return; S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1; S.lastDay = t; }
const streak = () => (S.lastDay === today() || S.lastDay === yesterday()) ? S.streak : 0;
const xpFor = L => 40 * (L - 1) ** 2;
const level = xp => Math.floor(Math.sqrt(xp / 40)) + 1;
function addXP(n) { const b = level(S.xp); S.xp += n; if (level(S.xp) > b) { toast(`⬆️ Naik ke Level ${level(S.xp)}! すごい！`); confetti(); } }
function checkGoal() {
  if (S.doneToday >= S.goal && S.goalDay !== today()) { S.goalDay = today(); addXP(50); confetti(); toast('🎯 Target harian tercapai! +50 XP'); }
}

let jaVoice = null, warnedVoice = false;
function pickVoice() { if ('speechSynthesis' in window) jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t) {
  if (!('speechSynthesis' in window)) return toast('Browser ini tidak mendukung suara.');
  if (!jaVoice && !warnedVoice) { warnedVoice = true; toast('Suara Jepang belum terpasang — pasang di Pengaturan Windows › Waktu & bahasa › Ucapan.'); }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice; u.rate = .85;
  speechSynthesis.speak(u);
}

let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#ff4f93', '#7b5cff', '#12b5c4', '#ffb84d', '#3ddc97'];
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('i'); d.className = 'cf';
    d.style.cssText = `left:${Math.random() * 100}vw;background:${pick(cols)};--dx:${(Math.random() - .5) * 240}px;--r:${Math.random() * 900}deg;animation-duration:${1.8 + Math.random() * 1.6}s;animation-delay:${Math.random() * .3}s`;
    document.body.appendChild(d); setTimeout(() => d.remove(), 4000);
  }
}

function dueItems() { const now = Date.now(); return [...VOCAB, ...KANJI].filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due); }
function freshItems() {
  let v = VOCAB.filter(x => !S.cards[x.id]); const k = KANJI.filter(x => !S.cards[x.id]);
  if (S.focus) v = [...v.filter(x => x.theme === S.focus), ...v.filter(x => x.theme !== S.focus)];
  const out = []; // 2 kosakata : 1 kanji
  while (v.length || k.length) { if (v.length) out.push(v.shift()); if (v.length) out.push(v.shift()); if (k.length) out.push(k.shift()); }
  return out;

const plainJP = t => t.replace(RB, '$1').replace(/\s+/g, '');
const escRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function wordRe(v) { // kata kerja/sifat: cocokkan akarnya (食べる → 食べます)
  const hasK = /[\u4e00-\u9fff]/.test(v.w);
  if (/する$/.test(v.w) && v.w.length > 2) return new RegExp(escRe(v.w.slice(0, -2)) + '[しすさせ]'); // 勉強する → 勉強します
  if (hasK && /[\u3040-\u309f]$/.test(v.w) && v.w.length >= 2) return new RegExp(escRe(v.w.slice(0, -1)) + '[\u3040-\u309f]');
  return hasK || v.w.length >= 3 ? new RegExp(escRe(v.w)) : null;
}
function sentencesFor(it, own, max = 3) {
  const mine = own ? [[it.ex, it.exid], ...(it.ex2 ? [[it.ex2, it.ex2id]] : [])] : [];
  const re = it.type === 'v' ? wordRe(it) : new RegExp(escRe(it.c));
  const more = re ? SENTENCES.filter(x => !mine.some(m => m[0] === x[0]) && re.test(plainJP(x[0]))) : [];

/* ---------- grammar ---------- */
let GS = null;

function initEx(i, e) {

}
function vGrammarList() {

}
function vGrammar(arg) {

function pickTok(n) { if (GS.res === 'ok') return; GS.sel.push(GS.pool.splice(n, 1)[0]); GS.res = null; render(); }

/* ---------- quiz ---------- */
let Q = null, qTimer = null;
const QTIME = 60;
function vQuiz() {
  if (!Q || Q.state === 'idle') return `<div class="rv"><div class="card qcard">
    <div style="font-size:64px">⚡</div><h1>Kuis Kilat</h1>
    <p class="muted">60 detik, soal campuran: pilih arti, pilih kata Jepang, dengar audio, kanji, <b>jawab romaji</b>, dan <b>jawab dengan huruf Jepang</b> (keyboard kana di layar). Jawaban benar beruntun = <b>combo</b> pengali skor!</p>

    <button class="btn big" onclick="startQuiz()">Mulai!</button><p class="hint">Pintasan: tombol 1–4 untuk pilihan ganda · Enter untuk soal ketik</p></div></div>`;

    <div style="font-size:56px">${Q.newBest ? '🏆' : '⏱️'}</div><h1>${Q.newBest ? 'Rekor baru!' : 'Waktu habis!'}</h1>

    <div class="row" style="justify-content:center"><button class="btn" onclick="startQuiz()">↺ Main lagi</button><a class="btn ghost" href="#review">🔁 Review</a></div></div></div>`;
  const c = Q.cur, left = Math.max(0, QTIME - (Date.now() - Q.t0) / 1000);
  return `<div class="rv">
    <div class="row" style="margin-bottom:8px"><b>⏱️ <span id="qtime">${Math.ceil(left)}</span>s</b><span class="sp"></span>${Q.combo > 1 ? `<span class="combo">COMBO ×${Math.min(5, Q.combo)}</span>` : ''}<span class="sp"></span><b>${Q.score} pts</b></div>
    <div class="timer"><i id="qbar" style="width:${left / QTIME * 100}%"></i></div>
    <div class="card qcard" id="qc" style="margin-top:16px">
      ${c.typed ? modeBadge(c.typed) : `<div class="muted">${c.label}</div>`}
      <div class="big ${c.cls}">${c.prompt}</div>
      ${c.typed ? `<div class="ans"><input id="ansIn" ${inputAttrs(c.typed)} autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" onclick="quizTyped()">Periksa</button></div>
        <div id="qfb" class="verdict"></div>${c.typed === 'jp' ? kbHTML() : ''}<button class="linkbtn" onclick="quizTyped(true)">Lewati</button>`
      : `<div class="opts">${c.opts.map((o, k) => `<button class="opt" id="o${k}" onclick="answerQuiz(${k})"><span class="k">${k + 1}</span>${o}</button>`).join('')}</div>`}
    </div></div>`;
}
function distract(item, list, key) {
  const same = shuffle(list.filter(x => x !== item && x.theme === item.theme)), other = shuffle(list.filter(x => x !== item && x.theme !== item.theme));

  return out;
}
function genQ() {
  const seenV = VOCAB.filter(v => S.cards[v.id]), seenK = KANJI.filter(k => S.cards[k.id]);
  const vp = seenV.length >= 12 ? seenV : VOCAB, kp = seenK.length >= 8 ? seenK : KANJI.slice(0, 30);
  const kind = pick(['jp', 'id', 'audio', 'kanji', 'romaji', 'kana']);
  if (kind === 'kanji') {
    const k = pick(kp), opts = shuffle([k, ...distract(k, KANJI, 'm')]);
    return { item: k, label: 'Arti kanji ini?', prompt: k.c, cls: 'kchar', opts: opts.map(x => esc(x.m)), a: opts.indexOf(k) };
  }
  const v = pick(vp);
  if (kind === 'romaji') return { item: v, typed: 'romaji', prompt: v.w, cls: '' };
  if (kind === 'kana') return { item: v, typed: 'jp', prompt: esc(v.m), cls: 'id' };
  if (kind === 'jp') { const o = shuffle([v, ...distract(v, VOCAB, 'm')]); return { item: v, label: 'Apa artinya?', prompt: wordHTML(v), cls: '', opts: o.map(x => esc(x.m)), a: o.indexOf(v) }; }

  return { item: v, label: 'Dengarkan — kata apa ini?', prompt: `<button class="spk" style="width:90px;height:90px;font-size:38px" onclick="speak('${v.r}')">🔊</button>`, cls: '', opts: o.map(x => x.w), a: o.indexOf(v), audio: v.r };
}
function startQuiz() {
  Q = { state: 'run', score: 0, combo: 0, maxCombo: 0, right: 0, total: 0, t0: Date.now(), cur: genQ(), lock: false };
  clearInterval(qTimer); qTimer = setInterval(tickQuiz, 100);

}
function tickQuiz() {

}
function answerQuiz(k) {

  Q.lock = true; const ok = k === Q.cur.a;
  $('#o' + Q.cur.a)?.classList.add('ok'); if (!ok) $('#o' + k)?.classList.add('bad');
  quizResult(ok, ok ? 450 : 1200);
}
function quizTyped(skip) {
  if (!Q || Q.state !== 'run' || Q.lock || !Q.cur.typed) return;
  const it = Q.cur.item, val = skip ? '' : validAnswer(Q.cur.typed, kbIn()?.value || '');
  if (val === null || (!val && !skip)) return;
  Q.lock = true; const ok = !!val && jpAnswer(it, val) > 0, fb = $('#qfb');
  if (fb) { fb.style.color = ok ? 'var(--good)' : 'var(--bad)'; fb.innerHTML = `${ok ? '✓ Benar!' : '✗ Jawaban:'} <span class="jp"><ruby>${it.w}<rt>${it.w === it.r ? '' : it.r}</rt></ruby></span> (${toRomaji(it.r)})`; }
  quizResult(ok, ok ? 700 : 2200);
}
function quizResult(ok, delay) {
  Q.total++; if (!ok) animate('#qc', 'shake');
  if (ok) { Q.combo++; Q.right++; Q.maxCombo = Math.max(Q.maxCombo, Q.combo); Q.score += 10 * Math.min(5, Q.combo); } else Q.combo = 0;

}
function endQuiz() {
  clearInterval(qTimer); Q.state = 'end'; addXP(Q.right * 3); touchStreak();
  if (Q.score > S.best) { S.best = Q.score; Q.newBest = Q.score > 0; if (Q.newBest) confetti(); }
  save(); if (route() === 'quiz') render();
}

/* ================= ROUTER ================= */
const VIEWS = { home: vHome, review: vReview, vocab: vVocab, kanji: vKanji, grammar: vGrammar, quiz: vQuiz };
const route = () => (location.hash.slice(1) || 'home').split('/')[0];
let lastHash = null;
function render() {
  const [r, arg] = (location.hash.slice(1) || 'home').split('/');
  const view = VIEWS[r] || vHome, main = $('#main');
  main.innerHTML = view(arg); main.classList.toggle('wide', r === 'review');
  renderNav(VIEWS[r] ? r : 'home');
  if (location.hash !== lastHash) { lastHash = location.hash; window.scrollTo(0, 0); main.style.animation = 'none'; void main.offsetWidth; main.style.animation = ''; }
  if ((r === 'review' || r === 'quiz') && !matchMedia('(pointer: coarse)').matches) $('#ansIn')?.focus(); // di HP: pakai keyboard kana di layar
}
window.addEventListener('hashchange', () => { closeModal(); if (route() === 'quiz' && Q?.state === 'run' && Date.now() - Q.t0 > QTIME * 1000) endQuiz(); render(); });

document.addEventListener('keydown', e => {
  const r = route(), tag = e.target.tagName;
  if (e.key === 'Escape') return closeModal();
  if (tag === 'INPUT' && e.key === 'Backspace' && e.target.readOnly) { e.preventDefault(); return kbDel(); }
  if (tag === 'INPUT' && e.key === 'Enter') { e.preventDefault(); return r === 'review' ? check() : r === 'quiz' ? quizTyped() : null; }
  if (tag === 'INPUT' || tag === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (r === 'review' && R && R.i < R.q.length && (e.key === ' ' || e.key === 'Enter')) {
    if (tag === 'BUTTON' && e.key === 'Enter') return; // biarkan tombol yang sedang fokus bekerja
    e.preventDefault();
    if (R.shown) nextCard(); else if (isIntro(R, R.q[R.i])) learned();
  }
  if (r === 'quiz' && Q?.state === 'run' && /^[1-4]$/.test(e.key)) answerQuiz(+e.key - 1);
});

/* ================= SETTINGS ================= */
function setOpt(k, v) { S[k] = +v; save(); R = null; render(); }
function resetAll() { if (confirm('Hapus semua progres? Tindakan ini tidak bisa dibatalkan.')) { S = defaults(); save(); R = null; GS = null; applyPrefs(); render(); toast('Progres direset.'); } }
function toggleFuri() { S.furi = !S.furi; save(); applyPrefs(); }
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  S.theme = cur === 'dark' ? 'light' : 'dark'; save(); applyPrefs();
}
function applyPrefs() {
  document.body.classList.toggle('nofuri', !S.furi); $('#furiBtn').classList.toggle('off', !S.furi);
  if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme;
}

/* ================= SELF-CHECK (?test) ================= */
function runTests() {
  const eq = (a, b, m) => { if (a !== b) throw new Error(`${m}: ${a} !== ${b}`); };
  let c = schedule({}, 3, 0); eq(c.ivl, 1, 'baru+Bagus'); eq(c.reps, 1, 'reps');
  c = schedule(c, 3, 0); eq(c.ivl, 3, 'ke-2 Bagus');
  c = schedule(c, 3, 0); eq(c.ivl, 8, 'ke-3 Bagus (3×2.5)');
  const f = schedule(c, 1, 0); eq(f.ivl, 0, 'Lupa ivl'); eq(f.reps, 0, 'Lupa reps'); eq(f.due, 10 * MIN, 'Lupa due'); eq(Math.round(f.ease * 100), 230, 'Lupa ease');
  eq(schedule(f, 3, 0).ivl, 1, 'setelah lupa');
  const e = schedule({}, 4, 0); eq(e.ivl, 3, 'baru+Mudah'); eq(Math.round(e.ease * 100), 265, 'Mudah ease');
  let x = {}; for (let i = 0; i < 10; i++) x = schedule(x, 1, 0); eq(x.ease, 1.3, 'ease minimum');
  eq(matchMeaning('Terima Kasih', 'terima kasih'), 2, 'jawaban case');
  eq(matchMeaning('ayah', 'ayah (sendiri)'), 2, 'kurung diabaikan');
  eq(matchMeaning('halo', 'selamat siang/halo'), 2, 'alternatif arti');
  eq(matchMeaning('ibu', 'ayah (sendiri)'), 0, 'jawaban salah');
  eq(matchMeaning('perpustakan', 'perpustakaan'), 1, 'typo 1 huruf');
  eq(toRomaji('べんきょう'), 'benkyou', 'romaji yoon'); eq(toRomaji('ちょっと'), 'chotto', 'romaji sokuon'); eq(toRomaji('パン'), 'pan', 'romaji katakana');
  eq(matchReading('benkyou', 'べんきょう'), 2, 'baca tepat'); eq(matchReading('benkyo', 'べんきょう'), 1, 'vokal panjang hilang');
  eq(matchReading('gakkou', 'がっこう'), 2, 'baca っ'); eq(matchReading('tyotto', 'ちょっと'), 2, 'kunrei');
  eq(matchReading('sennsei', 'せんせい'), 2, 'nn'); eq(matchReading('しんぶん', 'しんぶん'), 2, 'input kana');
  eq(matchReading('toshokan', 'としょかん'), 2, 'sho'); eq(matchReading('jikan', 'じかん'), 2, 'ji'); eq(matchReading('neko', 'いぬ'), 0, 'baca salah');
  eq(jpAnswer({ w: '学校', r: 'がっこう' }, '学校'), 2, 'jawab dengan kanji'); eq(jpAnswer({ w: 'パン', r: 'パン' }, 'ぱん'), 2, 'katakana via hiragana');
  const k7 = KANJI.find(k => k.c === '七'), k1 = KANJI.find(k => k.c === '一'), kE = KANJI.find(k => k.c === '駅');
  eq(mainRead(k7), 'なな', 'baca utama 7'); eq(mainRead(k1), 'いち', 'baca utama 1'); eq(mainRead(kE), 'えき', 'kanji tanpa kun');
  eq(kanjiReadAnswer(k7, 'nana'), 2, 'baca nana'); eq(kanjiReadAnswer(k7, 'shichi'), 2, 'baca shichi'); eq(kanjiReadAnswer(k7, 'tujuh'), 0, 'arti bukan bacaan');
  eq(kanjiReadAnswer(k1, 'hitotsu'), 2, 'baca okurigana penuh'); eq(kanjiReadAnswer(k1, 'hito'), 2, 'baca tanpa okurigana');
  KANJI.forEach(k => { if (!mainRead(k) || /[^a-z]/.test(toRomaji(mainRead(k)))) throw new Error('baca utama rusak: ' + k.c); }); eq(relParts(KANJI[4]).m, 'lima menit', 'contoh kanji');
  eq(validAnswer('romaji', 'がっこう'), null, 'romaji menolak kana'); eq(validAnswer('jp', 'gakkou'), null, 'jp menolak romaji'); eq(validAnswer('jp', 'がっこう'), 'がっこう', 'jp kana'); eq(validAnswer('mean', ' rumah '), 'rumah', 'arti');
  const vTaberu = VOCAB.find(v => v.w === '食べる'), vGakusei = VOCAB.find(v => v.w === '学生');
  eq(sentencesFor(vTaberu, vTaberu.ex).length, 3, 'contoh 食べる'); eq(sentencesFor(vGakusei, vGakusei.ex)[0][0], vGakusei.ex, 'contoh sendiri duluan');
  eq(sentencesFor(KANJI.find(k => k.c === '学'), null, 2).every(x => plainJP(x[0]).includes('学')), true, 'contoh kanji');
  VOCAB.forEach(v => { if (sentencesFor(v, v.ex).length < 2) throw new Error('contoh kalimat < 2: ' + v.w); });
  SENTENCES.forEach(([jp]) => { if (/[\u4e00-\u9fff]/.test(jp.replace(RB, ''))) throw new Error('kanji tanpa furigana: ' + jp); });
  eq(autoGrade(0, 3, 5), 1, 'salah=Lupa'); eq(autoGrade(1, 3, 5), 2, 'typo=Sulit'); eq(autoGrade(2, 25, 5), 2, 'lambat=Sulit');
  eq(autoGrade(2, 4, 5), 4, 'cepat=Mudah'); eq(autoGrade(2, 9, 5), 3, 'normal=Bagus');
  eq(kana('私[わたし]は 学生[がくせい]です。'), 'わたしはがくせいです。', 'kana()');
  eq(furi('学生[がくせい]'), '<ruby>学生<rt>がくせい</rt></ruby>', 'furi()');
  eq(new Set(VOCAB.map(v => v.id)).size, VOCAB.length, 'id kosakata unik');
  eq(new Set(KANJI.map(k => k.id)).size, KANJI.length, 'id kanji unik');
  VOCAB.forEach(v => { if (!v.exid) throw new Error('data kosakata rusak: ' + v.w); });
  KANJI.forEach(k => { if (!k.rel) throw new Error('data kanji rusak: ' + k.c); });
  GRAMMAR.forEach((g, i) => g.q.forEach(s => { const p = parseEx(s); if (p.t === 'm' && p.o.length !== 4) throw new Error('grammar ' + (i + 1) + ' opsi kurang'); if (p.t === 'm' && !p.q.includes('___')) throw new Error('grammar ' + (i + 1) + ' tanpa ___'); }));
  console.log(`✅ Semua self-check lulus (${VOCAB.length} kosakata, ${KANJI.length} kanji, ${GRAMMAR.length} grammar)`);
  toast('✅ Self-check lulus');
}

/* ================= SINKRON PC ↔ HP (Google Apps Script) ================= */
// Konfigurasi per perangkat dari "link sinkron" (#sync=...) — URL & kunci tidak ada di repo publik.
const SYNC_KEY = 'nihongo-sync';
let SYNC = null, pushT = null;
try { SYNC = JSON.parse(localStorage.getItem(SYNC_KEY)); } catch (e) { }
function readSyncLink() {
  const m = location.hash.match(/^#sync=(.+)$/); if (!m) return;
  try {
    const c = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    if (!c.url || !c.secret) throw 0;
    SYNC = c; try { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); } catch (e) { }
    setTimeout(() => toast('☁️ Sinkron & pengingat aktif di perangkat ini'), 300);
  } catch (e) { setTimeout(() => toast('Link sinkron tidak valid'), 300); }
  history.replaceState(null, '', location.pathname + location.search + '#home');
}
const summary = () => ({ day: S.day, done: S.doneToday, goal: S.goal, left: dueItems().length + newLeft() });
function api(body) {
  return fetch(SYNC.url, { method: 'POST', keepalive: true, body: JSON.stringify({ secret: SYNC.secret, ...body }) }).then(r => r.json());
}
function schedulePush() { if (SYNC) { clearTimeout(pushT); pushT = setTimeout(push, 4000); } }
function push() { pushT = null; if (SYNC) return api({ action: 'save', state: S, summary: summary() }).catch(() => { }); }
async function pull() {
  if (!SYNC) return;
  try {
    const r = await api({ action: 'load' }); if (!r.ok) return;
    const remote = r.state, ra = remote?.updatedAt || 0, la = S.updatedAt || 0;
    if (remote && ra > la) {
      S = { ...defaults(), ...remote }; save(true); rollDay(); R = null; GS = null; applyPrefs(); render();
      toast('☁️ Progres disinkronkan');
    } else if (la > ra) push();
  } catch (e) { } // offline: tetap jalan pakai data lokal
}
async function testNotify() {
  try {
    const r = await api({ action: 'test' });
    if (!r.ok) return toast('Gagal: ' + r.error);
    const res = Object.entries(r.sent || {}).map(([ch, code]) => `${ch} ${code === 200 ? '✓' : '✗ (' + (code === 429 ? 'dibatasi' : code || 'error') + ')'}`); // code bisa berupa petunjuk teks
    toast(res.length ? '🔔 ' + res.join(' · ') : 'Belum ada saluran notifikasi yang diisi di Code.gs');
  }
  catch (e) { toast('Gagal terhubung ke server sinkron'); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') pull();
  else if (pushT) { clearTimeout(pushT); push(); } // kirim sebelum tab ditutup
});

readSyncLink(); applyPrefs(); rollDay(); render(); pull();
if (location.search.includes('test')) try { runTests(); } catch (err) { console.error('❌', err); toast('❌ ' + err.message); }
</script>
